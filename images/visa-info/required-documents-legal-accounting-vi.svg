<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Phap ly / Ke toan</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 40)">
      <!-- Scale of justice -->
      <rect x="55" y="20" width="10" height="80" fill="#3b82f6"/>
      <rect x="30" y="100" width="60" height="8" rx="2" fill="#1d4ed8"/>
      <!-- Left pan -->
      <line x1="35" y1="25" x2="60" y2="20" stroke="#3b82f6" stroke-width="3"/>
      <ellipse cx="25" cy="35" rx="20" ry="8" fill="#60a5fa"/>
      <!-- Right pan -->
      <line x1="60" y1="20" x2="85" y2="25" stroke="#3b82f6" stroke-width="3"/>
      <ellipse cx="95" cy="35" rx="20" ry="8" fill="#60a5fa"/>
      <!-- Calculator icon -->
      <rect x="30" y="120" width="60" height="45" rx="4" fill="#1e40af"/>
      <rect x="35" y="125" width="50" height="15" fill="#93c5fd"/>
      <rect x="35" y="145" width="10" height="8" fill="#60a5fa"/>
      <rect x="50" y="145" width="10" height="8" fill="#60a5fa"/>
      <rect x="65" y="145" width="10" height="8" fill="#60a5fa"/>
      <rect x="35" y="155" width="10" height="8" fill="#60a5fa"/>
      <rect x="50" y="155" width="10" height="8" fill="#60a5fa"/>
      <rect x="65" y="155" width="10" height="8" fill="#60a5fa"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Hoat dong phap ly va ke toan</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Luat su, ke toan vien cong chung</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Nguoi co tu cach phap ly</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 5 nam, 3 nam, 1 nam, 3 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Chuyen gia co chung chi</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="290" y="290" width="220" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">法律・会計業務</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
