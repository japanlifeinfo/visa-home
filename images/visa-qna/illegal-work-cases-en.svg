<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="55" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">Real Cases of Illegal Employment in Japan</text>
  <text x="600" y="82" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">"One mistake" can change your entire life</text>

  <g transform="translate(50, 100)">
    <rect width="350" height="160" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="350" height="32" rx="8" fill="#dc2626"/>
    <rect y="16" width="350" height="16" fill="#dc2626"/>
    <text x="175" y="22" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Case 1 · Trainee Runaway + Fake Residence Card</text>
    <text x="20" y="58" fill="#334155" font-family="sans-serif" font-size="13">Technical trainee fled, worked illegally</text>
    <text x="20" y="78" fill="#334155" font-family="sans-serif" font-size="13">Broker made fake residence cards</text>
    <text x="20" y="100" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">Result: Broker arrested and prosecuted</text>
    <text x="20" y="122" fill="#64748b" font-family="sans-serif" font-size="12">→ Recruiters face punishment too</text>
    <text x="20" y="144" fill="#64748b" font-family="sans-serif" font-size="12">→ Worker, employer, broker ALL liable</text>
  </g>

  <g transform="translate(420, 100)">
    <rect width="350" height="160" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="350" height="32" rx="8" fill="#ea580c"/>
    <rect y="16" width="350" height="16" fill="#ea580c"/>
    <text x="175" y="22" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Case 2 · Working Outside Visa Category</text>
    <text x="20" y="58" fill="#334155" font-family="sans-serif" font-size="13">Agriculture visa → laundry/factory work</text>
    <text x="20" y="78" fill="#334155" font-family="sans-serif" font-size="13">Agency said "it's fine" but wasn't</text>
    <text x="20" y="100" fill="#ea580c" font-family="sans-serif" font-size="13" font-weight="bold">Result: Arrested for immigration violation</text>
    <text x="20" y="122" fill="#64748b" font-family="sans-serif" font-size="12">→ Work outside designated industry = illegal</text>
    <text x="20" y="144" fill="#64748b" font-family="sans-serif" font-size="12">→ Visa type must match actual work</text>
  </g>

  <g transform="translate(790, 100)">
    <rect width="360" height="160" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="360" height="32" rx="8" fill="#9333ea"/>
    <rect y="16" width="360" height="16" fill="#9333ea"/>
    <text x="180" y="22" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Case 3 · Employer Caught</text>
    <text x="20" y="58" fill="#334155" font-family="sans-serif" font-size="13">Hired workers with expired/no visa</text>
    <text x="20" y="78" fill="#334155" font-family="sans-serif" font-size="13">"Hired because wages were cheap"</text>
    <text x="20" y="100" fill="#9333ea" font-family="sans-serif" font-size="13" font-weight="bold">Result: Arrested for immigration violation</text>
    <text x="20" y="122" fill="#64748b" font-family="sans-serif" font-size="12">→ Employers face criminal charges</text>
    <text x="20" y="144" fill="#64748b" font-family="sans-serif" font-size="12">→ Must verify residence status before hiring</text>
  </g>

  <g transform="translate(50, 280)">
    <rect width="530" height="75" rx="12" fill="#1e293b"/>
    <text x="265" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">2024 Stats: ~14,000 caught for work violations</text>
    <text x="265" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13">Includes cases where stay itself violated visa rules</text>
  </g>

  <g transform="translate(600, 280)">
    <rect width="550" height="75" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="275" y="30" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">⚠ Beware SNS "Quick High-Pay Jobs"</text>
    <text x="275" y="55" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">Illegal job recruitment online — flagged by Japanese police</text>
  </g>

  <text x="50" y="395" fill="#475569" font-family="sans-serif" font-size="15" font-weight="bold">Why Are There So Many Cases?</text>
  <g transform="translate(50, 405)">
    <rect width="260" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="30" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Labor shortage → foreign reliance</text>
  </g>
  <g transform="translate(320, 405)">
    <rect width="260" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="30" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Workers don't know visa terms</text>
  </g>
  <g transform="translate(590, 405)">
    <rect width="260" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="30" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Illegal brokers facilitate</text>
  </g>
  <g transform="translate(860, 405)">
    <rect width="290" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="145" y="30" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">Visa status ≠ Actual work</text>
  </g>

  <g transform="translate(50, 475)">
    <rect width="1100" height="55" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="100" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">Arrest</text>
    <text x="310" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">Deportation</text>
    <text x="550" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">Re-entry Ban</text>
    <text x="810" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">Visa Disadvantage</text>
    <text x="1010" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">Career Destroyed</text>
  </g>

  <text x="600" y="565" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="15">Your visa status must match your actual work — this is legally critical in Japan</text>
  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
