  <g transform="translate(500, 360)">
    <rect width="180" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="35" cy="35" r="20" fill="#ddd6fe"/>
    <text x="35" y="42" text-anchor="middle" fill="#7c3aed" font-family="sans-serif" font-size="18" font-weight="bold">Q8</text>
    <text x="100" y="60" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="13">Extra Documents</text>
  </g>

  <g transform="translate(700, 360)">
    <rect width="180" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="35" cy="35" r="20" fill="#fecaca"/>
    <text x="35" y="42" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="18" font-weight="bold">Q9</text>
    <text x="100" y="60" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="13">Denial Reasons</text>
  </g>

  <g transform="translate(900, 360)">
    <rect width="180" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="35" cy="35" r="20" fill="#bfdbfe"/>
    <text x="35" y="42" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="18" font-weight="bold">...</text>
    <text x="100" y="60" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="13">+11 more</text>
  </g>

  <!-- Badge -->
  <g transform="translate(500, 490)">
    <rect width="200" height="50" rx="25" fill="#1e293b"/>
    <text x="100" y="33" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">TOP 20 Q&amp;A</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
