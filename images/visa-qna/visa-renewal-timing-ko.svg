<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="60" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="30" font-weight="bold">일본 비자 갱신, 언제부터 준비해야 할까?</text>
  <text x="600" y="90" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">놓치면 큰일 나는 재류기간 연장 타이밍</text>

  <!-- Timeline bar -->
  <rect x="100" y="140" width="1000" height="50" rx="25" fill="#e2e8f0"/>
  <!-- Green zone: 3-2 months -->
  <rect x="100" y="140" width="333" height="50" rx="25" fill="#22c55e"/>
  <!-- Yellow zone: 1 month -->
  <rect x="433" y="140" width="334" height="50" fill="#eab308"/>
  <!-- Red zone: after expiry -->
  <rect x="767" y="140" width="333" height="50" rx="25" fill="#ef4444"/>
  <!-- Cover left corner of yellow -->
  <rect x="433" y="140" width="30" height="50" fill="#22c55e"/>
  <!-- Cover right corner of yellow -->
  <rect x="747" y="140" width="30" height="50" fill="#eab308"/>

  <!-- Timeline labels -->
  <text x="266" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">안전 구간</text>
  <text x="600" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">주의 구간</text>
  <text x="933" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">위험!</text>

  <!-- Timeline markers -->
  <line x1="100" y1="195" x2="100" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="100" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">3개월 전</text>
  <line x1="433" y1="195" x2="433" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="433" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">2개월 전</text>
  <line x1="767" y1="195" x2="767" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="767" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">만료일</text>
  <line x1="1100" y1="195" x2="1100" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="1100" y="238" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">만료 후</text>

  <!-- Recommended arrow -->
  <polygon points="250,125 280,125 265,110" fill="#15803d"/>
  <text x="265" y="105" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">권장 시작</text>

  <!-- Info cards row -->
  <g transform="translate(60, 270)">
    <rect width="340" height="130" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="17" font-weight="bold">✓ 만료 전 신청 시</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#bbf7d0" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">결과 나올 때까지 합법 체류</text>
    <text x="170" y="93" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">재류카드 뒷면에 "신청 중" 표시</text>
    <text x="170" y="116" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">특례기간: 최대 2개월</text>
  </g>

  <g transform="translate(430, 270)">
    <rect width="340" height="130" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="17" font-weight="bold">✕ 만료일 초과 시</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#fecaca" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">하루라도 넘기면 불법체류</text>
    <text x="170" y="93" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">영주권 심사에 악영향</text>
    <text x="170" y="116" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">재입국 시 불이익 가능</text>
  </g>

  <g transform="translate(800, 270)">
    <rect width="340" height="130" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="17" font-weight="bold">⚠ 빨리 신청해야 하는 경우</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#fde68a" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">4월 입사·갱신 시즌 (혼잡)</text>
    <text x="170" y="93" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">회사 변경 직후</text>
    <text x="170" y="116" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">직무·재무 상태 변경</text>
  </g>

  <!-- Bottom key message -->
  <rect x="60" y="425" width="1080" height="70" rx="12" fill="#1e293b"/>
  <text x="600" y="455" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">핵심: 만료 3개월 전부터 신청 가능 → 2~3개월 전에 시작하세요</text>
  <text x="600" y="480" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="15">"하루 정도는 괜찮겠지" → 매우 위험한 생각입니다</text>

  <!-- Footer -->
  <text x="600" y="540" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">비자 관리는 곧 신용 관리 — 단 하루의 공백도 만들지 마세요</text>
  <text x="600" y="580" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
