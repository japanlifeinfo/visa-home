<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Documentos Necessários</text>
    <text x="80" y="270" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="52" font-weight="900">Cônjuge de</text>
    <text x="80" y="335" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="52" font-weight="900">Residente</text>
    <text x="80" y="400" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="52" font-weight="900">Permanente</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <circle cx="110" cy="105" r="35" fill="none" stroke="#be185d" stroke-width="5" opacity="0.3"/>
      <circle cx="155" cy="105" r="35" fill="none" stroke="#be185d" stroke-width="5" opacity="0.25"/>
      <path d="M130 78 C130 72 121 60 110 60 C95 60 88 74 88 83 C88 106 130 128 130 128 C130 128 172 106 172 83 C172 74 165 60 150 60 C139 60 130 72 130 78Z" fill="#be185d" opacity="0.2"/>
      <path d="M130 145 L115 170 L120 170 L120 190 L140 190 L140 170 L145 170Z" fill="#be185d" opacity="0.2"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#be185d" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">永住者の配偶者等</text>
  <text x="955" y="425" text-anchor="middle" fill="#be185d" font-family="sans-serif" font-size="30" opacity="0.6">Spouse of Permanent Resident</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#be185d" opacity="0.08" stroke="#be185d" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#be185d" font-family="sans-serif" font-size="23" font-weight="600">T-2</text>

