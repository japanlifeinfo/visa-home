<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fef2f2"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="50" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="28" font-weight="bold">Ly do thuong gap khi bi tu choi visa lao dong Nhat</text>
  <text x="600" y="78" text-anchor="middle" fill="#b91c1c" font-family="sans-serif" font-size="15">Phan lon bi tu choi do chuan bi ho so khong day du</text>

  <!-- Danger card 1 -->
  <g transform="translate(50, 100)">
    <rect width="350" height="150" rx="12" fill="white" stroke="#fca5a5" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#dc2626"/>
    <rect x="48" width="12" height="150" fill="#dc2626"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">1</text>
    <text x="80" y="35" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="bold">Nganh hoc · Cong viec khong khop</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">Ly do tu choi pho bien nhat</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">Hoc van/kinh nghiem phai lien quan</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">Khong giai thich duoc → "lao dong don gian"</text>
    <text x="80" y="132" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">→ Ly do tu choi so 1</text>
  </g>

  <!-- Danger card 2 -->
  <g transform="translate(420, 100)">
    <rect width="350" height="150" rx="12" fill="white" stroke="#fdba74" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#ea580c"/>
    <rect x="48" width="12" height="150" fill="#ea580c"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">2</text>
    <text x="80" y="35" fill="#9a3412" font-family="sans-serif" font-size="16" font-weight="bold">Mo ta cong viec mo ho</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">"Co phai chuyen mon?" tieu chi xet duyet</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">Dien dat truu tuong la rui ro</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">Can mo ta cong viec cu the</text>
    <text x="80" y="132" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">→ Mo ta cong viec la then chot</text>
  </g>

  <!-- Danger card 3 -->
  <g transform="translate(790, 100)">
    <rect width="360" height="150" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#d97706"/>
    <rect x="48" width="12" height="150" fill="#d97706"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">3</text>
    <text x="80" y="35" fill="#92400e" font-family="sans-serif" font-size="16" font-weight="bold">Van de tai chinh cong ty</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">Bi tu choi do cong ty, khong phai ung vien</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">Startup / cong ty lo = rui ro cao</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">Xet duyet kha nang duy tri tuyen dung</text>
    <text x="80" y="132" fill="#d97706" font-family="sans-serif" font-size="12" font-weight="bold">→ Su on dinh cong ty cung bi xet duyet</text>
  </g>

  <!-- Additional reasons row -->
  <text x="50" y="290" fill="#991b1b" font-family="sans-serif" font-size="15" font-weight="bold">Cac ly do tu choi chinh khac</text>
  <g transform="translate(50, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="25" fill="#dc2626" font-family="sans-serif" font-size="22" font-weight="bold">¥</text>
    <text x="50" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">Luong thap</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">Duoi muc trung binh Nhat = nghi ngo</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">So sanh voi muc trung binh nganh</text>
  </g>
  <g transform="translate(325, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">!</text>
    <text x="40" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">Thieu · Khong nhat quan</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">Thieu ban dich, mau thuan ho so</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">Thong tin khong nhat quan = mat tin nhiem</text>
  </g>
  <g transform="translate(600, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">X</text>
    <text x="42" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">Van de lich su cu tru</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">Tung cu tru bat hop phap</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">No thue, tien an tien su</text>
  </g>
  <g transform="translate(875, 300)">
    <rect width="275" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">?</text>
    <text x="42" y="27" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">Chung minh kinh nghiem thieu</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">Chua dat yeu cau 10 nam kinh nghiem</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">Khong dat yeu cau hoc van</text>
  </g>

  <!-- Prevention checklist -->
  <g transform="translate(50, 405)">
    <rect width="540" height="155" rx="12" fill="#1e293b"/>
    <text x="270" y="28" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">Danh sach kiem tra phong tu choi</text>
    <line x1="30" y1="42" x2="510" y2="42" stroke="#334155"/>
    <text x="35" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="12">✓ Giai thich ro lien quan nganh hoc/kinh nghiem voi cong viec</text>
    <text x="35" y="87" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ Viet mo ta cong viec cu the</text>
    <text x="35" y="109" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ Kiem tra tinh nhat quan giua tat ca ho so</text>
    <text x="35" y="131" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ Xac nhan luong bang hoac tren muc trung binh nganh</text>
    <text x="35" y="148" fill="#fbbf24" font-family="sans-serif" font-size="12">※ Co the nop lai nhung cung van de = cung ket qua</text>
  </g>

  <!-- Rejection consequences box -->
  <g transform="translate(610, 405)">
    <rect width="540" height="155" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <text x="270" y="28" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="15" font-weight="bold">Hau qua khi bi tu choi</text>
    <line x1="30" y1="42" x2="510" y2="42" stroke="#fecaca"/>
    <text x="270" y="68" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">Khong the nhap canh (COE bi tu choi)</text>
    <text x="270" y="90" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">Thay doi/gia han bi tu choi → phai xuat canh</text>
    <text x="270" y="112" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">Co the nop lai nhung mat thoi gian</text>
    <text x="270" y="140" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="14" font-weight="bold">→ Chuan bi ky luong ngay lan dau!</text>
  </g>

  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>