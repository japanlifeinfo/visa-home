    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Ihanda ang mga dokumento</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Ihanda ang revenue stamp</text>
