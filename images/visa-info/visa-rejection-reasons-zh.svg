<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fef2f2"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="50" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="28" font-weight="bold">日本工作签证被拒的常见原因</text>
  <text x="600" y="78" text-anchor="middle" fill="#b91c1c" font-family="sans-serif" font-size="15">大多数拒签是由于材料准备不足</text>

  <!-- Danger card 1 -->
  <g transform="translate(50, 100)">
    <rect width="350" height="150" rx="12" fill="white" stroke="#fca5a5" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#dc2626"/>
    <rect x="48" width="12" height="150" fill="#dc2626"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">1</text>
    <text x="80" y="35" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="bold">专业·职务不匹配</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">最常见的拒签理由</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">学历/经历须与职务相关</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">无法说明时→判定为"简单劳动"</text>
    <text x="80" y="132" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">→ 拒签原因第1位</text>
  </g>

  <!-- Danger card 2 -->
  <g transform="translate(420, 100)">
    <rect width="350" height="150" rx="12" fill="white" stroke="#fdba74" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#ea580c"/>
    <rect x="48" width="12" height="150" fill="#ea580c"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">2</text>
    <text x="80" y="35" fill="#9a3412" font-family="sans-serif" font-size="16" font-weight="bold">职务描述模糊</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">"是否为专业职?"审查标准</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">抽象表述存在风险</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">须提供具体职务说明</text>
    <text x="80" y="132" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">→ 职务描述是关键</text>
  </g>

  <!-- Danger card 3 -->
  <g transform="translate(790, 100)">
    <rect width="360" height="150" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#d97706"/>
    <rect x="48" width="12" height="150" fill="#d97706"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">3</text>
    <text x="80" y="35" fill="#92400e" font-family="sans-serif" font-size="16" font-weight="bold">公司财务问题</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">因公司而非申请人被拒</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">初创/亏损企业 = 高风险</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">审查雇用可持续性</text>
    <text x="80" y="132" fill="#d97706" font-family="sans-serif" font-size="12" font-weight="bold">→ 公司稳定性也是审查对象</text>
  </g>

  <!-- Additional reasons row -->
  <text x="50" y="290" fill="#991b1b" font-family="sans-serif" font-size="15" font-weight="bold">其他主要拒签原因</text>
  <g transform="translate(50, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="25" fill="#dc2626" font-family="sans-serif" font-size="22" font-weight="bold">¥</text>
    <text x="50" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">薪资水平不达标</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">低于日本平均 = 引起怀疑</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">与同行业平均水平比较审查</text>
  </g>
  <g transform="translate(325, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">!</text>
    <text x="40" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">材料缺失·不一致</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">缺少翻译·材料间矛盾</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">信息不一致 = 信任下降</text>
  </g>
  <g transform="translate(600, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">X</text>
    <text x="42" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">居留历史问题</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">曾有非法居留</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">欠税·犯罪记录</text>
  </g>
  <g transform="translate(875, 300)">
    <rect width="275" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">?</text>
    <text x="42" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">经历证明不足</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">10年经验要求未达标</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">学历要求不满足</text>
  </g>

  <!-- Prevention checklist -->
  <g transform="translate(50, 405)">
    <rect width="540" height="155" rx="12" fill="#1e293b"/>
    <text x="270" y="28" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">拒签防范检查清单</text>
    <line x1="30" y1="42" x2="510" y2="42" stroke="#334155"/>
    <text x="35" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ 明确说明专业/经历与职务的关联性</text>
    <text x="35" y="87" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ 撰写具体的职务描述</text>
    <text x="35" y="109" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ 确认所有材料间信息的一致性</text>
    <text x="35" y="131" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ 确认薪资达到或超过同行业平均水平</text>
    <text x="35" y="148" fill="#fbbf24" font-family="sans-serif" font-size="12">※ 可以重新申请，但相同问题会导致相同结果</text>
  </g>

  <!-- Rejection consequences box -->
  <g transform="translate(610, 405)">
    <rect width="540" height="155" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <text x="270" y="28" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="15" font-weight="bold">拒签后果</text>
    <line x1="30" y1="42" x2="510" y2="42" stroke="#fecaca"/>
    <text x="270" y="68" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">无法入境（COE被拒时）</text>
    <text x="270" y="90" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">变更/更新被拒 → 须出境</text>
    <text x="270" y="112" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">可重新申请但需要时间</text>
    <text x="270" y="140" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="14" font-weight="bold">→ 首次申请务必充分准备！</text>
  </g>

  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>