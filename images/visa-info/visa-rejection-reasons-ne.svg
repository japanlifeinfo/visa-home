<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fef2f2"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="40" font-weight="bold">भिसा अस्वीकृतिका मुख्य कारण</text>

  <!-- Warning triangle icon -->
  <polygon points="600,120 680,260 520,260" fill="#fbbf24" stroke="#f59e0b" stroke-width="4"/>
  <text x="600" y="240" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="60" font-weight="bold">!</text>

  <!-- 3 reason rows -->
  <rect x="100" y="300" width="1000" height="70" rx="12" fill="#dc2626"/>
  <text x="600" y="347" text-anchor="middle" fill="white" font-family="sans-serif" font-size="34" font-weight="bold">1. विषय/कार्य बेमेल</text>

  <rect x="100" y="385" width="1000" height="70" rx="12" fill="#ea580c"/>
  <text x="600" y="432" text-anchor="middle" fill="white" font-family="sans-serif" font-size="34" font-weight="bold">2. कार्य विवरण अस्पष्ट</text>

  <rect x="100" y="470" width="1000" height="70" rx="12" fill="#d97706"/>
  <text x="600" y="517" text-anchor="middle" fill="white" font-family="sans-serif" font-size="34" font-weight="bold">3. कम्पनी आर्थिक समस्या</text>

  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
