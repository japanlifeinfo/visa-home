<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="white"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1e293b">&lt; Requisitos do Visto de Gestor &gt;</text>

  <!-- Header backgrounds -->
  <rect x="270" y="70" width="455" height="60" fill="#dbeafe"/>
  <rect x="725" y="70" width="455" height="60" fill="#bfdbfe"/>

  <!-- Category column background -->
  <rect x="20" y="130" width="250" height="450" fill="#f1f5f9"/>

  <!-- Header row text -->
  <text x="498" y="108" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Antes</text>
  <text x="953" y="108" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Depois</text>

  <!-- Outer border -->
  <rect x="20" y="70" width="1160" height="510" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Row separators -->
  <line x1="20" y1="130" x2="1180" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="20" y1="220" x2="1180" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="20" y1="310" x2="1180" y2="310" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="20" y1="400" x2="1180" y2="400" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="20" y1="490" x2="1180" y2="490" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column separators -->
  <line x1="270" y1="70" x2="270" y2="580" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="725" y1="70" x2="725" y2="580" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Row 1: Capital -->
  <text x="145" y="174" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Capital /</text>
  <text x="145" y="192" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1e293b">Investimento</text>
  <text x="498" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">5 milhões</text>
  <text x="498" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">de ienes</text>
  <text x="953" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">30 milhões</text>
  <text x="953" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">de ienes</text>

  <!-- Row 2: Experience -->
  <text x="145" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Experiência /</text>
  <text x="145" y="282" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Formação</text>
  <text x="498" y="271" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Nenhum</text>
  <text x="953" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">3+ anos de experiência em gestão</text>
  <text x="953" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">OU mestrado em área de</text>
  <text x="953" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">negócios relevante</text>

  <!-- Row 3: Employment -->
  <text x="145" y="354" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Obrigação de</text>
  <text x="145" y="372" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Emprego</text>
  <text x="498" y="361" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Nenhum</text>
  <text x="953" y="344" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Contratar ao menos 1</text>
  <text x="953" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">funcionário em</text>
  <text x="953" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">regime integral</text>

  <!-- Row 4: Japanese -->
  <text x="145" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Proficiência</text>
  <text x="145" y="462" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">em Japonês</text>
  <text x="498" y="451" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Nenhum</text>
  <text x="953" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">O solicitante ou funcionário</text>
  <text x="953" y="446" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">deve ter proficiência</text>
  <text x="953" y="462" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">suficiente em japonês</text>

  <!-- Row 5: Expert verification -->
  <text x="145" y="516" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Verificação por</text>
  <text x="145" y="532" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Especialista</text>
  <text x="145" y="548" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">(na confirmação do status)</text>
  <text x="498" y="541" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Nenhum</text>
  <text x="953" y="512" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Verificação obrigatória do</text>
  <text x="953" y="528" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">novo plano de negócios</text>
  <text x="953" y="544" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">por especialista em gestão</text>
</svg>
