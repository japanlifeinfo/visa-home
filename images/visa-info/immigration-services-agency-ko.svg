<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: dark navy (distinct from cream/light backgrounds of recent SVGs) -->
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Subtle radial guideline rings around hub -->
  <circle cx="600" cy="385" r="260" fill="none" stroke="#1e40af" stroke-width="1" opacity="0.25"/>
  <circle cx="600" cy="385" r="200" fill="none" stroke="#1e40af" stroke-width="1" opacity="0.18"/>

  <!-- Subtle decoration: chrysanthemum-like emblem top-right -->
  <g transform="translate(1110, 75)" opacity="0.15">
    <circle r="38" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <g fill="#fbbf24">
      <circle cx="0" cy="-24" r="5"/>
      <circle cx="17" cy="-17" r="5"/>
      <circle cx="24" cy="0" r="5"/>
      <circle cx="17" cy="17" r="5"/>
      <circle cx="0" cy="24" r="5"/>
      <circle cx="-17" cy="17" r="5"/>
      <circle cx="-24" cy="0" r="5"/>
      <circle cx="-17" cy="-17" r="5"/>
      <circle cx="0" cy="0" r="7"/>
    </g>
  </g>

  <!-- Top kicker -->
  <text x="600" y="60" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="600" letter-spacing="4">JAPAN · 法務省 · 入管 · ISA</text>

  <!-- Headline -->
  <text x="600" y="112" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="36" font-weight="bold">출입국재류관리청은 어떤 기관일까?</text>

  <!-- Subtitle -->
  <text x="600" y="148" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">외국인의 비자·재류·영주권을 총괄하는 일본 법무성 외청</text>

  <!-- ===== SPOKE CONNECTORS (behind hub and leaves) ===== -->
  <line x1="600" y1="385" x2="756" y2="295" stroke="#fbbf24" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 4"/>
  <line x1="600" y1="385" x2="780" y2="385" stroke="#fbbf24" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 4"/>
  <line x1="600" y1="385" x2="756" y2="475" stroke="#fbbf24" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 4"/>
  <line x1="600" y1="385" x2="444" y2="475" stroke="#fbbf24" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 4"/>
  <line x1="600" y1="385" x2="420" y2="385" stroke="#fbbf24" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 4"/>
  <line x1="600" y1="385" x2="444" y2="295" stroke="#fbbf24" stroke-width="1.5" opacity="0.45" stroke-dasharray="5 4"/>

  <!-- ===== HUB (central agency emblem) ===== -->
  <g transform="translate(600, 385)">
    <!-- Outer faint ring -->
    <circle r="128" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
    <!-- Hub body -->
    <circle r="115" fill="#1e3a8a" stroke="#fbbf24" stroke-width="3"/>
    <!-- Inner faint ring -->
    <circle r="102" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>

    <!-- Hub labels -->
    <text y="-30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="42" font-weight="bold" letter-spacing="6">ISA</text>
    <text y="4" text-anchor="middle" fill="#fef3c7" font-family="serif" font-size="19" font-weight="bold">出入国在留管理庁</text>
    <text y="32" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="13" opacity="0.85">출입국재류관리청</text>
    <text y="58" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="600">入管 (뉴칸)</text>
  </g>

  <!-- ===== LEAF NODES (key duties) ===== -->
  <!-- Upper right (30°): 영주권 심사 -->
  <rect x="666" y="270" width="180" height="50" rx="25" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="756" y="301" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="18" font-weight="600">영주권 심사</text>

  <!-- Right (0°): 재류자격 심사 -->
  <rect x="690" y="360" width="180" height="50" rx="25" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="780" y="391" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="18" font-weight="600">재류자격 심사</text>

  <!-- Lower right (330°): 재류카드 발급 -->
  <rect x="666" y="450" width="180" height="50" rx="25" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="756" y="481" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="18" font-weight="600">재류카드 발급</text>

  <!-- Lower left (210°): COE 발급 -->
  <rect x="354" y="450" width="180" height="50" rx="25" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="444" y="481" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="18" font-weight="600">COE 발급</text>

  <!-- Left (180°): 비자 갱신 -->
  <rect x="330" y="360" width="180" height="50" rx="25" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="420" y="391" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="18" font-weight="600">비자 갱신</text>

  <!-- Upper left (150°): 입국 심사 -->
  <rect x="354" y="270" width="180" height="50" rx="25" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="444" y="301" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="18" font-weight="600">입국 심사</text>

  <!-- Bottom caption -->
  <text x="600" y="588" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="15" opacity="0.85">비자 신청부터 재류기간 갱신·영주권 심사·재류카드 관리까지</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
</svg>
