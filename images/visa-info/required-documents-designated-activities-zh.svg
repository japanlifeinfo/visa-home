      <path d="M130 110 L118 130 L122 130 L122 155 L138 155 L138 130 L142 130Z" fill="#65a30d" opacity="0.35"/>
      <line x1="95" y1="72" x2="130" y2="72" stroke="white" stroke-width="2" opacity="0.5"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#65a30d" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">特定活動</text>
