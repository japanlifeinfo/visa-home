<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Jurnalis</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Panduan Dokumen yang Diperlukan</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(60, 40)">
      <!-- Camera body -->
      <rect x="20" y="40" width="80" height="55" rx="8" fill="#374151"/>
      <!-- Lens -->
      <circle cx="55" cy="67" r="22" fill="#1f2937"/>
      <circle cx="55" cy="67" r="15" fill="#4b5563"/>
      <circle cx="55" cy="67" r="8" fill="#111827"/>
      <!-- Flash -->
      <rect x="70" y="30" width="25" height="15" rx="3" fill="#6b7280"/>
      <!-- Microphone -->
      <rect x="95" y="65" width="15" height="40" rx="7" fill="#ef4444"/>
      <rect x="98" y="70" width="9" height="8" rx="4" fill="#fee2e2"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Status Tinggal Kegiatan Jurnalistik</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#fee2e2"/>
        <text x="12" y="17" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Wartawan, juru kamera dari media asing, dll.</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#fee2e2"/>
        <text x="12" y="17" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Kegiatan liputan dan pelaporan berita</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#fee2e2"/>
        <text x="12" y="17" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Masa tinggal: 5 tahun, 3 tahun, 1 tahun, 3 bulan</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#fee2e2"/>
        <text x="12" y="17" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Pengakuan/perubahan/perpanjangan tersedia</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#fee2e2"/>
    <text x="400" y="320" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="18" font-weight="bold">報道</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
