<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="40" font-weight="bold">कार्य भिसा vs स्थायी बसोबास</text>

  <!-- Left: कार्य भिसा (grey) -->
  <rect x="60" y="110" width="520" height="400" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="60" y="110" width="520" height="70" rx="20" fill="#64748b"/>
  <rect x="60" y="155" width="520" height="25" fill="#64748b"/>
  <text x="320" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="34" font-weight="bold">कार्य भिसा</text>

  <text x="320" y="250" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="30">पेशा सीमित</text>
  <text x="320" y="310" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="30">नवीकरण आवश्यक</text>
  <text x="320" y="370" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="30">ऋण कठिन</text>
  <text x="320" y="470" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="34" font-weight="bold">सीमित</text>

  <!-- Right: स्थायी बसोबास (green) -->
  <rect x="620" y="110" width="520" height="400" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <rect x="620" y="110" width="520" height="70" rx="20" fill="#16a34a"/>
  <rect x="620" y="155" width="520" height="25" fill="#16a34a"/>
  <text x="880" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">स्थायी बसोबास</text>

  <text x="880" y="250" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="30">पेशा स्वतन्त्र</text>
  <text x="880" y="310" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="30">नवीकरण अनावश्यक</text>
  <text x="880" y="370" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="30">ऋण सम्भव</text>
  <text x="880" y="470" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="34" font-weight="bold">स्वतन्त्र</text>

  <!-- VS badge -->
  <circle cx="600" cy="310" r="40" fill="#1e293b"/>
  <text x="600" y="322" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">VS</text>

  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>