<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">企业内转勤</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">提交材料指南</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(45, 35)">
      <!-- Office building 1 (overseas) -->
      <rect x="10" y="40" width="40" height="60" fill="#94a3b8"/>
      <rect x="15" y="45" width="10" height="10" fill="#e2e8f0"/>
      <rect x="30" y="45" width="10" height="10" fill="#e2e8f0"/>
      <rect x="15" y="60" width="10" height="10" fill="#e2e8f0"/>
      <rect x="30" y="60" width="10" height="10" fill="#e2e8f0"/>
      <rect x="15" y="75" width="10" height="10" fill="#e2e8f0"/>
      <rect x="30" y="75" width="10" height="10" fill="#e2e8f0"/>
      <rect x="22" y="88" width="16" height="12" fill="#475569"/>
      <!-- Arrow -->
      <path d="M55 70 L75 70 L75 60 L95 75 L75 90 L75 80 L55 80 Z" fill="#f97316"/>
      <!-- Office building 2 (Japan) -->
      <rect x="100" y="30" width="45" height="70" fill="#3b82f6"/>
      <rect x="105" y="35" width="12" height="12" fill="#bfdbfe"/>
      <rect x="122" y="35" width="12" height="12" fill="#bfdbfe"/>
      <rect x="105" y="52" width="12" height="12" fill="#bfdbfe"/>
      <rect x="122" y="52" width="12" height="12" fill="#bfdbfe"/>
      <rect x="105" y="69" width="12" height="12" fill="#bfdbfe"/>
      <rect x="122" y="69" width="12" height="12" fill="#bfdbfe"/>
      <rect x="115" y="88" width="18" height="12" fill="#1d4ed8"/>
      <!-- Japan flag indicator -->
      <circle cx="122" cy="15" r="12" fill="white" stroke="#ef4444" stroke-width="2"/>
      <circle cx="122" cy="15" r="6" fill="#ef4444"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">公司内部调动在留资格</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">从海外总公司·分公司调至日本事业所</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">从事技术·人文知识·国际业务相关工作</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">在留期间：5年、3年、1年、3个月</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">可申请认定·变更·更新</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="305" y="290" width="190" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">企業内転勤</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
