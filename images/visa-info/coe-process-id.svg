<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">Proses COE (Certificate of Eligibility)</text>

  <!-- Card 1: Persiapan -->
  <g transform="translate(80, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#3b82f6"/><rect y="45" width="330" height="15" fill="#3b82f6"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">①② Persiapan</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Tanda tangan kontrak kerja</text>
    <text x="165" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">↓</text>
    <text x="165" y="158" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Perusahaan ajukan COE</text>
    <rect x="40" y="180" width="250" height="32" rx="16" fill="#dbeafe"/>
    <text x="165" y="201" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="14" font-weight="bold">Biasanya ditangani perusahaan</text>
    <text x="165" y="240" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Formulir COE · Kontrak kerja</text>
    <text x="165" y="262" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Registrasi perusahaan · Keuangan</text>
    <text x="165" y="284" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Deskripsi kerja · Ijazah</text>
  </g>

  <text x="422" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="28">→</text>

  <!-- Card 2: Pemeriksaan -->
  <g transform="translate(435, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#f59e0b"/><rect y="45" width="330" height="15" fill="#f59e0b"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">③④ Periksa · Terbit</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">1–3 bulan</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Musim ramai: 3–4+ bulan</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#fef3c7"/>
    <text x="165" y="192" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="15" font-weight="bold">Gerbang paling penting</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Review relevansi jurusan-kerja</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Cek keuangan perusahaan</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Dokumen tambahan = lebih lama</text>
  </g>

  <text x="777" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="28">→</text>

  <!-- Card 3: Masuk -->
  <g transform="translate(790, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#10b981"/><rect y="45" width="330" height="15" fill="#10b981"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">⑤⑥ Visa · Masuk</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Ajukan visa di kedutaan</text>
    <text x="165" y="138" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Terbit: 3–7 hari</text>
    <text x="165" y="163" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">↓</text>
    <text x="165" y="188" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Masuk Jepang · Terima kartu</text>
    <rect x="65" y="210" width="200" height="32" rx="16" fill="#d1fae5"/>
    <text x="165" y="231" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="14" font-weight="bold">Resmi mulai bekerja!</text>
    <text x="165" y="270" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Cek yurisdiksi kedutaan</text>
    <text x="165" y="292" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Total: sekitar 1,5–4 bulan</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 450)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">Poin Utama</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">Tawaran kerja bukan akhir — pemeriksaan COE adalah gerbang paling penting</text>
  </g>
  <text x="600" y="575" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
