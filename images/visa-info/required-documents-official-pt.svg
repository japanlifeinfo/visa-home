    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Documentos Necessários</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="120" font-weight="900">Oficial</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <rect x="90" y="60" width="80" height="10" rx="2" fill="#1e3a5f" opacity="0.4"/>
      <rect x="80" y="70" width="100" height="8" rx="2" fill="#1e3a5f" opacity="0.35"/>
      <rect x="88" y="85" width="10" height="80" fill="#1e3a5f" opacity="0.3"/>
      <rect x="112" y="85" width="10" height="80" fill="#1e3a5f" opacity="0.3"/>
      <rect x="136" y="85" width="10" height="80" fill="#1e3a5f" opacity="0.3"/>
      <rect x="160" y="85" width="10" height="80" fill="#1e3a5f" opacity="0.3"/>
      <rect x="75" y="165" width="110" height="12" rx="2" fill="#1e3a5f" opacity="0.35"/>
      <path d="M130 30 L120 60 L140 60Z" fill="#1e3a5f" opacity="0.3"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#1e3a5f" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">公用</text>
  <text x="955" y="425" text-anchor="middle" fill="#1e3a5f" font-family="sans-serif" font-size="30" opacity="0.6">Official</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#1e3a5f" opacity="0.08" stroke="#1e3a5f" stroke-width="1.5" stroke-opacity="0.2"/>
