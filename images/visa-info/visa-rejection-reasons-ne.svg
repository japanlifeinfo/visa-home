<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="30" font-weight="bold">कार्य भिसा अस्वीकृत हुने सामान्य कारणहरू</text>

  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fee2e2"/>
    <text x="45" y="53" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="20" font-weight="bold">1</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">विषय·कार्य बेमेल</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">सबैभन्दा सामान्य अस्वीकृति कारण</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">शिक्षा-कार्य सान्दर्भिकता आवश्यक</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">व्याख्या नभएमा = "साधारण श्रम"</text>
  </g>

  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="20" font-weight="bold">2</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">कार्य विवरण अस्पष्ट</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">"विशेषज्ञ कार्य हो?" जाँच</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">अमूर्त विवरण जोखिमपूर्ण</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">विशिष्ट विवरण आवश्यक</text>
  </g>

  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="20" font-weight="bold">3</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">कम्पनी वित्तीय समस्या</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">कम्पनी समस्याले अस्वीकृत</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">स्टार्टअप · घाटा = उच्च जोखिम</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">रोजगारी निरन्तरता मूल्यांकन</text>
  </g>

  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="53" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="20" font-weight="bold">+</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">तलब · कागजात · अनुभव</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">कम तलब = शंका</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">कागजात छुटेको · अनुवाद नभएको</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">अवैध बसोबास · कर नतिरेको</text>
  </g>

  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">मुख्य बुँदा</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">जागिर पाउनु अन्त्य होइन — अधिकांश अस्वीकृति कागजात तयारी अपर्याप्तको कारण हो</text>
  </g>
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
