<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="60" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">Gia Han Visa Nhat Ban, Nen Chuan Bi Tu Khi Nao?</text>
  <text x="600" y="90" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Qua han se tro thanh cu tru bat hop phap</text>

  <rect x="100" y="140" width="1000" height="50" rx="25" fill="#e2e8f0"/>
  <rect x="100" y="140" width="333" height="50" rx="25" fill="#22c55e"/>
  <rect x="433" y="140" width="334" height="50" fill="#eab308"/>
  <rect x="767" y="140" width="333" height="50" rx="25" fill="#ef4444"/>
  <rect x="433" y="140" width="30" height="50" fill="#22c55e"/>
  <rect x="747" y="140" width="30" height="50" fill="#eab308"/>

  <text x="266" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">Vung An Toan</text>
  <text x="600" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">Vung Canh Bao</text>
  <text x="933" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">Nguy Hiem!</text>

  <line x1="100" y1="195" x2="100" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="100" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">3 thang truoc</text>
  <line x1="433" y1="195" x2="433" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="433" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">2 thang truoc</text>
  <line x1="767" y1="195" x2="767" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="767" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">Ngay het han</text>
  <line x1="1100" y1="195" x2="1100" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="1100" y="238" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">Sau het han</text>

  <polygon points="250,125 280,125 265,110" fill="#15803d"/>
  <text x="265" y="105" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">Nen bat dau</text>

  <g transform="translate(60, 270)">
    <rect width="340" height="130" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="17" font-weight="bold">✓ Nop truoc het han</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#bbf7d0" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">Duoc o hop phap cho den khi co ket qua</text>
    <text x="170" y="93" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">Ghi "dang xin" tren the cu tru</text>
    <text x="170" y="116" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">Thoi gian dac biet: toi da 2 thang</text>
  </g>

  <g transform="translate(430, 270)">
    <rect width="340" height="130" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="17" font-weight="bold">✕ Qua han</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#fecaca" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">Chi 1 ngay cung la cu tru bat hop phap</text>
    <text x="170" y="93" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">Anh huong xau den xin vinh tru</text>
    <text x="170" y="116" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">Bat loi khi tai nhap canh</text>
  </g>

  <g transform="translate(800, 270)">
    <rect width="340" height="130" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="17" font-weight="bold">⚠ Can nop som neu...</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#fde68a" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">Mua cao diem thang 4</text>
    <text x="170" y="93" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">Vua doi cong ty</text>
    <text x="170" y="116" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">Thay doi cong viec hoac tai chinh</text>
  </g>

  <rect x="60" y="425" width="1080" height="70" rx="12" fill="#1e293b"/>
  <text x="600" y="455" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">Trong tam: Nop duoc tu 3 thang truoc → Bat dau tu 2-3 thang truoc</text>
  <text x="600" y="480" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="15">"Tre 1 ngay khong sao" → Suy nghi rat nguy hiem</text>

  <text x="600" y="540" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">Quan ly visa chinh la quan ly uy tin — Dung de trong mot ngay nao</text>
  <text x="600" y="580" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
