<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">गैरकानुनी काम घटनाहरू</text>

  <!-- Badge 1: Red -->
  <rect x="60" y="130" width="340" height="280" rx="20" fill="#dc2626"/>
  <circle cx="230" cy="200" r="50" fill="white"/>
  <text x="230" y="215" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="50" font-weight="bold">1</text>
  <text x="230" y="295" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">प्रशिक्षार्थी भागेको</text>
  <text x="230" y="340" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="26">नक्कली रेजिडेन्स कार्ड</text>
  <text x="230" y="385" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="26">दलाल पक्राउ</text>

  <!-- Badge 2: Orange -->
  <rect x="430" y="130" width="340" height="280" rx="20" fill="#ea580c"/>
  <circle cx="600" cy="200" r="50" fill="white"/>
  <text x="600" y="215" text-anchor="middle" fill="#ea580c" font-family="sans-serif" font-size="50" font-weight="bold">2</text>
  <text x="600" y="295" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">गलत उद्योग</text>
  <text x="600" y="340" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="26">कृषि भिसामा कारखाना</text>
  <text x="600" y="385" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="26">आप्रवासन उल्लङ्घन</text>

  <!-- Badge 3: Purple -->
  <rect x="800" y="130" width="340" height="280" rx="20" fill="#9333ea"/>
  <circle cx="970" cy="200" r="50" fill="white"/>
  <text x="970" y="215" text-anchor="middle" fill="#9333ea" font-family="sans-serif" font-size="50" font-weight="bold">3</text>
  <text x="970" y="295" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">रोजगारदाता पक्रिएको</text>
  <text x="970" y="340" text-anchor="middle" fill="#e9d5ff" font-family="sans-serif" font-size="24">अयोग्य विदेशी भर्ना</text>
  <text x="970" y="385" text-anchor="middle" fill="#e9d5ff" font-family="sans-serif" font-size="26">फौजदारी मुद्दा</text>

  <!-- Bottom -->
  <rect x="100" y="460" width="1000" height="80" rx="16" fill="#1e293b"/>
  <text x="600" y="498" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="30" font-weight="bold">२०२४: ~१४,००० कार्य उल्लङ्घन</text>
  <text x="600" y="530" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">SNS 'छिटो पैसा' जागिरबाट सावधान</text>


  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>