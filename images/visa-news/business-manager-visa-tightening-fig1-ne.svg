<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="white"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b">&lt; व्यापार व्यवस्थापन भिसा आवश्यकताहरू &gt;</text>

  <!-- Header backgrounds -->
  <rect x="270" y="70" width="455" height="60" fill="#dbeafe"/>
  <rect x="725" y="70" width="455" height="60" fill="#bfdbfe"/>

  <!-- Category column background -->
  <rect x="20" y="130" width="250" height="450" fill="#f1f5f9"/>

  <!-- Header row text -->
  <text x="498" y="108" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b">पहिले</text>
  <text x="953" y="108" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b">पछि</text>

  <!-- Outer border -->
  <rect x="20" y="70" width="1160" height="510" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Row separators -->
  <line x1="20" y1="130" x2="1180" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="20" y1="220" x2="1180" y2="220" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="20" y1="310" x2="1180" y2="310" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="20" y1="400" x2="1180" y2="400" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="20" y1="490" x2="1180" y2="490" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Column separators -->
  <line x1="270" y1="70" x2="270" y2="580" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="725" y1="70" x2="725" y2="580" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Row 1: Capital -->
  <text x="145" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">पुँजी / लगानी</text>
  <text x="498" y="181" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">५०० मान येन</text>
  <text x="953" y="181" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">३,००० मान येन</text>

  <!-- Row 2: Experience -->
  <text x="145" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">अनुभव / शिक्षा</text>
  <text x="498" y="271" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">छैन</text>
  <text x="953" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">३+ वर्षको व्यवस्थापन अनुभव</text>
  <text x="953" y="262" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">वा सम्बन्धित व्यापार क्षेत्रमा</text>
  <text x="953" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">स्नातकोत्तर डिग्री</text>

  <!-- Row 3: Employment -->
  <text x="145" y="355" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">रोजगार दायित्व</text>
  <text x="498" y="361" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">छैन</text>
  <text x="953" y="350" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">कम्तीमा १ पूर्णकालीन</text>
  <text x="953" y="368" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">कर्मचारी नियुक्त गर्नुपर्ने</text>

  <!-- Row 4: Japanese -->
  <text x="145" y="445" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">जापानी भाषा क्षमता</text>
  <text x="498" y="451" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">छैन</text>
  <text x="953" y="428" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">आवेदक वा कर्मचारीसँग</text>
  <text x="953" y="446" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">पर्याप्त जापानी भाषा</text>
  <text x="953" y="464" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">क्षमता हुनुपर्ने</text>

  <!-- Row 5: Expert verification -->
  <text x="145" y="521" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e293b">विशेषज्ञ सत्यापन</text>
  <text x="145" y="540" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">(स्थिति पुष्टिमा)</text>
  <text x="498" y="541" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">छैन</text>
  <text x="953" y="514" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">नयाँ व्यावसायिक योजनाको</text>
  <text x="953" y="532" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">व्यवस्थापन विशेषज्ञद्वारा</text>
  <text x="953" y="550" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">अनिवार्य सत्यापन</text>
</svg>
