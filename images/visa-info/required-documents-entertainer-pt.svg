  </g>

  <text x="955" y="385" text-anchor="middle" fill="#c026d3" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">興行</text>
  <text x="955" y="425" text-anchor="middle" fill="#c026d3" font-family="sans-serif" font-size="30" opacity="0.6">Entertainer</text>

