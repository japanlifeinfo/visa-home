    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="14">बसोबास स्थान अनुसार</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="14">प्रान्त अनुसार तोकिएको कार्यालय</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="14">अनलाइन जाँच सम्भव</text>
  </g>

  <!-- Step 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="20" font-weight="bold">🕐</text>
