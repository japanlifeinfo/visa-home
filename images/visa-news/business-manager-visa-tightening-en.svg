<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: light sky-blue (distinct from yellow cream and near-white of previous articles) -->
  <rect width="1200" height="630" fill="#f0f9ff"/>

  <!-- Top gradient bar (brand consistent) -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Subtle background accent shapes (sky/blue tones) -->
  <circle cx="1080" cy="500" r="160" fill="#dbeafe" opacity="0.75"/>
  <circle cx="60" cy="180" r="40" fill="#dbeafe" opacity="0.7"/>
  <polygon points="0,630 220,630 0,440" fill="#e0f2fe" opacity="0.8"/>

  <!-- NEWS badge (brand consistent) -->
  <rect x="60" y="50" width="200" height="70" rx="12" fill="#dc2626"/>
  <text x="160" y="97" text-anchor="middle" fill="white" font-family="sans-serif" font-size="42" font-weight="bold">NEWS</text>

  <!-- Bar chart visualization (left side: rising capital threshold) -->
  <g transform="translate(80, 270)">
    <!-- Vertical axis -->
    <line x1="0" y1="0" x2="0" y2="240" stroke="#94a3b8" stroke-width="2"/>
    <!-- Baseline -->
    <line x1="0" y1="240" x2="480" y2="240" stroke="#64748b" stroke-width="2"/>
    <!-- Horizontal grid lines -->
    <line x1="0" y1="180" x2="480" y2="180" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,6"/>
    <line x1="0" y1="120" x2="480" y2="120" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,6"/>
    <line x1="0" y1="60" x2="480" y2="60" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,6"/>

    <!-- Bar 1: ¥5M (small, gray) -->
    <text x="100" y="186" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">Before</text>
    <rect x="50" y="200" width="100" height="40" rx="4" fill="#94a3b8"/>
    <text x="100" y="282" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="22" font-weight="bold">¥5M</text>

    <!-- Bar 2: ¥30M (tall, gold with red top) -->
    <text x="380" y="-14" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="18" font-weight="bold">After</text>
    <rect x="330" y="0" width="100" height="240" rx="4" fill="#fbbf24"/>
    <rect x="330" y="0" width="100" height="60" rx="4" fill="#dc2626"/>
    <text x="380" y="282" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="22" font-weight="bold">¥30M</text>

    <!-- Rising trend arrow (dashed) -->
    <path d="M 110 196 Q 210 115 322 8" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="10,6"/>
    <path d="M 304 14 L 322 8 L 314 25" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ×6 multiplier badge (sits along the arrow) -->
    <circle cx="240" cy="108" r="40" fill="#dc2626" stroke="#f0f9ff" stroke-width="4"/>
    <text x="240" y="122" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">×6</text>
  </g>

  <!-- Headline (right side, right-aligned — distinct from previous centered layouts) -->
  <text x="880" y="225" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="62" font-weight="bold">Business Visa</text>
  <text x="880" y="305" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="62" font-weight="bold">Rules Tightened</text>

  <!-- Subtitle -->
  <text x="880" y="365" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="28">~¥30M capital now required</text>

  <!-- Key requirements: 2x2 filled pill grid (slate-900 fill, gold text) -->
  <g transform="translate(620, 410)">
    <rect x="0" y="0" width="240" height="48" rx="24" fill="#1e293b"/>
    <text x="120" y="32" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold">Full-time staff</text>

    <rect x="260" y="0" width="260" height="48" rx="24" fill="#1e293b"/>
    <text x="390" y="32" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold">Business plan review</text>

    <rect x="0" y="65" width="240" height="48" rx="24" fill="#1e293b"/>
    <text x="120" y="97" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold">Mgmt. experience</text>

    <rect x="260" y="65" width="260" height="48" rx="24" fill="#1e293b"/>
    <text x="390" y="97" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold">Japanese proficiency</text>
  </g>

  <!-- Footer URL (brand consistent) -->
  <text x="600" y="608" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="22">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>
