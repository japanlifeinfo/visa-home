<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">H&#x1B0;&#x1EDB;ng d&#x1EA5;n l&#x1EC7; ph&#xED;</text>

  <!-- Column 1: Mới (COE) -->
  <rect x="60" y="130" width="340" height="340" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="230" y="195" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="36" font-weight="bold">M&#x1EDB;i (COE)</text>
  <text x="230" y="310" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="56" font-weight="bold">Mi&#x1EC5;n ph&#xED;</text>
  <text x="230" y="420" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">L&#x1EC7; ph&#xED; ch&#xED;nh th&#x1EE9;c</text>

  <!-- Column 2: Gia hạn -->
  <rect x="430" y="130" width="340" height="340" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="600" y="195" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="36" font-weight="bold">Gia h&#x1EA1;n</text>
  <text x="600" y="310" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="56" font-weight="bold">&#165;4,000</text>
  <text x="600" y="420" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Tem thu nh&#x1EAD;p</text>

  <!-- Column 3: Thường trú -->
  <rect x="800" y="130" width="340" height="340" rx="20" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="3"/>
  <text x="970" y="195" text-anchor="middle" fill="#9d174d" font-family="sans-serif" font-size="36" font-weight="bold">Th&#x1B0;&#x1EDD;ng tr&#xFA;</text>
  <text x="970" y="310" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="56" font-weight="bold">&#165;8,000</text>
  <text x="970" y="420" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Tem thu nh&#x1EAD;p</text>

  <!-- Bottom note -->
  <rect x="100" y="500" width="1000" height="60" rx="12" fill="#1e293b"/>
  <text x="600" y="540" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="30" font-weight="bold">T&#x1EF1; n&#x1ED9;p &#x111;&#x1A1;n &#x111;&#x1EC3; ti&#x1EBF;t ki&#x1EC7;m ph&#xED;!</text>


  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>