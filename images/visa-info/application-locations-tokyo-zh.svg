<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="48" font-weight="bold">东京</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">申请地点指南</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Building icon -->
    <g transform="translate(60, 50)">
      <!-- Building body -->
      <rect x="15" y="40" width="90" height="120" rx="4" fill="#3b82f6"/>
      <!-- Windows row 1 -->
      <rect x="30" y="55" width="18" height="14" rx="2" fill="#eff5fe"/>
      <rect x="58" y="55" width="18" height="14" rx="2" fill="#eff5fe"/>
      <rect x="86" y="55" width="18" height="14" rx="2" fill="#eff5fe"/>
      <!-- Windows row 2 -->
      <rect x="30" y="80" width="18" height="14" rx="2" fill="#eff5fe"/>
      <rect x="58" y="80" width="18" height="14" rx="2" fill="#eff5fe"/>
      <rect x="86" y="80" width="18" height="14" rx="2" fill="#eff5fe"/>
      <!-- Windows row 3 -->
      <rect x="30" y="105" width="18" height="14" rx="2" fill="#eff5fe"/>
      <rect x="58" y="105" width="18" height="14" rx="2" fill="#eff5fe"/>
      <rect x="86" y="105" width="18" height="14" rx="2" fill="#eff5fe"/>
      <!-- Door -->
      <rect x="46" y="130" width="28" height="30" rx="3" fill="#2f68c5"/>
      <!-- Roof accent -->
      <rect x="10" y="35" width="100" height="8" rx="2" fill="#2f68c5"/>
      <!-- Flag pole -->
      <rect x="57" y="10" width="3" height="28" fill="#2f68c5"/>
      <rect x="60" y="12" width="20" height="12" fill="#3b82f6" opacity="0.7"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">东京 (東京)</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="12" fill="#eff5fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">管辖都道府县: 10个</text>
      </g>
      <g transform="translate(0, 45)">
        <circle cx="12" cy="12" r="12" fill="#eff5fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">出张所: 10处</text>
      </g>
      <g transform="translate(0, 90)">
        <circle cx="12" cy="12" r="12" fill="#eff5fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">负责地区: 関東·甲信越</text>
      </g>
      <g transform="translate(0, 135)">
        <circle cx="12" cy="12" r="12" fill="#eff5fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">办公时间: 工作日 09:00-16:00</text>
      </g>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#e2ecfe"/>
    <text x="400" y="320" text-anchor="middle" fill="#2f68c5" font-family="sans-serif" font-size="18" font-weight="bold">東京</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#3575dd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
</svg>