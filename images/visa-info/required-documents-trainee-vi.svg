<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Tu nghiep sinh</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 40)">
      <!-- Training/learning icon -->
      <!-- Book/Manual -->
      <rect x="20" y="30" width="70" height="50" rx="4" fill="#22c55e"/>
      <rect x="25" y="35" width="60" height="40" fill="#86efac"/>
      <line x1="55" y1="35" x2="55" y2="75" stroke="#22c55e" stroke-width="2"/>
      <rect x="30" y="45" width="20" height="3" fill="#16a34a"/>
      <rect x="30" y="52" width="15" height="3" fill="#16a34a"/>
      <rect x="30" y="59" width="18" height="3" fill="#16a34a"/>
      <!-- Person learning -->
      <circle cx="55" cy="105" r="18" fill="#4ade80"/>
      <rect x="37" y="125" width="36" height="40" rx="4" fill="#4ade80"/>
      <!-- Lightbulb (learning) -->
      <ellipse cx="110" cy="55" rx="18" ry="22" fill="#fef08a"/>
      <rect x="102" y="75" width="16" height="8" fill="#facc15"/>
      <rect x="105" y="83" width="10" height="4" fill="#eab308"/>
      <!-- Rays -->
      <line x1="110" y1="25" x2="110" y2="15" stroke="#fbbf24" stroke-width="2"/>
      <line x1="130" y1="35" x2="138" y2="28" stroke="#fbbf24" stroke-width="2"/>
      <line x1="90" y1="35" x2="82" y2="28" stroke="#fbbf24" stroke-width="2"/>
      <line x1="135" y1="55" x2="145" y2="55" stroke="#fbbf24" stroke-width="2"/>
      <line x1="85" y1="55" x2="75" y2="55" stroke="#fbbf24" stroke-width="2"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Hoc ky nang tai co quan Nhat Ban</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Duoc tiep nhan boi co quan cong/tu</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Khac voi Thuc tap ky nang va Du hoc</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 1 nam, 6 thang, 3 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Hoat dong hoc ky nang tai co so kinh doanh</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#dcfce7"/>
    <text x="400" y="320" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="18" font-weight="bold">研修</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
