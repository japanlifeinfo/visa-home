<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fffbeb"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <g transform="translate(80 200)">
    <rect x="6" y="10" width="440" height="270" rx="16" fill="#000000" opacity="0.1"/>
    <rect x="0" y="0" width="440" height="270" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

    <path d="M 16 0 L 424 0 Q 440 0 440 16 L 440 44 L 0 44 L 0 16 Q 0 0 16 0 Z" fill="#16a34a"/>
    <text x="20" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">JAPAN RESIDENCE CARD</text>
    <text x="420" y="28" text-anchor="end" fill="#ffffff" font-family="serif" font-size="14" font-weight="bold">在留カード</text>

    <rect x="22" y="62" width="92" height="120" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="68" cy="102" r="18" fill="#94a3b8"/>
    <path d="M 38 178 Q 38 142 68 142 Q 98 142 98 178 Z" fill="#94a3b8"/>

    <text x="130" y="80" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">NAME / 氏名</text>
    <rect x="130" y="88" width="180" height="9" rx="2" fill="#e2e8f0"/>

    <text x="130" y="118" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">STATUS / 在留資格</text>
    <text x="130" y="137" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">技術・人文知識・国際業務</text>

    <text x="130" y="160" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">PERIOD / 在留期間</text>
    <text x="130" y="179" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">5 YEARS</text>

    <rect x="340" y="62" width="64" height="46" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <line x1="350" y1="75" x2="394" y2="75" stroke="#d97706" stroke-width="1"/>
    <line x1="350" y1="85" x2="394" y2="85" stroke="#d97706" stroke-width="1"/>
    <line x1="350" y1="95" x2="394" y2="95" stroke="#d97706" stroke-width="1"/>
    <line x1="367" y1="66" x2="367" y2="104" stroke="#d97706" stroke-width="1"/>

    <text x="130" y="218" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">CARD NO.</text>
    <text x="130" y="240" fill="#1e293b" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="3">AB12345678CD</text>

    <text x="300" y="218" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="0.5">VALID UNTIL</text>
    <text x="300" y="240" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">2030.01.15</text>
  </g>

  <g transform="translate(490 365)">
    <circle cx="0" cy="0" r="70" fill="#dcfce7" opacity="0.95"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#16a34a" stroke-width="6"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#16a34a" stroke-width="1.5" opacity="0.6"/>
    <path d="M -28 2 L -8 26 L 30 -22" stroke="#15803d" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="50" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">STILL VALID</text>
  </g>

  <text x="1100" y="160" text-anchor="end" fill="#dc2626" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="3">Q&amp;A · Visto de Trabalho · Demissao</text>

  <text x="1100" y="225" text-anchor="end" fill="#1f2937" font-family="sans-serif" font-size="48" font-weight="bold">Demissao durante</text>
  <text x="1100" y="283" text-anchor="end" fill="#1f2937" font-family="sans-serif" font-size="48" font-weight="bold">analise do visto?</text>

  <text x="1100" y="328" text-anchor="end" fill="#78716c" font-family="sans-serif" font-size="22">Sem cancelamento imediato, mas com regras</text>

  <line x1="780" y1="475" x2="1100" y2="475" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <text x="1100" y="510" text-anchor="end" fill="#92400e" font-family="sans-serif" font-size="20" font-weight="bold">Notificacao em 14 dias e obrigatoria</text>
  <text x="1100" y="540" text-anchor="end" fill="#a16207" font-family="sans-serif" font-size="18">Desemprego prolongado pode acionar regra de 3 meses</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
</svg>
