<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">COE 발급 절차</text>

  <!-- Document icon (left) -->
  <rect x="80" y="150" width="200" height="260" rx="12" fill="white" stroke="#3b82f6" stroke-width="4"/>
  <rect x="110" y="190" width="140" height="12" rx="4" fill="#93c5fd"/>
  <rect x="110" y="220" width="120" height="12" rx="4" fill="#93c5fd"/>
  <rect x="110" y="250" width="140" height="12" rx="4" fill="#93c5fd"/>
  <rect x="110" y="280" width="100" height="12" rx="4" fill="#93c5fd"/>
  <text x="180" y="350" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="32" font-weight="bold">COE</text>

  <!-- Arrow from doc -->
  <text x="310" y="290" fill="#94a3b8" font-family="sans-serif" font-size="50" font-weight="bold">&gt;</text>

  <!-- 5 step flow -->
  <rect x="370" y="150" width="160" height="80" rx="12" fill="#3b82f6"/>
  <text x="450" y="200" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">고용</text>

  <text x="545" y="200" fill="#94a3b8" font-family="sans-serif" font-size="36" font-weight="bold">&gt;</text>

  <rect x="575" y="150" width="160" height="80" rx="12" fill="#8b5cf6"/>
  <text x="655" y="200" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">신청</text>

  <text x="750" y="200" fill="#94a3b8" font-family="sans-serif" font-size="36" font-weight="bold">&gt;</text>

  <rect x="780" y="150" width="160" height="80" rx="12" fill="#f59e0b"/>
  <text x="860" y="200" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">심사</text>

  <text x="955" y="200" fill="#94a3b8" font-family="sans-serif" font-size="36" font-weight="bold">&gt;</text>

  <rect x="985" y="150" width="160" height="80" rx="12" fill="#10b981"/>
  <text x="1065" y="200" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">발급</text>

  <!-- Second row: visa + entry -->
  <rect x="575" y="280" width="160" height="80" rx="12" fill="#ec4899"/>
  <text x="655" y="330" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">비자</text>

  <text x="750" y="330" fill="#94a3b8" font-family="sans-serif" font-size="36" font-weight="bold">&gt;</text>

  <rect x="780" y="280" width="360" height="80" rx="12" fill="#dc2626"/>
  <text x="960" y="330" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">일본 입국!</text>

  <!-- Bottom summary -->
  <rect x="100" y="420" width="1000" height="100" rx="16" fill="#1e293b"/>
  <text x="600" y="465" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="34" font-weight="bold">총 소요: 약 1.5~4개월</text>
  <text x="600" y="505" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="28">COE 유효기간 3개월 이내 입국 필수</text>

  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>