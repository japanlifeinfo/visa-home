<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="48" font-weight="bold">Estudyante</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Gabay sa mga Kinakailangang Dokumento</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(60, 50)">
      <!-- Graduation cap icon -->
      <polygon points="60,20 120,50 60,80 0,50" fill="#8b5cf6"/>
      <rect x="55" y="80" width="10" height="30" fill="#7c3aed"/>
      <rect x="20" y="105" width="80" height="8" rx="4" fill="#7c3aed"/>

      <!-- Book icon -->
      <rect x="20" y="130" width="80" height="60" rx="4" fill="#a78bfa"/>
      <rect x="25" y="135" width="70" height="50" fill="#c4b5fd"/>
      <line x1="60" y1="135" x2="60" y2="185" stroke="#8b5cf6" stroke-width="2"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Status ng Paninirahan para sa Pag-aaral</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#ede9fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Unibersidad, vocational school, Japanese language school</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#ede9fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Kailangan ang certificate of admission</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#ede9fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Kailangan ang patunay ng pinansyal na suporta</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#ede9fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Inirerekomenda ang 80%+ na attendance rate</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#ede9fe"/>
    <text x="400" y="320" text-anchor="middle" fill="#7c3aed" font-family="sans-serif" font-size="18" font-weight="bold">留学</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
