<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="signGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== Background: warm cream paper (distinct from peach / dark slate / dark navy / dark emerald) ===== -->
  <rect width="1200" height="630" fill="#fdf6e3"/>
  <!-- Top gradient bar (caution theme: red→orange→amber) -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark (Korean only): 주의 lower-right, very faint -->
  <text x="1180" y="612" text-anchor="end" fill="#dc2626" font-family="sans-serif" font-size="220" font-weight="bold" opacity="0.05" letter-spacing="-4">주의</text>

  <!-- Subtle dotted grid (upper-left, breaks empty space) -->
  <g opacity="0.30">
    <circle cx="60" cy="80" r="2" fill="#d97706"/>
    <circle cx="90" cy="80" r="2" fill="#d97706"/>
    <circle cx="120" cy="80" r="2" fill="#d97706"/>
    <circle cx="60" cy="110" r="2" fill="#d97706"/>
    <circle cx="90" cy="110" r="2" fill="#d97706"/>
    <circle cx="60" cy="140" r="2" fill="#d97706"/>
  </g>

  <!-- Decorative accent circles (asymmetric placement) -->
  <circle cx="1110" cy="100" r="44" fill="#fbbf24" opacity="0.22"/>
  <circle cx="1060" cy="160" r="22" fill="#dc2626" opacity="0.16"/>
  <circle cx="80" cy="540" r="38" fill="#dc2626" opacity="0.10"/>

  <!-- =============================================================== -->
  <!-- TOP: Kicker pill (centered)                                     -->
  <!-- =============================================================== -->

  <g transform="translate(600, 56)">
    <rect x="-108" y="0" width="216" height="36" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="-88" cy="18" r="4.5" fill="#dc2626"/>
    <text x="-72" y="24" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">비자 신청 대행 · 주의점</text>
  </g>

  <!-- =============================================================== -->
  <!-- CENTER HERO: PROHIBITION SIGN with "100%" inside                -->
  <!-- (Typography hero in prohibition symbol — break from card/stamp/hourglass/hub) -->
  <!-- Sign center at (600, 280), main r=180                           -->
  <!-- =============================================================== -->

  <!-- Outer glow halo -->
  <circle cx="600" cy="280" r="210" fill="url(#signGlow)"/>

  <!-- Decorative dashed outer ring -->
  <circle cx="600" cy="280" r="170" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.45"/>

  <!-- Main prohibition circle (white fill so text reads cleanly on cream bg) -->
  <circle cx="600" cy="280" r="150" fill="#ffffff" stroke="#dc2626" stroke-width="12"/>

  <!-- "100%" text inside the sign -->
  <text x="600" y="315" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="100" font-weight="900" letter-spacing="-3">100%</text>

  <!-- Diagonal slash (NW → SE) across the circle — international "no" bar -->
  <line x1="494" y1="174" x2="706" y2="386" stroke="#dc2626" stroke-width="14" stroke-linecap="round" opacity="0.95"/>

  <!-- =============================================================== -->
  <!-- BELOW HERO: Headline + subtitle (centered)                      -->
  <!-- =============================================================== -->

  <!-- Main headline (centered, completes the visual's message) -->
  <text x="600" y="510" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="44" font-weight="bold">허가 보장은 없습니다</text>

  <!-- Subtitle -->
  <text x="600" y="548" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="19" font-weight="500">비자 심사는 출입국재류관리청이 결정합니다</text>

  <!-- =============================================================== -->
  <!-- BOTTOM CHIP ROW (3 cautions — single supporting callout)        -->
  <!-- Total width 140 + 180 + 140 + 32 (gaps) = 492, leftmost at x=354 -->
  <!-- =============================================================== -->

  <g transform="translate(354, 578)">
    <!-- Chip 1: 광고 의심 -->
    <g>
      <rect width="140" height="40" rx="20" fill="#0f172a"/>
      <g transform="translate(18, 20)">
        <circle r="8" fill="#fca5a5"/>
        <path d="M 0 -3 L 0 1 M 0 3.5 L 0 4" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
      <text x="38" y="26" fill="#fee2e2" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="1">광고 의심</text>
    </g>
    <!-- Chip 2: 허위 서류 위험 -->
    <g transform="translate(156, 0)">
      <rect width="180" height="40" rx="20" fill="#0f172a"/>
      <g transform="translate(18, 20)">
        <circle r="8" fill="#fcd34d"/>
        <path d="M -3.5 -3.5 L 3.5 3.5 M 3.5 -3.5 L -3.5 3.5" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <text x="38" y="26" fill="#fef3c7" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="1">허위 서류 위험</text>
    </g>
    <!-- Chip 3: 본인 책임 -->
    <g transform="translate(352, 0)">
      <rect width="140" height="40" rx="20" fill="#0f172a"/>
      <g transform="translate(18, 20)">
        <circle r="8" fill="#5eead4"/>
        <path d="M -4.5 0 L -1 3.5 L 4.5 -3" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="38" y="26" fill="#ccfbf1" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="1">본인 책임</text>
    </g>
  </g>
</svg>
