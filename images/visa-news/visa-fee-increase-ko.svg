<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefce8"/>

  <!-- Top gradient bar (brand consistent) -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Decorative geometric shapes -->
  <circle cx="1100" cy="120" r="160" fill="#fee2e2" opacity="0.55"/>
  <circle cx="1170" cy="240" r="80" fill="#fed7aa" opacity="0.6"/>
  <circle cx="100" cy="540" r="100" fill="#fef3c7" opacity="0.5"/>
  <polygon points="0,630 280,630 0,400" fill="#fef3c7" opacity="0.4"/>

  <!-- NEWS badge (brand consistent) -->
  <rect x="60" y="50" width="200" height="70" rx="12" fill="#dc2626"/>
  <text x="160" y="97" text-anchor="middle" fill="white" font-family="sans-serif" font-size="42" font-weight="bold">NEWS</text>

  <!-- Headline (centered) -->
  <text x="600" y="225" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="64" font-weight="bold">일본 비자 수수료</text>
  <text x="600" y="305" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="64" font-weight="bold">대폭 인상 추진</text>

  <!-- Subtitle with emphasized 30배 -->
  <text x="600" y="380" text-anchor="middle" font-family="sans-serif">
    <tspan fill="#64748b" font-size="32">영주권 신청 비용 최대 </tspan>
    <tspan fill="#dc2626" font-size="44" font-weight="bold">30배</tspan>
    <tspan fill="#64748b" font-size="32"> 상승 가능</tspan>
  </text>

  <!-- Comparison section -->
  <g transform="translate(210, 410)">
    <!-- Percentage label above arrow -->
    <text x="350" y="40" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="32" font-weight="bold">약 2,900%</text>

    <!-- Before box (small, gray) -->
    <rect x="0" y="55" width="180" height="80" rx="12" fill="#cbd5e1"/>
    <text x="90" y="105" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="32" font-weight="bold">1만 엔</text>

    <!-- Arrow between boxes -->
    <path d="M 215 95 L 480 95" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <path d="M 470 82 L 485 95 L 470 108" stroke="#dc2626" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- After box (larger, red) -->
    <rect x="520" y="25" width="260" height="140" rx="12" fill="#dc2626"/>
    <text x="650" y="75" text-anchor="middle" fill="#fee2e2" font-family="sans-serif" font-size="24" font-weight="bold">최대</text>
    <text x="650" y="130" text-anchor="middle" fill="white" font-family="sans-serif" font-size="36" font-weight="bold">30만 엔</text>
  </g>

  <!-- Footer URL -->

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>
