<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="40" font-weight="bold">Vo/chong nguoi Nhat</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 45)">
      <!-- Couple icon -->
      <!-- Person 1 (Japanese) -->
      <circle cx="45" cy="40" r="20" fill="#ec4899"/>
      <rect x="25" y="65" width="40" height="50" rx="8" fill="#ec4899"/>
      <!-- Person 2 (Foreign spouse) -->
      <circle cx="100" cy="40" r="20" fill="#f472b6"/>
      <rect x="80" y="65" width="40" height="50" rx="8" fill="#f472b6"/>
      <!-- Heart between them -->
      <path d="M72 55 C65 47, 52 50, 52 62 C52 77, 72 87, 72 87 C72 87, 92 77, 92 62 C92 50, 79 47, 72 55" fill="#fecdd3"/>
      <!-- Wedding rings -->
      <circle cx="55" cy="130" r="12" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <circle cx="75" cy="130" r="12" fill="none" stroke="#fbbf24" stroke-width="4"/>
      <!-- Japan flag hint -->
      <rect x="100" y="125" width="30" height="20" fill="white" stroke="#e5e7eb" stroke-width="1"/>
      <circle cx="115" cy="135" r="6" fill="#ef4444"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Vo/chong hoac con nguoi Nhat</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#fce7f3"/>
        <text x="12" y="17" text-anchor="middle" fill="#ec4899" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Khong gioi han viec lam</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#fce7f3"/>
        <text x="12" y="17" text-anchor="middle" fill="#ec4899" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Giay chung nhan ket hon can thiet</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#fce7f3"/>
        <text x="12" y="17" text-anchor="middle" fill="#ec4899" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 5 nam, 3 nam, 1 nam, 6 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#fce7f3"/>
        <text x="12" y="17" text-anchor="middle" fill="#ec4899" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Bang cau hoi va anh chup chung</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="280" y="290" width="240" height="44" rx="22" fill="#fce7f3"/>
    <text x="400" y="320" text-anchor="middle" fill="#be185d" font-family="sans-serif" font-size="18" font-weight="bold">日本人の配偶者等</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
