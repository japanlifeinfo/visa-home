<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="46" font-weight="bold">日本在留资格一目了然</text>
  <text x="600" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="24">长期居留必备的7种核心资格</text>

  <!-- 1. 技·人·国 -->
  <rect x="40" y="155" width="270" height="160" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <rect x="40" y="155" width="270" height="48" rx="20" fill="#3b82f6"/>
  <rect x="40" y="183" width="270" height="20" fill="#3b82f6"/>
  <text x="175" y="189" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">1. 技·人·国</text>
  <text x="175" y="245" text-anchor="middle" fill="#1e3a8a" font-family="sans-serif" font-size="22" font-weight="bold">工作</text>
  <text x="175" y="280" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="18">IT·设计·翻译</text>

  <!-- 2. 日本人配偶 -->
  <rect x="330" y="155" width="270" height="160" rx="20" fill="#fdf2f8" stroke="#ec4899" stroke-width="3"/>
  <rect x="330" y="155" width="270" height="48" rx="20" fill="#ec4899"/>
  <rect x="330" y="183" width="270" height="20" fill="#ec4899"/>
  <text x="465" y="189" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">2. 日本人配偶</text>
  <text x="465" y="245" text-anchor="middle" fill="#9d174d" font-family="sans-serif" font-size="22" font-weight="bold">结婚</text>
  <text x="465" y="280" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="18">无职业限制</text>

  <!-- 3. 永住者 -->
  <rect x="620" y="155" width="270" height="160" rx="20" fill="#f0fdf4" stroke="#10b981" stroke-width="3"/>
  <rect x="620" y="155" width="270" height="48" rx="20" fill="#10b981"/>
  <rect x="620" y="183" width="270" height="20" fill="#10b981"/>
  <text x="755" y="189" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">3. 永住者</text>
  <text x="755" y="245" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="22" font-weight="bold">永住</text>
  <text x="755" y="280" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="18">免更新</text>

  <!-- 4. 家族滞在 -->
  <rect x="910" y="155" width="250" height="160" rx="20" fill="#faf5ff" stroke="#8b5cf6" stroke-width="3"/>
  <rect x="910" y="155" width="250" height="48" rx="20" fill="#8b5cf6"/>
  <rect x="910" y="183" width="250" height="20" fill="#8b5cf6"/>
  <text x="1035" y="189" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">4. 家族滞在</text>
  <text x="1035" y="245" text-anchor="middle" fill="#5b21b6" font-family="sans-serif" font-size="22" font-weight="bold">陪同</text>
  <text x="1035" y="280" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="18">配偶·子女</text>

  <!-- 5. 留学 -->
  <rect x="180" y="345" width="270" height="160" rx="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="3"/>
  <rect x="180" y="345" width="270" height="48" rx="20" fill="#f59e0b"/>
  <rect x="180" y="373" width="270" height="20" fill="#f59e0b"/>
  <text x="315" y="379" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">5. 留学</text>
  <text x="315" y="435" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="22" font-weight="bold">学业</text>
  <text x="315" y="470" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="18">大学·专门·日语</text>

  <!-- 6. 特定技能 -->
  <rect x="470" y="345" width="270" height="160" rx="20" fill="#f0fdfa" stroke="#14b8a6" stroke-width="3"/>
  <rect x="470" y="345" width="270" height="48" rx="20" fill="#14b8a6"/>
  <rect x="470" y="373" width="270" height="20" fill="#14b8a6"/>
  <text x="605" y="379" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">6. 特定技能</text>
  <text x="605" y="435" text-anchor="middle" fill="#115e59" font-family="sans-serif" font-size="22" font-weight="bold">现场</text>
  <text x="605" y="470" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="18">餐饮·住宿·护理</text>

  <!-- 7. 经营·管理 -->
  <rect x="760" y="345" width="270" height="160" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
  <rect x="760" y="345" width="270" height="48" rx="20" fill="#6366f1"/>
  <rect x="760" y="373" width="270" height="20" fill="#6366f1"/>
  <text x="895" y="379" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">7. 经营·管理</text>
  <text x="895" y="435" text-anchor="middle" fill="#3730a3" font-family="sans-serif" font-size="22" font-weight="bold">创业</text>
  <text x="895" y="470" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="18">法人代表·经营</text>

  <!-- Bottom callout -->
  <rect x="160" y="540" width="880" height="64" rx="12" fill="#0f172a"/>
  <text x="600" y="582" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="bold">在留资格决定您在日本的活动范围</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
