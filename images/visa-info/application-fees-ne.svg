  <rect x="100" y="500" width="1000" height="60" rx="12" fill="#1e293b"/>
  <text x="600" y="540" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="bold">आफैं आवेदन गरेर शुल्क बचत!</text>

  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
