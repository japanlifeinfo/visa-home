  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">४७ प्रान्तका कार्यालयहरूको ठेगाना र फोन नम्बर</text>

  <!-- Step 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">🏢</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="18" font-weight="bold">कार्यालय नेटवर्क</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="14">८ मुख्य कार्यालय राष्ट्रव्यापी</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="14">३ शाखा कार्यालय</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="14">करिब ५५ शाखा</text>
  </g>

  <!-- Step 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="20" font-weight="bold">📍</text>
