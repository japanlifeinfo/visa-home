<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="40" font-weight="bold">Thuc tap sinh ky nang</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(45, 35)">
      <!-- Factory/workplace icon -->
      <rect x="20" y="30" width="100" height="70" fill="#3b82f6"/>
      <rect x="30" y="40" width="20" height="20" fill="#93c5fd"/>
      <rect x="60" y="40" width="20" height="20" fill="#93c5fd"/>
      <rect x="90" y="40" width="20" height="20" fill="#93c5fd"/>
      <rect x="30" y="70" width="20" height="20" fill="#93c5fd"/>
      <rect x="60" y="70" width="20" height="20" fill="#93c5fd"/>
      <rect x="90" y="70" width="20" height="20" fill="#93c5fd"/>
      <!-- Chimney -->
      <rect x="100" y="10" width="15" height="25" fill="#1d4ed8"/>
      <!-- Trainee figure -->
      <circle cx="50" cy="120" r="15" fill="#60a5fa"/>
      <rect x="35" y="138" width="30" height="35" rx="4" fill="#60a5fa"/>
      <!-- Learning arrow -->
      <path d="M75,130 L95,130 L95,125 L110,135 L95,145 L95,140 L75,140 Z" fill="#22c55e"/>
      <!-- Skills badge -->
      <circle cx="120" cy="135" r="18" fill="#16a34a"/>
      <text x="120" y="142" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">技</text>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Hoc ky nang tai Nhat Ban</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Loai 1, loai 2, loai 3</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Can phe duyet ke hoach tu OTIT</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 1 nam + 2 nam + 2 nam</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Hinh thuc giam sat tap the hoac doanh nghiep</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="320" y="290" width="160" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">技能実習</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
