  <!-- Card 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="55" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="22" font-weight="bold">&#8734;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Tanpa Batas Waktu</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Tidak perlu perpanjangan lagi</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Tidak khawatir kadaluarsa</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Stres administratif hilang</text>
  </g>

  <!-- Card 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="55" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="22" font-weight="bold">&#9733;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Kebebasan Karir</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Tanpa batasan industri</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Freelance, bisnis bisa</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Pekerjaan sampingan juga bebas</text>
  </g>

  <!-- Card 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
