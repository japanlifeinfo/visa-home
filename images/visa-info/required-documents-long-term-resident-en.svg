<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Long-Term Resident</text>
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Required Documents Guide</text>
  <g transform="translate(200, 190)">
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Home/Residence Icon -->
    <g transform="translate(60, 70)">
      <!-- House -->
      <polygon points="80,30 140,80 20,80" fill="#22c55e"/>
      <rect x="30" y="80" width="100" height="80" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
      <!-- Door -->
      <rect x="65" y="100" width="30" height="60" fill="#22c55e"/>
      <circle cx="88" cy="130" r="3" fill="#166534"/>
      <!-- Window -->
      <rect x="40" y="95" width="20" height="20" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
      <rect x="100" y="95" width="20" height="20" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
      <!-- Calendar/Time indicator -->
      <rect x="110" y="40" width="40" height="35" rx="4" fill="white" stroke="#22c55e" stroke-width="2"/>
      <text x="130" y="65" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="bold">5Y+</text>
    </g>
    <!-- Content Section -->
    <g transform="translate(280, 60)">
      <circle cx="20" cy="20" r="12" fill="#dcfce7"/>
      <text x="45" y="26" fill="#1e293b" font-family="sans-serif" font-size="20">Japanese ancestry</text>
      <circle cx="20" cy="70" r="12" fill="#dcfce7"/>
      <text x="45" y="76" fill="#1e293b" font-family="sans-serif" font-size="20">Refugee recognized</text>
      <circle cx="20" cy="120" r="12" fill="#dcfce7"/>
      <text x="45" y="126" fill="#1e293b" font-family="sans-serif" font-size="20">Special circumstances</text>
      <circle cx="20" cy="170" r="12" fill="#dcfce7"/>
      <text x="45" y="176" fill="#1e293b" font-family="sans-serif" font-size="20">Long-term stability</text>
    </g>
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#dcfce7"/>
    <text x="400" y="320" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="18" font-weight="bold">定住者</text>
  </g>
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>