<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="30" font-weight="bold">Panduan langkah demi langkah untuk pemohon pertama</text>

  <!-- Step 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="22" font-weight="bold">1</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Siapkan Dokumen</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Formulir, paspor, foto</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Bukti aktivitas, dokumen perusahaan</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Surat keterangan kerja</text>
  </g>


  <!-- Step 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="22" font-weight="bold">2</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Ajukan Permohonan</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Ke Kantor Imigrasi atau perwakilan</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Gratis biaya pengajuan</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Cek yurisdiksi kantor</text>
  </g>


  <!-- Step 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="22" font-weight="bold">3</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Periode Pemeriksaan</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Rata-rata 1-3 bulan</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Respon cepat untuk permintaan tambahan</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Tunggu pemberitahuan hasil</text>
  </g>


  <!-- Step 4 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="53" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="22" font-weight="bold">4</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Setelah Disetujui</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Kartu Tinggal, visa (baru masuk)</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Bayar materai</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Pendaftaran alamat</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">Poin Penting</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">Sesuaikan status | Konsistensi dokumen | Respon cepat</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>