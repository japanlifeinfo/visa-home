<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Trabalhador Qualificado Especificado 2</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Guia de Documentos Necessarios</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(45, 25)">
      <!-- Worker with hard hat -->
      <circle cx="60" cy="35" r="20" fill="#fcd34d"/>
      <rect x="40" y="20" width="40" height="12" fill="#f59e0b"/>
      <rect x="45" y="16" width="30" height="6" fill="#f59e0b"/>
      <!-- Face -->
      <circle cx="52" cy="35" r="3" fill="#1f2937"/>
      <circle cx="68" cy="35" r="3" fill="#1f2937"/>
      <path d="M55 42 Q60 46 65 42" stroke="#1f2937" stroke-width="2" fill="none"/>
      <!-- Body with uniform -->
      <rect x="42" y="55" width="36" height="45" rx="5" fill="#0ea5e9"/>
      <rect x="55" y="55" width="10" height="45" fill="#0284c7"/>
      <!-- Arms -->
      <rect x="25" y="58" width="20" height="12" rx="4" fill="#0ea5e9"/>
      <rect x="75" y="58" width="20" height="12" rx="4" fill="#0ea5e9"/>
      <!-- Tool belt -->
      <rect x="42" y="85" width="36" height="8" fill="#92400e"/>
      <!-- Star badge (expert level) -->
      <polygon points="100,30 105,45 120,45 108,55 112,70 100,60 88,70 92,55 80,45 95,45" fill="#fbbf24"/>
      <text x="100" y="55" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">2</text>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Visto de Habilidade Especifica Avancada</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">&#x2713;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Habilidades avancadas em 11 areas</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">&#x2713;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Sem limite de periodo (renovavel)</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">&#x2713;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Familia permitida (conjuge, filhos)</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">&#x2713;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Elegivel para residencia permanente</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="290" y="290" width="220" height="44" rx="22" fill="#e0f2fe"/>
    <text x="400" y="320" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="18" font-weight="bold">特定技能2号</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
