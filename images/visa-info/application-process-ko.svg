<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">처음 준비하시는 분들을 위한 단계별 가이드</text>

  <!-- Step 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="22" font-weight="bold">1</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">서류 준비</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">신청서, 여권, 증명사진</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">활동증명, 회사 관련 서류</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">재직증명서 등</text>
  </g>


  <!-- Step 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="22" font-weight="bold">2</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">입국관리국 신청</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">본인 직접 방문 또는 대리 신청</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">접수 수수료 무료</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">관할 사무소 사전 확인</text>
  </g>


  <!-- Step 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="22" font-weight="bold">3</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">심사 기간</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">평균 1~3개월 소요</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">추가 서류 요청 시 신속 대응</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">결과 통지 대기</text>
  </g>


  <!-- Step 4 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="53" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="22" font-weight="bold">4</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">허가 후 절차</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">재류카드 발급, 비자 발급 (신규)</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">수입인지 납부</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">주소지 등록</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">핵심 포인트</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">재류자격과 활동 일치 | 서류 일관성 | 추가 요청 신속 대응</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>