<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="55" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="30" font-weight="bold">Co the doi visa ngan han sang visa dai han?</text>
  <text x="600" y="85" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Visa du lich → Visa lam viec: Su that</text>

  <text x="80" y="125" fill="#dc2626" font-family="sans-serif" font-size="18" font-weight="bold">Cach sai</text>

  <g transform="translate(60, 138)">
    <rect width="200" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">Nhap canh visa du lich</text>
    <text x="100" y="45" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="12">Luu tru ngan han 15/30/90 ngay</text>
  </g>
  <line x1="270" y1="168" x2="310" y2="168" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="310,162 322,168 310,174" fill="#dc2626"/>

  <g transform="translate(325, 138)">
    <rect width="200" height="60" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="100" y="25" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">Doi visa tai Nhat Ban?</text>
    <text x="100" y="45" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="12">Ngan han → Visa lam viec</text>
  </g>
  <g transform="translate(545, 138)">
    <circle cx="30" cy="30" r="30" fill="#dc2626"/>
    <line x1="15" y1="15" x2="45" y2="45" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="45" y1="15" x2="15" y2="45" stroke="white" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(620, 138)">
    <rect width="520" height="60" rx="10" fill="#1e293b"/>
    <text x="260" y="25" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="bold">Luat nhap cu cam doi tu ngan han sang tu cach khac</text>
    <text x="260" y="45" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">Nhap canh "tam thoi" → muc dich dai han = vi pham</text>
  </g>

  <line x1="60" y1="220" x2="1140" y2="220" stroke="#e2e8f0" stroke-width="2"/>

  <text x="80" y="252" fill="#15803d" font-family="sans-serif" font-size="18" font-weight="bold">Thu tuc dung</text>

  <g transform="translate(60, 265)">
    <rect width="200" height="90" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="24" cy="20" r="14" fill="#22c55e"/>
    <text x="24" y="25" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">1</text>
    <text x="120" y="24" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">Duoc tuyen dung</text>
    <text x="100" y="52" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">Nhan duoc loi moi</text>
    <text x="100" y="70" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">tu cong ty Nhat Ban</text>
  </g>
  <line x1="270" y1="310" x2="290" y2="310" stroke="#22c55e" stroke-width="2"/>
  <polygon points="290,304 302,310 290,316" fill="#22c55e"/>

  <g transform="translate(305, 265)">
    <rect width="200" height="90" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="24" cy="20" r="14" fill="#22c55e"/>
    <text x="24" y="25" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">2</text>
    <text x="120" y="24" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">Nop don COE</text>
    <text x="100" y="52" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">Cong ty nop don</text>
    <text x="100" y="70" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">xin COE</text>
  </g>
  <line x1="515" y1="310" x2="535" y2="310" stroke="#22c55e" stroke-width="2"/>
  <polygon points="535,304 547,310 535,316" fill="#22c55e"/>

  <g transform="translate(550, 265)">
    <rect width="180" height="90" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="24" cy="20" r="14" fill="#22c55e"/>
    <text x="24" y="25" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">3</text>
    <text x="108" y="24" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">COE duoc cap</text>
    <text x="90" y="52" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">Co quan nhap cu</text>
    <text x="90" y="70" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">cap giay COE</text>
  </g>
  <line x1="740" y1="310" x2="760" y2="310" stroke="#22c55e" stroke-width="2"/>
  <polygon points="760,304 772,310 760,316" fill="#22c55e"/>

  <g transform="translate(775, 265)">
    <rect width="200" height="90" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <circle cx="24" cy="20" r="14" fill="#22c55e"/>
    <text x="24" y="25" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">4</text>
    <text x="118" y="24" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">Xin visa lam viec</text>
    <text x="100" y="52" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">Tai dai su quan Nhat</text>
    <text x="100" y="70" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">o nuoc minh</text>
  </g>
  <line x1="985" y1="310" x2="1005" y2="310" stroke="#22c55e" stroke-width="2"/>
  <polygon points="1005,304 1017,310 1005,316" fill="#22c55e"/>

  <g transform="translate(1020, 265)">
    <rect width="120" height="90" rx="10" fill="#22c55e"/>
    <circle cx="22" cy="20" r="14" fill="white"/>
    <text x="22" y="25" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="bold">5</text>
    <text x="60" y="55" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">Nhap canh</text>
    <text x="60" y="75" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">Nhat Ban!</text>
  </g>

  <g transform="translate(60, 380)">
    <rect width="530" height="100" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <text x="265" y="28" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="15" font-weight="bold">Ngoai le (Rat han che)</text>
    <line x1="30" y1="40" x2="500" y2="40" stroke="#fde68a" stroke-width="1"/>
    <text x="30" y="62" fill="#78350f" font-family="sans-serif" font-size="13">* Ket hon khan cap voi nguoi Nhat</text>
    <text x="30" y="82" fill="#78350f" font-family="sans-serif" font-size="13">* Tinh huong gia dinh nghiem trong / sinh con</text>
    <text x="300" y="62" fill="#78350f" font-family="sans-serif" font-size="13">* Quyet dinh hanh chinh dac biet</text>
    <text x="300" y="82" fill="#a16207" font-family="sans-serif" font-size="12">→ Hau nhu khong ap dung cho viec lam</text>
  </g>

  <g transform="translate(610, 380)">
    <rect width="530" height="100" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="265" y="28" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="15" font-weight="bold">Luu y khi co visa du lich</text>
    <line x1="30" y1="40" x2="500" y2="40" stroke="#fecaca" stroke-width="1"/>
    <text x="30" y="62" fill="#991b1b" font-family="sans-serif" font-size="13">OK: Di phong van xin viec</text>
    <text x="30" y="82" fill="#991b1b" font-family="sans-serif" font-size="13">NG: Bat dau lam viec (bat hop phap)</text>
    <text x="300" y="62" fill="#991b1b" font-family="sans-serif" font-size="13">NG: Lam viec khong phep = truc xuat</text>
    <text x="300" y="82" fill="#991b1b" font-family="sans-serif" font-size="13">NG: Anh huong xau den visa tuong lai</text>
  </g>

  <rect x="60" y="500" width="1080" height="50" rx="10" fill="#1e293b"/>
  <text x="600" y="530" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="17" font-weight="bold">"Cu di roi tinh" ✕ → Tuyen dung → COE → Visa lam viec → Nhap canh ✓</text>

  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
