<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fef2f2"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="80" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="40" font-weight="bold">जीवनसाथी भिसा किन अस्वीकृत हुन्छ?</text>

  <rect x="100" y="130" width="320" height="260" rx="20" fill="#dc2626"/>
  <text x="260" y="210" text-anchor="middle" fill="white" font-family="sans-serif" font-size="72" font-weight="bold">1</text>
  <text x="260" y="270" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">नक्कली विवाह</text>
  <text x="260" y="310" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="24">शंका</text>

  <rect x="440" y="130" width="320" height="260" rx="20" fill="#ea580c"/>
  <text x="600" y="210" text-anchor="middle" fill="white" font-family="sans-serif" font-size="72" font-weight="bold">2</text>
  <text x="600" y="270" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">आर्थिक क्षमता</text>
  <text x="600" y="310" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="24">अपर्याप्त</text>

  <rect x="780" y="130" width="320" height="260" rx="20" fill="#d97706"/>
  <text x="940" y="210" text-anchor="middle" fill="white" font-family="sans-serif" font-size="72" font-weight="bold">3</text>
  <text x="940" y="270" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">बसोबास इतिहास</text>
  <text x="940" y="310" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="24">समस्या</text>

  <rect x="100" y="430" width="1000" height="90" rx="16" fill="#1e293b"/>
  <text x="600" y="485" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="28" font-weight="bold">विवाह ≠ स्वचालित स्वीकृति</text>


  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
