<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Penghibur</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Panduan Dokumen yang Diperlukan</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(40, 25)">
      <!-- Stage spotlight -->
      <polygon points="60,0 45,30 75,30" fill="#fbbf24"/>
      <rect x="52" y="30" width="16" height="8" fill="#92400e"/>
      <!-- Light beam -->
      <polygon points="60,38 30,110 90,110" fill="#fef3c7" opacity="0.5"/>
      <!-- Microphone -->
      <ellipse cx="60" cy="55" rx="12" ry="18" fill="#374151"/>
      <rect x="55" y="70" width="10" height="30" fill="#6b7280"/>
      <ellipse cx="60" cy="100" rx="18" ry="6" fill="#374151"/>
      <!-- Music notes -->
      <text x="95" y="50" fill="#8b5cf6" font-family="sans-serif" font-size="24">&#9834;</text>
      <text x="105" y="35" fill="#ec4899" font-family="sans-serif" font-size="20">&#9835;</text>
      <text x="20" y="45" fill="#3b82f6" font-family="sans-serif" font-size="22">&#9834;</text>
      <!-- Stars -->
      <polygon points="115,70 117,76 123,76 118,80 120,86 115,82 110,86 112,80 107,76 113,76" fill="#fbbf24"/>
      <polygon points="25,75 26,79 30,79 27,82 28,86 25,83 22,86 23,82 20,79 24,79" fill="#fbbf24"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Status Tinggal Hiburan</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#fae8ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Teater, hiburan, musik, olahraga, dll.</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#fae8ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Kegiatan seni (siaran, film, dll.)</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#fae8ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Masa tinggal: 3 tahun, 1 tahun, 6, 3 bulan, 15 hari</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#fae8ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Pengakuan/perubahan/perpanjangan tersedia</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#fae8ff"/>
    <text x="400" y="320" text-anchor="middle" fill="#9333ea" font-family="sans-serif" font-size="18" font-weight="bold">興行</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
