<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Visa Kerja vs PR</text>

  <!-- Left: Visa Kerja (grey) -->
  <rect x="60" y="110" width="520" height="400" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="60" y="110" width="520" height="70" rx="20" fill="#64748b"/>
  <rect x="60" y="155" width="520" height="25" fill="#64748b"/>
  <text x="320" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="36" font-weight="bold">Visa Kerja</text>

  <text x="320" y="250" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="32">Kerja terbatas</text>
  <text x="320" y="310" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="32">Wajib perpanjang</text>
  <text x="320" y="370" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="32">Sulit pinjam</text>
  <text x="320" y="470" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="36" font-weight="bold">Terbatas</text>

  <!-- Right: PR (green) -->
  <rect x="620" y="110" width="520" height="400" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <rect x="620" y="110" width="520" height="70" rx="20" fill="#16a34a"/>
  <rect x="620" y="155" width="520" height="25" fill="#16a34a"/>
  <text x="880" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="36" font-weight="bold">PR</text>

  <text x="880" y="250" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="32">Kerja bebas</text>
  <text x="880" y="310" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="32">Tanpa perpanjangan</text>
  <text x="880" y="370" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="32">Bisa pinjam</text>
  <text x="880" y="470" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="36" font-weight="bold">Bebas</text>

  <!-- VS badge -->
  <circle cx="600" cy="310" r="40" fill="#1e293b"/>
  <text x="600" y="322" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">VS</text>


  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>