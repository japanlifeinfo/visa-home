<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Hoat dong van hoa</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 40)">
      <!-- Traditional brush/calligraphy icon -->
      <rect x="40" y="20" width="8" height="80" fill="#7c3aed"/>
      <polygon points="44,100 30,140 58,140" fill="#5b21b6"/>
      <!-- Ikebana vase -->
      <ellipse cx="100" cy="130" rx="25" ry="15" fill="#a78bfa"/>
      <rect x="80" y="90" width="40" height="40" rx="4" fill="#8b5cf6"/>
      <!-- Flower -->
      <circle cx="90" cy="70" r="8" fill="#f472b6"/>
      <circle cx="110" cy="60" r="8" fill="#fb7185"/>
      <line x1="90" y1="78" x2="90" y2="90" stroke="#22c55e" stroke-width="2"/>
      <line x1="110" y1="68" x2="110" y2="90" stroke="#22c55e" stroke-width="2"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Hoat dong hoc thuat/nghe thuat</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#ede9fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Hoat dong khong co thu nhap</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#ede9fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Tra dao, cam hoa, vo thuat</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#ede9fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 3 nam, 1 nam, 6 thang, 3 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#ede9fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#8b5cf6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Duoi su huong dan cua chuyen gia</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="320" y="290" width="160" height="44" rx="22" fill="#ede9fe"/>
    <text x="400" y="320" text-anchor="middle" fill="#7c3aed" font-family="sans-serif" font-size="18" font-weight="bold">文化活動</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
