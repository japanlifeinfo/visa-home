<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Japan Travel: Visa Needed?</text>

  <!-- Passport icon -->
  <rect x="420" y="110" width="200" height="260" rx="16" fill="#1e40af"/>
  <rect x="445" y="140" width="150" height="100" rx="8" fill="#dbeafe"/>
  <text x="520" y="210" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="40" font-weight="bold">PASS</text>
  <text x="520" y="315" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">PASSPORT</text>

  <!-- Question mark -->
  <text x="720" y="300" fill="#f59e0b" font-family="sans-serif" font-size="160" font-weight="bold">?</text>

  <!-- Bottom: two columns -->
  <rect x="60" y="410" width="520" height="110" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="320" y="460" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="40" font-weight="bold">Exempt: Korea, US, EU</text>
  <text x="320" y="505" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">90-day stay without visa</text>

  <rect x="620" y="410" width="520" height="110" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
  <text x="880" y="460" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="40" font-weight="bold">Required: some countries</text>
  <text x="880" y="505" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Must obtain visa in advance</text>

  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>