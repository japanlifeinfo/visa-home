<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="34" font-weight="500" letter-spacing="6" opacity="0.8">제출 서류</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="140" font-weight="900">단기체재</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <path d="M60 130 L130 80 L200 130" fill="none" stroke="#0284c7" stroke-width="4" opacity="0.35"/>
      <path d="M130 80 L130 55" stroke="#0284c7" stroke-width="3" opacity="0.3"/>
      <ellipse cx="130" cy="115" rx="70" ry="20" fill="#0284c7" opacity="0.15"/>
      <path d="M85 105 L130 75 L175 105 L155 105 L130 85 L105 105Z" fill="#0284c7" opacity="0.3"/>
      <rect x="120" y="105" width="20" height="4" rx="2" fill="#0284c7" opacity="0.4"/>
      <path d="M80 140 C80 140 105 155 130 155 C155 155 180 140 180 140" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.2"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#0284c7" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">短期滞在</text>
  <text x="955" y="425" text-anchor="middle" fill="#0284c7" font-family="sans-serif" font-size="30" opacity="0.6">Temporary Visitor</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#0284c7" opacity="0.08" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#0284c7" font-family="sans-serif" font-size="23" font-weight="600">S</text>

</svg>