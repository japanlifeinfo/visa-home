<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="50" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Prosedur Penerbitan COE (Certificate of Eligibility)</text>
  <text x="600" y="78" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">Proses penting untuk bekerja di Jepang dari luar negeri</text>

  <!-- Horizontal Timeline Line -->
  <line x1="100" y1="160" x2="1100" y2="160" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Milestone 1: Kontrak Kerja -->
  <circle cx="140" cy="160" r="18" fill="#3b82f6"/>
  <text x="140" y="166" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">1</text>
  <g transform="translate(60, 185)">
    <rect width="160" height="75" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="80" y="25" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="14" font-weight="bold">Kontrak Kerja</text>
    <text x="80" y="45" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Menandatangani kontrak</text>
    <text x="80" y="62" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">kerja dengan perusahaan Jepang</text>
  </g>

  <!-- Milestone 2: Perusahaan mengajukan -->
  <circle cx="335" cy="160" r="18" fill="#8b5cf6"/>
  <text x="335" y="166" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">2</text>
  <g transform="translate(255, 100)">
    <rect width="160" height="50" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" fill="#6d28d9" font-family="sans-serif" font-size="12" font-weight="bold">Perusahaan mengajukan</text>
    <text x="80" y="40" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Biasanya ditangani perusahaan</text>
  </g>

  <!-- Milestone 3: Peninjauan -->
  <circle cx="530" cy="160" r="22" fill="#f59e0b" stroke="#fbbf24" stroke-width="3"/>
  <text x="530" y="166" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">3</text>
  <g transform="translate(440, 190)">
    <rect width="180" height="88" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <text x="90" y="22" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="13" font-weight="bold">Peninjauan (1-3 bulan)</text>
    <text x="90" y="42" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Relevansi jurusan/pekerjaan</text>
    <text x="90" y="58" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Pemeriksaan keuangan perusahaan</text>
    <text x="90" y="78" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="11" font-weight="bold">Gerbang paling penting!</text>
  </g>

  <!-- Milestone 4: COE Diterbitkan -->
  <circle cx="720" cy="160" r="18" fill="#10b981"/>
  <text x="720" y="166" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">4</text>
  <g transform="translate(640, 100)">
    <rect width="160" height="50" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="14" font-weight="bold">COE Diterbitkan</text>
    <text x="80" y="40" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Terima sertifikat via pos</text>
  </g>

  <!-- Milestone 5: Visa di Kedutaan -->
  <circle cx="910" cy="160" r="18" fill="#ec4899"/>
  <text x="910" y="166" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">5</text>
  <g transform="translate(830, 185)">
    <rect width="160" height="75" rx="8" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" fill="#9d174d" font-family="sans-serif" font-size="13" font-weight="bold">Visa di Kedutaan</text>
    <text x="80" y="42" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Kedutaan setempat</text>
    <text x="80" y="58" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Penerbitan: 3-7 hari</text>
  </g>

  <!-- Milestone 6: Masuk Jepang -->
  <circle cx="1060" cy="160" r="18" fill="#dc2626"/>
  <text x="1060" y="166" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">6</text>
  <g transform="translate(990, 100)">
    <rect width="140" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="70" y="20" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">Masuk Jepang!</text>
    <text x="70" y="40" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">Terima kartu tinggal di bandara</text>
  </g>

  <!-- Required Documents Box -->
  <g transform="translate(50, 310)">
    <rect width="540" height="175" rx="12" fill="#1e293b"/>
    <text x="270" y="28" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">Dokumen Wajib untuk COE</text>
    <line x1="30" y1="42" x2="510" y2="42" stroke="#334155"/>
    <text x="35" y="68" fill="#e2e8f0" font-family="sans-serif" font-size="13">• Formulir aplikasi COE</text>
    <text x="35" y="90" fill="#e2e8f0" font-family="sans-serif" font-size="13">• Salinan paspor, foto</text>
    <text x="35" y="112" fill="#e2e8f0" font-family="sans-serif" font-size="13">• Kontrak kerja, pendaftaran perusahaan</text>
    <text x="35" y="134" fill="#e2e8f0" font-family="sans-serif" font-size="13">• Laporan keuangan, deskripsi pekerjaan</text>
    <text x="35" y="158" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">※ Dokumen tambahan bervariasi sesuai jenis visa</text>
  </g>

  <!-- Duration summary -->
  <g transform="translate(610, 310)">
    <rect width="540" height="80" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="270" y="28" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="14">Total durasi (kontrak hingga masuk)</text>
    <text x="270" y="60" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="30" font-weight="bold">Sekitar 1,5-4 bulan</text>
  </g>

  <!-- Key point -->
  <g transform="translate(610, 405)">
    <rect width="540" height="80" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="270" y="28" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="15" font-weight="bold">Perhatian Masa Berlaku COE!</text>
    <text x="270" y="50" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">Harus masuk Jepang dalam 3 bulan sejak diterbitkan</text>
    <text x="270" y="70" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">Jika kadaluarsa, COE batal → harus mengajukan ulang</text>
  </g>

  <!-- Bottom bar -->
  <g transform="translate(50, 505)">
    <rect width="1100" height="55" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="550" y="35" text-anchor="middle" fill="#854d0e" font-family="sans-serif" font-size="15" font-weight="bold">Lulus ujian bukan akhir — Peninjauan COE adalah gerbang paling penting</text>
  </g>

  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>