<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="48" font-weight="bold">Pekerja Terampil Khusus 1</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Panduan Dokumen yang Diperlukan</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(40, 50)">
      <!-- Worker with helmet icon -->
      <circle cx="70" cy="40" r="25" fill="#10b981"/>
      <!-- Helmet -->
      <path d="M45 35 Q70 10 95 35 L95 45 L45 45 Z" fill="#059669"/>

      <!-- Body -->
      <rect x="45" y="70" width="50" height="60" rx="8" fill="#10b981"/>

      <!-- Tools -->
      <rect x="100" y="80" width="40" height="8" rx="2" fill="#6ee7b7"/>
      <rect x="100" y="95" width="35" height="8" rx="2" fill="#6ee7b7"/>
      <rect x="100" y="110" width="30" height="8" rx="2" fill="#6ee7b7"/>

      <!-- Badge "1号" -->
      <circle cx="70" cy="150" r="18" fill="#065f46"/>
      <text x="70" y="156" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">1号</text>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Pekerjaan Industri Tertentu (16 bidang)</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
        <text x="12" y="17" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Lulus ujian keterampilan + bahasa Jepang (N4)</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
        <text x="12" y="17" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Kontrak kerja dan rencana dukungan wajib</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
        <text x="12" y="17" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Maks 5 tahun tinggal (tanpa keluarga)</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
        <text x="12" y="17" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">PR tersedia jika naik ke No.2</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="310" y="290" width="180" height="44" rx="22" fill="#d1fae5"/>
    <text x="400" y="320" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="18" font-weight="bold">特定技能1号</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
