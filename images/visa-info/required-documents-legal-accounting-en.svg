<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Legal/Accounting Services</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Required Documents Guide</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 35)">
      <!-- Scales of justice -->
      <rect x="55" y="10" width="10" height="80" fill="#6366f1"/>
      <rect x="30" y="85" width="60" height="10" rx="3" fill="#6366f1"/>
      <!-- Left pan -->
      <line x1="60" y1="25" x2="25" y2="35" stroke="#6366f1" stroke-width="3"/>
      <path d="M10 35 L25 35 L40 35 L35 55 L15 55 Z" fill="#a5b4fc"/>
      <!-- Right pan -->
      <line x1="60" y1="25" x2="95" y2="35" stroke="#6366f1" stroke-width="3"/>
      <path d="M80 35 L95 35 L110 35 L105 55 L85 55 Z" fill="#a5b4fc"/>
      <!-- Balance bar -->
      <rect x="20" y="20" width="80" height="8" rx="4" fill="#4f46e5"/>
      <circle cx="60" cy="15" r="8" fill="#4f46e5"/>
      <!-- Calculator -->
      <rect x="90" y="65" width="30" height="40" rx="3" fill="#374151"/>
      <rect x="93" y="68" width="24" height="12" fill="#86efac"/>
      <rect x="93" y="83" width="5" height="5" fill="#9ca3af"/>
      <rect x="100" y="83" width="5" height="5" fill="#9ca3af"/>
      <rect x="107" y="83" width="5" height="5" fill="#9ca3af"/>
      <rect x="93" y="90" width="5" height="5" fill="#9ca3af"/>
      <rect x="100" y="90" width="5" height="5" fill="#9ca3af"/>
      <rect x="107" y="90" width="5" height="5" fill="#9ca3af"/>
      <rect x="93" y="97" width="5" height="5" fill="#9ca3af"/>
      <rect x="100" y="97" width="5" height="5" fill="#9ca3af"/>
      <rect x="107" y="97" width="5" height="5" fill="#9ca3af"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Legal/Accounting Professional Status</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Lawyer, CPA, Tax Accountant, etc.</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Japanese qualification required</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Period: 5 years, 3 years, 1 year, 3 months</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">COE, Change, Extension available</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="280" y="290" width="240" height="44" rx="22" fill="#e0e7ff"/>
    <text x="400" y="320" text-anchor="middle" fill="#4338ca" font-family="sans-serif" font-size="18" font-weight="bold">法律・会計業務</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
