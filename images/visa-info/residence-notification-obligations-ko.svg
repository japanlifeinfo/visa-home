<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="deadlineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- ===== Background: Light blue paper (distinct from cream / dark navy / dark emerald) ===== -->
  <rect width="1200" height="630" fill="#eff6ff"/>
  <!-- Top gradient bar (notification/urgency theme: blue → indigo → red) -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark (Korean only): 신고 lower-right, very faint -->
  <text x="1180" y="612" text-anchor="end" fill="#3b82f6" font-family="sans-serif" font-size="220" font-weight="bold" opacity="0.05" letter-spacing="-4">신고</text>

  <!-- Dotted accent grid (upper-right) -->
  <g opacity="0.30">
    <circle cx="1080" cy="80" r="2" fill="#3b82f6"/>
    <circle cx="1110" cy="80" r="2" fill="#3b82f6"/>
    <circle cx="1140" cy="80" r="2" fill="#3b82f6"/>
    <circle cx="1110" cy="110" r="2" fill="#3b82f6"/>
    <circle cx="1140" cy="110" r="2" fill="#3b82f6"/>
    <circle cx="1140" cy="140" r="2" fill="#3b82f6"/>
  </g>

  <!-- Decorative accent circles (asymmetric placement) -->
  <circle cx="1130" cy="540" r="38" fill="#6366f1" opacity="0.12"/>
  <circle cx="1080" cy="490" r="18" fill="#dc2626" opacity="0.15"/>
  <circle cx="60" cy="80" r="32" fill="#3b82f6" opacity="0.10"/>

  <!-- =============================================================== -->
  <!-- LEFT ZONE: Calendar page with 14-day deadline + 신고 stamp       -->
  <!-- Macro composition: LEFT-RIGHT SPLIT (breaks from 3 prior         -->
  <!-- centered compositions). Calendar silhouette breaks from scale /  -->
  <!-- prohibition sign / dual stamps.                                  -->
  <!-- =============================================================== -->

  <!-- Glow halo behind calendar -->
  <ellipse cx="330" cy="355" rx="270" ry="220" fill="url(#deadlineGlow)"/>

  <!-- Calendar page (tilted -4°) -->
  <g transform="translate(330, 355) rotate(-4)">
    <!-- Drop shadow -->
    <rect x="-172" y="-208" width="344" height="412" rx="8" fill="#1e293b" opacity="0.12" transform="translate(6, 8)"/>
    <!-- Page background -->
    <rect x="-174" y="-210" width="348" height="416" rx="8" fill="url(#paperShade)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Header bar (red) — top portion of page -->
    <path d="M -174 -210 L 166 -210 Q 174 -210 174 -202 L 174 -156 L -174 -156 Z" fill="#dc2626"/>
    <!-- Month text on header -->
    <text x="0" y="-176" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" letter-spacing="8">6월</text>

    <!-- Binding holes on top -->
    <circle cx="-90" cy="-210" r="5.5" fill="#cbd5e1"/>
    <circle cx="90" cy="-210" r="5.5" fill="#cbd5e1"/>

    <!-- Week header row -->
    <g font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">
      <text x="-140" y="-122">일</text>
      <text x="-93" y="-122">월</text>
      <text x="-47" y="-122">화</text>
      <text x="0" y="-122">수</text>
      <text x="47" y="-122">목</text>
      <text x="93" y="-122">금</text>
      <text x="140" y="-122">토</text>
    </g>

    <!-- Date grid -->
    <g font-family="sans-serif" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="middle">
      <!-- Week 1 (1=Mon, 2=Tue) -->
      <text x="-93" y="-86">1</text>
      <text x="-47" y="-86">2</text>
      <text x="0" y="-86">3</text>
      <text x="47" y="-86">4</text>
      <text x="93" y="-86">5</text>
      <text x="140" y="-86">6</text>
      <!-- Week 2 (7=Sun) -->
      <text x="-140" y="-50">7</text>
      <text x="-93" y="-50">8</text>
      <text x="-47" y="-50">9</text>
      <text x="0" y="-50">10</text>
      <text x="47" y="-50">11</text>
      <text x="93" y="-50">12</text>
      <text x="140" y="-50">13</text>
      <!-- Week 3 -->
      <text x="-140" y="-14">14</text>
      <text x="-93" y="-14">15</text>
      <text x="-47" y="-14">16</text>
      <text x="0" y="-14">17</text>
      <text x="47" y="-14">18</text>
      <text x="93" y="-14">19</text>
      <text x="140" y="-14">20</text>
      <!-- Week 4 -->
      <text x="-140" y="22">21</text>
      <text x="-93" y="22">22</text>
      <text x="-47" y="22">23</text>
      <text x="0" y="22">24</text>
      <text x="47" y="22">25</text>
      <text x="93" y="22">26</text>
      <text x="140" y="22">27</text>
      <!-- Week 5 -->
      <text x="-140" y="58">28</text>
      <text x="-93" y="58">29</text>
      <text x="-47" y="58">30</text>
    </g>

    <!-- Red highlight around "14" -->
    <circle cx="-140" cy="-19" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="-140" y="-13" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="20" font-weight="bold">14</text>

    <!-- "14일 이내" bottom callout (inside the calendar) -->
    <g transform="translate(0, 130)">
      <rect x="-130" y="0" width="260" height="56" rx="8" fill="#dc2626"/>
      <text x="0" y="37" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" letter-spacing="3">14일 이내 신고</text>
    </g>

    <!-- Connector dashed arrow from 14 to callout -->
    <line x1="-140" y1="4" x2="-130" y2="130" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- 신고 stamp (overlapping top-right of calendar, rotated +15°) -->
  <g transform="translate(450, 230) rotate(15)">
    <circle r="58" fill="#fef2f2" opacity="0.6"/>
    <circle r="58" fill="none" stroke="#dc2626" stroke-width="4.5"/>
    <circle r="46" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.7"/>
    <text y="14" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="38" font-weight="bold" letter-spacing="4">신고</text>
    <!-- Tiny ink imperfections -->
    <circle cx="-36" cy="-32" r="1.5" fill="#dc2626" opacity="0.6"/>
    <circle cx="38" cy="34" r="1.3" fill="#dc2626" opacity="0.55"/>
  </g>

  <!-- =============================================================== -->
  <!-- RIGHT ZONE: Kicker + headline + subtitle (LEFT-aligned)         -->
  <!-- Pattern: 좌측 정렬 헤드라인 — breaks from 3 prior centered      -->
  <!-- =============================================================== -->

  <!-- Kicker pill (left-aligned within right zone) -->
  <g transform="translate(680, 108)">
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="4.5" fill="#3b82f6"/>
    <text x="36" y="24" fill="#3b82f6" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">외국인 신고 의무</text>
  </g>

  <!-- Pre-headline (left-aligned, smaller) -->
  <text x="680" y="180" fill="#64748b" font-family="sans-serif" font-size="18" font-weight="500" letter-spacing="2">일본 체류 중 변경이 생겼다면</text>

  <!-- Main headline (2-line, left-aligned) -->
  <text x="680" y="248" font-family="sans-serif" font-size="56" font-weight="bold" fill="#0f172a">놓치지 마세요</text>
  <text x="680" y="312" font-family="sans-serif" font-size="56" font-weight="bold">
    <tspan fill="#dc2626">14일 이내</tspan> <tspan fill="#0f172a">신고</tspan>
  </text>

  <!-- Accent underline -->
  <line x1="680" y1="336" x2="780" y2="336" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

  <!-- Subtitle (left-aligned, 2 lines) -->
  <text x="680" y="382" font-family="sans-serif" font-size="20" font-weight="500" fill="#475569">주소·직장·결혼·이름 변경은</text>
  <text x="680" y="412" font-family="sans-serif" font-size="20" font-weight="500" fill="#475569">대표적인 신고 대상입니다</text>

  <!-- =============================================================== -->
  <!-- BOTTOM CHIP ROW (3 supporting risks — single callout cluster)   -->
  <!-- =============================================================== -->

  <g transform="translate(680, 488)">
    <!-- Chip 1: 과태료 -->
    <g>
      <rect x="0" y="0" width="100" height="40" rx="20" fill="#0f172a"/>
      <text x="50" y="26" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">과태료</text>
    </g>
    <!-- Chip 2: 비자 심사 불리 -->
    <g transform="translate(116, 0)">
      <rect x="0" y="0" width="156" height="40" rx="20" fill="#0f172a"/>
      <text x="78" y="26" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">비자 심사 불리</text>
    </g>
    <!-- Chip 3: 영주권 영향 -->
    <g transform="translate(288, 0)">
      <rect x="0" y="0" width="140" height="40" rx="20" fill="#0f172a"/>
      <text x="70" y="26" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="2">영주권 영향</text>
    </g>
  </g>
</svg>
