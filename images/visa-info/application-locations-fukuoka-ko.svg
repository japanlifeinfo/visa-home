<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="48" font-weight="bold">후쿠오카</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">신청 장소 안내</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Building icon -->
    <g transform="translate(60, 50)">
      <!-- Building body -->
      <rect x="15" y="40" width="90" height="120" rx="4" fill="#f43f5e"/>
      <!-- Windows row 1 -->
      <rect x="30" y="55" width="18" height="14" rx="2" fill="#fef0f2"/>
      <rect x="58" y="55" width="18" height="14" rx="2" fill="#fef0f2"/>
      <rect x="86" y="55" width="18" height="14" rx="2" fill="#fef0f2"/>
      <!-- Windows row 2 -->
      <rect x="30" y="80" width="18" height="14" rx="2" fill="#fef0f2"/>
      <rect x="58" y="80" width="18" height="14" rx="2" fill="#fef0f2"/>
      <rect x="86" y="80" width="18" height="14" rx="2" fill="#fef0f2"/>
      <!-- Windows row 3 -->
      <rect x="30" y="105" width="18" height="14" rx="2" fill="#fef0f2"/>
      <rect x="58" y="105" width="18" height="14" rx="2" fill="#fef0f2"/>
      <rect x="86" y="105" width="18" height="14" rx="2" fill="#fef0f2"/>
      <!-- Door -->
      <rect x="46" y="130" width="28" height="30" rx="3" fill="#c3324b"/>
      <!-- Roof accent -->
      <rect x="10" y="35" width="100" height="8" rx="2" fill="#c3324b"/>
      <!-- Flag pole -->
      <rect x="57" y="10" width="3" height="28" fill="#c3324b"/>
      <rect x="60" y="12" width="20" height="12" fill="#f43f5e" opacity="0.7"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">후쿠오카 (福岡)</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="12" fill="#fef0f2"/>
        <text x="12" y="17" text-anchor="middle" fill="#f43f5e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">관할 도도부현: 8개</text>
      </g>
      <g transform="translate(0, 45)">
        <circle cx="12" cy="12" r="12" fill="#fef0f2"/>
        <text x="12" y="17" text-anchor="middle" fill="#f43f5e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">출장소: 8곳</text>
      </g>
      <g transform="translate(0, 90)">
        <circle cx="12" cy="12" r="12" fill="#fef0f2"/>
        <text x="12" y="17" text-anchor="middle" fill="#f43f5e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">담당 지역: 九州</text>
      </g>
      <g transform="translate(0, 135)">
        <circle cx="12" cy="12" r="12" fill="#fef0f2"/>
        <text x="12" y="17" text-anchor="middle" fill="#f43f5e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">근무시간: 평일 09:00~16:00</text>
      </g>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#fde2e7"/>
    <text x="400" y="320" text-anchor="middle" fill="#c3324b" font-family="sans-serif" font-size="18" font-weight="bold">福岡</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#dc3955"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
</svg>