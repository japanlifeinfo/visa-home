<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="34" font-weight="500" letter-spacing="6" opacity="0.8">आवश्यक कागजातहरू</text>
    <text x="80" y="300" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="44" font-weight="900">प्राविधिक/मानविकी/</text>
    <text x="80" y="355" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="44" font-weight="900">अन्तर्राष्ट्रिय</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <circle cx="130" cy="120" r="55" fill="none" stroke="#2563eb" stroke-width="6" opacity="0.3"/>
      <circle cx="130" cy="120" r="40" fill="none" stroke="#2563eb" stroke-width="4" opacity="0.2"/>
      <circle cx="130" cy="120" r="12" fill="#2563eb" opacity="0.4"/>
      <rect x="126" y="60" width="8" height="20" rx="4" fill="#2563eb" opacity="0.35"/>
      <rect x="126" y="160" width="8" height="20" rx="4" fill="#2563eb" opacity="0.35"/>
      <rect x="170" y="116" width="20" height="8" rx="4" fill="#2563eb" opacity="0.35"/>
      <rect x="70" y="116" width="20" height="8" rx="4" fill="#2563eb" opacity="0.35"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#2563eb" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">技術・人文知識・国際業務</text>
  <text x="955" y="425" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="30" opacity="0.6">Engineer/Specialist</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#2563eb" opacity="0.08" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="23" font-weight="600">N-2</text>

  <text x="955" y="598" text-anchor="middle" fill="#d4d4d8" font-family="sans-serif" font-size="26">visa.japanlifeinfo.com</text>
