<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#1e293b"/>
  <rect width="1200" height="8" fill="url(#hg)"/>

  <text x="600" y="72" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="38" font-weight="bold">Parusa sa Hindi Pagdadala ng Residence Card</text>

  <!-- Left: Obligation -->
  <rect x="60" y="105" width="520" height="370" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="60" y="105" width="520" height="50" rx="16" fill="#2563eb"/>
  <rect x="60" y="135" width="520" height="20" fill="#2563eb"/>
  <text x="320" y="140" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="bold">Obligasyon sa Pagdadala</text>

  <text x="100" y="200" fill="#93c5fd" font-family="sans-serif" font-size="20" font-weight="bold">Laging dalhin kapag lumalabas</text>
  <text x="100" y="232" fill="#cbd5e1" font-family="sans-serif" font-size="17">Itago ang original sa wallet o bag</text>

  <line x1="90" y1="255" x2="550" y2="255" stroke="#334155" stroke-width="1"/>

  <text x="100" y="285" fill="#93c5fd" font-family="sans-serif" font-size="20" font-weight="bold">Kailan maaaring hilingin ipakita</text>
  <circle cx="110" cy="315" r="5" fill="#60a5fa"/>
  <text x="125" y="321" fill="#cbd5e1" font-family="sans-serif" font-size="17">Police questioning</text>
  <circle cx="330" cy="315" r="5" fill="#60a5fa"/>
  <text x="345" y="321" fill="#cbd5e1" font-family="sans-serif" font-size="17">Immigration check</text>
  <circle cx="110" cy="348" r="5" fill="#60a5fa"/>
  <text x="125" y="354" fill="#cbd5e1" font-family="sans-serif" font-size="17">Traffic enforcement</text>
  <circle cx="330" cy="348" r="5" fill="#60a5fa"/>
  <text x="345" y="354" fill="#cbd5e1" font-family="sans-serif" font-size="17">Opisyal na verification</text>

  <line x1="90" y1="375" x2="550" y2="375" stroke="#334155" stroke-width="1"/>

  <rect x="90" y="395" width="460" height="55" rx="10" fill="#7f1d1d"/>
  <text x="320" y="420" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="16">Kopya ✕ · Larawan sa phone ✕ · Driver's license ✕</text>
  <text x="320" y="440" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="14">Original card lang ang tinatanggap</text>

  <!-- Right: Penalty -->
  <rect x="620" y="105" width="520" height="185" rx="16" fill="#dc2626"/>
  <text x="880" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">Parusa</text>
  <text x="880" y="200" text-anchor="middle" fill="#fef2f2" font-family="sans-serif" font-size="46" font-weight="bold">Multa hanggang 200,000 yen</text>
  <text x="880" y="240" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="18">Kahit hindi sinasadya, paglabag pa rin</text>
  <text x="880" y="268" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="16">Paulit-ulit ay maaaring parusahan</text>

  <!-- Right bottom: Impact -->
  <rect x="620" y="310" width="520" height="165" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="880" y="352" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="22" font-weight="bold">Epekto sa PR &amp; Visa Renewal</text>
  <circle cx="660" cy="388" r="5" fill="#fbbf24"/>
  <text x="680" y="394" fill="#e2e8f0" font-family="sans-serif" font-size="18">Paulit-ulit → disadvantage sa screening</text>
  <circle cx="660" cy="420" r="5" fill="#fbbf24"/>
  <text x="680" y="426" fill="#e2e8f0" font-family="sans-serif" font-size="18">Multa record → negatibo sa PR application</text>
  <circle cx="660" cy="452" r="5" fill="#fbbf24"/>
  <text x="680" y="458" fill="#e2e8f0" font-family="sans-serif" font-size="18">Record ng paglabag ay itinatabi ng immigration</text>

  <!-- Bottom -->
  <rect x="60" y="500" width="1080" height="60" rx="12" fill="#16a34a"/>
  <text x="600" y="538" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="bold">Eksepsyon: Wala pang 16 exempt · Special permanent residents hiwalay na rules</text>

  <text x="600" y="605" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="22">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
</svg>
