<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Nen: mau kem am (thay doi tu mau xanh nhat / xanh dam / xanh da tro truoc do) -->
  <rect width="1200" height="630" fill="#fef9e7"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Chu mo nen KIEM TRA (goc duoi-trai, rat mo, phia sau kinh lup) -->
  <text x="40" y="600" fill="#dc2626" font-family="sans-serif" font-size="200" font-weight="bold" opacity="0.06">KIEM TRA</text>

  <!-- Chu mo nen NHAP CANH · KIEM TRA (goc tren-phai, nho, rat mo) -->
  <text x="1170" y="142" text-anchor="end" fill="#ea580c" font-family="sans-serif" font-size="56" font-weight="bold" letter-spacing="6" opacity="0.1">NHAP CANH · KIEM TRA</text>

  <!-- Duong cung nut nho trang tri tu tren-trai xuong duoi-phai (duong kiem tra) -->
  <path d="M 80 100 Q 600 200 1120 540" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="2 11" fill="none" opacity="0.25"/>

  <!-- The nho o cuoi duong cung -->
  <g transform="translate(1120, 540)">
    <circle r="4" fill="#dc2626" opacity="0.7"/>
    <text x="-10" y="-8" text-anchor="end" fill="#9a3412" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="3" opacity="0.75">PHAN DINH</text>
  </g>

  <!-- ===== PHAI: tieu de can le phai (kieu #3 — thay doi tu can giua / can trai / bang truoc do) ===== -->

  <!-- Thanh nhan doc ben phai -->
  <rect x="1114" y="84" width="6" height="240" rx="3" fill="url(#accentGradient)"/>

  <!-- Vien kicker (can phai, vien mau ho phach) -->
  <g transform="translate(1092, 102)">
    <rect x="-340" y="-18" width="340" height="34" rx="17" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <text x="-170" y="5" text-anchor="middle" fill="#9a3412" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">DIEM KIEM TRA VISA</text>
  </g>

  <!-- Nhan tieu de nho (can phai) -->
  <text x="1092" y="148" text-anchor="end" fill="#78716c" font-family="sans-serif" font-size="14" font-weight="500" letter-spacing="2">Can bo kiem tra nhap canh Nhat Ban</text>

  <!-- Tieu de (2 dong, can phai, lon) -->
  <text x="1092" y="212" text-anchor="end" fill="#1c1917" font-family="sans-serif" font-size="56" font-weight="500">Kiem tra nhung gi</text>
  <text x="1092" y="276" text-anchor="end" font-family="sans-serif" font-size="62" font-weight="bold">
    <tspan fill="#1c1917">de </tspan>
    <tspan fill="#dc2626">danh gia</tspan>
    <tspan fill="#1c1917"> visa?</tspan>
  </text>

  <!-- Duong nhan mong (can phai) -->
  <line x1="980" y1="304" x2="1092" y2="304" stroke="#d97706" stroke-width="2"/>

  <!-- Phu de (2 dong, can phai) -->
  <text x="1092" y="336" text-anchor="end" fill="#57534e" font-family="sans-serif" font-size="17" font-weight="500">Trung thuc · Hoat dong · Thu nhap · Hoc van · Thue · Lich su cu tru</text>
  <text x="1092" y="362" text-anchor="end" fill="#57534e" font-family="sans-serif" font-size="17" font-weight="500">Cac diem chinh ma can bo kiem tra tong hop</text>

  <!-- ===== TRAI-GIUA: kinh lup lon (bong tron — thay doi tu cac bong chu nhat/hop truoc do) ===== -->

  <g transform="translate(280, 360) rotate(-18)">
    <!-- Bong do kinh (bong ellip mem ben duoi) -->
    <ellipse cx="20" cy="170" rx="160" ry="20" fill="#000" opacity="0.10"/>

    <!-- Tay cam dai xuong duoi-phai (thanh tron) -->
    <g transform="translate(110, 110) rotate(45)">
      <!-- Bong tay cam -->
      <rect x="0" y="6" width="180" height="32" rx="16" fill="#000" opacity="0.18"/>
      <!-- Tay cam ngoai (mau than/tro dam) -->
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#3f2a13"/>
      <!-- Vien sang tay cam (can tren) -->
      <rect x="6" y="4" width="166" height="6" rx="3" fill="#7c4a16" opacity="0.7"/>
      <!-- Cac ranh cam tay cam -->
      <g stroke="#1c1917" stroke-width="1.2" opacity="0.55">
        <line x1="60" y1="6" x2="60" y2="26"/>
        <line x1="74" y1="6" x2="74" y2="26"/>
        <line x1="88" y1="6" x2="88" y2="26"/>
        <line x1="102" y1="6" x2="102" y2="26"/>
        <line x1="116" y1="6" x2="116" y2="26"/>
        <line x1="130" y1="6" x2="130" y2="26"/>
        <line x1="144" y1="6" x2="144" y2="26"/>
      </g>
      <!-- Dau cuoi tay cam -->
      <circle cx="180" cy="16" r="18" fill="#3f2a13"/>
      <circle cx="180" cy="16" r="12" fill="#1c1917"/>
      <circle cx="176" cy="12" r="3" fill="#7c4a16" opacity="0.6"/>
    </g>

    <!-- Vien ngoai kinh (vong vang/dong day) -->
    <circle r="148" fill="none" stroke="#b45309" stroke-width="18"/>
    <!-- Vien sang trong vien ngoai kinh -->
    <circle r="139" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
    <!-- Vong mong ngoai vien ngoai kinh -->
    <circle r="158" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>

    <!-- Kinh (mau xanh nhat voi do mo cao de nhin thay noi dung) -->
    <circle r="130" fill="#e0f2fe" opacity="0.85"/>
    <!-- Sac xanh ben trong kinh (gradient tinh te qua vong dong tam) -->
    <circle r="124" fill="#f0f9ff" opacity="0.6"/>

    <!-- ===== BEN TRONG KINH: cac manh tai lieu phong to nhin qua kinh ===== -->
    <g transform="rotate(18)">
      <!-- Manh tren-trai: dong Ly lich -->
      <g transform="translate(-78, -78)">
        <text x="0" y="0" fill="#9a3412" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">Ly lich</text>
        <line x1="0" y1="6" x2="80" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <line x1="0" y1="14" x2="64" y2="14" stroke="#a8a29e" stroke-width="0.8"/>
        <line x1="0" y1="22" x2="72" y2="22" stroke="#a8a29e" stroke-width="0.8"/>
        <!-- Dau kiem nho mau do -->
        <path d="M 84 8 L 90 14 L 102 0" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Manh giua-phai: dong Thu nhap voi dau kiem -->
      <g transform="translate(8, -34)">
        <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Thu nhap</text>
        <text x="62" y="0" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="500">· Thue · Huu tri</text>
        <line x1="0" y1="6" x2="100" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <path d="M 108 -3 L 113 2 L 122 -8" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Dong giua: Tu cach -->
      <g transform="translate(-72, 10)">
        <text x="0" y="0" fill="#1c1917" font-family="sans-serif" font-size="13" font-weight="bold">Tu cach</text>
        <text x="52" y="0" fill="#57534e" font-family="sans-serif" font-size="13" font-weight="500">· Hoat dong</text>
        <line x1="0" y1="6" x2="116" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <path d="M 124 -3 L 129 2 L 138 -8" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Manh duoi-trai: dong Hoc van · Su nghiep -->
      <g transform="translate(-78, 50)">
        <text x="0" y="0" fill="#1c1917" font-family="sans-serif" font-size="13" font-weight="bold">Hoc van · Su nghiep</text>
        <line x1="0" y1="6" x2="92" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <line x1="0" y1="14" x2="76" y2="14" stroke="#a8a29e" stroke-width="0.8"/>
        <path d="M 100 -3 L 105 2 L 114 -8" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Duoi-phai: dong Lich su cu tru voi dau canh bao -->
      <g transform="translate(20, 86)">
        <text x="0" y="0" fill="#1c1917" font-family="sans-serif" font-size="13" font-weight="bold">Lich su cu tru</text>
        <line x1="0" y1="6" x2="88" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <!-- Vong kinh lup (nhan manh them vao dong nay) -->
        <circle cx="100" cy="0" r="7" fill="none" stroke="#dc2626" stroke-width="1.6"/>
        <line x1="105" y1="5" x2="110" y2="10" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Con dau DAT nho mau do (goc duoi-trai noi dung kinh, hoi nghieng) -->
      <g transform="translate(-90, 92) rotate(-10)">
        <circle r="22" fill="none" stroke="#dc2626" stroke-width="2.2" opacity="0.85"/>
        <text y="5" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="1" opacity="0.9">DAT</text>
      </g>
    </g>

    <!-- Vung sang kinh ngoai (cung goc tren-trai, mo phong phan xa anh sang) -->
    <path d="M -100 -68 Q -68 -110 0 -116" stroke="#ffffff" stroke-width="9" fill="none" opacity="0.65" stroke-linecap="round"/>
    <path d="M -82 -52 Q -56 -82 -8 -90" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- ===== DUOI-PHAI: hop callout don ho tro (tai lieu dua tren su that) ===== -->
  <g transform="translate(680, 484)">
    <!-- Khoi callout toi -->
    <rect width="492" height="92" rx="14" fill="#1c1917"/>
    <!-- Duong ke nhan ben trai -->
    <rect width="6" height="92" rx="3" fill="#f59e0b"/>

    <!-- Bieu tuong nho: dau kiem tren con dau -->
    <g transform="translate(28, 26)">
      <!-- Vong ngoai con dau -->
      <circle cx="20" cy="20" r="20" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
      <!-- Vong trong con dau -->
      <circle cx="20" cy="20" r="15" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
      <!-- Dau kiem ben trong -->
      <path d="M 11 21 L 18 28 L 30 12" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Nhan -->
    <text x="84" y="40" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="4">NGUYEN TAC COT LOI</text>
    <!-- Thong diep chinh -->
    <text x="84" y="70" fill="#fef9e7" font-family="sans-serif" font-size="19" font-weight="bold">Tai lieu chinh xac la quan trong nhat</text>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
</svg>
