<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">Razoes Comuns para Rejeicao do Visto de Trabalho</text>

  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fee2e2"/>
    <text x="45" y="53" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="20" font-weight="bold">1</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Formacao-Funcao Incompativel</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Razao mais comum de rejeicao</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Relevancia educacao-trabalho exigida</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Sem relevancia = "trabalho simples"</text>
  </g>

  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="20" font-weight="bold">2</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Descricao de Cargo Vaga</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">"E especializado?" teste de analise</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Descricoes abstratas sao arriscadas</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Detalhes especificos essenciais</text>
  </g>

  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="20" font-weight="bold">3</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Problemas Financeiros Empresa</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Rejeicao pela empresa, nao solicitante</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Startup / prejuizo = alto risco</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Sustentabilidade do emprego avaliada</text>
  </g>

  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="53" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="20" font-weight="bold">+</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Salario · Docs · Experiencia</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Salario baixo = suspeita</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Documentos faltando / sem traducao</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Permanencia ilegal / impostos devidos</text>
  </g>

  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">Pontos-Chave</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">Oferta de emprego nao e o fim — maioria das rejeicoes por documentos insuficientes</text>
  </g>
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
