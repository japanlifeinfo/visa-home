<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="36" font-weight="bold">재류자격 발급 기간은 얼마나 걸릴까?</text>

  <!-- Card 1: 신규취득 -->
  <g transform="translate(80, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#3b82f6"/>
    <rect y="45" width="330" height="15" fill="#3b82f6"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">신규취득 (COE)</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">1~3개월</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">성수기: 3~4개월 이상</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#dbeafe"/>
    <text x="165" y="192" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="15" font-weight="bold">심사 강도: 높음</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">해외 거주자 대상</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">대도시 관할 = 더 오래 걸림</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">4월 입사 → 12~1월 신청 권장</text>
  </g>

  <!-- Card 2: 갱신 -->
  <g transform="translate(435, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#10b981"/>
    <rect y="45" width="330" height="15" fill="#10b981"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">갱신 (연장)</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">2주~1개월</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">통상 신규보다 빠름</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#d1fae5"/>
    <text x="165" y="192" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="15" font-weight="bold">심사 강도: 낮음</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">동일 조건 유지 시 안정적</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">회사 재무 악화 시 지연 가능</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">만료 전 접수 → 특례기간 적용</text>
  </g>

  <!-- Card 3: 변경 -->
  <g transform="translate(790, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#f59e0b"/>
    <rect y="45" width="330" height="15" fill="#f59e0b"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">변경 (유학→취업 등)</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">1~2개월</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">신규 수준 심사 가능</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#fef3c7"/>
    <text x="165" y="192" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="15" font-weight="bold">심사 강도: 중~높음</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">전공·직무 연관성 매우 중요</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">불일치 시 추가 서류 요구</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">직무 설명서 정확히 작성 필수</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 450)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">핵심 포인트</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">유형별 심사 기간·강도를 파악하고 전략적으로 준비하세요</text>
  </g>

  <!-- Footer -->
  <text x="600" y="575" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
