<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Nghien cuu sinh</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 35)">
      <!-- Microscope -->
      <rect x="60" y="20" width="20" height="50" fill="#3b82f6"/>
      <ellipse cx="70" cy="75" rx="15" ry="8" fill="#1d4ed8"/>
      <rect x="55" y="80" width="30" height="8" fill="#1e40af"/>
      <rect x="65" y="88" width="10" height="30" fill="#60a5fa"/>
      <rect x="50" y="115" width="40" height="8" rx="2" fill="#1d4ed8"/>
      <!-- Test tubes -->
      <rect x="100" y="40" width="12" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <rect x="103" y="70" width="6" height="12" fill="#60a5fa"/>
      <rect x="118" y="50" width="12" height="35" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
      <rect x="121" y="65" width="6" height="17" fill="#93c5fd"/>
      <!-- Atom symbol -->
      <circle cx="50" cy="140" r="5" fill="#3b82f6"/>
      <ellipse cx="50" cy="140" rx="25" ry="10" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <ellipse cx="50" cy="140" rx="25" ry="10" fill="none" stroke="#60a5fa" stroke-width="2" transform="rotate(60 50 140)"/>
      <ellipse cx="50" cy="140" rx="25" ry="10" fill="none" stroke="#60a5fa" stroke-width="2" transform="rotate(120 50 140)"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Hoat dong nghien cuu</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Nghien cuu tai co quan cong/tu</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Dua tren hop dong nghien cuu</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 5 nam, 3 nam, 1 nam, 3 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Khac voi tu cach Giao su</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">研究</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
