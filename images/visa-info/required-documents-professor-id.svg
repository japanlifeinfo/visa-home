<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Dokumen yang Diperlukan</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="100" font-weight="900">Profesor</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <path d="M130 60 L60 100 L130 140 L200 100Z" fill="#1e40af" opacity="0.35"/>
      <path d="M130 140 L90 120 L90 155 C90 170 110 185 130 185 C150 185 170 170 170 155 L170 120Z" fill="#1e40af" opacity="0.25"/>
      <line x1="185" y1="105" x2="185" y2="180" stroke="#1e40af" stroke-width="3" opacity="0.3"/>
      <circle cx="185" cy="183" r="5" fill="#1e40af" opacity="0.3"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#1e40af" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">教授</text>
  <text x="955" y="425" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="30" opacity="0.6">Professor</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#1e40af" opacity="0.08" stroke="#1e40af" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="23" font-weight="600">A-1</text>

</svg>