<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="50" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">일본 재류자격 신청 절차 완전 정복</text>
  <text x="600" y="78" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">처음 준비하시는 분들을 위한 4단계 가이드</text>

  <!-- Step 1 -->
  <g transform="translate(50, 100)">
    <rect width="240" height="145" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#3b82f6"/>
    <rect y="26" width="240" height="12" fill="#3b82f6"/>
    <text x="120" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">STEP 1 · 서류 준비</text>
    <text x="120" y="65" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="14" font-weight="bold">신청서 · 여권 · 증명사진</text>
    <text x="120" y="88" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">활동증명, 회사서류</text>
    <text x="120" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">재직증명서 등</text>
    <text x="120" y="132" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="12" font-weight="bold">재류자격별 추가서류 확인!</text>
  </g>

  <!-- Arrow 1→2 -->
  <text x="300" y="172" fill="#94a3b8" font-family="sans-serif" font-size="24">→</text>

  <!-- Step 2 -->
  <g transform="translate(320, 130)">
    <rect width="240" height="145" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#16a34a"/>
    <rect y="26" width="240" height="12" fill="#16a34a"/>
    <text x="120" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">STEP 2 · 입관 신청</text>
    <text x="120" y="65" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">본인 방문 또는 대리 신청</text>
    <text x="120" y="88" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">접수 수수료 무료</text>
    <text x="120" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">관할 사무소 사전 확인</text>
    <text x="120" y="132" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="12" font-weight="bold">온라인 신청도 가능!</text>
  </g>

  <!-- Arrow 2→3 -->
  <text x="570" y="202" fill="#94a3b8" font-family="sans-serif" font-size="24">→</text>

  <!-- Step 3 -->
  <g transform="translate(590, 160)">
    <rect width="240" height="145" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#d97706"/>
    <rect y="26" width="240" height="12" fill="#d97706"/>
    <text x="120" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">STEP 3 · 심사 대기</text>
    <text x="120" y="65" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">평균 1~3개월 소요</text>
    <text x="120" y="88" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">추가 서류 요청 시 신속 대응</text>
    <text x="120" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">결과 통지 대기</text>
    <text x="120" y="132" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="12" font-weight="bold">성수기 3~4개월+</text>
  </g>

  <!-- Arrow 3→4 -->
  <text x="840" y="232" fill="#94a3b8" font-family="sans-serif" font-size="24">→</text>

  <!-- Step 4 -->
  <g transform="translate(860, 190)">
    <rect width="280" height="145" rx="12" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2"/>
    <rect width="280" height="38" rx="12" fill="#db2777"/>
    <rect y="26" width="280" height="12" fill="#db2777"/>
    <text x="140" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">STEP 4 · 허가 완료!</text>
    <text x="140" y="65" text-anchor="middle" fill="#9d174d" font-family="sans-serif" font-size="14" font-weight="bold">재류카드 발급 · 비자 발급</text>
    <text x="140" y="88" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">수입인지 납부 (¥4,000)</text>
    <text x="140" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">주소지 등록</text>
    <text x="140" y="132" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold">정식 체류 시작!</text>
  </g>

  <!-- Checklist Box -->
  <g transform="translate(50, 365)">
    <rect width="520" height="210" rx="12" fill="#1e293b"/>
    <text x="260" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">핵심 체크리스트</text>
    <line x1="30" y1="45" x2="490" y2="45" stroke="#334155"/>
    <text x="40" y="72" fill="#e2e8f0" font-family="sans-serif" font-size="14">✓ 재류자격과 실제 활동이 일치하는지 확인</text>
    <text x="40" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="14">✓ 모든 서류의 내용이 서로 일관성 있는지 점검</text>
    <text x="40" y="124" fill="#e2e8f0" font-family="sans-serif" font-size="14">✓ 추가 서류 요청 시 신속하게 대응</text>
    <text x="40" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="14">✓ 재류기간 만료 전에 반드시 신청</text>
    <text x="40" y="176" fill="#e2e8f0" font-family="sans-serif" font-size="14">✓ 관할 출입국재류관리국 사전 확인</text>
    <text x="40" y="200" fill="#fbbf24" font-family="sans-serif" font-size="13">※ 대부분의 불허는 서류 준비 부족이 원인입니다</text>
  </g>

  <!-- Duration summary -->
  <g transform="translate(600, 365)">
    <rect width="550" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="275" y="30" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="14">총 예상 소요 기간</text>
    <text x="275" y="65" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="32" font-weight="bold">약 1~3개월</text>
    <text x="275" y="88" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">신규 신청(COE 포함) 시 1.5~4개월+</text>
  </g>

  <g transform="translate(600, 480)">
    <rect width="550" height="95" rx="12" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
    <text x="275" y="28" text-anchor="middle" fill="#854d0e" font-family="sans-serif" font-size="15" font-weight="bold">신청 유형별 참고</text>
    <text x="275" y="52" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="13">신규(COE) · 변경 · 갱신 · 영주 — 유형마다 서류와 심사가 다릅니다</text>
    <text x="275" y="75" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="13">직접 신청 시 대행료 절약 가능 | 행정서사 대행도 선택 가능</text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>