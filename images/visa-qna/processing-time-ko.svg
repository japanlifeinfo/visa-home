<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="54" font-weight="bold">재류자격 발급 기간</text>
  <text x="600" y="125" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="30">유형별 심사 소요 기간 안내</text>

  <!-- Bar 1: 신규취득 (Blue) -->
  <g transform="translate(60, 165)">
    <rect width="1080" height="110" rx="16" fill="#3b82f6"/>
    <text x="40" y="68" fill="white" font-family="sans-serif" font-size="40" font-weight="bold">신규취득 (COE)</text>
    <text x="1040" y="68" text-anchor="end" fill="white" font-family="sans-serif" font-size="52" font-weight="bold">1~3개월</text>
  </g>

  <!-- Bar 2: 갱신 (Green) -->
  <g transform="translate(60, 295)">
    <rect width="1080" height="110" rx="16" fill="#10b981"/>
    <text x="40" y="68" fill="white" font-family="sans-serif" font-size="40" font-weight="bold">갱신 (연장)</text>
    <text x="1040" y="68" text-anchor="end" fill="white" font-family="sans-serif" font-size="52" font-weight="bold">2주~1개월</text>
  </g>

  <!-- Bar 3: 변경 (Amber) -->
  <g transform="translate(60, 425)">
    <rect width="1080" height="110" rx="16" fill="#f59e0b"/>
    <text x="40" y="68" fill="white" font-family="sans-serif" font-size="40" font-weight="bold">변경 (유학→취업 등)</text>
    <text x="1040" y="68" text-anchor="end" fill="white" font-family="sans-serif" font-size="52" font-weight="bold">1~2개월</text>
  </g>

  <!-- Footer -->

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
