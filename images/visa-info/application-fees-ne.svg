<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">भिसा शुल्क मार्गदर्शन</text>

  <!-- Column 1: नयाँ -->
  <rect x="60" y="130" width="340" height="340" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="230" y="195" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="34" font-weight="bold">नयाँ (COE)</text>
  <text x="230" y="310" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="56" font-weight="bold">निःशुल्क</text>
  <text x="230" y="420" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">आधिकारिक शुल्क</text>

  <!-- Column 2: नवीकरण -->
  <rect x="430" y="130" width="340" height="340" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <text x="600" y="195" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="34" font-weight="bold">नवीकरण</text>
  <text x="600" y="310" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="56" font-weight="bold">&#165;4,000</text>
  <text x="600" y="420" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">राजस्व टिकट</text>

  <!-- Column 3: स्थायी बसोबास -->
  <rect x="800" y="130" width="340" height="340" rx="20" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="3"/>
  <text x="970" y="195" text-anchor="middle" fill="#9d174d" font-family="sans-serif" font-size="32" font-weight="bold">स्थायी बसोबास</text>
  <text x="970" y="310" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="56" font-weight="bold">&#165;8,000</text>
  <text x="970" y="420" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">राजस्व टिकट</text>

