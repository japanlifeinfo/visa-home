<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#062c1f"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark (Chinese only): 术语 -->
  <text x="1180" y="615" text-anchor="end" fill="#10b981" font-family="sans-serif" font-size="240" font-weight="bold" opacity="0.06" letter-spacing="-5">术语</text>

  <g opacity="0.25">
    <circle cx="60" cy="80" r="2" fill="#5eead4"/>
    <circle cx="90" cy="80" r="2" fill="#5eead4"/>
    <circle cx="120" cy="80" r="2" fill="#5eead4"/>
    <circle cx="60" cy="110" r="2" fill="#5eead4"/>
    <circle cx="90" cy="110" r="2" fill="#5eead4"/>
    <circle cx="60" cy="140" r="2" fill="#5eead4"/>
  </g>
  <g opacity="0.22">
    <circle cx="1080" cy="80" r="2" fill="#fbbf24"/>
    <circle cx="1110" cy="80" r="2" fill="#fbbf24"/>
    <circle cx="1140" cy="80" r="2" fill="#fbbf24"/>
    <circle cx="1110" cy="110" r="2" fill="#fbbf24"/>
    <circle cx="1140" cy="110" r="2" fill="#fbbf24"/>
    <circle cx="1140" cy="140" r="2" fill="#fbbf24"/>
  </g>

  <circle cx="140" cy="540" r="46" fill="#10b981" opacity="0.14"/>
  <circle cx="90" cy="490" r="20" fill="#fbbf24" opacity="0.18"/>
  <circle cx="1080" cy="560" r="32" fill="#14b8a6" opacity="0.18"/>

  <!-- Kicker pill: "签证核心术语" (6 hanzi) — natural = 6 × 13 × 1.0 + ls 4 × 5 = 78 + 20 = 98, W = 36 + 98 + 22 = 156 -->
  <g transform="translate(600, 56)">
    <rect x="-78" y="0" width="156" height="36" rx="18" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="-58" cy="18" r="4.5" fill="#5eead4"/>
    <text x="-42" y="24" fill="#5eead4" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">签证核心术语</text>
  </g>

  <g font-family="sans-serif" font-weight="bold" opacity="0.85">
    <text x="160" y="200" fill="#5eead4" font-size="38" letter-spacing="-1">在留资格</text>
    <text x="200" y="270" fill="#94a3b8" font-size="32" letter-spacing="-1">签证</text>
    <text x="140" y="480" fill="#94a3b8" font-size="32" letter-spacing="-1">在留卡</text>
  </g>
  <g font-family="sans-serif" font-weight="bold" opacity="0.85">
    <text x="1040" y="200" fill="#5eead4" font-size="34" letter-spacing="-1" text-anchor="end">入管</text>
    <text x="1080" y="270" fill="#fbbf24" font-size="42" letter-spacing="-1" text-anchor="end">COE</text>
    <text x="1080" y="480" fill="#94a3b8" font-size="32" letter-spacing="-1" text-anchor="end">永住</text>
  </g>

  <ellipse cx="600" cy="330" rx="340" ry="140" fill="url(#centerGlow)"/>

  <text x="600" y="200" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="22" font-weight="500" letter-spacing="2">面对陌生的日语术语</text>

  <text x="600" y="370" text-anchor="middle" font-family="sans-serif" font-size="140" font-weight="900" letter-spacing="-3">
    <tspan fill="#fbbf24">术语</tspan><tspan fill="#f8fafc"> 整理</tspan>
  </text>

  <rect x="450" y="395" width="300" height="3" rx="1.5" fill="url(#accentLine)"/>

  <text x="600" y="470" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="28" font-weight="600" letter-spacing="0.5">从基础术语开始逐步了解</text>

  <text x="600" y="510" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="500" letter-spacing="1">掌握后申请签证会更加轻松</text>
</svg>
