<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Kinakailangang Dokumento</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="64" font-weight="900">Mananaliksik</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <path d="M110 70 L100 155 L160 155 L150 70Z" fill="#0891b2" opacity="0.2"/>
      <ellipse cx="130" cy="70" rx="30" ry="8" fill="#0891b2" opacity="0.35"/>
      <rect x="95" y="155" width="70" height="8" rx="3" fill="#0891b2" opacity="0.3"/>
      <circle cx="120" cy="120" r="8" fill="#0891b2" opacity="0.4"/>
      <circle cx="140" cy="105" r="5" fill="#0891b2" opacity="0.3"/>
      <circle cx="128" cy="140" r="6" fill="#0891b2" opacity="0.35"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#0891b2" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">研究</text>
  <text x="955" y="425" text-anchor="middle" fill="#0891b2" font-family="sans-serif" font-size="30" opacity="0.6">Researcher</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#0891b2" opacity="0.08" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#0891b2" font-family="sans-serif" font-size="23" font-weight="600">F</text>

</svg>