<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Business Manager</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Required Documents Guide</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 40)">
      <!-- Building -->
      <rect x="20" y="20" width="80" height="100" fill="#0ea5e9"/>
      <rect x="25" y="25" width="15" height="15" fill="#bae6fd"/>
      <rect x="45" y="25" width="15" height="15" fill="#bae6fd"/>
      <rect x="65" y="25" width="15" height="15" fill="#bae6fd"/>
      <rect x="25" y="45" width="15" height="15" fill="#bae6fd"/>
      <rect x="45" y="45" width="15" height="15" fill="#bae6fd"/>
      <rect x="65" y="45" width="15" height="15" fill="#bae6fd"/>
      <rect x="25" y="65" width="15" height="15" fill="#bae6fd"/>
      <rect x="45" y="65" width="15" height="15" fill="#bae6fd"/>
      <rect x="65" y="65" width="15" height="15" fill="#bae6fd"/>
      <!-- Door -->
      <rect x="45" y="90" width="30" height="30" fill="#0369a1"/>
      <!-- Chart -->
      <rect x="95" y="50" width="30" height="50" fill="#f0fdf4"/>
      <rect x="100" y="80" width="8" height="15" fill="#22c55e"/>
      <rect x="112" y="65" width="8" height="30" fill="#22c55e"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Business Management Status</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Company management activities</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Capital 5M yen+ or 2+ full-time employees</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Period: 5yr, 3yr, 1yr, 4mo, 3mo</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Documents vary by category</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="305" y="290" width="190" height="44" rx="22" fill="#e0f2fe"/>
    <text x="400" y="320" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="18" font-weight="bold">経営・管理</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
