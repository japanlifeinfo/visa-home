<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: pale slate (light tone — break from prior dark slate / cream / dark crimson) -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark 旅券 (lower-right, very faint) -->
  <text x="1180" y="610" text-anchor="end" fill="#10b981" font-family="serif" font-size="240" font-weight="bold" opacity="0.06">旅券</text>

  <!-- Subtle dotted accent arc curving from upper-right toward passport -->
  <path d="M 1120 130 Q 980 200 880 280" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="2 10" fill="none" opacity="0.4"/>

  <!-- Small tag at end of arc -->
  <g transform="translate(1120, 130)">
    <circle r="4" fill="#10b981" opacity="0.7"/>
    <text x="-10" y="-8" text-anchor="end" fill="#0f766e" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="2" opacity="0.7">RENEWED · 新規</text>
  </g>

  <!-- ===== TOP-LEFT: vertical accent + left-aligned headline (pattern #2) ===== -->

  <!-- Vertical accent bar (gradient) -->
  <rect x="80" y="84" width="6" height="240" rx="3" fill="url(#accentGradient)"/>

  <!-- Kicker pill (left-aligned, outlined emerald) -->
  <g transform="translate(108, 102)">
    <rect x="0" y="-18" width="408" height="34" rx="17" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="204" y="5" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="4">여권 갱신 · 旅券更新 · PASSPORT RENEWAL</text>
  </g>

  <!-- Tiny pre-headline label -->
  <text x="108" y="148" fill="#64748b" font-family="sans-serif" font-size="14" font-weight="500" letter-spacing="2">일본 장기체류 중 여권을 새로 발급받았다면</text>

  <!-- Headline (2 lines, left-aligned) -->
  <text x="108" y="208" fill="#0f172a" font-family="sans-serif" font-size="48" font-weight="500">여권은 새것이어도</text>
  <text x="108" y="266" fill="#0f172a" font-family="sans-serif" font-size="48" font-weight="500">재류카드는 <tspan fill="#059669" font-weight="bold">그대로</tspan></text>

  <!-- Thin accent line -->
  <line x1="108" y1="294" x2="220" y2="294" stroke="#10b981" stroke-width="2"/>

  <!-- Subtitle (2 lines, left-aligned) -->
  <text x="108" y="324" fill="#475569" font-family="sans-serif" font-size="17" font-weight="500">입관 재신고나 재류카드 재발급 없이</text>
  <text x="108" y="350" fill="#475569" font-family="sans-serif" font-size="17" font-weight="500">기존 카드를 계속 사용할 수 있습니다</text>

  <!-- ===== RIGHT-CENTER: Korean passport (closed, 3D perspective with page edges visible) ===== -->

  <g transform="translate(870, 340) rotate(-8)">
    <!-- Cast shadow on ground -->
    <ellipse cx="6" cy="244" rx="184" ry="14" fill="#000" opacity="0.16"/>

    <!-- Page edges visible on right side (showing book depth — clearly NOT a flat card) -->
    <path d="M 158 -210 L 178 -198 L 178 218 L 158 218 Z" fill="#fefce8"/>
    <line x1="158" y1="-200" x2="178" y2="-188" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-180" x2="178" y2="-168" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-160" x2="178" y2="-148" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-140" x2="178" y2="-128" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-120" x2="178" y2="-108" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-100" x2="178" y2="-88" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-80" x2="178" y2="-68" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-60" x2="178" y2="-48" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-40" x2="178" y2="-28" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="-20" x2="178" y2="-8" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="0" x2="178" y2="12" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="20" x2="178" y2="32" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="40" x2="178" y2="52" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="60" x2="178" y2="72" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="80" x2="178" y2="92" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="100" x2="178" y2="112" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="120" x2="178" y2="132" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="140" x2="178" y2="152" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="160" x2="178" y2="172" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="180" x2="178" y2="192" stroke="#d6d3d1" stroke-width="0.8"/>
    <line x1="158" y1="200" x2="178" y2="212" stroke="#d6d3d1" stroke-width="0.8"/>

    <!-- Top-edge highlight (book top edge) -->
    <path d="M -158 -210 L 158 -210 L 178 -198 L -138 -198 Z" fill="#fefce8"/>
    <line x1="-138" y1="-204" x2="158" y2="-204" stroke="#d6d3d1" stroke-width="0.8"/>

    <!-- Passport cover (navy — Korean passport color) -->
    <rect x="-158" y="-210" width="316" height="428" rx="8" fill="#0c1f3d"/>

    <!-- Cover left edge highlight (lighter strip, suggests spine fold) -->
    <rect x="-158" y="-210" width="16" height="428" rx="8" fill="#1e3a5f" opacity="0.9"/>
    <line x1="-142" y1="-208" x2="-142" y2="216" stroke="#0a1a35" stroke-width="0.8"/>

    <!-- Cover gold embossed border -->
    <rect x="-142" y="-194" width="288" height="396" rx="3" fill="none" stroke="#d4a017" stroke-width="1.8" opacity="0.85"/>

    <!-- Top text: 대한민국 (Korean) -->
    <text x="8" y="-140" text-anchor="middle" fill="#d4a017" font-family="serif" font-size="24" font-weight="bold" letter-spacing="6">대한민국</text>

    <!-- Top text: REPUBLIC OF KOREA (English) -->
    <text x="8" y="-114" text-anchor="middle" fill="#d4a017" font-family="serif" font-size="11" font-weight="bold" letter-spacing="3">REPUBLIC OF KOREA</text>

    <!-- Thin gold divider -->
    <line x1="-72" y1="-100" x2="88" y2="-100" stroke="#d4a017" stroke-width="0.8" opacity="0.6"/>

    <!-- ===== CENTER: Korean Taegeuk emblem (national emblem style) ===== -->
    <g transform="translate(8, -8)">
      <!-- Outer gold ring -->
      <circle r="68" fill="none" stroke="#d4a017" stroke-width="2.5"/>
      <circle r="64" fill="none" stroke="#d4a017" stroke-width="0.8" opacity="0.6"/>

      <!-- Taegeuk yin-yang (red top, blue bottom, curve interlocking) -->
      <circle r="50" fill="#0c1f3d"/>
      <!-- Red half (top) -->
      <path d="M -50 0 A 50 50 0 0 1 50 0 A 25 25 0 0 0 0 0 A 25 25 0 0 1 -50 0 Z" fill="#c8102e"/>
      <!-- Blue half (bottom) -->
      <path d="M 50 0 A 50 50 0 0 1 -50 0 A 25 25 0 0 1 0 0 A 25 25 0 0 0 50 0 Z" fill="#003478"/>

      <!-- Four trigrams (simplified, gold bars at 4 cardinal positions) -->
      <!-- Top: 3 solid bars (heaven 乾) -->
      <g fill="#d4a017">
        <rect x="-14" y="-90" width="28" height="3"/>
        <rect x="-14" y="-84" width="28" height="3"/>
        <rect x="-14" y="-78" width="28" height="3"/>
      </g>
      <!-- Bottom: 3 broken bars (earth 坤) -->
      <g fill="#d4a017">
        <rect x="-14" y="78" width="11" height="3"/>
        <rect x="3" y="78" width="11" height="3"/>
        <rect x="-14" y="84" width="11" height="3"/>
        <rect x="3" y="84" width="11" height="3"/>
        <rect x="-14" y="90" width="11" height="3"/>
        <rect x="3" y="90" width="11" height="3"/>
      </g>
      <!-- Left: water 坎 (solid-broken-solid) -->
      <g fill="#d4a017">
        <rect x="-92" y="-1.5" width="28" height="3"/>
        <rect x="-92" y="-7.5" width="11" height="3"/>
        <rect x="-75" y="-7.5" width="11" height="3"/>
        <rect x="-92" y="4.5" width="11" height="3"/>
        <rect x="-75" y="4.5" width="11" height="3"/>
      </g>
      <!-- Right: fire 離 (broken-solid-broken) -->
      <g fill="#d4a017">
        <rect x="64" y="-7.5" width="28" height="3"/>
        <rect x="64" y="-1.5" width="11" height="3"/>
        <rect x="81" y="-1.5" width="11" height="3"/>
        <rect x="64" y="4.5" width="28" height="3"/>
      </g>
    </g>

    <!-- Below emblem: 여권 (Korean) -->
    <text x="8" y="118" text-anchor="middle" fill="#d4a017" font-family="serif" font-size="32" font-weight="bold" letter-spacing="14">여권</text>

    <!-- Below: PASSPORT (English) -->
    <text x="8" y="148" text-anchor="middle" fill="#d4a017" font-family="serif" font-size="13" font-weight="bold" letter-spacing="6">PASSPORT</text>

    <!-- Bottom: biometric chip symbol (international passport indicator) -->
    <g transform="translate(8, 188)">
      <rect x="-14" y="-10" width="28" height="20" rx="2" fill="none" stroke="#d4a017" stroke-width="1.4"/>
      <line x1="-14" y1="-5" x2="-8" y2="-5" stroke="#d4a017" stroke-width="0.8"/>
      <line x1="-14" y1="0" x2="-10" y2="0" stroke="#d4a017" stroke-width="0.8"/>
      <line x1="-14" y1="5" x2="-8" y2="5" stroke="#d4a017" stroke-width="0.8"/>
      <line x1="8" y1="-5" x2="14" y2="-5" stroke="#d4a017" stroke-width="0.8"/>
      <line x1="10" y1="0" x2="14" y2="0" stroke="#d4a017" stroke-width="0.8"/>
      <line x1="8" y1="5" x2="14" y2="5" stroke="#d4a017" stroke-width="0.8"/>
    </g>
  </g>

  <!-- ===== LOWER-LEFT: single supporting callout (구여권은 보관) ===== -->
  <g transform="translate(80, 462)">
    <!-- Dark callout block -->
    <rect width="440" height="96" rx="14" fill="#0f172a"/>
    <!-- Left accent stripe -->
    <rect width="6" height="96" rx="3" fill="#10b981"/>

    <!-- Small chip with envelope/archive icon -->
    <g transform="translate(28, 28)">
      <rect width="34" height="24" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
      <path d="M 0 0 L 17 13 L 34 0" fill="none" stroke="#10b981" stroke-width="1.2"/>
      <text x="17" y="42" text-anchor="middle" fill="#34d399" font-family="serif" font-size="9" font-weight="bold">旧</text>
    </g>

    <!-- Label -->
    <text x="84" y="40" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="4">OLD PASSPORT · 旧旅券</text>
    <!-- Main message -->
    <text x="84" y="74" fill="#f1f5f9" font-family="sans-serif" font-size="22" font-weight="bold">구여권은 폐기하지 말고 보관</text>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>
