<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="50" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">在留资格 新申请·更新·变更 手续费总整理</text>
  <text x="600" y="78" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">2025年4月修订标准</text>

  <!-- Receipt-style table -->
  <g transform="translate(60, 95)">
    <!-- Table header -->
    <rect width="1080" height="45" rx="8" fill="#1e293b"/>
    <text x="200" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">项目</text>
    <text x="480" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">新申请</text>
    <text x="700" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">更新</text>
    <text x="920" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">变更</text>

    <!-- Row 1: Official fees -->
    <rect y="50" width="1080" height="55" rx="0" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <rect y="50" width="350" height="55" fill="#eff6ff"/>
    <text x="25" y="82" fill="#1e40af" font-family="sans-serif" font-size="14" font-weight="bold">官方手续费（收入印纸）</text>
    <text x="480" y="82" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="15" font-weight="bold">免费 (COE)</text>
    <text x="700" y="82" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="15" font-weight="bold">¥4,000</text>
    <text x="920" y="82" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="15" font-weight="bold">¥4,000</text>

    <!-- Row 2: Online discount -->
    <rect y="105" width="1080" height="55" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect y="105" width="350" height="55" fill="#f0fdf4"/>
    <text x="25" y="137" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">在线申请折扣</text>
    <text x="480" y="137" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="15">—</text>
    <text x="700" y="137" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="15" font-weight="bold">¥3,000</text>
    <text x="920" y="137" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="15" font-weight="bold">¥3,000</text>

    <!-- Row 3: Scrivener -->
    <rect y="160" width="1080" height="55" rx="0" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <rect y="160" width="350" height="55" fill="#fffbeb"/>
    <text x="25" y="192" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">行政书士代办费用</text>
    <text x="480" y="192" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">¥44,000~¥220,000</text>
    <text x="700" y="192" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">¥40,000~¥99,000</text>
    <text x="920" y="192" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">¥80,000~¥187,000</text>

    <!-- Row 4: Permanent residence -->
    <rect y="215" width="1080" height="55" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect y="215" width="350" height="55" fill="#fdf2f8"/>
    <text x="25" y="247" fill="#9d174d" font-family="sans-serif" font-size="14" font-weight="bold">永住权申请</text>
    <text x="540" y="240" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">印纸: ¥8,000</text>
    <text x="540" y="260" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">行政书士: ¥100,000~¥200,000</text>
    <text x="920" y="247" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">—</text>
  </g>

  <!-- Additional costs box -->
  <g transform="translate(60, 380)">
    <rect width="520" height="130" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="520" height="38" rx="12" fill="#6366f1"/>
    <rect y="26" width="520" height="12" fill="#6366f1"/>
    <text x="260" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">其他可能产生的费用</text>
    <text x="30" y="62" fill="#334155" font-family="sans-serif" font-size="13">• 文件翻译费: 每份 ¥3,000~¥10,000</text>
    <text x="30" y="84" fill="#334155" font-family="sans-serif" font-size="13">• 公证/认证费: ¥5,000~¥20,000</text>
    <text x="30" y="106" fill="#334155" font-family="sans-serif" font-size="13">• 证件照、邮费/挂号费、邀请函相关费用</text>
  </g>

  <!-- Summary highlight -->
  <g transform="translate(600, 380)">
    <rect width="540" height="130" rx="12" fill="#1e293b"/>
    <text x="270" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">总预估费用范围</text>
    <line x1="40" y1="45" x2="500" y2="45" stroke="#334155"/>
    <text x="270" y="72" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">自行申请（更新）: 约 ¥4,000</text>
    <text x="270" y="96" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14">委托代办（新申请）: ¥50,000~¥300,000+</text>
    <text x="270" y="120" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold">自行申请可节省代办费！</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(60, 525)">
    <rect width="1080" height="50" rx="10" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
    <text x="540" y="32" text-anchor="middle" fill="#854d0e" font-family="sans-serif" font-size="14" font-weight="bold">※ 在线申请可享手续费折扣 | 手续费上调讨论中（请确认最新信息）</text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>