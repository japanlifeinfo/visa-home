<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#eff6ff"/>
  <rect width="1200" height="8" fill="url(#hg)"/>

  <text x="600" y="75" text-anchor="middle" fill="#1e3a5f" font-family="sans-serif" font-size="44" font-weight="bold">재류카드 분실! 어떻게 해야 하나?</text>

  <!-- Left: Step boxes -->
  <text x="100" y="140" fill="#dc2626" font-family="sans-serif" font-size="22" font-weight="bold">STEP 1</text>
  <rect x="100" y="155" width="460" height="75" rx="14" fill="#dc2626"/>
  <text x="330" y="200" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">경찰에 분실 신고</text>

  <polygon points="330,242 318,230 342,230" fill="#dc2626"/>

  <text x="100" y="268" fill="#ea580c" font-family="sans-serif" font-size="22" font-weight="bold">STEP 2</text>
  <rect x="100" y="283" width="460" height="75" rx="14" fill="#ea580c"/>
  <text x="330" y="328" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">14일 이내 재발급 신청</text>

  <polygon points="330,370 318,358 342,358" fill="#ea580c"/>

  <text x="100" y="396" fill="#16a34a" font-family="sans-serif" font-size="22" font-weight="bold">STEP 3</text>
  <rect x="100" y="411" width="460" height="75" rx="14" fill="#16a34a"/>
  <text x="330" y="456" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">새 재류카드 수령</text>

  <!-- Right: required docs -->
  <rect x="640" y="130" width="470" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="875" y="175" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="26" font-weight="bold">준비서류</text>
  <line x1="665" y1="192" x2="1085" y2="192" stroke="#e2e8f0" stroke-width="1"/>
  <text x="680" y="235" fill="#475569" font-family="sans-serif" font-size="24">&#x2713; 재발급 신청서</text>
  <text x="680" y="280" fill="#475569" font-family="sans-serif" font-size="24">&#x2713; 여권</text>
  <text x="680" y="325" fill="#475569" font-family="sans-serif" font-size="24">&#x2713; 사진 (4cm x 3cm)</text>
  <text x="680" y="370" fill="#475569" font-family="sans-serif" font-size="24">&#x2713; 경찰 접수번호</text>
  <text x="680" y="415" fill="#475569" font-family="sans-serif" font-size="24">&#x2713; 수수료: 무료</text>
  <text x="680" y="460" fill="#475569" font-family="sans-serif" font-size="24">&#x2713; 신청장소: 출입국관리국</text>

  <!-- Bottom warning -->
  <rect x="80" y="520" width="1040" height="60" rx="12" fill="#fbbf24"/>
  <text x="600" y="558" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="26" font-weight="bold">분실 인지일로부터 14일 이내 반드시 신청!</text>


  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
</svg>
