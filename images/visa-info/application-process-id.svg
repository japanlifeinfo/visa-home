<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="50" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="26" font-weight="bold">Panduan Lengkap Pengajuan Status Tinggal Jepang</text>
  <text x="600" y="78" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">Panduan 4 langkah untuk pemohon pertama kali</text>

  <!-- Step 1 -->
  <g transform="translate(50, 100)">
    <rect width="240" height="145" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#3b82f6"/>
    <rect y="26" width="240" height="12" fill="#3b82f6"/>
    <text x="120" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">STEP 1 · Persiapan Dokumen</text>
    <text x="120" y="65" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="13" font-weight="bold">Formulir, paspor, foto</text>
    <text x="120" y="88" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Bukti kegiatan, dokumen perusahaan</text>
    <text x="120" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Surat keterangan kerja</text>
    <text x="120" y="132" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="11" font-weight="bold">Cek dokumen tambahan per jenis visa!</text>
  </g>

  <!-- Arrow 1-2 -->
  <text x="300" y="172" fill="#94a3b8" font-family="sans-serif" font-size="24">&#x2192;</text>

  <!-- Step 2 -->
  <g transform="translate(320, 130)">
    <rect width="240" height="145" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#16a34a"/>
    <rect y="26" width="240" height="12" fill="#16a34a"/>
    <text x="120" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">STEP 2 · Pengajuan Imigrasi</text>
    <text x="120" y="65" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="bold">Datang langsung atau melalui wakil</text>
    <text x="120" y="88" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Tidak ada biaya pengajuan</text>
    <text x="120" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Cek kantor yurisdiksi terlebih dahulu</text>
    <text x="120" y="132" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="12" font-weight="bold">Pengajuan online tersedia!</text>
  </g>

  <!-- Arrow 2-3 -->
  <text x="570" y="202" fill="#94a3b8" font-family="sans-serif" font-size="24">&#x2192;</text>

  <!-- Step 3 -->
  <g transform="translate(590, 160)">
    <rect width="240" height="145" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <rect width="240" height="38" rx="12" fill="#d97706"/>
    <rect y="26" width="240" height="12" fill="#d97706"/>
    <text x="120" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">STEP 3 · Masa Peninjauan</text>
    <text x="120" y="65" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">Rata-rata 1-3 bulan</text>
    <text x="120" y="88" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Respons cepat untuk permintaan dokumen</text>
    <text x="120" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Tunggu pemberitahuan hasil</text>
    <text x="120" y="132" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="12" font-weight="bold">Musim ramai 3-4 bulan+</text>
  </g>

  <!-- Arrow 3-4 -->
  <text x="840" y="232" fill="#94a3b8" font-family="sans-serif" font-size="24">&#x2192;</text>

  <!-- Step 4 -->
  <g transform="translate(860, 190)">
    <rect width="280" height="145" rx="12" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2"/>
    <rect width="280" height="38" rx="12" fill="#db2777"/>
    <rect y="26" width="280" height="12" fill="#db2777"/>
    <text x="140" y="27" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">STEP 4 · Persetujuan Selesai!</text>
    <text x="140" y="65" text-anchor="middle" fill="#9d174d" font-family="sans-serif" font-size="13" font-weight="bold">Kartu tinggal &amp; visa diterbitkan</text>
    <text x="140" y="88" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Pembayaran materai (&#xA5;4,000)</text>
    <text x="140" y="108" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Pendaftaran alamat</text>
    <text x="140" y="132" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold">Tinggal resmi dimulai!</text>
  </g>

  <!-- Checklist Box -->
  <g transform="translate(50, 365)">
    <rect width="520" height="210" rx="12" fill="#1e293b"/>
    <text x="260" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">Daftar Periksa Utama</text>
    <line x1="30" y1="45" x2="490" y2="45" stroke="#334155"/>
    <text x="40" y="72" fill="#e2e8f0" font-family="sans-serif" font-size="13">&#x2713; Pastikan status sesuai dengan kegiatan sebenarnya</text>
    <text x="40" y="98" fill="#e2e8f0" font-family="sans-serif" font-size="13">&#x2713; Periksa konsistensi semua isi dokumen</text>
    <text x="40" y="124" fill="#e2e8f0" font-family="sans-serif" font-size="13">&#x2713; Respons cepat saat diminta dokumen tambahan</text>
    <text x="40" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="13">&#x2713; Ajukan sebelum masa tinggal berakhir</text>
    <text x="40" y="176" fill="#e2e8f0" font-family="sans-serif" font-size="13">&#x2713; Cek kantor imigrasi yurisdiksi terlebih dahulu</text>
    <text x="40" y="200" fill="#fbbf24" font-family="sans-serif" font-size="13">&#x203B; Sebagian besar penolakan karena persiapan dokumen kurang</text>
  </g>

  <!-- Duration summary -->
  <g transform="translate(600, 365)">
    <rect width="550" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <text x="275" y="30" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="14">Estimasi Total Waktu</text>
    <text x="275" y="65" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="32" font-weight="bold">Sekitar 1-3 bulan</text>
    <text x="275" y="88" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Pengajuan baru (dengan COE): 1,5-4 bulan+</text>
  </g>

  <g transform="translate(600, 480)">
    <rect width="550" height="95" rx="12" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
    <text x="275" y="28" text-anchor="middle" fill="#854d0e" font-family="sans-serif" font-size="14" font-weight="bold">Referensi Berdasarkan Jenis Pengajuan</text>
    <text x="275" y="52" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="12">Baru (COE) · Perubahan · Perpanjangan · Permanen — dokumen &amp; review berbeda</text>
    <text x="275" y="75" text-anchor="middle" fill="#713f12" font-family="sans-serif" font-size="13">Ajukan sendiri hemat biaya agen | Layanan agen juga tersedia</text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>