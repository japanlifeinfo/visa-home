<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="55" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="30" font-weight="bold">日本非法就业查处案例合集</text>
  <text x="600" y="82" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">"一次失误"可能改变一生</text>

  <g transform="translate(50, 100)">
    <rect width="350" height="160" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="350" height="32" rx="8" fill="#dc2626"/>
    <rect y="16" width="350" height="16" fill="#dc2626"/>
    <text x="175" y="22" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">案例1 · 技能实习生逃跑 + 伪造在留卡</text>
    <text x="20" y="58" fill="#334155" font-family="sans-serif" font-size="13">技能实习生逃跑后在建筑工地非法工作</text>
    <text x="20" y="78" fill="#334155" font-family="sans-serif" font-size="13">中介制作伪造在留卡并分发</text>
    <text x="20" y="100" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">结果: 中介被逮捕·起诉</text>
    <text x="20" y="122" fill="#64748b" font-family="sans-serif" font-size="12">→ 介绍人也是处罚对象</text>
    <text x="20" y="144" fill="#64748b" font-family="sans-serif" font-size="12">→ 本人·雇主·中介全部追责</text>
  </g>

  <g transform="translate(420, 100)">
    <rect width="350" height="160" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="350" height="32" rx="8" fill="#ea580c"/>
    <rect y="16" width="350" height="16" fill="#ea580c"/>
    <text x="175" y="22" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">案例2 · 在签证范围外的行业就业</text>
    <text x="20" y="58" fill="#334155" font-family="sans-serif" font-size="13">农业签证 → 从事洗衣·工厂工作</text>
    <text x="20" y="78" fill="#334155" font-family="sans-serif" font-size="13">支援机构说"没问题"但实际违法</text>
    <text x="20" y="100" fill="#ea580c" font-family="sans-serif" font-size="13" font-weight="bold">结果: 因违反入管法被逮捕</text>
    <text x="20" y="122" fill="#64748b" font-family="sans-serif" font-size="12">→ 指定行业外工作 = 非法就业</text>
    <text x="20" y="144" fill="#64748b" font-family="sans-serif" font-size="12">→ 签证类型必须与实际工作一致</text>
  </g>

  <g transform="translate(790, 100)">
    <rect width="360" height="160" rx="8" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="360" height="32" rx="8" fill="#9333ea"/>
    <rect y="16" width="360" height="16" fill="#9333ea"/>
    <text x="180" y="22" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">案例3 · 雇主被查处</text>
    <text x="20" y="58" fill="#334155" font-family="sans-serif" font-size="13">雇用签证过期/无资格外国人</text>
    <text x="20" y="78" fill="#334155" font-family="sans-serif" font-size="13">"因为工资便宜所以雇用了"</text>
    <text x="20" y="100" fill="#9333ea" font-family="sans-serif" font-size="13" font-weight="bold">结果: 因违反入国管理法被逮捕</text>
    <text x="20" y="122" fill="#64748b" font-family="sans-serif" font-size="12">→ 雇主面临刑事处罚</text>
    <text x="20" y="144" fill="#64748b" font-family="sans-serif" font-size="12">→ 雇用前必须确认在留资格</text>
  </g>

  <g transform="translate(50, 280)">
    <rect width="530" height="75" rx="12" fill="#1e293b"/>
    <text x="265" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">2024年统计: 约14,000人因就业违规被查</text>
    <text x="265" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13">包括滞留本身不符合签证规定的情况</text>
  </g>

  <g transform="translate(600, 280)">
    <rect width="550" height="75" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="275" y="30" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">⚠ 警惕SNS"短期高薪兼职"</text>
    <text x="275" y="55" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">网上非法招聘 — 已被日本警方列为警告对象</text>
  </g>

  <text x="50" y="395" fill="#475569" font-family="sans-serif" font-size="15" font-weight="bold">为什么这类案例这么多？</text>
  <g transform="translate(50, 405)">
    <rect width="260" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="30" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">劳动力短缺 → 依赖外国人</text>
  </g>
  <g transform="translate(320, 405)">
    <rect width="260" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="30" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">劳动者不了解签证条件</text>
  </g>
  <g transform="translate(590, 405)">
    <rect width="260" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="30" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">非法中介助长违规</text>
  </g>
  <g transform="translate(860, 405)">
    <rect width="290" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="145" y="30" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13">签证状态 ≠ 实际工作</text>
  </g>

  <g transform="translate(50, 475)">
    <rect width="1100" height="55" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="100" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">逮捕·处罚</text>
    <text x="310" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">强制遣返</text>
    <text x="550" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">长期禁止入境</text>
    <text x="810" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">签证审查不利</text>
    <text x="1010" y="35" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">职业生涯毁灭</text>
  </g>

  <text x="600" y="565" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="15">签证状态与实际工作的一致性在法律上至关重要</text>
  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
