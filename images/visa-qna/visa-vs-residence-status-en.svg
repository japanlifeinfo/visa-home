<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Visa vs Residence Status</text>

  <!-- Left circle: Visa -->
  <circle cx="300" cy="310" r="150" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
  <text x="300" y="290" text-anchor="middle" fill="#1e40af" font-family="sans-serif" font-size="50" font-weight="bold">Visa</text>
  <text x="300" y="350" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="32">Entry ticket</text>
  <text x="300" y="400" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Single use</text>

  <!-- VS -->
  <circle cx="600" cy="310" r="45" fill="#1e293b"/>
  <text x="600" y="322" text-anchor="middle" fill="white" font-family="sans-serif" font-size="36" font-weight="bold">VS</text>

  <!-- Right circle: Residence Status -->
  <circle cx="900" cy="310" r="150" fill="#d1fae5" stroke="#10b981" stroke-width="4"/>
  <text x="900" y="280" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="42" font-weight="bold">Residence</text>
  <text x="900" y="340" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="32">Stay permit</text>
  <text x="900" y="390" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Renewable</text>

  <!-- Bottom -->
  <text x="600" y="540" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="30">Confusing them blocks your application</text>

  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>