<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">취업비자에서 영주권을 취득하면 좋은 점</text>

  <!-- Card 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="55" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="22" font-weight="bold">&#8734;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">체류 기간 무제한</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">갱신 불필요</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">만료 걱정 없음</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">행정적 스트레스 해소</text>
  </g>

  <!-- Card 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="55" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="22" font-weight="bold">&#9733;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">직업 선택의 자유</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">업종 제한 없음</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">프리랜서, 창업 가능</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">부업도 자유롭게</text>
  </g>

  <!-- Card 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="55" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="22" font-weight="bold">&#9750;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">이직 리스크 감소</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">개인 기반 체류</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">회사와 무관하게 체류 가능</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">고용 불안 시대의 안전장치</text>
  </g>

  <!-- Card 4 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="55" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="22" font-weight="bold">&#9960;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">금융 신뢰도 상승</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">주택 대출 승인 가능성 향상</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">유리한 금리 조건</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">카드/금융 심사 통과율 상승</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">영주권의 핵심 가치</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">국적 유지 | 무기한 거주 | 삶을 설계할 수 있는 자격</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
