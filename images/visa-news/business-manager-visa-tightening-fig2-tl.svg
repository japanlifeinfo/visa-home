<svg width="900" height="540" viewBox="0 0 900 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="540" fill="white"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">&lt; Mga May-hawak ng Business Manager Visa (2014–2024) &gt;</text>

  <!-- Y axis -->
  <line x1="100" y1="80" x2="100" y2="470" stroke="#475569" stroke-width="1.5"/>
  <!-- X axis -->
  <line x1="100" y1="470" x2="870" y2="470" stroke="#475569" stroke-width="1.5"/>

  <!-- Y axis gridlines + labels (0, 5K, 10K, ..., 45K) -->
  <g font-family="sans-serif" font-size="14" fill="#475569" text-anchor="end">
    <text x="92" y="475">-</text>
    <line x1="100" y1="427" x2="870" y2="427" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="432">5,000</text>
    <line x1="100" y1="384" x2="870" y2="384" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="389">10,000</text>
    <line x1="100" y1="341" x2="870" y2="341" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="346">15,000</text>
    <line x1="100" y1="298" x2="870" y2="298" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="303">20,000</text>
    <line x1="100" y1="255" x2="870" y2="255" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="260">25,000</text>
    <line x1="100" y1="212" x2="870" y2="212" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="217">30,000</text>
    <line x1="100" y1="169" x2="870" y2="169" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="174">35,000</text>
    <line x1="100" y1="126" x2="870" y2="126" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="131">40,000</text>
    <line x1="100" y1="83" x2="870" y2="83" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="88">45,000</text>
  </g>

  <!-- Bars: 11 years (2014–2024), each ~60px wide with ~10px gap, total ~770px starting at x=110 -->
  <!-- Bar formula: y = 470 - (value / 45000) * 387; height = (value / 45000) * 387 -->
  <!-- 2014: 15184 → h=130.6, y=339.4 -->
  <g fill="#3b82f6">
    <rect x="115" y="339" width="55" height="131"/>
    <rect x="185" y="314" width="55" height="156"/>
    <rect x="255" y="282" width="55" height="188"/>
    <rect x="325" y="263" width="55" height="207"/>
    <rect x="395" y="249" width="55" height="221"/>
    <rect x="465" y="236" width="55" height="234"/>
    <rect x="535" y="236" width="55" height="234"/>
    <rect x="605" y="236" width="55" height="234"/>
    <rect x="675" y="197" width="55" height="273"/>
    <rect x="745" y="148" width="55" height="322"/>
    <rect x="815" y="112" width="55" height="358"/>
  </g>

  <!-- Data labels above each bar -->
  <g font-family="sans-serif" font-size="14" fill="#1e293b" font-weight="bold" text-anchor="middle">
    <text x="142" y="330">15,184</text>
    <text x="212" y="305">18,109</text>
    <text x="282" y="273">21,877</text>
    <text x="352" y="254">24,033</text>
    <text x="422" y="240">25,670</text>
    <text x="492" y="227">27,249</text>
    <text x="562" y="227">27,235</text>
    <text x="632" y="227">27,197</text>
    <text x="702" y="188">31,808</text>
    <text x="772" y="139">37,510</text>
    <text x="842" y="103">41,615</text>
  </g>

  <!-- X axis labels (years) -->
  <g font-family="sans-serif" font-size="15" fill="#334155" text-anchor="middle">
    <text x="142" y="495">2014</text>
    <text x="212" y="495">2015</text>
    <text x="282" y="495">2016</text>
    <text x="352" y="495">2017</text>
    <text x="422" y="495">2018</text>
    <text x="492" y="495">2019</text>
    <text x="562" y="495">2020</text>
    <text x="632" y="495">2021</text>
    <text x="702" y="495">2022</text>
    <text x="772" y="495">2023</text>
    <text x="842" y="495">2024</text>
  </g>
</svg>
