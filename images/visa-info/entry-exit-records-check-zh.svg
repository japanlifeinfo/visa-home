<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep indigo (break from prior 2 light backgrounds + slate-blue residence card) -->
  <rect width="1200" height="630" fill="#1e1b4b"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark 履歴 (lower-right, very faint) -->
  <text x="1180" y="608" text-anchor="end" fill="#fbbf24" font-family="serif" font-size="220" font-weight="bold" opacity="0.06">履歴</text>

  <!-- Background watermark 出入国 (upper-left, very faint) -->
  <text x="40" y="180" fill="#a78bfa" font-family="serif" font-size="80" font-weight="bold" letter-spacing="6" opacity="0.06">出入国</text>

  <!-- ===== TOP CENTERED STACK (pattern #1 — break from recent #2/#3/#4) ===== -->

  <!-- Kicker pill (outlined, centered) -->
  <g transform="translate(600, 60)">
    <rect x="-280" y="-19" width="560" height="36" rx="18" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="4">出入境记录 · 出入国履歴 · ENTRY/EXIT RECORDS</text>
  </g>

  <!-- Tiny pre-headline label (centered) -->
  <text x="600" y="116" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="16" font-weight="500" letter-spacing="2">申请永住权或签证前必看</text>

  <!-- Main headline (2 lines, centered) -->
  <text x="600" y="178" text-anchor="middle" fill="#f1f5f9" font-family="sans-serif" font-size="52" font-weight="500">出入境记录</text>
  <text x="600" y="236" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="bold">
    <tspan fill="#fbbf24">如何</tspan>
    <tspan fill="#f1f5f9"> </tspan>
    <tspan fill="#f1f5f9">查询?</tspan>
  </text>

  <!-- Subtitle (centered, single line) -->
  <text x="600" y="278" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="500">从护照盖章到出入国在留管理厅信息公开请求</text>

  <!-- Thin centered accent line -->
  <line x1="560" y1="298" x2="640" y2="298" stroke="#60a5fa" stroke-width="1.5" opacity="0.55"/>

  <!-- ===== STAMP CONSTELLATION (the main illustration — circular stamps, not card silhouettes) ===== -->

  <!-- Subtle dashed timeline running through stamps -->
  <line x1="280" y1="440" x2="920" y2="440" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 10" opacity="0.55"/>

  <!-- Tiny tick marks on timeline -->
  <g opacity="0.5">
    <line x1="370" y1="436" x2="370" y2="444" stroke="#64748b" stroke-width="1.2"/>
    <line x1="500" y1="436" x2="500" y2="444" stroke="#64748b" stroke-width="1.2"/>
    <line x1="630" y1="436" x2="630" y2="444" stroke="#64748b" stroke-width="1.2"/>
    <line x1="760" y1="436" x2="760" y2="444" stroke="#64748b" stroke-width="1.2"/>
    <line x1="890" y1="436" x2="890" y2="444" stroke="#64748b" stroke-width="1.2"/>
  </g>

  <!-- Timeline label -->
  <text x="600" y="488" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="6" opacity="0.85">时间轴 · 出入国 履歴</text>

  <!-- ===== STAMP 1: 入国 (red, leftmost, rotated -11°) ===== -->
  <g transform="translate(370, 410) rotate(-11)">
    <!-- Outer ring -->
    <circle r="62" fill="none" stroke="#dc2626" stroke-width="4.5" opacity="0.92"/>
    <!-- Inner ring -->
    <circle r="52" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.88"/>
    <!-- Small upper text -->
    <text y="-22" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="3" opacity="0.92">JAPAN</text>
    <!-- Main kanji -->
    <text y="14" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="34" font-weight="bold" letter-spacing="4" opacity="0.95">入国</text>
    <!-- Date -->
    <text y="36" text-anchor="middle" fill="#dc2626" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1" opacity="0.88">2023.04.15</text>
    <!-- Ink imperfections -->
    <circle cx="-44" cy="-32" r="2" fill="#dc2626" opacity="0.55"/>
    <circle cx="42" cy="38" r="1.6" fill="#dc2626" opacity="0.5"/>
    <circle cx="-50" cy="22" r="1.4" fill="#dc2626" opacity="0.5"/>
  </g>

  <!-- ===== STAMP 2: 出国 (blue, rotated +7°) ===== -->
  <g transform="translate(500, 440) rotate(7)">
    <!-- Outer ring -->
    <circle r="58" fill="none" stroke="#2563eb" stroke-width="4" opacity="0.92"/>
    <!-- Inner ring -->
    <circle r="48" fill="none" stroke="#2563eb" stroke-width="1.4" opacity="0.85"/>
    <!-- Small upper text -->
    <text y="-20" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="8" font-weight="bold" letter-spacing="3" opacity="0.9">JAPAN</text>
    <!-- Main kanji -->
    <text y="12" text-anchor="middle" fill="#2563eb" font-family="serif" font-size="32" font-weight="bold" letter-spacing="4" opacity="0.95">出国</text>
    <!-- Date -->
    <text y="32" text-anchor="middle" fill="#2563eb" font-family="monospace" font-size="8.5" font-weight="bold" letter-spacing="1" opacity="0.88">2023.09.22</text>
    <!-- Ink imperfections -->
    <circle cx="40" cy="-30" r="1.8" fill="#2563eb" opacity="0.55"/>
    <circle cx="-38" cy="34" r="1.4" fill="#2563eb" opacity="0.5"/>
  </g>

  <!-- ===== STAMP 3: 入国 (red, rotated -5°) ===== -->
  <g transform="translate(630, 410) rotate(-5)">
    <!-- Outer ring -->
    <circle r="64" fill="none" stroke="#dc2626" stroke-width="4.5" opacity="0.92"/>
    <!-- Inner ring -->
    <circle r="54" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.88"/>
    <!-- Small upper text -->
    <text y="-24" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="3" opacity="0.92">JAPAN</text>
    <!-- Main kanji -->
    <text y="14" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="36" font-weight="bold" letter-spacing="4" opacity="0.95">入国</text>
    <!-- Date -->
    <text y="38" text-anchor="middle" fill="#dc2626" font-family="monospace" font-size="9.5" font-weight="bold" letter-spacing="1" opacity="0.88">2024.02.10</text>
    <!-- Ink imperfections -->
    <circle cx="46" cy="-28" r="1.8" fill="#dc2626" opacity="0.55"/>
    <circle cx="-46" cy="36" r="1.6" fill="#dc2626" opacity="0.55"/>
    <circle cx="-22" cy="-46" r="1.4" fill="#dc2626" opacity="0.5"/>
  </g>

  <!-- ===== STAMP 4: 出国 (blue, rotated +13°) ===== -->
  <g transform="translate(760, 440) rotate(13)">
    <!-- Outer ring -->
    <circle r="58" fill="none" stroke="#2563eb" stroke-width="4" opacity="0.92"/>
    <!-- Inner ring -->
    <circle r="48" fill="none" stroke="#2563eb" stroke-width="1.4" opacity="0.85"/>
    <!-- Small upper text -->
    <text y="-20" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="8" font-weight="bold" letter-spacing="3" opacity="0.9">JAPAN</text>
    <!-- Main kanji -->
    <text y="12" text-anchor="middle" fill="#2563eb" font-family="serif" font-size="32" font-weight="bold" letter-spacing="4" opacity="0.95">出国</text>
    <!-- Date -->
    <text y="32" text-anchor="middle" fill="#2563eb" font-family="monospace" font-size="8.5" font-weight="bold" letter-spacing="1" opacity="0.88">2024.08.05</text>
    <!-- Ink imperfections -->
    <circle cx="-38" cy="-32" r="1.6" fill="#2563eb" opacity="0.5"/>
    <circle cx="38" cy="34" r="1.6" fill="#2563eb" opacity="0.5"/>
  </g>

  <!-- ===== STAMP 5: 入国 (red, rightmost, rotated -8°) ===== -->
  <g transform="translate(890, 410) rotate(-8)">
    <!-- Outer ring -->
    <circle r="56" fill="none" stroke="#dc2626" stroke-width="4" opacity="0.9"/>
    <!-- Inner ring -->
    <circle r="46" fill="none" stroke="#dc2626" stroke-width="1.4" opacity="0.85"/>
    <!-- Small upper text -->
    <text y="-18" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="8" font-weight="bold" letter-spacing="3" opacity="0.9">JAPAN</text>
    <!-- Main kanji -->
    <text y="10" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="30" font-weight="bold" letter-spacing="4" opacity="0.95">入国</text>
    <!-- Date -->
    <text y="30" text-anchor="middle" fill="#dc2626" font-family="monospace" font-size="8" font-weight="bold" letter-spacing="1" opacity="0.85">2025.03.18</text>
    <!-- Ink imperfections -->
    <circle cx="34" cy="-28" r="1.4" fill="#dc2626" opacity="0.5"/>
    <circle cx="-34" cy="30" r="1.4" fill="#dc2626" opacity="0.5"/>
  </g>

  <!-- ===== LOWER-CENTER: single supporting callout (정보 공개 청구) ===== -->
  <g transform="translate(370, 528)">
    <!-- Dark callout block -->
    <rect width="460" height="74" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95"/>
    <!-- Left accent stripe -->
    <rect width="6" height="74" rx="3" fill="#fbbf24"/>

    <!-- Small icon: magnifying glass over document corner -->
    <g transform="translate(28, 22)">
      <!-- Document corner -->
      <path d="M 0 0 L 18 0 L 24 6 L 24 28 L 0 28 Z" fill="none" stroke="#fbbf24" stroke-width="1.3"/>
      <line x1="4" y1="10" x2="18" y2="10" stroke="#fbbf24" stroke-width="0.8" opacity="0.7"/>
      <line x1="4" y1="16" x2="18" y2="16" stroke="#fbbf24" stroke-width="0.8" opacity="0.7"/>
      <line x1="4" y1="22" x2="14" y2="22" stroke="#fbbf24" stroke-width="0.8" opacity="0.7"/>
      <!-- Magnifying glass overlay -->
      <circle cx="22" cy="22" r="7" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
      <line x1="27" y1="27" x2="33" y2="33" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Label -->
    <text x="84" y="32" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="3">信息公开 · 開示請求</text>
    <!-- Main message -->
    <text x="84" y="58" fill="#f1f5f9" font-family="sans-serif" font-size="20" font-weight="bold">向出入国在留管理厅申请信息公开</text>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
</svg>
