<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="34" font-weight="500" letter-spacing="6" opacity="0.8">आवश्यक कागजातहरू</text>
    <text x="80" y="300" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="48" font-weight="900">उच्च</text>
    <text x="80" y="360" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="48" font-weight="900">दक्ष पेशेवर</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <polygon points="130,50 155,105 215,115 170,155 182,215 130,188 78,215 90,155 45,115 105,105" fill="#b45309" opacity="0.25"/>
      <polygon points="130,75 147,112 188,118 158,146 166,186 130,167 94,186 102,146 72,118 113,112" fill="#b45309" opacity="0.2"/>
      <circle cx="130" cy="130" r="20" fill="#b45309" opacity="0.3"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#b45309" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">高度専門職</text>
  <text x="955" y="425" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="30" opacity="0.6">Highly Skilled Professional</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#b45309" opacity="0.08" stroke="#b45309" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="23" font-weight="600">B</text>

</svg>