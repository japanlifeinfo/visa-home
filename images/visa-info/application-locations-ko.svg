  <!-- Step 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">🏢</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">전국 사무소 규모</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">본청 8곳 전국 배치</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">지국 3곳</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">출장소 약 55곳</text>
  </g>

  <!-- Step 2 (top-right) -->
