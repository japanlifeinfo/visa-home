<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">Processo do COE (Certificado de Elegibilidade)</text>

  <!-- Card 1: Preparacao -->
  <g transform="translate(80, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#3b82f6"/><rect y="45" width="330" height="15" fill="#3b82f6"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">①② Preparacao</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Assinar contrato de trabalho</text>
    <text x="165" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">↓</text>
    <text x="165" y="158" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Empresa solicita o COE</text>
    <rect x="40" y="180" width="250" height="32" rx="16" fill="#dbeafe"/>
    <text x="165" y="201" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="14" font-weight="bold">Geralmente feito pela empresa</text>
    <text x="165" y="240" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Formulario COE · Contrato</text>
    <text x="165" y="262" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Registro empresa · Financeiros</text>
    <text x="165" y="284" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Descricao cargo · Diploma</text>
  </g>

  <text x="422" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="28">→</text>

  <!-- Card 2: Analise -->
  <g transform="translate(435, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#f59e0b"/><rect y="45" width="330" height="15" fill="#f59e0b"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">③④ Analise · Emissao</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">1–3 meses</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Alta temporada: 3–4+ meses</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#fef3c7"/>
    <text x="165" y="192" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="15" font-weight="bold">Portal mais importante</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Review formacao-funcao</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Verificacao financeira empresa</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Docs extras = mais atraso</text>
  </g>

  <text x="777" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="28">→</text>

  <!-- Card 3: Entrada -->
  <g transform="translate(790, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#10b981"/><rect y="45" width="330" height="15" fill="#10b981"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">⑤⑥ Visto · Entrada</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Solicitar visto na embaixada</text>
    <text x="165" y="138" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Emissao: 3–7 dias</text>
    <text x="165" y="163" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">↓</text>
    <text x="165" y="188" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Entrar no Japao · Cartao</text>
    <rect x="65" y="210" width="200" height="32" rx="16" fill="#d1fae5"/>
    <text x="165" y="231" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="14" font-weight="bold">Comecar a trabalhar!</text>
    <text x="165" y="270" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Verifique jurisdicao da embaixada</text>
    <text x="165" y="292" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Total: cerca de 1,5–4 meses</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 450)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">Pontos-Chave</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">Oferta de emprego nao e o fim — analise do COE e o portal mais importante</text>
  </g>
  <text x="600" y="575" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
