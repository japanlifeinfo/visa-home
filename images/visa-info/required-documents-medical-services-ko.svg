<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">의료</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">제출 서류 안내</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(55, 35)">
      <!-- Medical cross -->
      <rect x="30" y="10" width="60" height="90" rx="10" fill="#10b981"/>
      <rect x="15" y="35" width="90" height="40" rx="10" fill="#10b981"/>
      <rect x="40" y="20" width="40" height="70" fill="#d1fae5"/>
      <rect x="25" y="45" width="70" height="20" fill="#d1fae5"/>
      <!-- Stethoscope -->
      <circle cx="95" cy="90" r="18" stroke="#374151" stroke-width="4" fill="none"/>
      <path d="M95 72 Q95 55 80 45 Q65 35 60 25" stroke="#374151" stroke-width="4" fill="none"/>
      <circle cx="58" cy="22" r="6" fill="#374151"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">의료 전문직 재류자격</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
        <text x="12" y="17" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">의사, 치과의사, 간호사, 약제사 등</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
        <text x="12" y="17" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">일본 의료 관련 자격 취득 필요</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
        <text x="12" y="17" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">재류 기간: 5년, 3년, 1년, 3개월</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#d1fae5"/>
        <text x="12" y="17" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">인정 · 변경 · 갱신 신청 가능</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#d1fae5"/>
    <text x="400" y="320" text-anchor="middle" fill="#059669" font-family="sans-serif" font-size="18" font-weight="bold">医療</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
