<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f0f9ff"/>
  <rect width="1200" height="8" fill="url(#hg)"/>

  <text x="600" y="75" text-anchor="middle" fill="#0c4a6e" font-family="sans-serif" font-size="42" font-weight="bold">搬家了？在留卡地址变更必须办！</text>

  <rect x="80" y="120" width="500" height="340" rx="16" fill="white" stroke="#bae6fd" stroke-width="2"/>
  <text x="330" y="165" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="26" font-weight="bold">申报流程</text>
  <line x1="100" y1="180" x2="560" y2="180" stroke="#e0f2fe" stroke-width="2"/>

  <circle cx="140" cy="225" r="22" fill="#0284c7"/>
  <text x="140" y="232" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">1</text>
  <text x="180" y="232" fill="#334155" font-family="sans-serif" font-size="22" font-weight="bold">前往市/区政厅 (市役所·区役所)</text>

  <circle cx="140" cy="285" r="22" fill="#0284c7"/>
  <text x="140" y="292" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">2</text>
  <text x="180" y="292" fill="#334155" font-family="sans-serif" font-size="22" font-weight="bold">迁入申报 + 出示在留卡</text>

  <circle cx="140" cy="345" r="22" fill="#0284c7"/>
  <text x="140" y="352" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">3</text>
  <text x="180" y="352" fill="#334155" font-family="sans-serif" font-size="22" font-weight="bold">卡背面记载新地址</text>

  <line x1="100" y1="385" x2="560" y2="385" stroke="#e0f2fe" stroke-width="2"/>
  <text x="330" y="420" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="18">携带：在留卡 · 护照 · My Number卡 · 迁出证明</text>

  <rect x="620" y="120" width="500" height="155" rx="16" fill="#dc2626"/>
  <text x="870" y="170" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">期限：搬家后14天内</text>
  <text x="870" y="210" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="20">以实际入住日为准（非合同日）</text>
  <text x="870" y="250" text-anchor="middle" fill="#fef2f2" font-family="sans-serif" font-size="20" font-weight="bold">违规：最高20万日元罚款</text>

  <rect x="620" y="300" width="500" height="160" rx="16" fill="#1e293b"/>
  <text x="870" y="345" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="22" font-weight="bold">不申报的实际风险</text>
  <text x="870" y="380" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="18">收不到税单 · 年金欠缴处理</text>
  <text x="870" y="410" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="18">健康保险问题 · 入管通知遗漏</text>
  <text x="870" y="440" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">永住审查信用度下降！</text>

  <rect x="80" y="500" width="1040" height="60" rx="12" fill="#fbbf24"/>
  <text x="600" y="538" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="26" font-weight="bold">搬家后14天内，请务必到市/区政厅申报！</text>


  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
</svg>
