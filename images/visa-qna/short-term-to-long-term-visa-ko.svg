<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="70" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">단기 비자 &gt; 장기 비자 변경?</text>

  <!-- Top half: Red (불가) -->
  <rect x="60" y="100" width="1080" height="200" rx="20" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
  <circle cx="180" cy="200" r="60" fill="#dc2626"/>
  <line x1="138" y1="158" x2="222" y2="242" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <line x1="222" y1="158" x2="138" y2="242" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <text x="660" y="185" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="40" font-weight="bold">관광 비자에서 직접 변경 불가</text>
  <text x="660" y="240" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="30">입관법상 원칙적으로 허용되지 않습니다</text>

  <!-- Bottom half: Green (정규 절차) -->
  <rect x="60" y="330" width="1080" height="200" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
  <circle cx="180" cy="430" r="60" fill="#22c55e"/>
  <path d="M150,430 L170,455 L215,405" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="660" y="410" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="40" font-weight="bold">COE 취득 후 취업비자 발급</text>
  <text x="660" y="465" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="30">회사 합격 &gt; COE &gt; 비자 &gt; 입국</text>

  <!-- Bottom note -->
  <text x="600" y="575" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">정규 절차가 가장 빠르고 안전합니다</text>


  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>