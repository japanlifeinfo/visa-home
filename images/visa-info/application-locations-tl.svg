    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Araw ng trabaho 9:00-16:00</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Matao tuwing tanghali</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Suriin ang peak hours</text>
  </g>

  <!-- Step 4 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="53" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="20" font-weight="bold">📋</text>
