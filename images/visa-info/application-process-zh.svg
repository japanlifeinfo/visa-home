<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="36" font-weight="bold">为首次申请者准备的分步指南</text>

  <!-- Step 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="22" font-weight="bold">1</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">准备材料</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">申请书、护照、证件照</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">活动证明、公司相关材料</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">在职证明等</text>
  </g>


  <!-- Step 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="22" font-weight="bold">2</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">提交申请</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">本人前往或代理申请</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">提交免费</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">确认管辖区域</text>
  </g>


  <!-- Step 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="22" font-weight="bold">3</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">审查期间</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">平均1-3个月</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">追加要求及时回复</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">等待结果通知</text>
  </g>


  <!-- Step 4 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="53" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="22" font-weight="bold">4</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">许可后手续</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">领取在留卡、申请签证(新规)</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">缴纳印花税</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">地址登记</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">关键要点</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">资格与活动一致 | 材料一致性 | 及时回复追加要求</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>