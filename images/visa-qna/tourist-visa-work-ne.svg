    <text x="220" y="55" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">वर्किङ हलिडे</text>
    <text x="355" y="55" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">विद्यार्थी + अनुमति</text>
    <text x="470" y="55" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="12">जीवनसाथी भिसा</text>
