<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">C&#xE1;c v&#x1EE5; vi&#x1EC7;c lao &#x111;&#x1ED9;ng b&#x1EA5;t h&#x1EE3;p ph&#xE1;p</text>

  <!-- Badge 1: Red -->
  <rect x="60" y="130" width="340" height="280" rx="20" fill="#dc2626"/>
  <circle cx="230" cy="200" r="50" fill="white"/>
  <text x="230" y="215" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="50" font-weight="bold">1</text>
  <text x="230" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">Th&#x1EF1;c t&#x1EAD;p sinh b&#x1ECF; tr&#x1ED1;n</text>
  <text x="230" y="335" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="24">Th&#x1EBB; l&#x1B0;u tr&#xFA; gi&#x1EA3;</text>
  <text x="230" y="380" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="24">M&#xF4;i gi&#x1EDB;i b&#x1ECB; b&#x1EAF;t</text>

  <!-- Badge 2: Orange -->
  <rect x="430" y="130" width="340" height="280" rx="20" fill="#ea580c"/>
  <circle cx="600" cy="200" r="50" fill="white"/>
  <text x="600" y="215" text-anchor="middle" fill="#ea580c" font-family="sans-serif" font-size="50" font-weight="bold">2</text>
  <text x="600" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">Sai ng&#xE0;nh ngh&#x1EC1;</text>
  <text x="600" y="335" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="22">Visa n&#xF4;ng nghi&#x1EC7;p l&#xE0;m nh&#xE0; m&#xE1;y</text>
  <text x="600" y="380" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="24">Vi ph&#x1EA1;m lu&#x1EAD;t nh&#x1EAD;p c&#x1B0;</text>

  <!-- Badge 3: Purple -->
  <rect x="800" y="130" width="340" height="280" rx="20" fill="#9333ea"/>
  <circle cx="970" cy="200" r="50" fill="white"/>
  <text x="970" y="215" text-anchor="middle" fill="#9333ea" font-family="sans-serif" font-size="50" font-weight="bold">3</text>
  <text x="970" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="bold">Ch&#x1EE7; s&#x1EED; d&#x1EE5;ng b&#x1ECB; ph&#xE1;t hi&#x1EC7;n</text>
  <text x="970" y="335" text-anchor="middle" fill="#e9d5ff" font-family="sans-serif" font-size="22">Thu&#xEA; lao &#x111;&#x1ED9;ng kh&#xF4;ng t&#x1B0; c&#xE1;ch</text>
  <text x="970" y="380" text-anchor="middle" fill="#e9d5ff" font-family="sans-serif" font-size="24">B&#x1ECB; truy t&#x1ED1; h&#xEC;nh s&#x1EF1;</text>

  <!-- Bottom -->
  <rect x="100" y="460" width="1000" height="80" rx="16" fill="#1e293b"/>
  <text x="600" y="500" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="bold">2024: ~14.000 vi ph&#x1EA1;m lao &#x111;&#x1ED9;ng</text>
  <text x="600" y="530" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="22">C&#x1EA3;nh gi&#xE1;c vi&#x1EC7;c l&#xE0;m "thu nh&#x1EAD;p cao" tr&#xEA;n MXH</text>


  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>