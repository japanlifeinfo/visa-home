<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="34" font-weight="500" letter-spacing="6" opacity="0.8">Required Documents</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="80" font-weight="900">Instructor</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <rect x="65" y="65" width="130" height="90" rx="6" fill="#1d4ed8" opacity="0.3"/>
      <rect x="70" y="70" width="120" height="80" rx="4" fill="#1d4ed8" opacity="0.15"/>
      <line x1="90" y1="95" x2="155" y2="95" stroke="#1d4ed8" stroke-width="3" opacity="0.4"/>
      <line x1="90" y1="110" x2="140" y2="110" stroke="#1d4ed8" stroke-width="3" opacity="0.3"/>
      <line x1="90" y1="125" x2="150" y2="125" stroke="#1d4ed8" stroke-width="3" opacity="0.25"/>
      <rect x="120" y="155" width="20" height="30" rx="2" fill="#1d4ed8" opacity="0.25"/>
      <rect x="108" y="180" width="44" height="8" rx="2" fill="#1d4ed8" opacity="0.25"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#1d4ed8" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">教育</text>
  <text x="955" y="425" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="30" opacity="0.6">Instructor</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#1d4ed8" opacity="0.08" stroke="#1d4ed8" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="23" font-weight="600">G</text>

</svg>