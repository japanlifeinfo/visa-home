<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Skilled Labor</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Required Documents Guide</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(45, 30)">
      <!-- Chef hat -->
      <ellipse cx="65" cy="35" rx="35" ry="20" fill="white" stroke="#374151" stroke-width="2"/>
      <rect x="35" y="35" width="60" height="25" fill="white"/>
      <rect x="35" y="55" width="60" height="10" fill="#374151"/>
      <!-- Wok/Pan -->
      <ellipse cx="65" cy="90" rx="45" ry="15" fill="#1f2937"/>
      <ellipse cx="65" cy="85" rx="40" ry="12" fill="#374151"/>
      <!-- Fire under wok -->
      <path d="M45 105 Q50 95 55 105 Q60 95 65 105 Q70 95 75 105 Q80 95 85 105" stroke="#f97316" stroke-width="3" fill="none"/>
      <!-- Spatula -->
      <rect x="100" y="50" width="8" height="40" rx="2" fill="#92400e"/>
      <rect x="98" y="45" width="12" height="8" rx="2" fill="#6b7280"/>
      <!-- Steam -->
      <path d="M50 75 Q45 65 50 55" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M65 73 Q60 63 65 53" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
      <path d="M80 75 Q75 65 80 55" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.5"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Skilled Worker Status</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#fef3c7"/>
        <text x="12" y="17" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Chef, Construction technician, etc.</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#fef3c7"/>
        <text x="12" y="17" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">10+ years experience required (varies)</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#fef3c7"/>
        <text x="12" y="17" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Period: 5 years, 3 years, 1 year, 3 months</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#fef3c7"/>
        <text x="12" y="17" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">COE, Change, Extension available</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#fef3c7"/>
    <text x="400" y="320" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="18" font-weight="bold">技能</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
