<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Specified Skilled Worker (i)</text>
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Required Documents Guide</text>
  <g transform="translate(200, 190)">
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Worker with tools Icon -->
    <g transform="translate(60, 70)">
      <!-- Worker figure -->
      <circle cx="80" cy="40" r="25" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
      <rect x="55" y="70" width="50" height="60" rx="8" fill="#3b82f6"/>
      <!-- Hard hat -->
      <rect x="55" y="20" width="50" height="12" rx="4" fill="#3b82f6"/>
      <rect x="50" y="28" width="60" height="6" fill="#3b82f6"/>
      <!-- Wrench -->
      <g transform="translate(110, 70) rotate(45)">
        <rect x="0" y="0" width="12" height="50" rx="2" fill="#60a5fa"/>
        <circle cx="6" cy="5" r="8" fill="none" stroke="#60a5fa" stroke-width="4"/>
      </g>
      <!-- Badge with "1" -->
      <circle cx="130" cy="130" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
      <text x="130" y="138" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="24" font-weight="bold">1</text>
    </g>
    <!-- Content Section -->
    <g transform="translate(280, 60)">
      <circle cx="20" cy="20" r="12" fill="#dbeafe"/>
      <text x="45" y="26" fill="#1e293b" font-family="sans-serif" font-size="20">14 designated industries</text>
      <circle cx="20" cy="70" r="12" fill="#dbeafe"/>
      <text x="45" y="76" fill="#1e293b" font-family="sans-serif" font-size="20">Skills test required</text>
      <circle cx="20" cy="120" r="12" fill="#dbeafe"/>
      <text x="45" y="126" fill="#1e293b" font-family="sans-serif" font-size="20">Japanese language N4+</text>
      <circle cx="20" cy="170" r="12" fill="#dbeafe"/>
      <text x="45" y="176" fill="#1e293b" font-family="sans-serif" font-size="20">Up to 5 years stay</text>
    </g>
    <rect x="305" y="290" width="190" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">特定技能1号</text>
  </g>
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>