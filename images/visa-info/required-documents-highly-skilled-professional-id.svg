<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Profesional Berketerampilan Tinggi</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Panduan Dokumen yang Diperlukan</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 35)">
      <!-- Star badge -->
      <polygon points="60,5 70,35 102,40 78,62 84,95 60,80 36,95 42,62 18,40 50,35" fill="#fbbf24"/>
      <polygon points="60,20 67,40 88,43 72,58 76,80 60,70 44,80 48,58 32,43 53,40" fill="#fef3c7"/>
      <!-- Person silhouette -->
      <circle cx="60" cy="40" r="12" fill="#1e3a5f"/>
      <path d="M40 75 Q60 55 80 75 L80 95 L40 95 Z" fill="#1e3a5f"/>
      <!-- Points indicator -->
      <rect x="85" y="75" width="35" height="25" rx="5" fill="#059669"/>
      <text x="102" y="93" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12" font-weight="bold">70+</text>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Visa Sistem Poin Tenaga Ahli</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#fef3c7"/>
        <text x="12" y="17" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Tipe No.1 (i/ro/ha) dan No.2</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#fef3c7"/>
        <text x="12" y="17" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Minimal 70 poin diperlukan</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#fef3c7"/>
        <text x="12" y="17" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Masa tinggal: 5 tahun (dapat diperpanjang)</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#fef3c7"/>
        <text x="12" y="17" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Keuntungan: membawa keluarga, orang tua</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="305" y="290" width="190" height="44" rx="22" fill="#fef3c7"/>
    <text x="400" y="320" text-anchor="middle" fill="#b45309" font-family="sans-serif" font-size="18" font-weight="bold">高度専門職</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
