  <!-- Step 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">🏢</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">全国事务所规模</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">本局8处全国分布</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">支局3处</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">出张所约55处</text>
  </g>

  <!-- Step 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="20" font-weight="bold">📍</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">确认管辖</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">根据居住地确定管辖</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">按都道府县指定事务所</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">可在线查询</text>
  </g>

  <!-- Step 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="20" font-weight="bold">🕐</text>
