<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: warm cream (distinct from prior 3 dark backgrounds: emerald / slate / navy) -->
  <rect width="1200" height="630" fill="#fef7ed"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark kanji (lower right, very faint) -->
  <text x="1140" y="600" text-anchor="end" fill="#9a3412" font-family="serif" font-size="220" font-weight="bold" opacity="0.05">経歴</text>

  <!-- Subtle dotted baseline beneath documents -->
  <line x1="80" y1="568" x2="660" y2="568" stroke="#fb923c" stroke-width="1" opacity="0.4" stroke-dasharray="2 6"/>

  <!-- ===== TOP BANNER: center-aligned kicker + headline + subtitle ===== -->

  <!-- Kicker row -->
  <text x="600" y="68" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">CAREER · 経歴 · 実務経験</text>

  <!-- Headline (two lines, center-aligned) -->
  <text x="600" y="138" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="62" font-weight="bold">What Decides Your Visa</text>
  <text x="600" y="208" text-anchor="middle" fill="#ea580c" font-family="sans-serif" font-size="72" font-weight="bold">Another Weapon: Career</text>

  <!-- Subtitle -->
  <text x="600" y="252" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="19">Work experience matters as much as education — ISA's evidence of job-fit and expertise</text>

  <!-- ===== LEFT-CENTER: Stacked career documents illustration ===== -->

  <!-- Doc 3 (back): 雇用契約書 -->
  <g transform="translate(80, 308) rotate(-9 200 130)">
    <rect x="6" y="8" width="320" height="240" rx="10" fill="#000" opacity="0.18"/>
    <rect width="320" height="240" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="34" rx="10" fill="#fdba74"/>
    <rect x="0" y="22" width="320" height="12" fill="#fdba74"/>
    <text x="20" y="24" fill="#7c2d12" font-family="sans-serif" font-size="13" font-weight="bold">雇用契約書</text>
    <text x="300" y="24" text-anchor="end" fill="#7c2d12" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">CONTRACT</text>

    <line x1="24" y1="64" x2="296" y2="64" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="24" y1="92" x2="240" y2="92" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="24" y1="120" x2="280" y2="120" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="24" y1="148" x2="220" y2="148" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="24" y1="176" x2="270" y2="176" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="24" y1="204" x2="200" y2="204" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <!-- Doc 2 (middle): 在職証明書 -->
  <g transform="translate(150, 298) rotate(-2 200 130)">
    <rect x="6" y="8" width="340" height="250" rx="10" fill="#000" opacity="0.18"/>
    <rect width="340" height="250" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="36" rx="10" fill="#fb923c"/>
    <rect x="0" y="24" width="340" height="12" fill="#fb923c"/>
    <text x="20" y="25" fill="#7c2d12" font-family="sans-serif" font-size="14" font-weight="bold">在職証明書</text>
    <text x="320" y="25" text-anchor="end" fill="#7c2d12" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">EMPLOYMENT</text>

    <!-- Company logo placeholder -->
    <rect x="24" y="56" width="80" height="46" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="64" y="84" text-anchor="middle" fill="#c2410c" font-family="serif" font-size="22" font-weight="bold">株</text>

    <!-- Field rows -->
    <text x="120" y="72" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">期間 / PERIOD</text>
    <text x="120" y="92" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">2018.04 — 2026.06</text>

    <line x1="24" y1="120" x2="316" y2="120" stroke="#e2e8f0" stroke-width="1"/>

    <text x="24" y="142" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">職務 / ROLE</text>
    <text x="24" y="162" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">System Dev · Web Dev</text>

    <line x1="24" y1="184" x2="316" y2="184" stroke="#e2e8f0" stroke-width="1"/>

    <text x="24" y="206" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">業務内容 / DUTIES</text>
    <line x1="24" y1="222" x2="240" y2="222" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Stamp (hanko) bottom-right -->
    <g transform="translate(280, 210)">
      <circle r="22" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <text y="6" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="16" font-weight="bold">人事</text>
    </g>
  </g>

  <!-- Doc 1 (front): 経歴証明書 -->
  <g transform="translate(220, 290) rotate(5 200 130)">
    <rect x="6" y="8" width="360" height="260" rx="10" fill="#000" opacity="0.22"/>
    <rect width="360" height="260" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="0" y="0" width="360" height="40" rx="10" fill="#ea580c"/>
    <rect x="0" y="26" width="360" height="14" fill="#ea580c"/>
    <text x="22" y="27" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">経歴証明書</text>
    <text x="338" y="27" text-anchor="end" fill="#fed7aa" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">CAREER PROOF</text>

    <!-- Header strip with name -->
    <text x="24" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">PROFILE</text>
    <text x="24" y="92" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">8+ Years Experience</text>

    <!-- Timeline (horizontal mini-graph) -->
    <line x1="24" y1="124" x2="336" y2="124" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>
    <line x1="24" y1="124" x2="280" y2="124" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

    <!-- Year marks -->
    <circle cx="24" cy="124" r="5" fill="#ea580c"/>
    <circle cx="108" cy="124" r="5" fill="#ea580c"/>
    <circle cx="192" cy="124" r="5" fill="#ea580c"/>
    <circle cx="280" cy="124" r="5" fill="#ea580c"/>
    <circle cx="336" cy="124" r="5" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>

    <text x="24" y="148" fill="#7c2d12" font-family="monospace" font-size="11" font-weight="bold">'18</text>
    <text x="108" y="148" text-anchor="middle" fill="#7c2d12" font-family="monospace" font-size="11" font-weight="bold">'20</text>
    <text x="192" y="148" text-anchor="middle" fill="#7c2d12" font-family="monospace" font-size="11" font-weight="bold">'22</text>
    <text x="280" y="148" text-anchor="middle" fill="#7c2d12" font-family="monospace" font-size="11" font-weight="bold">'24</text>
    <text x="336" y="148" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">'26</text>

    <!-- Skills checklist -->
    <g transform="translate(24, 172)">
      <rect width="16" height="16" rx="4" fill="#16a34a"/>
      <path d="M 4 8 L 7 11 L 12 5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="13" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="600">System · Web · App Dev</text>
    </g>
    <g transform="translate(24, 198)">
      <rect width="16" height="16" rx="4" fill="#16a34a"/>
      <path d="M 4 8 L 7 11 L 12 5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="13" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="600">Database Design</text>
    </g>
    <g transform="translate(24, 224)">
      <rect width="16" height="16" rx="4" fill="#16a34a"/>
      <path d="M 4 8 L 7 11 L 12 5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="13" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="600">Multiple Real Projects</text>
    </g>

    <!-- Stamp (hanko) -->
    <g transform="translate(308, 218)">
      <circle r="28" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <circle r="22" fill="none" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
      <text y="6" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="14" font-weight="bold">代表印</text>
    </g>
  </g>

  <!-- ===== RIGHT: Vertical info column ===== -->

  <!-- Right column: career value callout -->
  <g transform="translate(700, 308)">
    <!-- Top label -->
    <rect width="60" height="3" fill="#ea580c"/>
    <text x="0" y="30" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="3">EVIDENCE · 証拠</text>
    <text x="0" y="68" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">As Strong as Education /</text>
    <text x="0" y="104" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">Proof of Expertise</text>

    <text x="0" y="142" fill="#64748b" font-family="sans-serif" font-size="14">Not just years of service —</text>
    <text x="0" y="164" fill="#64748b" font-family="sans-serif" font-size="14">evaluated on job-fit</text>

    <!-- Equation-style highlight -->
    <g transform="translate(0, 196)">
      <rect width="440" height="64" rx="12" fill="#0f172a"/>
      <text x="22" y="40" fill="#fed7aa" font-family="sans-serif" font-size="17" font-weight="bold">Job Relevance</text>
      <text x="158" y="42" fill="#fbbf24" font-family="sans-serif" font-size="24" font-weight="bold">&gt;</text>
      <text x="188" y="40" fill="#cbd5e1" font-family="sans-serif" font-size="17" font-weight="bold">Years on Job</text>
    </g>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
</svg>
