<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="40" font-weight="bold">Lao dong co tay nghe</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(45, 35)">
      <!-- Chef hat -->
      <ellipse cx="70" cy="50" rx="35" ry="20" fill="white" stroke="#3b82f6" stroke-width="3"/>
      <rect x="40" y="45" width="60" height="30" fill="white"/>
      <rect x="40" y="70" width="60" height="10" fill="#3b82f6"/>
      <!-- Chef face -->
      <circle cx="70" cy="95" r="18" fill="#fcd34d"/>
      <circle cx="63" cy="92" r="3" fill="#1e293b"/>
      <circle cx="77" cy="92" r="3" fill="#1e293b"/>
      <path d="M63,102 Q70,108 77,102" fill="none" stroke="#1e293b" stroke-width="2"/>
      <!-- Chef body -->
      <rect x="50" y="115" width="40" height="35" rx="4" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <!-- Cooking pan -->
      <ellipse cx="115" cy="100" rx="20" ry="10" fill="#64748b"/>
      <rect x="130" y="95" width="20" height="6" rx="2" fill="#374151"/>
      <!-- Steam -->
      <path d="M105,85 Q108,75 105,65" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M115,85 Q118,75 115,65" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M125,85 Q128,75 125,65" fill="none" stroke="#94a3b8" stroke-width="2"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Ky nang thanh thao dac biet</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Dau bep, xay dung, thu cong</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">10 nam kinh nghiem tro len</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 5 nam, 3 nam, 1 nam, 3 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">9 linh vuc doi tuong</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">技能</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
