<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">प्राविधिक प्रशिक्षु</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">आवश्यक कागजातहरू गाइड</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(40, 25)">
      <!-- Factory/Workshop -->
      <rect x="20" y="50" width="80" height="55" fill="#6b7280"/>
      <rect x="25" y="55" width="15" height="15" fill="#d1d5db"/>
      <rect x="45" y="55" width="15" height="15" fill="#d1d5db"/>
      <rect x="65" y="55" width="15" height="15" fill="#d1d5db"/>
      <rect x="25" y="75" width="15" height="15" fill="#d1d5db"/>
      <rect x="45" y="75" width="15" height="15" fill="#d1d5db"/>
      <rect x="65" y="75" width="15" height="15" fill="#d1d5db"/>
      <rect x="45" y="93" width="30" height="12" fill="#374151"/>
      <!-- Chimney with smoke -->
      <rect x="75" y="35" width="15" height="20" fill="#4b5563"/>
      <ellipse cx="82" cy="28" rx="8" ry="5" fill="#9ca3b8" opacity="0.6"/>
      <ellipse cx="85" cy="20" rx="6" ry="4" fill="#9ca3b8" opacity="0.4"/>
      <!-- Gear/Training symbol -->
      <circle cx="110" cy="70" r="22" fill="#f97316"/>
      <circle cx="110" cy="70" r="12" fill="white"/>
      <rect x="106" y="48" width="8" height="8" fill="#f97316"/>
      <rect x="106" y="84" width="8" height="8" fill="#f97316"/>
      <rect x="88" y="66" width="8" height="8" fill="#f97316"/>
      <rect x="124" y="66" width="8" height="8" fill="#f97316"/>
      <!-- Arrow showing progression 1->2->3 -->
      <text x="35" y="25" fill="#3b82f6" font-family="sans-serif" font-size="14" font-weight="bold">1号</text>
      <text x="60" y="25" fill="#64748b" font-family="sans-serif" font-size="12">&#8594;</text>
      <text x="70" y="25" fill="#8b5cf6" font-family="sans-serif" font-size="14" font-weight="bold">2号</text>
      <text x="95" y="25" fill="#64748b" font-family="sans-serif" font-size="12">&#8594;</text>
      <text x="105" y="25" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">3号</text>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">प्राविधिक प्रशिक्षण भिसा</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#ffedd5"/>
        <text x="12" y="17" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">१ नम्बर (१ वर्ष), २ नम्बर (२ वर्ष), ३ नम्बर (२ वर्ष)</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#ffedd5"/>
        <text x="12" y="17" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">OTIT प्रशिक्षण योजना मान्यता आवश्यक</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#ffedd5"/>
        <text x="12" y="17" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">कम्पनी एकल प्रकार / समूह निरीक्षण प्रकार</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#ffedd5"/>
        <text x="12" y="17" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">मान्यता, परिवर्तन, नवीकरण आवेदन</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="305" y="290" width="190" height="44" rx="22" fill="#ffedd5"/>
    <text x="400" y="320" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="18" font-weight="bold">技能実習</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
