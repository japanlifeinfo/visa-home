<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">Loi Ich Khi Lay Thuong Tru Tu Visa Lao Dong</text>

  <!-- Card 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="55" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="22" font-weight="bold">&#8734;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Luu Tru Khong Gioi Han</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Khong can gia han</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Khong lo het han</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Het ap luc hanh chinh</text>
  </g>

  <!-- Card 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="55" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="22" font-weight="bold">&#9733;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Tu Do Nghe Nghiep</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Khong gioi han nganh nghe</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Tu do, khoi nghiep duoc</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Lam them cung tu do</text>
  </g>

  <!-- Card 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="55" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="22" font-weight="bold">&#9750;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Giam Rui Ro Doi Viec</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Luu tru dua tren ca nhan</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">O lai bat ke cong ty</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Mang luoi an toan manh nhat</text>
  </g>

  <!-- Card 4 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="55" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="22" font-weight="bold">&#9960;</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Uy Tin Tai Chinh</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Tang kha nang duyet vay nha</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Lai suat co loi hon</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">De duyet the tin dung hon</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">Gia tri cot loi cua Thuong Tru</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">Giu quoc tich | O vo thoi han | Tu cach thiet ke cuoc song</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
