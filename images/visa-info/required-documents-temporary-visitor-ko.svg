<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">단기체재</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">제출 서류 안내</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(40, 25)">
      <!-- Suitcase -->
      <rect x="25" y="40" width="70" height="55" rx="8" fill="#0ea5e9"/>
      <rect x="45" y="30" width="30" height="15" rx="5" fill="#0ea5e9"/>
      <rect x="50" y="35" width="20" height="5" fill="#f0f9ff"/>
      <rect x="30" y="55" width="60" height="3" fill="#0369a1"/>
      <rect x="30" y="75" width="60" height="3" fill="#0369a1"/>
      <!-- Handle -->
      <rect x="55" y="22" width="10" height="12" rx="2" fill="#6b7280"/>
      <!-- Airplane -->
      <g transform="translate(75, 5) rotate(15)">
        <ellipse cx="20" cy="15" rx="25" ry="6" fill="#64748b"/>
        <polygon points="5,15 -10,5 -10,10 0,15 -10,20 -10,25" fill="#64748b"/>
        <polygon points="35,15 50,8 50,12 40,15 50,18 50,22" fill="#64748b"/>
        <polygon points="15,15 10,0 20,0 25,15" fill="#475569"/>
      </g>
      <!-- Calendar with short period -->
      <rect x="95" y="60" width="35" height="40" rx="3" fill="white" stroke="#94a3b8" stroke-width="2"/>
      <rect x="95" y="60" width="35" height="12" fill="#ef4444"/>
      <text x="112" y="70" text-anchor="middle" fill="white" font-family="sans-serif" font-size="8" font-weight="bold">90日</text>
      <rect x="100" y="78" width="8" height="8" fill="#d1d5db"/>
      <rect x="112" y="78" width="8" height="8" fill="#d1d5db"/>
      <rect x="100" y="88" width="8" height="8" fill="#d1d5db"/>
      <rect x="112" y="88" width="8" height="8" fill="#94a3b8"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">단기 체재 재류자격</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">관광, 친족 방문, 업무 연락 등</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">재류 기간: 90일, 30일, 15일 이내</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">갱신 원칙적 불가 (특별 사유시 가능)</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#e0f2fe"/>
        <text x="12" y="17" text-anchor="middle" fill="#0ea5e9" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">인정증명서 교부 신청 불가</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="305" y="290" width="190" height="44" rx="22" fill="#e0f2fe"/>
    <text x="400" y="320" text-anchor="middle" fill="#0369a1" font-family="sans-serif" font-size="18" font-weight="bold">短期滞在</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
