<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="36" font-weight="bold">Lao dong ky nang dac dinh 1</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(45, 35)">
      <!-- Worker with helmet -->
      <ellipse cx="70" cy="35" rx="30" ry="15" fill="#3b82f6"/>
      <rect x="45" y="35" width="50" height="10" fill="#2563eb"/>
      <circle cx="70" cy="60" r="18" fill="#fcd34d"/>
      <circle cx="63" cy="57" r="3" fill="#1e293b"/>
      <circle cx="77" cy="57" r="3" fill="#1e293b"/>
      <path d="M63,68 Q70,74 77,68" fill="none" stroke="#1e293b" stroke-width="2"/>
      <!-- Worker body with vest -->
      <rect x="50" y="80" width="40" height="40" rx="4" fill="#3b82f6"/>
      <rect x="55" y="85" width="10" height="30" fill="#fbbf24"/>
      <rect x="75" y="85" width="10" height="30" fill="#fbbf24"/>
      <!-- Number 1 badge -->
      <circle cx="115" cy="60" r="25" fill="#2563eb"/>
      <text x="115" y="70" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">1</text>
      <!-- Tools -->
      <rect x="100" y="100" width="8" height="40" fill="#64748b"/>
      <rect x="96" y="95" width="16" height="10" fill="#374151"/>
      <rect x="115" y="110" width="25" height="8" fill="#64748b"/>
      <rect x="115" y="105" width="8" height="18" fill="#374151"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Kien thuc/Kinh nghiem dang ke</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">16 linh vuc (dieu duong, xay dung...)</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Tong cong trong vong 5 nam</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Gia dinh khong duoc di kem</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Ho so 3 loai (nguoi nop don, to chuc, linh vuc)</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="300" y="290" width="200" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">特定技能1号</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
