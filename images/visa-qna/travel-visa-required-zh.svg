<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="70" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="36" font-weight="bold">去日本旅游需要签证吗？</text>
  <text x="600" y="105" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="20">因国籍而异</text>

  <circle cx="600" cy="290" r="95" fill="white" stroke="#e2e8f0" stroke-width="3"/>
  <text x="600" y="275" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="56" font-weight="bold">90</text>
  <text x="600" y="310" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="20">天以内</text>
  <text x="600" y="340" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">短期滞在最长期限</text>

  <g transform="translate(50, 150)">
    <rect width="420" height="280" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="50" cy="40" r="22" fill="#16a34a"/>
    <text x="50" y="47" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">✓</text>
    <text x="82" y="48" fill="#15803d" font-family="sans-serif" font-size="22" font-weight="bold">免签国家</text>
    <text x="35" y="90" fill="#1e293b" font-family="sans-serif" font-size="17" font-weight="bold">无需签证即可入境</text>
    <text x="35" y="125" fill="#64748b" font-family="sans-serif" font-size="15">• 韩国 · 美国 · 加拿大</text>
    <text x="35" y="150" fill="#64748b" font-family="sans-serif" font-size="15">• 大部分欧盟国家</text>
    <text x="35" y="175" fill="#64748b" font-family="sans-serif" font-size="15">• 澳大利亚 · 新西兰等</text>
    <rect x="35" y="200" width="350" height="50" rx="10" fill="#dcfce7"/>
    <text x="210" y="222" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14">观光 · 探亲 · 短期出差 OK</text>
    <text x="210" y="240" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">绝对不可就业！</text>
  </g>

  <g transform="translate(730, 150)">
    <rect width="420" height="280" rx="20" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <circle cx="50" cy="40" r="22" fill="#dc2626"/>
    <text x="50" y="48" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">!</text>
    <text x="82" y="48" fill="#991b1b" font-family="sans-serif" font-size="22" font-weight="bold">需要签证的国家</text>
    <text x="35" y="90" fill="#1e293b" font-family="sans-serif" font-size="17" font-weight="bold">必须事先办理签证</text>
    <text x="35" y="125" fill="#64748b" font-family="sans-serif" font-size="15">• 部分东南亚国家</text>
    <text x="35" y="150" fill="#64748b" font-family="sans-serif" font-size="15">• 部分非洲国家</text>
    <text x="35" y="175" fill="#64748b" font-family="sans-serif" font-size="15">• 部分中东国家等</text>
    <rect x="35" y="200" width="350" height="50" rx="10" fill="#fee2e2"/>
    <text x="210" y="222" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">请在外务省官方网站</text>
    <text x="210" y="240" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">确认最新对象国名单</text>
  </g>

  <g transform="translate(100, 460)">
    <rect width="1000" height="105" rx="16" fill="#1e293b"/>
    <text x="500" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">⚠ 即使免签也需注意</text>
    <text x="250" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">准备往返机票</text>
    <text x="500" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">住宿 · 行程证明</text>
    <text x="750" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">充足旅行经费</text>
    <text x="500" y="88" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">超过90天 → 需要留学·就业·打工度假等长期在留资格</text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
