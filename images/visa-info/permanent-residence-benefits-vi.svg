<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="50" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">Visa Lao Dong vs Vinh Tru — Thay Doi Gi?</text>
  <text x="600" y="78" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">Nhung loi ich thuc te khi co vinh tru</text>

  <!-- Left column header -->
  <g transform="translate(60, 100)">
    <rect width="520" height="50" rx="10" fill="#64748b"/>
    <text x="260" y="33" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">Visa Lao Dong (Han Che)</text>
  </g>

  <!-- Right column header -->
  <g transform="translate(620, 100)">
    <rect width="520" height="50" rx="10" fill="#16a34a"/>
    <text x="260" y="33" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">Vinh Tru (Tu Do)</text>
  </g>

  <!-- Row 1: Thoi Han Cu Tru -->
  <g transform="translate(60, 160)">
    <rect width="520" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="25" fill="#64748b" font-family="sans-serif" font-size="12">Thoi Han Cu Tru</text>
    <text x="25" y="47" fill="#475569" font-family="sans-serif" font-size="16" font-weight="bold">Phai gia han moi 1~5 nam</text>
  </g>
  <g transform="translate(620, 160)">
    <rect width="520" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="25" y="25" fill="#16a34a" font-family="sans-serif" font-size="12">Thoi Han Cu Tru</text>
    <text x="25" y="47" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="bold">Vo thoi han — khong can gia han</text>
  </g>

  <!-- Row 2: Lua Chon Nghe Nghiep -->
  <g transform="translate(60, 228)">
    <rect width="520" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="25" fill="#64748b" font-family="sans-serif" font-size="12">Lua Chon Nghe Nghiep</text>
    <text x="25" y="47" fill="#475569" font-family="sans-serif" font-size="16" font-weight="bold">Chi nganh duoc phep, han che lam them</text>
  </g>
  <g transform="translate(620, 228)">
    <rect width="520" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="25" y="25" fill="#16a34a" font-family="sans-serif" font-size="12">Lua Chon Nghe Nghiep</text>
    <text x="25" y="47" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="bold">Khong han che nganh, tu do, kinh doanh OK</text>
  </g>

  <!-- Row 3: Doi Viec / That Nghiep -->
  <g transform="translate(60, 296)">
    <rect width="520" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="25" fill="#64748b" font-family="sans-serif" font-size="12">Doi Viec / That Nghiep</text>
    <text x="25" y="47" fill="#475569" font-family="sans-serif" font-size="16" font-weight="bold">Visa theo cong ty, nghi viec co rui ro</text>
  </g>
  <g transform="translate(620, 296)">
    <rect width="520" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="25" y="25" fill="#16a34a" font-family="sans-serif" font-size="12">Doi Viec / That Nghiep</text>
    <text x="25" y="47" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="bold">Theo ca nhan, that nghiep van o duoc</text>
  </g>

  <!-- Row 4: Tai Chinh / Vay -->
  <g transform="translate(60, 364)">
    <rect width="520" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="25" fill="#64748b" font-family="sans-serif" font-size="12">Tai Chinh / Vay</text>
    <text x="25" y="47" fill="#475569" font-family="sans-serif" font-size="16" font-weight="bold">Kho vay mua nha, lai suat bat loi</text>
  </g>
  <g transform="translate(620, 364)">
    <rect width="520" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="25" y="25" fill="#16a34a" font-family="sans-serif" font-size="12">Tai Chinh / Vay</text>
    <text x="25" y="47" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="bold">Vay mua nha duoc, dieu kien tot</text>
  </g>

  <!-- Row 5: Ganh Nang Hanh Chinh -->
  <g transform="translate(60, 432)">
    <rect width="520" height="60" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="25" y="25" fill="#64748b" font-family="sans-serif" font-size="12">Ganh Nang Hanh Chinh</text>
    <text x="25" y="47" fill="#475569" font-family="sans-serif" font-size="16" font-weight="bold">Gia han dinh ky, ap luc chuan bi giay to</text>
  </g>
  <g transform="translate(620, 432)">
    <rect width="520" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="25" y="25" fill="#16a34a" font-family="sans-serif" font-size="12">Ganh Nang Hanh Chinh</text>
    <text x="25" y="47" fill="#15803d" font-family="sans-serif" font-size="16" font-weight="bold">Khong can gia han, khong ap luc hanh chinh</text>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(60, 510)">
    <rect width="1080" height="65" rx="12" fill="#1e293b"/>
    <text x="540" y="28" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">Gia Tri Cot Loi Cua Vinh Tru</text>
    <text x="540" y="52" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15">Giu quoc tich · Cu tru vo thoi han · Tu thiet ke cuoc song cua ban</text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>