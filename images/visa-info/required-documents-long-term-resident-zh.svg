<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="34" font-weight="500" letter-spacing="6" opacity="0.8">提交材料</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="140" font-weight="900">定住者</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <path d="M130 55 L65 110 L75 110 L75 180 L185 180 L185 110 L195 110Z" fill="#92400e" opacity="0.25"/>
      <rect x="110" y="135" width="40" height="45" rx="3" fill="#92400e" opacity="0.35"/>
      <rect x="118" y="143" width="24" height="20" rx="2" fill="#92400e" opacity="0.15"/>
      <circle cx="130" cy="100" r="15" fill="#92400e" opacity="0.2"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#92400e" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">定住者</text>
  <text x="955" y="425" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="30" opacity="0.6">Long-term Resident</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#92400e" opacity="0.08" stroke="#92400e" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="23" font-weight="600">U</text>

  <text x="955" y="598" text-anchor="middle" fill="#d4d4d8" font-family="sans-serif" font-size="26">visa.japanlifeinfo.com</text>
