<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Entertainer</text>
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Required Documents Guide</text>
  <g transform="translate(200, 190)">
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Entertainment Icon (Stage/Spotlight/Star) -->
    <g transform="translate(60, 70)">
      <!-- Stage -->
      <rect x="10" y="130" width="140" height="30" rx="4" fill="#ec4899"/>
      <rect x="20" y="110" width="120" height="25" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
      <!-- Spotlight beams -->
      <polygon points="30,30 50,110 10,110" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1"/>
      <polygon points="130,30 150,110 110,110" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1"/>
      <!-- Star -->
      <polygon points="80,40 88,65 115,65 93,82 102,110 80,92 58,110 67,82 45,65 72,65" fill="#ec4899"/>
      <!-- Microphone -->
      <ellipse cx="80" cy="85" rx="12" ry="18" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
      <line x1="80" y1="103" x2="80" y2="125" stroke="#ec4899" stroke-width="3"/>
      <line x1="70" y1="125" x2="90" y2="125" stroke="#ec4899" stroke-width="3"/>
    </g>
    <!-- Content Section -->
    <g transform="translate(280, 60)">
      <circle cx="20" cy="20" r="12" fill="#fce7f3"/>
      <text x="45" y="26" fill="#1e293b" font-family="sans-serif" font-size="20">Performance artists</text>
      <circle cx="20" cy="70" r="12" fill="#fce7f3"/>
      <text x="45" y="76" fill="#1e293b" font-family="sans-serif" font-size="20">Musicians &amp; singers</text>
      <circle cx="20" cy="120" r="12" fill="#fce7f3"/>
      <text x="45" y="126" fill="#1e293b" font-family="sans-serif" font-size="20">Actors &amp; entertainers</text>
      <circle cx="20" cy="170" r="12" fill="#fce7f3"/>
      <text x="45" y="176" fill="#1e293b" font-family="sans-serif" font-size="20">Sports professionals</text>
    </g>
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#fce7f3"/>
    <text x="400" y="320" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="18" font-weight="bold">興行</text>
  </g>
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>