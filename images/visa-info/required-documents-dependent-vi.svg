<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="34" font-weight="500" letter-spacing="6" opacity="0.8">Hồ sơ cần nộp</text>
    <text x="80" y="300" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="72" font-weight="900">Gia</text>
    <text x="80" y="390" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="72" font-weight="900">đình đi kèm</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <circle cx="110" cy="90" r="28" fill="#e11d48" opacity="0.3"/>
      <ellipse cx="110" cy="150" rx="35" ry="25" fill="#e11d48" opacity="0.25"/>
      <circle cx="160" cy="100" r="22" fill="#e11d48" opacity="0.25"/>
      <ellipse cx="160" cy="148" rx="28" ry="22" fill="#e11d48" opacity="0.2"/>
      <circle cx="85" cy="108" r="16" fill="#e11d48" opacity="0.2"/>
      <ellipse cx="85" cy="148" rx="20" ry="18" fill="#e11d48" opacity="0.15"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#e11d48" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">家族滞在</text>
  <text x="955" y="425" text-anchor="middle" fill="#e11d48" font-family="sans-serif" font-size="30" opacity="0.6">Dependent</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#e11d48" opacity="0.08" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#e11d48" font-family="sans-serif" font-size="23" font-weight="600">R-1</text>

</svg>