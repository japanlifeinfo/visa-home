<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="34" font-weight="500" letter-spacing="6" opacity="0.8">आवश्यक कागजातहरू</text>
    <text x="80" y="300" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="72" font-weight="900">विद्य</text>
    <text x="80" y="390" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="72" font-weight="900">ार्थी</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <rect x="85" y="70" width="75" height="100" rx="5" fill="#2563eb" opacity="0.3"/>
      <rect x="95" y="80" width="55" height="80" rx="3" fill="#2563eb" opacity="0.15"/>
      <line x1="105" y1="100" x2="140" y2="100" stroke="#2563eb" stroke-width="2" opacity="0.35"/>
      <line x1="105" y1="115" x2="135" y2="115" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
      <line x1="105" y1="130" x2="140" y2="130" stroke="#2563eb" stroke-width="2" opacity="0.25"/>
      <rect x="105" y="55" width="65" height="90" rx="5" fill="#2563eb" opacity="0.2"/>
      <rect x="113" y="63" width="50" height="70" rx="3" fill="#2563eb" opacity="0.1"/>
      <line x1="120" y1="80" x2="155" y2="80" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
      <line x1="120" y1="95" x2="148" y2="95" stroke="#2563eb" stroke-width="2" opacity="0.25"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#2563eb" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">留学</text>
  <text x="955" y="425" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="30" opacity="0.6">Student</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#2563eb" opacity="0.08" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#2563eb" font-family="sans-serif" font-size="23" font-weight="600">P</text>

</svg>