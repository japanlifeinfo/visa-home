<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Documentos Necessários</text>
    <text x="80" y="300" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="72" font-weight="900">Trabalhador</text>
    <text x="80" y="390" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="72" font-weight="900">Especifico 2</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <rect x="80" y="65" width="100" height="120" rx="12" fill="#0f766e" opacity="0.25"/>
      <rect x="80" y="65" width="100" height="40" rx="12" fill="#0f766e" opacity="0.35"/>
      <circle cx="130" cy="85" r="10" fill="#0f766e" opacity="0.15"/>
      <text x="130" y="155" text-anchor="middle" fill="#0f766e" font-family="sans-serif" font-size="52" font-weight="900" opacity="0.4">2</text>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#0f766e" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">特定技能2号</text>
  <text x="955" y="425" text-anchor="middle" fill="#0f766e" font-family="sans-serif" font-size="30" opacity="0.6">Specified Skilled Worker (ii)</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#0f766e" opacity="0.08" stroke="#0f766e" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#0f766e" font-family="sans-serif" font-size="23" font-weight="600">V-2</text>

</svg>