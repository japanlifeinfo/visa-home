<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Documentos Necessários</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="80" font-weight="900">Estagiário</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <rect x="85" y="60" width="90" height="120" rx="6" fill="#059669" opacity="0.25"/>
      <rect x="85" y="60" width="90" height="25" rx="6" fill="#059669" opacity="0.35"/>
      <circle cx="130" cy="72" r="6" fill="#059669" opacity="0.15"/>
      <line x1="100" y1="100" x2="160" y2="100" stroke="#059669" stroke-width="2.5" opacity="0.3"/>
      <line x1="100" y1="118" x2="150" y2="118" stroke="#059669" stroke-width="2.5" opacity="0.25"/>
      <line x1="100" y1="136" x2="155" y2="136" stroke="#059669" stroke-width="2.5" opacity="0.25"/>
      <line x1="100" y1="154" x2="140" y2="154" stroke="#059669" stroke-width="2.5" opacity="0.2"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#059669" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">研修</text>
  <text x="955" y="425" text-anchor="middle" fill="#059669" font-family="sans-serif" font-size="30" opacity="0.6">Trainee</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#059669" opacity="0.08" stroke="#059669" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#059669" font-family="sans-serif" font-size="23" font-weight="600">Q</text>

  <text x="955" y="598" text-anchor="middle" fill="#d4d4d8" font-family="sans-serif" font-size="26">visa.japanlifeinfo.com</text>
</svg>