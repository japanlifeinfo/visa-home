<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">재류자격 신규신청, 갱신, 변경 수수료 총정리</text>

  <!-- Card 1: 공식 수수료 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">¥</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">공식 수수료</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">갱신/변경: ¥5,500~¥6,000</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">영주권: ¥10,000</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">온라인 신청 시 할인 적용</text>
  </g>

  <!-- Card 2: 신규 신청 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="18" font-weight="bold">COE</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">신규 재류자격 신청</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">COE 정부 수수료: 없음</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">대행 시: ¥80,000~¥200,000</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">비자 발급 수수료: 국가별 상이</text>
  </g>

  <!-- Card 3: 대행 서비스 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="55" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="22" font-weight="bold">代</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">행정서사 대행 비용</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">신규 신청: ¥44,000~¥220,000</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">변경: ¥80,000~¥187,000</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">갱신: ¥40,000~¥99,000</text>
  </g>

  <!-- Card 4: 기타 비용 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="55" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="22" font-weight="bold">+</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">기타 비용</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">서류 번역/공증료</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">우편/등기 비용</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">증명사진, 초청장 관련 비용</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">2025년 4월 개정 기준</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">온라인 신청 할인 | 직접 신청 시 대행료 불필요 | 수수료 인상 논의 중</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
