<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fef2f2"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="50" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="28" font-weight="bold">Common Reasons for Japan Work Visa Rejection</text>
  <text x="600" y="78" text-anchor="middle" fill="#b91c1c" font-family="sans-serif" font-size="15">Most rejections are caused by poor document preparation</text>

  <!-- Danger card 1 -->
  <g transform="translate(50, 100)">
    <rect width="350" height="150" rx="12" fill="white" stroke="#fca5a5" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#dc2626"/>
    <rect x="48" width="12" height="150" fill="#dc2626"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">1</text>
    <text x="80" y="35" fill="#991b1b" font-family="sans-serif" font-size="16" font-weight="bold">Major / Job Mismatch</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">Most common rejection reason</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">Education/career must relate to job</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">If unexplainable → "simple labor" ruling</text>
    <text x="80" y="132" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">→ #1 rejection cause</text>
  </g>

  <!-- Danger card 2 -->
  <g transform="translate(420, 100)">
    <rect width="350" height="150" rx="12" fill="white" stroke="#fdba74" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#ea580c"/>
    <rect x="48" width="12" height="150" fill="#ea580c"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">2</text>
    <text x="80" y="35" fill="#9a3412" font-family="sans-serif" font-size="16" font-weight="bold">Vague Job Description</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">"Is it professional?" review criteria</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">Abstract expressions are risky</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">Specific job description required</text>
    <text x="80" y="132" fill="#ea580c" font-family="sans-serif" font-size="12" font-weight="bold">→ Job description is key</text>
  </g>

  <!-- Danger card 3 -->
  <g transform="translate(790, 100)">
    <rect width="360" height="150" rx="12" fill="white" stroke="#fde68a" stroke-width="2"/>
    <rect width="60" height="150" rx="12" fill="#d97706"/>
    <rect x="48" width="12" height="150" fill="#d97706"/>
    <text x="30" y="82" text-anchor="middle" fill="white" font-family="sans-serif" font-size="26" font-weight="bold">3</text>
    <text x="80" y="35" fill="#92400e" font-family="sans-serif" font-size="16" font-weight="bold">Company Financial Issues</text>
    <text x="80" y="60" fill="#64748b" font-family="sans-serif" font-size="13">Rejection due to company, not applicant</text>
    <text x="80" y="82" fill="#64748b" font-family="sans-serif" font-size="13">Startups / loss companies = high risk</text>
    <text x="80" y="104" fill="#64748b" font-family="sans-serif" font-size="13">Employment sustainability review</text>
    <text x="80" y="132" fill="#d97706" font-family="sans-serif" font-size="12" font-weight="bold">→ Company stability is also reviewed</text>
  </g>

  <!-- Additional reasons row -->
  <text x="50" y="290" fill="#991b1b" font-family="sans-serif" font-size="15" font-weight="bold">Other Major Rejection Reasons</text>
  <g transform="translate(50, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="25" fill="#dc2626" font-family="sans-serif" font-size="22" font-weight="bold">¥</text>
    <text x="50" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">Low Salary</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">Below Japan average = suspicious</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">Compared to same industry average</text>
  </g>
  <g transform="translate(325, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">!</text>
    <text x="40" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">Missing / Inconsistent Docs</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">Missing translations, contradictions</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">Inconsistent info = trust decline</text>
  </g>
  <g transform="translate(600, 300)">
    <rect width="260" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">X</text>
    <text x="42" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">Stay History Issues</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">Past illegal stay</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">Unpaid taxes, criminal record</text>
  </g>
  <g transform="translate(875, 300)">
    <rect width="275" height="85" rx="8" fill="white" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="27" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="bold">?</text>
    <text x="42" y="27" fill="#334155" font-family="sans-serif" font-size="14" font-weight="bold">Insufficient Career Proof</text>
    <text x="20" y="48" fill="#64748b" font-family="sans-serif" font-size="12">10-year career requirement unmet</text>
    <text x="20" y="68" fill="#64748b" font-family="sans-serif" font-size="12">Academic requirements not met</text>
  </g>

  <!-- Prevention checklist -->
  <g transform="translate(50, 405)">
    <rect width="540" height="155" rx="12" fill="#1e293b"/>
    <text x="270" y="28" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold">Rejection Prevention Checklist</text>
    <line x1="30" y1="42" x2="510" y2="42" stroke="#334155"/>
    <text x="35" y="65" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ Clearly explain major/career-job relevance</text>
    <text x="35" y="87" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ Write specific job descriptions</text>
    <text x="35" y="109" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ Verify info consistency across all documents</text>
    <text x="35" y="131" fill="#e2e8f0" font-family="sans-serif" font-size="13">✓ Confirm salary is at or above industry average</text>
    <text x="35" y="148" fill="#fbbf24" font-family="sans-serif" font-size="12">※ Reapplication possible but same issue = same result</text>
  </g>

  <!-- Rejection consequences box -->
  <g transform="translate(610, 405)">
    <rect width="540" height="155" rx="12" fill="white" stroke="#fecaca" stroke-width="2"/>
    <text x="270" y="28" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="15" font-weight="bold">Rejection Consequences</text>
    <line x1="30" y1="42" x2="510" y2="42" stroke="#fecaca"/>
    <text x="270" y="68" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">Cannot enter (COE denied)</text>
    <text x="270" y="90" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">Change/renewal denied → must leave</text>
    <text x="270" y="112" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="14">Reapplication possible but takes time</text>
    <text x="270" y="140" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="14" font-weight="bold">→ Prepare thoroughly on first try!</text>
  </g>

  <text x="600" y="600" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>