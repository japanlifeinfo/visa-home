<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glassFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="topChamberShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="topChamberClip">
      <path d="M 820 200 L 1020 200 L 920 348 Z"/>
    </clipPath>
    <clipPath id="bottomChamberClip">
      <path d="M 920 360 L 1020 510 L 820 510 Z"/>
    </clipPath>
  </defs>

  <!-- Background: warm peach -->
  <rect width="1200" height="630" fill="#fff7ed"/>
  <!-- Top gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark: "PRAZO" lower-left, very faint -->
  <text x="20" y="615" fill="#ea580c" font-family="sans-serif" font-size="220" font-weight="bold" opacity="0.06" letter-spacing="-4">PRAZO</text>

  <!-- Subtle dotted grid (upper-left) -->
  <g opacity="0.22">
    <circle cx="60" cy="80" r="2" fill="#fdba74"/>
    <circle cx="90" cy="80" r="2" fill="#fdba74"/>
    <circle cx="120" cy="80" r="2" fill="#fdba74"/>
    <circle cx="60" cy="110" r="2" fill="#fdba74"/>
    <circle cx="90" cy="110" r="2" fill="#fdba74"/>
    <circle cx="60" cy="140" r="2" fill="#fdba74"/>
  </g>

  <!-- Decorative accent circles -->
  <circle cx="1130" cy="80" r="40" fill="#fdba74" opacity="0.18"/>
  <circle cx="1090" cy="140" r="20" fill="#14b8a6" opacity="0.18"/>

  <!-- =============================================================== -->
  <!-- LEFT: Kicker + pre-headline + 2-line headline + subtitle + chips -->
  <!-- =============================================================== -->

  <!-- Kicker pill (left-aligned) -->
  <g transform="translate(60, 60)">
    <rect width="320" height="36" rx="18" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="5" fill="#dc2626"/>
    <text x="38" y="24" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="3" textLength="262" lengthAdjust="spacing">DOCS ADICIONAIS - RESPOSTA</text>
  </g>

  <!-- Pre-headline label -->
  <text x="60" y="148" fill="#475569" font-family="sans-serif" font-size="20" font-weight="500" letter-spacing="1">Solicitacao de documentos adicionais</text>

  <!-- Main headline line 1 -->
  <text x="60" y="222" fill="#0f172a" font-family="sans-serif" font-size="60" font-weight="bold">NAO e sinal</text>
  <!-- Main headline line 2 -->
  <text x="60" y="294" font-family="sans-serif" font-size="60" font-weight="bold">
    <tspan fill="#0f172a">de recusa</tspan>
  </text>

  <!-- Thin accent line under headline -->
  <line x1="60" y1="324" x2="220" y2="324" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtitle 2 lines -->
  <text x="60" y="372" fill="#475569" font-family="sans-serif" font-size="21" font-weight="500">Significa que a analise continua em andamento</text>
  <text x="60" y="404" fill="#475569" font-family="sans-serif" font-size="21" font-weight="500">O mais importante e <tspan fill="#ea580c" font-weight="bold">cumprir o prazo</tspan></text>

  <!-- ===== BOTTOM-LEFT CHIP ROW (3 supporting points) ===== -->
  <g transform="translate(60, 470)">
    <!-- Chip 1: No Prazo -->
    <g transform="translate(0, 0)">
      <rect width="200" height="44" rx="22" fill="#0f172a"/>
      <g transform="translate(20, 22)">
        <circle r="9" fill="#fbbf24"/>
        <path d="M -4.5 0 L -1 3.5 L 4.5 -3" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="29" fill="#fef3c7" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="1">No Prazo</text>
    </g>
    <!-- Chip 2: Fatos Reais -->
    <g transform="translate(216, 0)">
      <rect width="200" height="44" rx="22" fill="#0f172a"/>
      <g transform="translate(20, 22)">
        <circle r="9" fill="#5eead4"/>
        <path d="M -4.5 0 L -1 3.5 L 4.5 -3" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="29" fill="#ccfbf1" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="1">Fatos Reais</text>
    </g>
    <!-- Chip 3: Explicacao Clara -->
    <g transform="translate(432, 0)">
      <rect width="220" height="44" rx="22" fill="#0f172a"/>
      <g transform="translate(20, 22)">
        <circle r="9" fill="#c4b5fd"/>
        <path d="M -4.5 0 L -1 3.5 L 4.5 -3" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="29" fill="#ede9fe" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="1">Explicacao Clara</text>
    </g>
  </g>

  <!-- =============================================================== -->
  <!-- RIGHT: BIG HOURGLASS ILLUSTRATION (deadline metaphor) -->
  <!-- Anchored at x=920, vertical center y=355 -->
  <!-- =============================================================== -->

  <!-- Glow halo behind hourglass -->
  <circle cx="920" cy="355" r="240" fill="url(#glow)"/>

  <!-- Hourglass frame: top cap -->
  <rect x="800" y="180" width="240" height="22" rx="4" fill="url(#glassFrame)"/>
  <rect x="794" y="178" width="252" height="6" rx="3" fill="#78350f"/>

  <!-- Hourglass frame: bottom cap -->
  <rect x="800" y="508" width="240" height="22" rx="4" fill="url(#glassFrame)"/>
  <rect x="794" y="528" width="252" height="6" rx="3" fill="#78350f"/>

  <!-- Glass top chamber (triangle pointing down) -->
  <path d="M 820 202 L 1020 202 L 920 354 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" opacity="0.92"/>
  <!-- Top chamber shine -->
  <path d="M 824 206 L 880 206 L 880 264 Z" fill="url(#topChamberShine)" opacity="0.6"/>

  <!-- Sand still in top chamber -->
  <g clip-path="url(#topChamberClip)">
    <path d="M 820 290 L 1020 290 L 920 354 Z" fill="url(#sandGrad)"/>
    <ellipse cx="920" cy="294" rx="80" ry="3" fill="#fef3c7" opacity="0.7"/>
  </g>

  <!-- "?" symbols inside top chamber -->
  <g fill="#94a3b8" font-family="sans-serif" font-weight="bold" opacity="0.75">
    <text x="880" y="245" font-size="28">?</text>
    <text x="930" y="225" font-size="22">?</text>
    <text x="960" y="262" font-size="24">?</text>
  </g>

  <!-- Falling sand stream (middle neck) -->
  <rect x="918" y="350" width="4" height="14" fill="#f59e0b" opacity="0.95"/>
  <!-- Sand particles -->
  <circle cx="920" cy="370" r="2" fill="#d97706"/>
  <circle cx="918" cy="378" r="1.5" fill="#d97706"/>
  <circle cx="922" cy="386" r="2" fill="#d97706"/>
  <circle cx="919" cy="394" r="1.5" fill="#d97706"/>
  <circle cx="921" cy="402" r="2" fill="#d97706"/>

  <!-- Glass bottom chamber (triangle pointing up) -->
  <path d="M 920 360 L 1020 510 L 820 510 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" opacity="0.92"/>
  <!-- Bottom chamber shine -->
  <path d="M 826 506 L 826 460 L 866 506 Z" fill="url(#topChamberShine)" opacity="0.6"/>

  <!-- Sand accumulating in bottom chamber -->
  <g clip-path="url(#bottomChamberClip)">
    <path d="M 820 510 L 1020 510 L 1000 480 Q 920 432 840 480 Z" fill="url(#sandGrad)"/>
    <path d="M 855 478 Q 920 446 985 478" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.6"/>
    <path d="M 905 446 L 920 432 L 935 446 L 925 460 L 915 460 Z" fill="#fbbf24"/>
  </g>

  <!-- "P R A Z O" label ABOVE the hourglass (centered) -->
  <g transform="translate(920, 158)">
    <text x="0" y="0" text-anchor="middle" fill="#ea580c" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="8">P R A Z O</text>
    <line x1="-50" y1="12" x2="50" y2="12" stroke="#ea580c" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Grouped checkmark + "Entrega no Prazo" below hourglass -->
  <g transform="translate(920, 575)">
    <!-- checkmark circle -->
    <g transform="translate(-85, 0)">
      <circle r="16" fill="#14b8a6"/>
      <path d="M -7 0 L -2 5 L 7 -5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- "Entrega no Prazo" text -->
    <text x="-59" y="7" fill="#0f172a" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="1">Entrega no Prazo</text>
  </g>

  <!-- Subtle motion lines around hourglass -->
  <g stroke="#fdba74" stroke-width="2" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M 1080 220 Q 1110 245 1080 270"/>
    <path d="M 1100 350 Q 1130 355 1100 380"/>
    <path d="M 1080 460 Q 1110 480 1080 500"/>
  </g>
</svg>
