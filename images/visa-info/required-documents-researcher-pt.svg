<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Pesquisa</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Guia de Documentos Necessarios</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 30)">
      <!-- Microscope -->
      <rect x="55" y="85" width="30" height="15" rx="3" fill="#374151"/>
      <rect x="40" y="95" width="60" height="8" rx="2" fill="#1f2937"/>
      <!-- Eyepiece -->
      <rect x="60" y="10" width="20" height="25" rx="3" fill="#4b5563"/>
      <ellipse cx="70" cy="10" rx="8" ry="4" fill="#6b7280"/>
      <!-- Body tube -->
      <rect x="65" y="35" width="10" height="30" fill="#6b7280"/>
      <!-- Arm -->
      <path d="M60 50 L50 70 L50 85 L90 85 L90 70 L80 50" fill="#9ca3af"/>
      <!-- Objective lenses -->
      <rect x="55" y="65" width="30" height="10" rx="2" fill="#3b82f6"/>
      <rect x="58" y="72" width="6" height="12" fill="#1d4ed8"/>
      <rect x="67" y="72" width="6" height="15" fill="#1d4ed8"/>
      <rect x="76" y="72" width="6" height="10" fill="#1d4ed8"/>
      <!-- Stage -->
      <rect x="45" y="85" width="50" height="6" fill="#374151"/>
      <!-- Test tube -->
      <rect x="100" y="40" width="20" height="55" rx="10" fill="#a5f3fc" stroke="#06b6d4" stroke-width="2"/>
      <ellipse cx="110" cy="45" rx="8" ry="3" fill="#06b6d4"/>
      <rect x="102" y="60" width="16" height="25" fill="#22d3ee" opacity="0.7"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Visto de Atividades de Pesquisa</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#cffafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="14">&#x2713;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Pesquisa em instituicoes publicas/privadas</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#cffafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="14">&#x2713;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">P&amp;D empresarial, pesquisadores de laboratorio</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#cffafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="14">&#x2713;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Periodo: 5 anos, 3 anos, 1 ano, 3 meses</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#cffafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="14">&#x2713;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Pedido de certificado, mudanca, renovacao</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#cffafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#0891b2" font-family="sans-serif" font-size="18" font-weight="bold">研究</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
