<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="90" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">Immigration Bureau</text>
  <text x="600" y="145" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">Application Locations by Residence</text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="24">Addresses and phone numbers of offices for all 47 prefectures</text>

  <!-- Region Cards -->
  <!-- Card 1 -->
  <g transform="translate(60, 250)">
    <rect width="250" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="35" cy="50" r="20" fill="#dbeafe"/>
    <text x="35" y="56" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14" font-weight="bold">北</text>
    <text x="145" y="42" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">Sapporo · Sendai</text>
    <text x="145" y="68" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Hokkaido · Tohoku area</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(340, 250)">
    <rect width="250" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="35" cy="50" r="20" fill="#dcfce7"/>
    <text x="35" y="56" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14" font-weight="bold">関</text>
    <text x="145" y="42" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">Tokyo · Yokohama</text>
    <text x="145" y="68" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Kanto · Koshinetsu area</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(620, 250)">
    <rect width="250" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="35" cy="50" r="20" fill="#fef3c7"/>
    <text x="35" y="56" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="14" font-weight="bold">中</text>
    <text x="145" y="42" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">Nagoya · Osaka</text>
    <text x="145" y="68" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Chubu · Kinki area</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(900, 250)">
    <rect width="250" height="100" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="35" cy="50" r="20" fill="#fce7f3"/>
    <text x="35" y="56" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="14" font-weight="bold">西</text>
    <text x="145" y="42" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">Hiroshima · Fukuoka</text>
    <text x="145" y="68" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Chugoku · Shikoku · Kyushu area</text>
  </g>

  <!-- Info Box -->
  <g transform="translate(200, 400)">
    <rect width="800" height="110" rx="12" fill="#1e293b"/>
    <text x="400" y="35" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Nationwide Immigration Bureau Guide</text>
    <text x="400" y="65" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">8 Main Offices | 3 Branch Bureaus | About 55 Branch Offices</text>
    <text x="400" y="92" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Check the office with jurisdiction over your place of residence</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients and markers -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
