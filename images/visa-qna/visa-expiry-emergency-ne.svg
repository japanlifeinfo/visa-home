<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fef2f2"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="44" font-weight="bold">भिसा म्याद आपतकालीन गाइड</text>

  <!-- Clock icon (left-aligned) -->
  <circle cx="175" cy="220" r="90" fill="white" stroke="#dc2626" stroke-width="5"/>
  <circle cx="175" cy="220" r="75" fill="none" stroke="#fca5a5" stroke-width="3"/>
  <line x1="175" y1="220" x2="175" y2="165" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <line x1="175" y1="220" x2="215" y2="240" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="175" y="345" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="24" font-weight="bold">D-DAY</text>

  <!-- Right side: 3 key actions (wider) -->
  <rect x="310" y="120" width="790" height="70" rx="12" fill="#dc2626"/>
  <text x="705" y="165" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">म्याद अघि: तुरुन्तै नवीकरण पेश</text>

  <rect x="310" y="205" width="790" height="70" rx="12" fill="#ea580c"/>
  <text x="705" y="250" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">म्याद दिन: अनलाइन वा सिधै जाने</text>

  <rect x="310" y="290" width="790" height="70" rx="12" fill="#d97706"/>
  <text x="705" y="335" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">म्याद पछि: तुरुन्तै स्वेच्छा उपस्थित</text>

  <!-- Bottom warning bar -->
  <rect x="100" y="420" width="1000" height="100" rx="16" fill="#1e293b"/>
  <text x="600" y="465" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="36" font-weight="bold">१ दिन बढी = अवैध बसोबास · निष्कासन</text>
  <text x="600" y="505" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="28">म्याद सकिनुभन्दा ३ महिना अघि तयारी गर्नुहोस्</text>

  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>