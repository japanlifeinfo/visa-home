<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="70" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">Preciso de Visto para o Japao?</text>
  <text x="600" y="105" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="20">Depende da sua nacionalidade</text>

  <circle cx="600" cy="290" r="95" fill="white" stroke="#e2e8f0" stroke-width="3"/>
  <text x="600" y="275" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="56" font-weight="bold">90</text>
  <text x="600" y="310" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="20">dias max</text>
  <text x="600" y="340" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Limite de estadia curta</text>

  <g transform="translate(50, 150)">
    <rect width="420" height="280" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="50" cy="40" r="22" fill="#16a34a"/>
    <text x="50" y="47" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">✓</text>
    <text x="82" y="48" fill="#15803d" font-family="sans-serif" font-size="22" font-weight="bold">Paises Isentos de Visto</text>
    <text x="35" y="90" fill="#1e293b" font-family="sans-serif" font-size="17" font-weight="bold">Sem necessidade de visto</text>
    <text x="35" y="125" fill="#64748b" font-family="sans-serif" font-size="15">• Coreia do Sul · EUA · Canada</text>
    <text x="35" y="150" fill="#64748b" font-family="sans-serif" font-size="15">• Maioria dos paises da UE</text>
    <text x="35" y="175" fill="#64748b" font-family="sans-serif" font-size="15">• Australia · Nova Zelandia, etc.</text>
    <rect x="35" y="200" width="350" height="50" rx="10" fill="#dcfce7"/>
    <text x="210" y="222" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14">Turismo · Visita · Negocios curto OK</text>
    <text x="210" y="240" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">Trabalho estritamente proibido!</text>
  </g>

  <g transform="translate(730, 150)">
    <rect width="420" height="280" rx="20" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <circle cx="50" cy="40" r="22" fill="#dc2626"/>
    <text x="50" y="48" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">!</text>
    <text x="82" y="48" fill="#991b1b" font-family="sans-serif" font-size="22" font-weight="bold">Paises com Visto</text>
    <text x="35" y="90" fill="#1e293b" font-family="sans-serif" font-size="17" font-weight="bold">Visto obrigatorio previamente</text>
    <text x="35" y="125" fill="#64748b" font-family="sans-serif" font-size="15">• Alguns paises do Sudeste Asiatico</text>
    <text x="35" y="150" fill="#64748b" font-family="sans-serif" font-size="15">• Alguns paises africanos</text>
    <text x="35" y="175" fill="#64748b" font-family="sans-serif" font-size="15">• Alguns do Oriente Medio, etc.</text>
    <rect x="35" y="200" width="350" height="50" rx="10" fill="#fee2e2"/>
    <text x="210" y="222" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">Verifique no site do Ministerio</text>
    <text x="210" y="240" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">a lista atualizada de paises</text>
  </g>

  <g transform="translate(100, 460)">
    <rect width="1000" height="105" rx="16" fill="#1e293b"/>
    <text x="500" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">⚠ Mesmo isento de visto, atencao</text>
    <text x="250" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">Passagem ida e volta pronta</text>
    <text x="500" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">Hospedagem · Itinerario</text>
    <text x="750" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">Fundos de viagem suficientes</text>
    <text x="500" y="88" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Mais de 90 dias → Precisa de visto de estudante, trabalho ou Working Holiday</text>
  </g>

  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
