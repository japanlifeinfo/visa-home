<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: warm cream -->
  <rect width="1200" height="630" fill="#fef9e7"/>
  <!-- Top gradient bar: amber → orange → red (seal/judgement warmth) -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Top-left: Kicker pill -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="175" height="36" rx="18" fill="#1e293b"/>
    <circle cx="20" cy="18" r="4.5" fill="#fbbf24"/>
    <text x="36" y="24" fill="#fef3c7" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">Q&amp;A · 担保人</text>
  </g>

  <!-- Headline (left-aligned, 2 lines) -->
  <text x="80" y="155" fill="#1f2937" font-family="sans-serif" font-size="62" font-weight="bold">签证申请</text>
  <text x="80" y="225" fill="#1f2937" font-family="sans-serif" font-size="62" font-weight="bold">需要担保人吗？</text>

  <!-- Subtitle -->
  <text x="80" y="270" fill="#78716c" font-family="sans-serif" font-size="22">因在留资格而异</text>

  <!-- ===== Giant Stamp (upper right, symbolic) ===== -->

  <g transform="translate(1020 195) rotate(-15)">
    <!-- Soft ink halo -->
    <circle cx="0" cy="0" r="118" fill="#dc2626" opacity="0.06"/>
    <!-- Outer thick stamp ring -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="#dc2626" stroke-width="10"/>
    <!-- Inner thin ring -->
    <circle cx="0" cy="0" r="93" fill="none" stroke="#dc2626" stroke-width="2.5" opacity="0.75"/>
    <!-- Center stacked characters: 保 / 证 -->
    <text x="0" y="-12" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="70" font-weight="bold">保</text>
    <text x="0" y="62" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="70" font-weight="bold">证</text>
  </g>

  <!-- ===== 身份担保书 document (lower-left shift, tilted -15°, 1.5x size, clear of upper-left text block) ===== -->
  <g transform="translate(560 395) rotate(-15)">
    <!-- Drop shadow -->
    <rect x="-282" y="-158" width="570" height="322" rx="9" fill="#000000" opacity="0.18"/>
    <!-- Paper -->
    <rect x="-285" y="-161" width="570" height="322" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Title band -->
    <rect x="-285" y="-161" width="570" height="78" rx="9" fill="#fef3c7"/>
    <rect x="-285" y="-86" width="570" height="3" fill="#f59e0b"/>
    <!-- Title text -->
    <text x="0" y="-108" text-anchor="middle" fill="#92400e" font-family="serif" font-size="42" font-weight="bold" letter-spacing="12">身份担保书</text>

    <!-- Field 1: 担保人姓名 -->
    <text x="-247" y="-45" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="0.75">担保人姓名</text>
    <rect x="-247" y="-33" width="292" height="12" rx="3" fill="#e2e8f0"/>

    <!-- Field 2: 地址 -->
    <text x="-247" y="6" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="0.75">地址</text>
    <rect x="-247" y="18" width="435" height="12" rx="3" fill="#e2e8f0"/>

    <!-- Field 3: 职业 / 收入 -->
    <text x="-247" y="57" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="0.75">职业 / 收入</text>
    <rect x="-247" y="69" width="345" height="12" rx="3" fill="#e2e8f0"/>

    <!-- Field 4: 签名 -->
    <text x="-247" y="108" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="0.75">签名</text>
    <line x1="-247" y1="135" x2="-30" y2="135" stroke="#cbd5e1" stroke-width="2"/>

    <!-- 盖章 area (dashed box, right side) -->
    <rect x="97" y="-37" width="172" height="172" rx="6" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="9 7.5"/>
    <text x="183" y="57" text-anchor="middle" fill="#a16207" font-family="sans-serif" font-size="20" font-weight="bold" letter-spacing="6">盖章</text>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
</svg>
