      <!-- Worker figure -->
      <circle cx="80" cy="40" r="25" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
      <rect x="55" y="70" width="50" height="60" rx="8" fill="#6366f1"/>
      <!-- Star badge for advanced -->
      <polygon points="80,5 84,18 98,18 87,27 91,40 80,32 69,40 73,27 62,18 76,18" fill="#6366f1"/>
      <!-- Gear/Cog for expertise -->
      <g transform="translate(110, 80)">
        <circle cx="25" cy="25" r="18" fill="none" stroke="#818cf8" stroke-width="4"/>
        <circle cx="25" cy="25" r="8" fill="#6366f1"/>
        <rect x="22" y="0" width="6" height="12" fill="#818cf8"/>
        <rect x="22" y="38" width="6" height="12" fill="#818cf8"/>
        <rect x="0" y="22" width="12" height="6" fill="#818cf8"/>
        <rect x="38" y="22" width="12" height="6" fill="#818cf8"/>
      </g>
      <!-- Badge with "2" -->
