<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="30" font-weight="bold">COE (बसोबास योग्यता प्रमाणपत्र) प्रक्रिया</text>

  <!-- Card 1: तयारी -->
  <g transform="translate(80, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#3b82f6"/><rect y="45" width="330" height="15" fill="#3b82f6"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">①② तयारी</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">रोजगार सम्झौता हस्ताक्षर</text>
    <text x="165" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">↓</text>
    <text x="165" y="158" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">कम्पनीले आवेदन दिन्छ</text>
    <rect x="40" y="180" width="250" height="32" rx="16" fill="#dbeafe"/>
    <text x="165" y="201" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="14" font-weight="bold">सामान्यतया कम्पनीले गर्छ</text>
    <text x="165" y="240" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">COE फारम · रोजगार सम्झौता</text>
    <text x="165" y="262" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">कम्पनी दर्ता · वित्तीय विवरण</text>
    <text x="165" y="284" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">कार्य विवरण · स्नातक प्रमाणपत्र</text>
  </g>

  <text x="422" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="28">→</text>

  <!-- Card 2: जाँच -->
  <g transform="translate(435, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#f59e0b"/><rect y="45" width="330" height="15" fill="#f59e0b"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">③④ जाँच · जारी</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">१~३ महिना</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">व्यस्त समय: ३~४+ महिना</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#fef3c7"/>
    <text x="165" y="192" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="15" font-weight="bold">सबैभन्दा महत्त्वपूर्ण ढोका</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">विषय-कार्य सान्दर्भिकता जाँच</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">कम्पनी वित्तीय स्थिति जाँच</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">थप कागजात = थप ढिलो</text>
  </g>

  <text x="777" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="28">→</text>

  <!-- Card 3: प्रवेश -->
  <g transform="translate(790, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#10b981"/><rect y="45" width="330" height="15" fill="#10b981"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">⑤⑥ भिसा · प्रवेश</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">दूतावासमा भिसा आवेदन</text>
    <text x="165" y="138" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">जारी: ३~७ दिन</text>
    <text x="165" y="163" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">↓</text>
    <text x="165" y="188" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">जापान प्रवेश · कार्ड प्राप्त</text>
    <rect x="65" y="210" width="200" height="32" rx="16" fill="#d1fae5"/>
    <text x="165" y="231" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="14" font-weight="bold">औपचारिक काम सुरु!</text>
    <text x="165" y="270" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">दूतावास अधिकार क्षेत्र जाँच</text>
    <text x="165" y="292" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">कुल: लगभग १.५~४ महिना</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 450)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">मुख्य बुँदा</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">जागिर पाउनु अन्त्य होइन — COE जाँच सबैभन्दा महत्त्वपूर्ण ढोका हो</text>
  </g>
  <text x="600" y="575" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
