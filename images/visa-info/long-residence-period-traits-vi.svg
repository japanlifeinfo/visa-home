<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Decorative background shapes -->
  <circle cx="80" cy="540" r="140" fill="#ecfdf5" opacity="0.6"/>
  <circle cx="1130" cy="100" r="90" fill="#dbeafe" opacity="0.5"/>
  <circle cx="1050" cy="560" r="60" fill="#fef3c7" opacity="0.5"/>

  <!-- Left: Headline -->
  <text x="60" y="150" fill="#0f766e" font-family="sans-serif" font-size="26" font-weight="600">Nguoi nhan visa 3 nam hoac 5 nam</text>
  <text x="60" y="232" fill="#0f172a" font-family="sans-serif" font-size="60" font-weight="bold">Dac diem cua</text>
  <text x="60" y="304" fill="#0f172a" font-family="sans-serif" font-size="60" font-weight="bold">nguoi co visa</text>
  <text x="60" y="376" fill="#0f172a" font-family="sans-serif" font-size="60" font-weight="bold">dai han o Nhat</text>

  <text x="60" y="438" fill="#475569" font-family="sans-serif" font-size="22">Cac chi so on dinh cu tru ma</text>
  <text x="60" y="468" fill="#475569" font-family="sans-serif" font-size="22">Cuc Quan ly Xuat nhap canh danh gia.</text>

  <!-- Bottom-left callout -->
  <rect x="60" y="510" width="520" height="60" rx="14" fill="#0f172a"/>
  <text x="84" y="548" fill="#34d399" font-family="sans-serif" font-size="19" font-weight="bold" textLength="472" lengthAdjust="spacingAndGlyphs">Thue · Luong huu · Bao hiem · Viec lam · Cu tru</text>

  <!-- Right: Visa stamp card with checklist -->
  <g transform="translate(720, 110)">
    <rect x="6" y="10" width="420" height="420" rx="24" fill="#0f172a" opacity="0.08"/>
    <rect x="0" y="0" width="420" height="420" rx="24" fill="white" stroke="#10b981" stroke-width="3"/>

    <path d="M 0 24 Q 0 0 24 0 L 396 0 Q 420 0 420 24 L 420 76 L 0 76 Z" fill="#10b981"/>
    <text x="32" y="50" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">JAPAN VISA</text>
    <text x="388" y="50" text-anchor="end" fill="white" font-family="sans-serif" font-size="22" font-weight="600">在留期間</text>

    <text x="210" y="160" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="32" font-weight="600">3年 · 5年</text>

    <g transform="translate(330, 140) rotate(-12)">
      <circle cx="0" cy="0" r="44" fill="none" stroke="#dc2626" stroke-width="3" opacity="0.85"/>
      <circle cx="0" cy="0" r="36" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.85"/>
      <text x="0" y="-4" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="14" font-weight="bold" opacity="0.9">APPROVED</text>
      <text x="0" y="14" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold" opacity="0.9">許可</text>
    </g>

    <g transform="translate(36, 200)">
      <circle cx="14" cy="14" r="14" fill="#10b981"/>
      <path d="M 8 14 L 13 19 L 21 9" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="42" y="20" fill="#0f172a" font-family="sans-serif" font-size="20" font-weight="600">Da nop du thue</text>

      <circle cx="14" cy="54" r="14" fill="#10b981"/>
      <path d="M 8 54 L 13 59 L 21 49" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="42" y="60" fill="#0f172a" font-family="sans-serif" font-size="20" font-weight="600">Luong huu day du</text>

      <circle cx="14" cy="94" r="14" fill="#10b981"/>
      <path d="M 8 94 L 13 99 L 21 89" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="42" y="100" fill="#0f172a" font-family="sans-serif" font-size="20" font-weight="600">Bao hiem y te</text>

      <circle cx="14" cy="134" r="14" fill="#10b981"/>
      <path d="M 8 134 L 13 139 L 21 129" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="42" y="140" fill="#0f172a" font-family="sans-serif" font-size="20" font-weight="600">Cong viec on dinh</text>

      <circle cx="14" cy="174" r="14" fill="#10b981"/>
      <path d="M 8 174 L 13 179 L 21 169" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="42" y="180" fill="#0f172a" font-family="sans-serif" font-size="20" font-weight="600">Cu tru dai han</text>
    </g>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
