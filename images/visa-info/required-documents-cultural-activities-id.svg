<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Kegiatan Budaya</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Panduan Dokumen yang Diperlukan</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(40, 25)">
      <!-- Tea ceremony set -->
      <ellipse cx="55" cy="95" rx="40" ry="12" fill="#92400e"/>
      <!-- Tea bowl (chawan) -->
      <ellipse cx="55" cy="80" rx="22" ry="8" fill="#16a34a"/>
      <path d="M33 80 Q33 95 55 95 Q77 95 77 80" fill="#15803d"/>
      <!-- Whisk (chasen) -->
      <rect x="80" y="55" width="8" height="30" fill="#d4a574"/>
      <ellipse cx="84" cy="52" rx="8" ry="5" fill="#d4a574"/>
      <line x1="78" y1="50" x2="78" y2="40" stroke="#d4a574" stroke-width="1"/>
      <line x1="80" y1="50" x2="80" y2="38" stroke="#d4a574" stroke-width="1"/>
      <line x1="82" y1="50" x2="82" y2="40" stroke="#d4a574" stroke-width="1"/>
      <line x1="84" y1="50" x2="84" y2="38" stroke="#d4a574" stroke-width="1"/>
      <line x1="86" y1="50" x2="86" y2="40" stroke="#d4a574" stroke-width="1"/>
      <line x1="88" y1="50" x2="88" y2="38" stroke="#d4a574" stroke-width="1"/>
      <line x1="90" y1="50" x2="90" y2="40" stroke="#d4a574" stroke-width="1"/>
      <!-- Flower arrangement (ikebana) -->
      <rect x="100" y="70" width="25" height="35" rx="3" fill="#374151"/>
      <line x1="112" y1="70" x2="112" y2="40" stroke="#22c55e" stroke-width="3"/>
      <circle cx="112" cy="35" r="8" fill="#f472b6"/>
      <line x1="105" y1="70" x2="95" y2="50" stroke="#22c55e" stroke-width="2"/>
      <ellipse cx="93" cy="47" rx="5" ry="8" fill="#fbbf24"/>
      <line x1="118" y1="70" x2="125" y2="55" stroke="#22c55e" stroke-width="2"/>
      <circle cx="127" cy="50" r="6" fill="#a855f7"/>
      <!-- Calligraphy brush -->
      <rect x="20" y="20" width="6" height="50" fill="#92400e"/>
      <polygon points="23,70 18,85 28,85" fill="#1f2937"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Status Tinggal Kegiatan Budaya/Seni</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Upacara teh, ikebana, kaligrafi, bela diri, dll.</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Kegiatan tanpa pendapatan</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Masa tinggal: 3 tahun, 1 tahun, 6 bulan, 3 bulan</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Pengakuan/perubahan/perpanjangan tersedia</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="305" y="290" width="190" height="44" rx="22" fill="#dcfce7"/>
    <text x="400" y="320" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="18" font-weight="bold">文化活動</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
