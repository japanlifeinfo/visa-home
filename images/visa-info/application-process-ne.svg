<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="90" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="32" font-weight="bold">जापानी बसोबास स्थिति आवेदन</text>
  <text x="600" y="145" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="32" font-weight="bold">प्रक्रियाको पूर्ण गाइड</text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="22">पहिलो पटक आवेदन दिनेहरूको लागि चरणबद्ध गाइड</text>

  <!-- Process Steps -->
  <!-- Step 1 -->
  <g transform="translate(100, 260)">
    <rect width="220" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="40" cy="40" r="25" fill="#dbeafe"/>
    <text x="40" y="48" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">1</text>
    <text x="120" y="45" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">कागजात तयारी</text>
    <text x="110" y="80" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Application form</text>
    <text x="110" y="100" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Passport, Photos</text>
    <text x="110" y="120" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Company docs</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M330 330 L370 330" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->
  <g transform="translate(380, 260)">
    <rect width="220" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="40" cy="40" r="25" fill="#dcfce7"/>
    <text x="40" y="48" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="20" font-weight="bold">2</text>
    <text x="120" y="45" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">आवेदन पेश</text>
    <text x="110" y="80" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Immigration Bureau</text>
    <text x="110" y="100" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Or via proxy</text>
    <text x="110" y="120" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">No submission fee</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M610 330 L650 330" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->
  <g transform="translate(660, 260)">
    <rect width="220" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="40" cy="40" r="25" fill="#fef3c7"/>
    <text x="40" y="48" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="20" font-weight="bold">3</text>
    <text x="120" y="45" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">समीक्षा अवधि</text>
    <text x="110" y="80" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Average 1-3 months</text>
    <text x="110" y="100" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Additional docs</text>
    <text x="110" y="120" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">may be requested</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M890 330 L930 330" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Step 4 -->
  <g transform="translate(940, 260)">
    <rect width="220" height="140" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="40" cy="40" r="25" fill="#fce7f3"/>
    <text x="40" y="48" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="20" font-weight="bold">4</text>
    <text x="120" y="45" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">स्वीकृति पछि</text>
    <text x="110" y="80" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Residence card</text>
    <text x="110" y="100" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Visa (new entry)</text>
    <text x="110" y="120" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Stamp fee payment</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(300, 440)">
    <rect width="600" height="80" rx="12" fill="#1e293b"/>
    <text x="300" y="35" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">मुख्य बुँदाहरू</text>
    <text x="300" y="60" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13" font-weight="bold">Status match | Document consistency | Quick response</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients and markers -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
