<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="32" font-weight="bold">Address at telepono ng mga opisina para sa 47 prefecture</text>

  <!-- Step 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">🏢</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Network ng Opisina</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">8 pangunahing opisina</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">3 sangay</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Mga 55 branch offices</text>
  </g>

  <!-- Step 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="20" font-weight="bold">📍</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Alamin ang Saklaw</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Batay sa lugar ng tirahan</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Itinalagang opisina bawat prefecture</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Tingnan online</text>
  </g>

  <!-- Step 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="20" font-weight="bold">🕐</text>
