<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Dokumen yang Diperlukan</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="120" font-weight="900">Seniman</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <ellipse cx="130" cy="120" rx="100" ry="85" fill="#9333ea" opacity="0.35"/>
      <ellipse cx="130" cy="120" rx="82" ry="68" fill="#9333ea" opacity="0.2"/>
      <ellipse cx="100" cy="140" rx="18" ry="16" fill="#9333ea" opacity="0.5"/>
      <circle cx="90" cy="90" r="16" fill="#ef4444" opacity="0.7"/>
      <circle cx="135" cy="75" r="13" fill="#fbbf24" opacity="0.7"/>
      <circle cx="172" cy="95" r="14" fill="#22c55e" opacity="0.7"/>
      <circle cx="162" cy="142" r="13" fill="#3b82f6" opacity="0.7"/>
      <circle cx="125" cy="160" r="12" fill="#a855f7" opacity="0.7"/>
      <rect x="185" y="45" width="11" height="70" rx="3" fill="#92400e" opacity="0.5" transform="rotate(28 185 45)"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#9333ea" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">芸術</text>
  <text x="955" y="425" text-anchor="middle" fill="#9333ea" font-family="sans-serif" font-size="30" opacity="0.6">Artist</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#9333ea" opacity="0.08" stroke="#9333ea" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#9333ea" font-family="sans-serif" font-size="23" font-weight="600">A-2</text>

</svg>