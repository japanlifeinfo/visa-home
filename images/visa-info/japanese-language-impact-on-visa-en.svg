<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: deep indigo -->
  <rect width="1200" height="630" fill="#1e1b4b"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background subtle hiragana watermark -->
  <text x="40" y="180" fill="#a78bfa" font-family="serif" font-size="120" font-weight="bold" opacity="0.06">あいうえお</text>

  <!-- Background subtle dotted column -->
  <g opacity="0.18">
    <circle cx="1130" cy="556" r="2.5" fill="#fbbf24"/>
    <circle cx="1110" cy="556" r="2.5" fill="#fbbf24"/>
    <circle cx="1090" cy="556" r="2.5" fill="#fbbf24"/>
    <circle cx="1130" cy="576" r="2.5" fill="#fbbf24"/>
    <circle cx="1110" cy="576" r="2.5" fill="#fbbf24"/>
    <circle cx="1130" cy="596" r="2.5" fill="#fbbf24"/>
  </g>

  <!-- TOP BANNER -->
  <text x="600" y="68" text-anchor="middle" fill="#a5b4fc" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="6">JAPANESE LANGUAGE · 日本語能力試験 · VISA SCREENING</text>

  <text x="600" y="146" text-anchor="middle" fill="#f5f3ff" font-family="sans-serif" font-size="38" font-weight="600">In Japan&apos;s visa screening,</text>
  <text x="600" y="208" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="58" font-weight="bold">JLPT is not required</text>

  <text x="600" y="246" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="15">Work · Spouse · Business Manager · Permanent Residence — the real role of Japanese</text>

  <line x1="540" y1="278" x2="660" y2="278" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>

  <!-- CENTER HERO: 日本語 calligraphy + stamp (unchanged across languages) -->
  <text x="600" y="510" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="220" font-weight="bold" letter-spacing="-4" opacity="0.95">日本語</text>
  <text x="600" y="510" text-anchor="middle" fill="none" stroke="#fde68a" stroke-width="1" font-family="serif" font-size="220" font-weight="bold" letter-spacing="-4" opacity="0.35">日本語</text>

  <g transform="translate(600, 462) rotate(-11)">
    <rect x="-200" y="-58" width="400" height="116" rx="10" fill="none" stroke="#dc2626" stroke-width="7"/>
    <rect x="-190" y="-48" width="380" height="96" rx="6" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="42" font-weight="bold">必須なし</text>
    <text x="0" y="30" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="17" font-weight="bold" letter-spacing="6">NOT REQUIRED FOR VISA</text>
  </g>

  <!-- BOTTOM inline indirect-impact line -->
  <line x1="120" y1="585" x2="380" y2="585" stroke="#a78bfa" stroke-width="1" opacity="0.45"/>
  <line x1="820" y1="585" x2="1080" y2="585" stroke="#a78bfa" stroke-width="1" opacity="0.45"/>

  <text x="600" y="592" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="2">Indirect impact · Job opportunities · Salary · Workplace fit · Long-term settlement</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
</svg>
