<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="65" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">पर्यटक भिसामा जापानमा काम गर्न सकिन्छ?</text>

  <circle cx="600" cy="185" r="70" fill="#fef2f2" stroke="#dc2626" stroke-width="5"/>
  <line x1="555" y1="140" x2="645" y2="230" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="195" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="26" font-weight="bold">काम</text>

  <text x="600" y="285" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="20" font-weight="bold">अल्पकालीन बसोबास (पर्यटक भिसा) मा सख्त निषेध!</text>

  <g transform="translate(60, 310)">
    <rect width="250" height="70" rx="12" fill="#fee2e2"/>
    <text x="125" y="30" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">❌ क्याफे अंशकालिक</text>
    <text x="125" y="52" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="12">छोटो अवधि पनि अवैध</text>
  </g>
  <g transform="translate(330, 310)">
    <rect width="250" height="70" rx="12" fill="#fee2e2"/>
    <text x="125" y="30" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">❌ दोभाषे · कार्यक्रम</text>
    <text x="125" y="52" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="12">भुक्तानी गतिविधि निषेध</text>
  </g>
  <g transform="translate(600, 310)">
    <rect width="250" height="70" rx="12" fill="#fee2e2"/>
    <text x="125" y="30" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">❌ नगद भुक्तानी</text>
    <text x="125" y="52" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="12">भुक्तानी तरिका असम्बन्धित</text>
  </g>
  <g transform="translate(870, 310)">
    <rect width="250" height="70" rx="12" fill="#fee2e2"/>
    <text x="125" y="30" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">❌ रिमोट काम</text>
    <text x="125" y="52" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="12">जापानमा बस्दा आय गतिविधि</text>
  </g>

  <g transform="translate(60, 400)">
    <rect width="530" height="80" rx="12" fill="#1e293b"/>
