<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="40" font-weight="bold">Ky thuat vien / Chuyen gia</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(40, 35)">
      <!-- Computer/Tech icon -->
      <rect x="20" y="40" width="80" height="55" rx="4" fill="#3b82f6"/>
      <rect x="25" y="45" width="70" height="40" fill="#1e40af"/>
      <!-- Code lines -->
      <rect x="30" y="52" width="25" height="3" fill="#60a5fa"/>
      <rect x="30" y="60" width="35" height="3" fill="#93c5fd"/>
      <rect x="30" y="68" width="20" height="3" fill="#60a5fa"/>
      <rect x="30" y="76" width="30" height="3" fill="#93c5fd"/>
      <!-- Monitor stand -->
      <rect x="50" y="95" width="20" height="10" fill="#64748b"/>
      <rect x="40" y="105" width="40" height="5" rx="2" fill="#64748b"/>
      <!-- Globe for international -->
      <circle cx="110" cy="70" r="25" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
      <ellipse cx="110" cy="70" rx="25" ry="10" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
      <line x1="110" y1="45" x2="110" y2="95" stroke="#60a5fa" stroke-width="1.5"/>
      <line x1="85" y1="70" x2="135" y2="70" stroke="#60a5fa" stroke-width="1.5"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="22" font-weight="bold">Ky thuat/Kien thuc nhan van/Quoc te</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Ky su CNTT, phien dich, tiep thi</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Tu cach luu tru pho bien nhat</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 5 nam, 3 nam, 1 nam, 3 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Phan loai danh muc 1-4</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="260" y="290" width="280" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="16" font-weight="bold">技術・人文知識・国際業務</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
