<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Edukasyon</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Gabay sa mga Kinakailangang Dokumento</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 30)">
      <!-- Chalkboard -->
      <rect x="10" y="15" width="100" height="70" rx="5" fill="#15803d"/>
      <rect x="15" y="20" width="90" height="60" fill="#166534"/>
      <!-- Board stand -->
      <rect x="25" y="85" width="8" height="25" fill="#92400e"/>
      <rect x="87" y="85" width="8" height="25" fill="#92400e"/>
      <!-- Math symbols on board -->
      <text x="30" y="45" fill="#fef3c7" font-family="sans-serif" font-size="16">ABC</text>
      <text x="30" y="65" fill="#fef3c7" font-family="sans-serif" font-size="14">1+2=3</text>
      <!-- Pointer -->
      <line x1="90" y1="50" x2="115" y2="70" stroke="#dc2626" stroke-width="3"/>
      <circle cx="117" cy="72" r="4" fill="#dc2626"/>
      <!-- Book -->
      <rect x="95" y="90" width="30" height="22" rx="2" fill="#3b82f6"/>
      <line x1="110" y1="90" x2="110" y2="112" stroke="#1e3a8a" stroke-width="2"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Status ng Paninirahan para sa Edukasyon sa Paaralan</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Elementarya, junior high, senior high school</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Aktibidad ng pagtuturo ng wika</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Panahon ng pananatili: 5 taon, 3 taon, 1 taon, 3 buwan</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Pwedeng mag-apply: Pagkilala, Pagbabago, Pag-renew</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#dcfce7"/>
    <text x="400" y="320" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="18" font-weight="bold">教育</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
