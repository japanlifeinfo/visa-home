<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: dark slate (distinct from #0f172a navy of immigration-services-agency) -->
  <rect width="1200" height="630" fill="#1e293b"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Subtle background kanji watermark -->
  <text x="1140" y="220" text-anchor="end" fill="#0ea5e9" font-family="serif" font-size="200" font-weight="bold" opacity="0.06">審査</text>

  <!-- Background dot grid (left side) -->
  <g opacity="0.12">
    <circle cx="80" cy="560" r="2" fill="#0ea5e9"/>
    <circle cx="120" cy="560" r="2" fill="#0ea5e9"/>
    <circle cx="160" cy="560" r="2" fill="#0ea5e9"/>
    <circle cx="200" cy="560" r="2" fill="#0ea5e9"/>
    <circle cx="240" cy="560" r="2" fill="#0ea5e9"/>
    <circle cx="80" cy="590" r="2" fill="#0ea5e9"/>
    <circle cx="120" cy="590" r="2" fill="#0ea5e9"/>
    <circle cx="160" cy="590" r="2" fill="#0ea5e9"/>
  </g>

  <!-- Decorative accent circle bottom-right -->
  <circle cx="1140" cy="580" r="60" fill="#0ea5e9" opacity="0.08"/>

  <!-- ===== LEFT: Screening evaluation sheet with magnifying glass ===== -->
  <g transform="translate(70, 130) rotate(-3 250 200)">
    <!-- Shadow -->
    <rect x="6" y="10" width="500" height="400" rx="14" fill="#000" opacity="0.35"/>

    <!-- Sheet body -->
    <rect width="500" height="400" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Top header band -->
    <path d="M 0 14 Q 0 0 14 0 L 486 0 Q 500 0 500 14 L 500 56 L 0 56 Z" fill="#0e7490"/>
    <text x="28" y="36" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">在留審査評価シート</text>
    <text x="472" y="36" text-anchor="end" fill="#a5f3fc" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="2">SCREENING SHEET</text>

    <!-- Section label -->
    <text x="28" y="86" fill="#0e7490" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2">CHECK ITEMS · 審査項目</text>

    <!-- Checklist items -->
    <!-- Item 1: 학력 -->
    <g transform="translate(28, 100)">
      <rect width="22" height="22" rx="5" fill="#10b981"/>
      <path d="M 5 11 L 10 16 L 17 7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" fill="#1f2937" font-family="sans-serif" font-size="15" font-weight="600">학력 · 전공 일치성</text>
      <line x1="0" y1="36" x2="444" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    </g>

    <!-- Item 2: 경력 -->
    <g transform="translate(28, 144)">
      <rect width="22" height="22" rx="5" fill="#10b981"/>
      <path d="M 5 11 L 10 16 L 17 7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" fill="#1f2937" font-family="sans-serif" font-size="15" font-weight="600">경력 · 업무 관련성</text>
      <line x1="0" y1="36" x2="444" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    </g>

    <!-- Item 3: 회사 -->
    <g transform="translate(28, 188)">
      <rect width="22" height="22" rx="5" fill="#10b981"/>
      <path d="M 5 11 L 10 16 L 17 7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" fill="#1f2937" font-family="sans-serif" font-size="15" font-weight="600">회사 · 소득 안정성</text>
      <line x1="0" y1="36" x2="444" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    </g>

    <!-- Item 4: 세금 -->
    <g transform="translate(28, 232)">
      <rect width="22" height="22" rx="5" fill="#10b981"/>
      <path d="M 5 11 L 10 16 L 17 7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" fill="#1f2937" font-family="sans-serif" font-size="15" font-weight="600">세금 납부 기록</text>
      <line x1="0" y1="36" x2="444" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    </g>

    <!-- Item 5: 연금 (highlighted - being inspected by magnifying glass) -->
    <g transform="translate(28, 276)">
      <rect x="-4" y="-6" width="452" height="36" rx="6" fill="#fef3c7"/>
      <rect width="22" height="22" rx="5" fill="#f59e0b"/>
      <path d="M 5 11 L 10 16 L 17 7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" fill="#92400e" font-family="sans-serif" font-size="15" font-weight="bold">연금 납부 기록</text>
      <text x="430" y="17" text-anchor="end" fill="#b45309" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1">FOCUS</text>
    </g>

    <!-- Item 6: 재류 이력 -->
    <g transform="translate(28, 320)">
      <rect width="22" height="22" rx="5" fill="#10b981"/>
      <path d="M 5 11 L 10 16 L 17 7" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17" fill="#1f2937" font-family="sans-serif" font-size="15" font-weight="600">재류 이력 · 법규 준수</text>
      <line x1="0" y1="36" x2="444" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    </g>

    <!-- Bottom signature line -->
    <text x="28" y="378" fill="#6b7280" font-family="sans-serif" font-size="11" font-weight="600">入国管理 · IMMIGRATION REVIEW</text>
    <text x="472" y="378" text-anchor="end" fill="#6b7280" font-family="monospace" font-size="11" font-weight="600">2026.06</text>
  </g>

  <!-- ===== Magnifying glass (overlaying item 5: 연금) ===== -->
  <g transform="translate(440, 410)">
    <!-- Handle -->
    <rect x="48" y="48" width="100" height="16" rx="8" fill="#fbbf24" transform="rotate(38 48 48)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Lens outer ring -->
    <circle r="78" fill="#0ea5e9" opacity="0.10"/>
    <circle r="78" fill="none" stroke="#fbbf24" stroke-width="6"/>
    <circle r="70" fill="none" stroke="#fef3c7" stroke-width="1.5" opacity="0.6"/>
    <!-- Inner highlighted content - reflected on lens -->
    <circle r="68" fill="#fffbeb" opacity="0.92"/>
    <text y="-4" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">CHECK</text>
    <text y="24" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="26" font-weight="bold">연금</text>
    <!-- Lens highlight -->
    <ellipse cx="-26" cy="-30" rx="20" ry="14" fill="white" opacity="0.5"/>
  </g>

  <!-- ===== RIGHT: Headline + subtitle + callout ===== -->

  <!-- Kicker -->
  <text x="640" y="130" fill="#67e8f9" font-family="sans-serif" font-size="16" font-weight="600" letter-spacing="4">JAPAN VISA SCREENING · 入管審査</text>

  <!-- Headline (3 lines) -->
  <text x="640" y="208" fill="#f8fafc" font-family="sans-serif" font-size="56" font-weight="bold">비자 심사에서</text>
  <text x="640" y="276" fill="#f8fafc" font-family="sans-serif" font-size="56" font-weight="bold">입관이 보는</text>
  <text x="640" y="344" fill="#fbbf24" font-family="sans-serif" font-size="56" font-weight="bold">핵심 요소</text>

  <!-- Subtitle (2 lines) -->
  <text x="640" y="404" fill="#cbd5e1" font-family="sans-serif" font-size="20">학력·경력·소득·세금·연금·재류 이력을</text>
  <text x="640" y="434" fill="#cbd5e1" font-family="sans-serif" font-size="20">종합적으로 검토하는 일본 비자 심사 기준</text>

  <!-- Callout chip -->
  <rect x="640" y="478" width="500" height="60" rx="14" fill="#0e7490"/>
  <text x="664" y="516" fill="#fef3c7" font-family="sans-serif" font-size="22" font-weight="bold">학력 · 경력 · 회사 · 소득 · 세금 · 연금</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>
