<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Documentos Necessários</text>
    <text x="80" y="300" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="72" font-weight="900">Atividades</text>
    <text x="80" y="390" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="72" font-weight="900">Religiosas</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <rect x="125" y="55" width="10" height="130" fill="#7e22ce" opacity="0.3"/>
      <rect x="92" y="85" width="76" height="10" fill="#7e22ce" opacity="0.3"/>
      <circle cx="130" cy="55" r="12" fill="#7e22ce" opacity="0.25"/>
      <path d="M80 185 L100 130 L130 155 L160 130 L180 185Z" fill="#7e22ce" opacity="0.2"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#7e22ce" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">宗教</text>
  <text x="955" y="425" text-anchor="middle" fill="#7e22ce" font-family="sans-serif" font-size="30" opacity="0.6">Religious Activities</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#7e22ce" opacity="0.08" stroke="#7e22ce" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#7e22ce" font-family="sans-serif" font-size="23" font-weight="600">A-3</text>

</svg>