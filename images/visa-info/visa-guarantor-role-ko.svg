<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="trustGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dangerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="trustInk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dangerInk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== Background: slate-emerald dark (distinct from pure navy / warm peach / split cream) ===== -->
  <rect width="1200" height="630" fill="#0b1f1d"/>
  <!-- Top gradient bar: teal → amber → red (trust ↔ caution contrast theme) -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark (Korean only): 보증 centered, very faint -->
  <text x="600" y="430" text-anchor="middle" fill="#14b8a6" font-family="sans-serif" font-size="280" font-weight="bold" opacity="0.05" letter-spacing="-6">보증</text>

  <!-- Subtle dotted grid (upper-left, breaks empty space) -->
  <g opacity="0.18">
    <circle cx="60" cy="80" r="2" fill="#475569"/>
    <circle cx="90" cy="80" r="2" fill="#475569"/>
    <circle cx="120" cy="80" r="2" fill="#475569"/>
    <circle cx="60" cy="110" r="2" fill="#475569"/>
    <circle cx="90" cy="110" r="2" fill="#475569"/>
    <circle cx="60" cy="140" r="2" fill="#475569"/>
  </g>
  <!-- Dotted accent grid (upper-right) -->
  <g opacity="0.18">
    <circle cx="1080" cy="80" r="2" fill="#475569"/>
    <circle cx="1110" cy="80" r="2" fill="#475569"/>
    <circle cx="1140" cy="80" r="2" fill="#475569"/>
    <circle cx="1110" cy="110" r="2" fill="#475569"/>
    <circle cx="1140" cy="110" r="2" fill="#475569"/>
    <circle cx="1140" cy="140" r="2" fill="#475569"/>
  </g>

  <!-- Decorative accent circles (asymmetric placement — break repetitive pattern) -->
  <circle cx="100" cy="560" r="46" fill="#14b8a6" opacity="0.08"/>
  <circle cx="1130" cy="540" r="32" fill="#dc2626" opacity="0.10"/>

  <!-- =============================================================== -->
  <!-- TOP: Centered kicker + single-line bold headline + subtitle      -->
  <!-- (Pattern: "centered stack" — break from 3 prior left-aligned)    -->
  <!-- =============================================================== -->

  <!-- Kicker pill (centered) -->
  <g transform="translate(600, 56)">
    <rect x="-120" y="0" width="240" height="36" rx="18" fill="none" stroke="#5eead4" stroke-width="1.5"/>
    <circle cx="-100" cy="18" r="4.5" fill="#5eead4"/>
    <text x="-84" y="24" fill="#5eead4" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">비자 신청 · 보증인 역할</text>
  </g>

  <!-- Pre-headline (centered, smaller) -->
  <text x="600" y="140" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="20" font-weight="500" letter-spacing="2">많은 사람이 오해하는 사실</text>

  <!-- Main headline (1-line giant banner — centered) -->
  <text x="600" y="216" text-anchor="middle" font-family="sans-serif" font-size="76" font-weight="bold">
    <tspan fill="#5eead4">비자 보증인</tspan>
    <tspan fill="#fbbf24" dx="14">≠</tspan>
    <tspan fill="#fca5a5" dx="14">빚보증</tspan>
  </text>

  <!-- Thin accent underline (centered) -->
  <line x1="540" y1="240" x2="660" y2="240" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtitle (centered, 1 line) -->
  <text x="600" y="278" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="20" font-weight="500">금융 연대보증과는 성격이 다른 신원 보증 제도입니다</text>

  <!-- =============================================================== -->
  <!-- CENTER: TWO LARGE OPPOSING SEAL STAMPS connected by ≠           -->
  <!-- Left (trust/teal) — Right (caution/red) — Center ≠ symbol       -->
  <!-- Silhouette: dual circular stamps — break from box/card pattern  -->
  <!-- =============================================================== -->

  <!-- ===== LEFT STAMP: 신원보증 (teal/trust) ===== -->
  <!-- Glow halo -->
  <circle cx="350" cy="430" r="160" fill="url(#trustGlow)"/>
  <!-- Outer ink smudge -->
  <g transform="translate(350, 430) rotate(-6)">
    <circle r="138" fill="url(#trustInk)" opacity="0.7"/>
    <circle r="124" fill="none" stroke="#14b8a6" stroke-width="4.5"/>
    <circle r="115" fill="none" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.75"/>
    <!-- Big check mark icon (centered) -->
    <path d="M -38 4 L -10 32 L 40 -28" stroke="#5eead4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Stamp label below check -->
    <text y="64" text-anchor="middle" fill="#5eead4" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="4">신원보증</text>
    <!-- Tiny ink imperfections -->
    <circle cx="-80" cy="-70" r="1.8" fill="#14b8a6" opacity="0.6"/>
    <circle cx="78" cy="68" r="1.6" fill="#14b8a6" opacity="0.5"/>
    <circle cx="-72" cy="78" r="1.4" fill="#14b8a6" opacity="0.5"/>
  </g>
  <!-- Caption under left stamp -->
  <text x="350" y="606" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="3">비자 보증인</text>

  <!-- ===== CENTER ≠ SYMBOL + label ===== -->
  <g transform="translate(600, 430)">
    <!-- Subtle backdrop circle for the symbol -->
    <circle r="58" fill="#1c2e2a" stroke="#fbbf24" stroke-width="1.2" opacity="0.55"/>
    <!-- Inner glow -->
    <circle r="48" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.5"/>
    <!-- ≠ symbol (giant) -->
    <text y="28" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="96" font-weight="bold">≠</text>
    <!-- Label above ≠ -->
    <text y="-78" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">다른 개념</text>
  </g>

  <!-- ===== RIGHT STAMP: 연대보증 (red/caution) ===== -->
  <!-- Glow halo -->
  <circle cx="850" cy="430" r="160" fill="url(#dangerGlow)"/>
  <!-- Outer ink smudge -->
  <g transform="translate(850, 430) rotate(7)">
    <circle r="138" fill="url(#dangerInk)" opacity="0.7"/>
    <circle r="124" fill="none" stroke="#dc2626" stroke-width="4.5"/>
    <circle r="115" fill="none" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="2 5" opacity="0.75"/>
    <!-- Big ✕ icon (centered) -->
    <path d="M -34 -34 L 34 34 M 34 -34 L -34 34" stroke="#fca5a5" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Stamp label below ✕ -->
    <text y="74" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="4">연대보증</text>
    <!-- Tiny ink imperfections -->
    <circle cx="80" cy="-66" r="1.8" fill="#dc2626" opacity="0.6"/>
    <circle cx="-78" cy="70" r="1.6" fill="#dc2626" opacity="0.5"/>
    <circle cx="72" cy="80" r="1.4" fill="#dc2626" opacity="0.5"/>
  </g>
  <!-- Caption under right stamp -->
  <text x="850" y="606" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="16" font-weight="bold" letter-spacing="3">금융 빚보증</text>
</svg>
