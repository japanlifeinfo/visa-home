<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Hoat dong chi dinh</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 40)">
      <!-- Document with star -->
      <rect x="20" y="20" width="80" height="100" rx="4" fill="#14b8a6"/>
      <rect x="30" y="35" width="60" height="4" fill="#5eead4"/>
      <rect x="30" y="50" width="50" height="4" fill="#5eead4"/>
      <rect x="30" y="65" width="55" height="4" fill="#5eead4"/>
      <rect x="30" y="80" width="40" height="4" fill="#5eead4"/>
      <!-- Star badge -->
      <polygon points="60,95 65,110 80,110 68,120 73,135 60,125 47,135 52,120 40,110 55,110" fill="#fbbf24"/>
      <!-- Checkmark -->
      <circle cx="110" cy="60" r="25" fill="#0d9488"/>
      <polyline points="97,60 107,70 123,50" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Hoat dong do Bo truong chi dinh</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#ccfbf1"/>
        <text x="12" y="17" text-anchor="middle" fill="#14b8a6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Working Holiday, EPA, v.v.</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#ccfbf1"/>
        <text x="12" y="17" text-anchor="middle" fill="#14b8a6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Tim viec lam sau tot nghiep</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#ccfbf1"/>
        <text x="12" y="17" text-anchor="middle" fill="#14b8a6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 5 nam, 3 nam, 1 nam, 6 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#ccfbf1"/>
        <text x="12" y="17" text-anchor="middle" fill="#14b8a6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Ho so khac nhau theo loai hoat dong</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="320" y="290" width="160" height="44" rx="22" fill="#ccfbf1"/>
    <text x="400" y="320" text-anchor="middle" fill="#0d9488" font-family="sans-serif" font-size="18" font-weight="bold">特定活動</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
