<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Visa Renewal Timing</text>

  <!-- Traffic light -->
  <rect x="150" y="120" width="200" height="420" rx="30" fill="#1e293b"/>

  <!-- Green light -->
  <circle cx="250" cy="220" r="55" fill="#22c55e"/>
  <text x="250" y="232" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">GO</text>

  <!-- Yellow light -->
  <circle cx="250" cy="350" r="55" fill="#eab308"/>
  <text x="250" y="362" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">WARN</text>

  <!-- Red light -->
  <circle cx="250" cy="480" r="55" fill="#ef4444"/>
  <text x="250" y="492" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">RISK</text>

  <!-- Labels on right -->
  <text x="440" y="230" fill="#15803d" font-family="sans-serif" font-size="40" font-weight="bold">Start 3 months before</text>
  <text x="440" y="275" fill="#64748b" font-family="sans-serif" font-size="28">Plenty of time to prepare</text>

  <text x="440" y="360" fill="#a16207" font-family="sans-serif" font-size="40" font-weight="bold">1 month before</text>
  <text x="440" y="405" fill="#64748b" font-family="sans-serif" font-size="28">Apply urgently</text>

  <text x="440" y="490" fill="#dc2626" font-family="sans-serif" font-size="40" font-weight="bold">After expiry = illegal stay</text>
  <text x="440" y="535" fill="#64748b" font-family="sans-serif" font-size="28">Even one day over is risky!</text>

  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>