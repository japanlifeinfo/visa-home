<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="34" font-weight="500" letter-spacing="6" opacity="0.8">आवश्यक कागजातहरू</text>
    <text x="80" y="300" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="64" font-weight="900">कानूनी/</text>
    <text x="80" y="380" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="64" font-weight="900">लेखा सेवा</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <rect x="118" y="50" width="24" height="8" rx="4" fill="#1e3a5f" opacity="0.4"/>
      <rect x="126" y="58" width="8" height="55" fill="#1e3a5f" opacity="0.3"/>
      <rect x="86" y="113" width="88" height="6" rx="3" fill="#1e3a5f" opacity="0.4"/>
      <line x1="100" y1="119" x2="100" y2="170" stroke="#1e3a5f" stroke-width="3" opacity="0.3"/>
      <line x1="160" y1="119" x2="160" y2="170" stroke="#1e3a5f" stroke-width="3" opacity="0.3"/>
      <circle cx="100" cy="175" r="14" fill="#1e3a5f" opacity="0.25"/>
      <circle cx="160" cy="175" r="14" fill="#1e3a5f" opacity="0.25"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#1e3a5f" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">法律・会計業務</text>
  <text x="955" y="425" text-anchor="middle" fill="#1e3a5f" font-family="sans-serif" font-size="30" opacity="0.6">Legal/Accounting</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#1e3a5f" opacity="0.08" stroke="#1e3a5f" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#1e3a5f" font-family="sans-serif" font-size="23" font-weight="600">D</text>

</svg>