<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Trainee</text>
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Required Documents Guide</text>
  <g transform="translate(200, 190)">
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Learning/Training Icon -->
    <g transform="translate(60, 70)">
      <!-- Clipboard/Certificate -->
      <rect x="20" y="30" width="90" height="120" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
      <rect x="45" y="15" width="40" height="25" rx="4" fill="#22c55e"/>
      <!-- Checkmarks for learning items -->
      <polyline points="35,60 45,70 65,50" stroke="#22c55e" stroke-width="3" fill="none"/>
      <line x1="75" y1="60" x2="100" y2="60" stroke="#22c55e" stroke-width="2"/>
      <polyline points="35,90 45,100 65,80" stroke="#22c55e" stroke-width="3" fill="none"/>
      <line x1="75" y1="90" x2="100" y2="90" stroke="#22c55e" stroke-width="2"/>
      <polyline points="35,120 45,130 65,110" stroke="#22c55e" stroke-width="3" fill="none"/>
      <line x1="75" y1="120" x2="100" y2="120" stroke="#22c55e" stroke-width="2"/>
      <!-- Person learning -->
      <circle cx="130" cy="60" r="20" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
      <rect x="115" y="85" width="30" height="45" rx="6" fill="#22c55e"/>
      <!-- Lightbulb for learning -->
      <circle cx="130" cy="145" r="15" fill="#fef08a" stroke="#22c55e" stroke-width="2"/>
      <rect x="125" y="158" width="10" height="8" fill="#22c55e"/>
      <line x1="130" y1="125" x2="130" y2="130" stroke="#22c55e" stroke-width="2"/>
      <line x1="115" y1="145" x2="118" y2="145" stroke="#22c55e" stroke-width="2"/>
      <line x1="142" y1="145" x2="145" y2="145" stroke="#22c55e" stroke-width="2"/>
    </g>
    <!-- Content Section -->
    <g transform="translate(280, 60)">
      <circle cx="20" cy="20" r="12" fill="#dcfce7"/>
      <text x="45" y="26" fill="#1e293b" font-family="sans-serif" font-size="20">Non-working training</text>
      <circle cx="20" cy="70" r="12" fill="#dcfce7"/>
      <text x="45" y="76" fill="#1e293b" font-family="sans-serif" font-size="20">Skills acquisition</text>
      <circle cx="20" cy="120" r="12" fill="#dcfce7"/>
      <text x="45" y="126" fill="#1e293b" font-family="sans-serif" font-size="20">Organization sponsored</text>
      <circle cx="20" cy="170" r="12" fill="#dcfce7"/>
      <text x="45" y="176" fill="#1e293b" font-family="sans-serif" font-size="20">Lecture-based learning</text>
    </g>
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#dcfce7"/>
    <text x="400" y="320" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="18" font-weight="bold">研修</text>
  </g>
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>