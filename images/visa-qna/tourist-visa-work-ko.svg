<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="65" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">관광비자로 일본에서 일할 수 있을까?</text>

  <!-- Big Prohibition Circle -->
  <circle cx="600" cy="185" r="70" fill="#fef2f2" stroke="#dc2626" stroke-width="5"/>
  <line x1="555" y1="140" x2="645" y2="230" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="195" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="28" font-weight="bold">취업</text>

  <!-- Subtitle -->
  <text x="600" y="285" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="22" font-weight="bold">단기체류(관광비자)로는 절대 불가!</text>

  <!-- Prohibited Activities Row -->
  <g transform="translate(60, 310)">
    <rect width="250" height="70" rx="12" fill="#fee2e2"/>
    <text x="125" y="30" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="15" font-weight="bold">❌ 카페 아르바이트</text>
    <text x="125" y="52" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">단기 알바도 불법</text>
  </g>
  <g transform="translate(330, 310)">
    <rect width="250" height="70" rx="12" fill="#fee2e2"/>
    <text x="125" y="30" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="15" font-weight="bold">❌ 통역·행사 스태프</text>
    <text x="125" y="52" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">보수 수령 명백히 금지</text>
  </g>
  <g transform="translate(600, 310)">
    <rect width="250" height="70" rx="12" fill="#fee2e2"/>
    <text x="125" y="30" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="15" font-weight="bold">❌ 현금 수령</text>
    <text x="125" y="52" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">지급 방식 무관 불법</text>
  </g>
  <g transform="translate(870, 310)">
    <rect width="250" height="70" rx="12" fill="#fee2e2"/>
    <text x="125" y="30" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="15" font-weight="bold">❌ 원격 근무</text>
    <text x="125" y="52" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">일본 체류 중 수입 활동</text>
  </g>

  <!-- Consequences Strip -->
  <g transform="translate(60, 400)">
    <rect width="530" height="80" rx="12" fill="#1e293b"/>
    <text x="265" y="28" text-anchor="middle" fill="#f87171" font-family="sans-serif" font-size="15" font-weight="bold">적발 시 결과</text>
    <text x="130" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">강제퇴거</text>
    <text x="265" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">입국 제한 5년+</text>
    <text x="410" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">취업비자 심사 불이익</text>
  </g>

  <!-- Legal Alternatives Strip -->
  <g transform="translate(610, 400)">
    <rect width="530" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="265" y="28" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="15" font-weight="bold">✓ 합법적으로 일하려면</text>
    <text x="100" y="55" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="13">취업비자</text>
    <text x="220" y="55" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="13">워킹홀리데이</text>
    <text x="355" y="55" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="13">유학+자격외허가</text>
    <text x="470" y="55" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="13">배우자비자</text>
  </g>

  <!-- Bottom message -->
  <text x="600" y="520" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">"잠깐이면 괜찮겠지"가 장기적인 일본 취업 계획을 무너뜨립니다</text>

  <!-- Footer -->
  <text x="600" y="575" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
