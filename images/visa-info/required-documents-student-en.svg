<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Student</text>
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Required Documents Guide</text>
  <g transform="translate(200, 190)">
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Graduation Cap and Book Icon -->
    <g transform="translate(60, 70)">
      <!-- Graduation Cap -->
      <polygon points="80,30 150,60 80,90 10,60" fill="#8b5cf6"/>
      <rect x="70" y="60" width="20" height="40" fill="#8b5cf6"/>
      <ellipse cx="80" cy="100" rx="35" ry="12" fill="#a78bfa"/>
      <line x1="140" y1="60" x2="140" y2="100" stroke="#8b5cf6" stroke-width="3"/>
      <rect x="132" y="95" width="16" height="20" rx="3" fill="#8b5cf6"/>
      <!-- Book -->
      <rect x="30" y="115" width="100" height="60" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="80" y1="115" x2="80" y2="175" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="45" y1="130" x2="70" y2="130" stroke="#a78bfa" stroke-width="2"/>
      <line x1="45" y1="145" x2="65" y2="145" stroke="#a78bfa" stroke-width="2"/>
      <line x1="90" y1="130" x2="115" y2="130" stroke="#a78bfa" stroke-width="2"/>
      <line x1="90" y1="145" x2="110" y2="145" stroke="#a78bfa" stroke-width="2"/>
    </g>
    <!-- Content Section -->
    <g transform="translate(280, 60)">
      <circle cx="20" cy="20" r="12" fill="#ede9fe"/>
      <text x="45" y="26" fill="#1e293b" font-family="sans-serif" font-size="20">University enrollment</text>
      <circle cx="20" cy="70" r="12" fill="#ede9fe"/>
      <text x="45" y="76" fill="#1e293b" font-family="sans-serif" font-size="20">Language school</text>
      <circle cx="20" cy="120" r="12" fill="#ede9fe"/>
      <text x="45" y="126" fill="#1e293b" font-family="sans-serif" font-size="20">Financial proof required</text>
      <circle cx="20" cy="170" r="12" fill="#ede9fe"/>
      <text x="45" y="176" fill="#1e293b" font-family="sans-serif" font-size="20">Part-time work allowed</text>
    </g>
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#ede9fe"/>
    <text x="400" y="320" text-anchor="middle" fill="#7c3aed" font-family="sans-serif" font-size="18" font-weight="bold">留学</text>
  </g>
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>