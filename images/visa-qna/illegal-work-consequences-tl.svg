<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="40" font-weight="bold">Kapag Nahuli sa Illegal na Trabaho</text>

  <!-- 4 descending stair blocks -->
  <rect x="60" y="130" width="260" height="100" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="190" y="175" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="28" font-weight="bold">STEP 1</text>
  <text x="190" y="215" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="30" font-weight="bold">Imbestigasyon</text>

  <rect x="330" y="210" width="260" height="100" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
  <text x="460" y="255" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="28" font-weight="bold">STEP 2</text>
  <text x="460" y="295" text-anchor="middle" fill="#7f1d1d" font-family="sans-serif" font-size="32" font-weight="bold">Deportasyon</text>

  <rect x="600" y="290" width="260" height="100" rx="12" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
  <text x="730" y="335" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="28" font-weight="bold">STEP 3</text>
  <text x="730" y="375" text-anchor="middle" fill="#7f1d1d" font-family="sans-serif" font-size="30" font-weight="bold">Bawal Bumalik</text>

  <rect x="870" y="370" width="270" height="100" rx="12" fill="#881337"/>
  <text x="1005" y="415" text-anchor="middle" fill="#fecdd3" font-family="sans-serif" font-size="28" font-weight="bold">STEP 4</text>
  <text x="1005" y="455" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">Sira ang Career</text>

  <!-- Arrows -->
  <text x="300" y="200" fill="#94a3b8" font-family="sans-serif" font-size="40" font-weight="bold">&gt;</text>
  <text x="570" y="280" fill="#94a3b8" font-family="sans-serif" font-size="40" font-weight="bold">&gt;</text>
  <text x="840" y="360" fill="#94a3b8" font-family="sans-serif" font-size="40" font-weight="bold">&gt;</text>

  <!-- Bottom -->
  <rect x="100" y="510" width="1000" height="60" rx="12" fill="#1e293b"/>
  <text x="600" y="550" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="28" font-weight="bold">Ilang libo lang, baka mawala ang career mo sa Japan</text>


  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>