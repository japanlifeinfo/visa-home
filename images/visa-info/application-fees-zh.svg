<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">在留资格新申请、更新、变更手续费总整理</text>

  <!-- Card 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">¥</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">官方手续费</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">更新/变更: ¥5,500~¥6,000</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">永住权: ¥10,000</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">在线申请享受折扣</text>
  </g>

  <!-- Card 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="18" font-weight="bold">COE</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">新在留资格申请</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">COE政府手续费: 无</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">代办时: ¥80,000~¥200,000</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">签证发行费: 因国家而异</text>
  </g>

  <!-- Card 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="55" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="22" font-weight="bold">代</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">行政书士代办费用</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">新申请: ¥44,000~¥220,000</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">变更: ¥80,000~¥187,000</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">更新: ¥40,000~¥99,000</text>
  </g>

  <!-- Card 4 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="55" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="22" font-weight="bold">+</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">其他费用</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">文件翻译/公证费</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">邮费/挂号费</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">证件照、邀请函相关费用</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">2025年4月修订基准</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">在线申请折扣 | 自行申请免代办费 | 手续费上调讨论中</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
