<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefce8"/>

  <!-- Top gradient bar (brand consistent) -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Decorative geometric shapes (repositioned vs ko version) -->
  <circle cx="80" cy="150" r="140" fill="#fee2e2" opacity="0.50"/>
  <circle cx="30" cy="280" r="70" fill="#fed7aa" opacity="0.55"/>
  <circle cx="1120" cy="520" r="110" fill="#fef3c7" opacity="0.5"/>
  <polygon points="1200,0 1200,240 960,0" fill="#fef3c7" opacity="0.4"/>

  <!-- NEWS badge (brand consistent) -->
  <rect x="60" y="50" width="200" height="70" rx="12" fill="#dc2626"/>
  <text x="160" y="97" text-anchor="middle" fill="white" font-family="sans-serif" font-size="42" font-weight="bold">NEWS</text>

  <!-- Headline (centered) -->
  <text x="600" y="225" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="62" font-weight="bold">Bayarin sa Japan Visa</text>
  <text x="600" y="305" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="62" font-weight="bold">Tataas Nang Husto</text>

  <!-- Subtitle with emphasized 30× -->
  <text x="600" y="380" text-anchor="middle" font-family="sans-serif">
    <tspan fill="#64748b" font-size="29">Bayad sa Permanent Residency, hanggang </tspan>
    <tspan fill="#dc2626" font-size="44" font-weight="bold">30×</tspan>
    <tspan fill="#64748b" font-size="29"> ang taas</tspan>
  </text>

  <!-- Comparison section -->
  <g transform="translate(210, 410)">
    <!-- Percentage label above arrow -->
    <text x="350" y="40" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="32" font-weight="bold">Humigit 2,900%</text>

    <!-- Before box (small, gray) -->
    <rect x="0" y="55" width="180" height="80" rx="12" fill="#cbd5e1"/>
    <text x="90" y="105" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="32" font-weight="bold">¥10,000</text>

    <!-- Arrow between boxes -->
    <path d="M 215 95 L 480 95" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <path d="M 470 82 L 485 95 L 470 108" stroke="#dc2626" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- After box (larger, red) -->
    <rect x="520" y="25" width="260" height="140" rx="12" fill="#dc2626"/>
    <text x="650" y="75" text-anchor="middle" fill="#fee2e2" font-family="sans-serif" font-size="22" font-weight="bold">Hanggang</text>
    <text x="650" y="130" text-anchor="middle" fill="white" font-family="sans-serif" font-size="36" font-weight="bold">¥300,000</text>
  </g>

  <!-- Footer URL -->
  <text x="600" y="608" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="22">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>
