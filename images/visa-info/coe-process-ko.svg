<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="36" font-weight="bold">COE(재류자격인정증명서) 발급 절차</text>

  <!-- Card 1: 준비 단계 -->
  <g transform="translate(80, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#3b82f6"/>
    <rect y="45" width="330" height="15" fill="#3b82f6"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">① ② 준비 단계</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">고용계약 체결</text>
    <text x="165" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">↓</text>
    <text x="165" y="158" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">회사가 입국관리국에 신청</text>
    <rect x="40" y="180" width="250" height="32" rx="16" fill="#dbeafe"/>
    <text x="165" y="201" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="14" font-weight="bold">보통 회사 측이 대행 신청</text>
    <text x="165" y="240" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">COE 신청서 · 고용계약서</text>
    <text x="165" y="262" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">회사 등기부등본 · 결산보고서</text>
    <text x="165" y="284" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">직무 설명서 · 졸업증명서</text>
  </g>

  <!-- Arrow 1→2 -->
  <text x="422" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="28">→</text>

  <!-- Card 2: 심사 단계 -->
  <g transform="translate(435, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#f59e0b"/>
    <rect y="45" width="330" height="15" fill="#f59e0b"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">③ ④ 심사·발급</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">1~3개월</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">성수기: 3~4개월 이상</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#fef3c7"/>
    <text x="165" y="192" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="15" font-weight="bold">가장 중요한 관문</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">전공·직무 연관성 심사</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">회사 재무 상태 확인</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">추가 서류 요청 시 지연</text>
  </g>

  <!-- Arrow 2→3 -->
  <text x="777" y="265" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="28">→</text>

  <!-- Card 3: 입국 단계 -->
  <g transform="translate(790, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#10b981"/>
    <rect y="45" width="330" height="15" fill="#10b981"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">⑤ ⑥ 비자·입국</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">대사관에서 비자 신청</text>
    <text x="165" y="138" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">발급: 3~7일</text>
    <text x="165" y="163" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">↓</text>
    <text x="165" y="188" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">일본 입국 · 재류카드 수령</text>
    <rect x="65" y="210" width="200" height="32" rx="16" fill="#d1fae5"/>
    <text x="165" y="231" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="14" font-weight="bold">정식 취업 시작!</text>
    <text x="165" y="270" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">거주지별 관할 대사관 확인</text>
    <text x="165" y="292" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">총 소요: 약 1.5~4개월</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 450)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">핵심 포인트</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">합격이 끝이 아닙니다 — COE 심사가 가장 중요한 관문입니다</text>
  </g>

  <!-- Footer -->
  <text x="600" y="575" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
