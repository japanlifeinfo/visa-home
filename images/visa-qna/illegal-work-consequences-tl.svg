<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="58" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="26" font-weight="bold">Ano ang Mangyayari Kung Mahuli sa Illegal na Trabaho?</text>
  <text x="600" y="85" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">"Konti lang naman..." maaaring baguhin ang buhay mo</text>

  <g transform="translate(60, 110)">
    <rect width="220" height="90" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="13" font-weight="bold">STEP 1</text>
    <text x="110" y="48" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="16" font-weight="bold">Imbestigasyon</text>
    <text x="110" y="70" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="12">Tawag · Tsek ng work records</text>
  </g>
  <path d="M280,155 L320,155 L320,175 L340,155 L320,135 L320,155" fill="#94a3b8"/>

  <g transform="translate(340, 120)">
    <rect width="220" height="90" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13" font-weight="bold">STEP 2</text>
    <text x="110" y="48" text-anchor="middle" fill="#7f1d1d" font-family="sans-serif" font-size="16" font-weight="bold">Deportasyon</text>
    <text x="110" y="70" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="12">Sapilitang pag-alis · Detensyon</text>
  </g>
  <path d="M560,165 L600,165 L600,185 L620,165 L600,145 L600,165" fill="#94a3b8"/>

  <g transform="translate(620, 130)">
    <rect width="220" height="90" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13" font-weight="bold">STEP 3</text>
    <text x="110" y="48" text-anchor="middle" fill="#7f1d1d" font-family="sans-serif" font-size="16" font-weight="bold">Entry Ban</text>
    <text x="110" y="70" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="12">5-10 taon bawal pumasok</text>
  </g>
  <path d="M840,175 L880,175 L880,195 L900,175 L880,155 L880,175" fill="#94a3b8"/>

  <g transform="translate(900, 140)">
    <rect width="240" height="90" rx="10" fill="#881337" stroke="#be123c" stroke-width="2"/>
    <text x="120" y="25" text-anchor="middle" fill="#fecdd3" font-family="sans-serif" font-size="13" font-weight="bold">STEP 4</text>
    <text x="120" y="48" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">Visa Disadvantage</text>
    <text x="120" y="70" text-anchor="middle" fill="#fecdd3" font-family="sans-serif" font-size="12">Lahat ng application apektado</text>
  </g>

  <text x="60" y="270" fill="#475569" font-family="sans-serif" font-size="15" font-weight="bold">Karaniwang Kaso</text>
  <g transform="translate(60, 280)">
    <rect width="260" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="22" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">Tourist Visa Part-time</text>
    <text x="130" y="42" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">"Saglit lang naman eh"</text>
  </g>
  <g transform="translate(330, 280)">
    <rect width="260" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="22" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">Estudyante Lagpas 28hrs/linggo</text>
    <text x="130" y="42" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Lagpas sa pinapayagang oras</text>
  </g>
  <g transform="translate(600, 280)">
    <rect width="260" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="130" y="22" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">SNS Interpreter/Event Gigs</text>
    <text x="130" y="42" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Social media job offers</text>
  </g>
  <g transform="translate(870, 280)">
    <rect width="270" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="22" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">Working Holiday Violation</text>
    <text x="135" y="42" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="11">Hindi sinusunod ang limitasyon</text>
  </g>

  <g transform="translate(60, 360)">
    <rect width="540" height="80" rx="12" fill="#1e293b"/>
    <text x="270" y="28" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">Tinitingnan ng batas ang "gawa", hindi "halaga"</text>
    <text x="270" y="52" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">Kahit 1 araw na may bayad na trabaho</text>
    <text x="270" y="70" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">maaaring ituring na illegal employment</text>
  </g>

  <g transform="translate(620, 360)">
    <rect width="520" height="80" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="260" y="25" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="15" font-weight="bold">Ano ang Mawawala sa Ilang Yen</text>
    <text x="80" y="55" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">Trabaho sa Japan</text>
    <text x="195" y="55" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">PR eligibility</text>
    <text x="330" y="55" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">Japan career</text>
    <text x="445" y="55" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="13">Family stay plans</text>
  </g>

  <g transform="translate(60, 465)">
    <rect width="1080" height="50" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="540" y="32" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="14" font-weight="bold">⚠ Employer din ay may parusa — Multa · Imbestigasyon · Criminal charges | Lehitimong kumpanya hindi pinapayagan</text>
  </g>

  <text x="600" y="555" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="15">Ang paggawa sa loob ng legal na status ang pinakamabilis na landas</text>
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
