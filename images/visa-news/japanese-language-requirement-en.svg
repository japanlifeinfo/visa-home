<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="85" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="36" font-weight="bold">Japanese Language Requirements</text>
  <text x="600" y="140" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="26">Japan's New Foreign Resident Policy Changes</text>

  <!-- Main content area -->
  <!-- Policy Icon -->
  <g transform="translate(150, 200)">
    <rect width="260" height="180" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="130" cy="60" r="35" fill="#fef3c7"/>
    <text x="130" y="70" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="36" font-weight="bold">JP</text>
    <text x="130" y="115" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">Language Proficiency</text>
    <text x="130" y="140" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">PR requirement review</text>
    <text x="130" y="160" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">JLPT N3~N2 advised</text>
  </g>

  <!-- Arrow -->
  <path d="M420 290 L480 290" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Integration Icon -->
  <g transform="translate(490, 200)">
    <rect width="260" height="180" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="130" cy="60" r="35" fill="#dbeafe"/>
    <text x="130" y="72" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="28" font-weight="bold">社会</text>
    <text x="130" y="115" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">Social Integration</text>
    <text x="130" y="140" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">Community coexistence</text>
    <text x="130" y="160" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">Mandatory education</text>
  </g>

  <!-- Arrow -->
  <path d="M760 290 L820 290" stroke="#cbd5e1" stroke-width="3" marker-end="url(#arrowhead)"/>

  <!-- Future Icon -->
  <g transform="translate(830, 200)">
    <rect width="260" height="180" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="130" cy="60" r="35" fill="#dcfce7"/>
    <text x="130" y="72" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="28" font-weight="bold">準備</text>
    <text x="130" y="115" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">Be Prepared</text>
    <text x="130" y="140" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">Employment advantage</text>
    <text x="130" y="160" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13">Long-term stay plans</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 420)">
    <rect width="800" height="100" rx="16" fill="#1e293b"/>
    <text x="400" y="35" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Key Points</text>
    <text x="400" y="60" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">Japanese proficiency may become a PR requirement</text>
    <text x="400" y="85" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Mandatory language education for long-term residents | Comprehensive policy review</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients and markers -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
