  <text x="600" y="555" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="15">Hoat dong trong tu cach luu tru hop phap la con duong nhanh nhat</text>
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

