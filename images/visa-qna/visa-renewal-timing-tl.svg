<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="60" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="28" font-weight="bold">Kailan Dapat Mag-renew ng Japan Visa?</text>
  <text x="600" y="90" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Kung ma-late ka, magiging overstayer ka</text>

  <rect x="100" y="140" width="1000" height="50" rx="25" fill="#e2e8f0"/>
  <rect x="100" y="140" width="333" height="50" rx="25" fill="#22c55e"/>
  <rect x="433" y="140" width="334" height="50" fill="#eab308"/>
  <rect x="767" y="140" width="333" height="50" rx="25" fill="#ef4444"/>
  <rect x="433" y="140" width="30" height="50" fill="#22c55e"/>
  <rect x="747" y="140" width="30" height="50" fill="#eab308"/>

  <text x="266" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">Safe Zone</text>
  <text x="600" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">Caution Zone</text>
  <text x="933" y="172" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">Delikado!</text>

  <line x1="100" y1="195" x2="100" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="100" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">3 buwan bago</text>
  <line x1="433" y1="195" x2="433" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="433" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">2 buwan bago</text>
  <line x1="767" y1="195" x2="767" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="767" y="238" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="13" font-weight="bold">Expiry Date</text>
  <line x1="1100" y1="195" x2="1100" y2="220" stroke="#334155" stroke-width="2"/>
  <text x="1100" y="238" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">Pagka-expire</text>

  <polygon points="250,125 280,125 265,110" fill="#15803d"/>
  <text x="265" y="105" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14" font-weight="bold">Magsimula Dito</text>

  <g transform="translate(60, 270)">
    <rect width="340" height="130" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="17" font-weight="bold">✓ Nag-apply Bago Mag-expire</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#bbf7d0" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">Legal na manatili hanggang may resulta</text>
    <text x="170" y="93" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">"Pending" stamp sa residence card</text>
    <text x="170" y="116" text-anchor="middle" fill="#166534" font-family="sans-serif" font-size="14">Grace period: hanggang 2 buwan</text>
  </g>

  <g transform="translate(430, 270)">
    <rect width="340" height="130" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="17" font-weight="bold">✕ Na-miss ang Deadline</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#fecaca" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">Kahit 1 araw late = overstay</text>
    <text x="170" y="93" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">Masama sa permanent residency</text>
    <text x="170" y="116" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">Disadvantage sa muling pagpasok</text>
  </g>

  <g transform="translate(800, 270)">
    <rect width="340" height="130" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
    <text x="170" y="30" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="17" font-weight="bold">⚠ Mag-apply Nang Maaga Kung...</text>
    <line x1="30" y1="45" x2="310" y2="45" stroke="#fde68a" stroke-width="1"/>
    <text x="170" y="70" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">April busy season (bagong hire)</text>
    <text x="170" y="93" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">Kakapalit lang ng kumpanya</text>
    <text x="170" y="116" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="14">Nagbago ang trabaho o finances</text>
  </g>

  <rect x="60" y="425" width="1080" height="70" rx="12" fill="#1e293b"/>
  <text x="600" y="455" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="18" font-weight="bold">Susi: Puwedeng mag-apply 3 buwan bago — simulan 2-3 buwan maaga</text>
  <text x="600" y="480" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="15">"1 araw lang naman late" — Napaka-delikadong pag-iisip</text>

  <text x="600" y="540" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="15">Visa management ay career management — huwag hayaang magkaroon ng gap</text>
  <text x="600" y="580" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
