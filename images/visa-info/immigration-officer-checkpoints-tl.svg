<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: warm cream (break from prior pale-cool-slate / dark-indigo / dark-slate-blue) -->
  <rect width="1200" height="630" fill="#fef9e7"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark PAGSUSURI (lower-left, very faint, behind magnifying glass) -->
  <text x="40" y="600" fill="#dc2626" font-family="sans-serif" font-size="200" font-weight="bold" opacity="0.06">PAGSUSURI</text>

  <!-- Background watermark IMMIGRATION · PAGSUSURI (upper-right, small, very faint) -->
  <text x="1170" y="142" text-anchor="end" fill="#ea580c" font-family="sans-serif" font-size="56" font-weight="bold" letter-spacing="6" opacity="0.1">IMMIGRATION · PAGSUSURI</text>

  <!-- Subtle dotted accent arc from upper-left to lower-right (scrutiny path) -->
  <path d="M 80 100 Q 600 200 1120 540" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="2 11" fill="none" opacity="0.25"/>

  <!-- Tiny tag at end of arc -->
  <g transform="translate(1120, 540)">
    <circle r="4" fill="#dc2626" opacity="0.7"/>
    <text x="-10" y="-8" text-anchor="end" fill="#9a3412" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="3" opacity="0.75">HATOL</text>
  </g>

  <!-- ===== RIGHT: right-aligned headline (pattern #3 — break from prior centered / left-aligned / banner) ===== -->

  <!-- Vertical accent bar on the right -->
  <rect x="1114" y="84" width="6" height="240" rx="3" fill="url(#accentGradient)"/>

  <!-- Kicker pill (right-aligned, outlined amber) -->
  <g transform="translate(1092, 102)">
    <rect x="-340" y="-18" width="340" height="34" rx="17" fill="none" stroke="#d97706" stroke-width="1.5"/>
    <text x="-170" y="5" text-anchor="middle" fill="#9a3412" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">MGA PAGSUSURI NG VISA</text>
  </g>

  <!-- Tiny pre-headline label (right-aligned) -->
  <text x="1092" y="148" text-anchor="end" fill="#78716c" font-family="sans-serif" font-size="14" font-weight="500" letter-spacing="2">Mga immigration officer ng Japan</text>

  <!-- Headline (2 lines, right-aligned, large) -->
  <text x="1092" y="212" text-anchor="end" fill="#1c1917" font-family="sans-serif" font-size="56" font-weight="500">Ano ang tinitingnan</text>
  <text x="1092" y="276" text-anchor="end" font-family="sans-serif" font-size="62" font-weight="bold">
    <tspan fill="#1c1917">upang </tspan>
    <tspan fill="#dc2626">magpasiya</tspan>
    <tspan fill="#1c1917"> sa visa?</tspan>
  </text>

  <!-- Thin accent line (right-aligned) -->
  <line x1="980" y1="304" x2="1092" y2="304" stroke="#d97706" stroke-width="2"/>

  <!-- Subtitle (2 lines, right-aligned) -->
  <text x="1092" y="336" text-anchor="end" fill="#57534e" font-family="sans-serif" font-size="17" font-weight="500">Katotohanan · Aktibidad · Kita · Edukasyon · Buwis · Pananatili</text>
  <text x="1092" y="362" text-anchor="end" fill="#57534e" font-family="sans-serif" font-size="17" font-weight="500">Mga pangunahing puntong tinitingnan ng officer</text>

  <!-- ===== LEFT-CENTER: large magnifying glass (circular silhouette — break from card/box silhouettes) ===== -->

  <g transform="translate(280, 360) rotate(-18)">
    <!-- Cast shadow from lens (soft elliptical shadow below) -->
    <ellipse cx="20" cy="170" rx="160" ry="20" fill="#000" opacity="0.10"/>

    <!-- Long handle extending down-right (rounded rod) -->
    <g transform="translate(110, 110) rotate(45)">
      <!-- Handle shadow -->
      <rect x="0" y="6" width="180" height="32" rx="16" fill="#000" opacity="0.18"/>
      <!-- Handle outer (dark slate/charcoal) -->
      <rect x="0" y="0" width="180" height="32" rx="16" fill="#3f2a13"/>
      <!-- Handle inner highlight (top edge) -->
      <rect x="6" y="4" width="166" height="6" rx="3" fill="#7c4a16" opacity="0.7"/>
      <!-- Handle grip ridges -->
      <g stroke="#1c1917" stroke-width="1.2" opacity="0.55">
        <line x1="60" y1="6" x2="60" y2="26"/>
        <line x1="74" y1="6" x2="74" y2="26"/>
        <line x1="88" y1="6" x2="88" y2="26"/>
        <line x1="102" y1="6" x2="102" y2="26"/>
        <line x1="116" y1="6" x2="116" y2="26"/>
        <line x1="130" y1="6" x2="130" y2="26"/>
        <line x1="144" y1="6" x2="144" y2="26"/>
      </g>
      <!-- Handle end cap -->
      <circle cx="180" cy="16" r="18" fill="#3f2a13"/>
      <circle cx="180" cy="16" r="12" fill="#1c1917"/>
      <circle cx="176" cy="12" r="3" fill="#7c4a16" opacity="0.6"/>
    </g>

    <!-- Lens outer rim (gold/brass thick ring) -->
    <circle r="148" fill="none" stroke="#b45309" stroke-width="18"/>
    <!-- Lens outer rim inner highlight -->
    <circle r="139" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
    <!-- Lens outer rim outer thin ring -->
    <circle r="158" fill="none" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>

    <!-- Lens glass (faint blue tint with high opacity for visibility of content) -->
    <circle r="130" fill="#e0f2fe" opacity="0.85"/>
    <!-- Inner glass tint (subtle gradient via concentric) -->
    <circle r="124" fill="#f0f9ff" opacity="0.6"/>

    <!-- ===== INSIDE LENS: enlarged document fragments visible through the glass ===== -->
    <g transform="rotate(18)">
      <!-- Top-left fragment: Resume row -->
      <g transform="translate(-78, -78)">
        <text x="0" y="0" fill="#9a3412" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">Resume</text>
        <line x1="0" y1="6" x2="80" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <line x1="0" y1="14" x2="64" y2="14" stroke="#a8a29e" stroke-width="0.8"/>
        <line x1="0" y1="22" x2="72" y2="22" stroke="#a8a29e" stroke-width="0.8"/>
        <!-- Small red checkmark -->
        <path d="M 84 8 L 90 14 L 102 0" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Middle-right fragment: Kita row with checkmark -->
      <g transform="translate(8, -34)">
        <text x="0" y="0" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Kita</text>
        <text x="34" y="0" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="500">· Buwis · Pension</text>
        <line x1="0" y1="6" x2="100" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <path d="M 108 -3 L 113 2 L 122 -8" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Middle row: Status ng Visa -->
      <g transform="translate(-72, 10)">
        <text x="0" y="0" fill="#1c1917" font-family="sans-serif" font-size="13" font-weight="bold">Status</text>
        <text x="58" y="0" fill="#57534e" font-family="sans-serif" font-size="13" font-weight="500">· Aktibidad</text>
        <line x1="0" y1="6" x2="116" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <path d="M 124 -3 L 129 2 L 138 -8" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Lower-left fragment: Edukasyon · Karanasan row -->
      <g transform="translate(-78, 50)">
        <text x="0" y="0" fill="#1c1917" font-family="sans-serif" font-size="13" font-weight="bold">Edukasyon · Karanasan</text>
        <line x1="0" y1="6" x2="92" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <line x1="0" y1="14" x2="76" y2="14" stroke="#a8a29e" stroke-width="0.8"/>
        <path d="M 100 -3 L 105 2 L 114 -8" stroke="#16a34a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Lower-right: Pananatili row with warning mark -->
      <g transform="translate(20, 86)">
        <text x="0" y="0" fill="#1c1917" font-family="sans-serif" font-size="13" font-weight="bold">Pananatili</text>
        <line x1="0" y1="6" x2="88" y2="6" stroke="#a8a29e" stroke-width="0.8"/>
        <!-- Magnifier circle (extra emphasis on this row) -->
        <circle cx="100" cy="0" r="7" fill="none" stroke="#dc2626" stroke-width="1.6"/>
        <line x1="105" y1="5" x2="110" y2="10" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Tiny SURI stamp overlay (lower-left of lens content, slightly tilted) -->
      <g transform="translate(-90, 92) rotate(-10)">
        <circle r="22" fill="none" stroke="#dc2626" stroke-width="2.2" opacity="0.85"/>
        <text y="5" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="1" opacity="0.9">SURI</text>
      </g>
    </g>

    <!-- Outer glass highlight (top-left arc, simulates light reflection) -->
    <path d="M -100 -68 Q -68 -110 0 -116" stroke="#ffffff" stroke-width="9" fill="none" opacity="0.65" stroke-linecap="round"/>
    <path d="M -82 -52 Q -56 -82 -8 -90" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round"/>
  </g>

  <!-- ===== LOWER-RIGHT: single supporting callout (accurate document-based principle) ===== -->
  <g transform="translate(680, 484)">
    <!-- Dark callout block -->
    <rect width="492" height="92" rx="14" fill="#1c1917"/>
    <!-- Left accent stripe -->
    <rect width="6" height="92" rx="3" fill="#f59e0b"/>

    <!-- Small icon: checkmark on stamp -->
    <g transform="translate(28, 26)">
      <!-- Stamp circle outer -->
      <circle cx="20" cy="20" r="20" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
      <!-- Stamp circle inner -->
      <circle cx="20" cy="20" r="15" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.6"/>
      <!-- Checkmark inside -->
      <path d="M 11 21 L 18 28 L 30 12" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Label -->
    <text x="84" y="40" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="4">BATAYANG TUNTUNIN</text>
    <!-- Main message -->
    <text x="84" y="70" fill="#fef9e7" font-family="sans-serif" font-size="18" font-weight="bold">Wastong dokumento ang pinakamahalaga</text>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
</svg>
