<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: very dark crimson (warning, distinct from stone/indigo/cream/emerald/slate) -->
  <rect width="1200" height="630" fill="#1a0a0e"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark 退去 (large, lower-right, very faint) -->
  <text x="1180" y="610" text-anchor="end" fill="#dc2626" font-family="serif" font-size="280" font-weight="bold" opacity="0.05">退去</text>

  <!-- ===== TOP OVERLAY BANNER (translucent dark band over scene) ===== -->
  <rect x="0" y="48" width="1200" height="206" fill="#1a0a0e" opacity="0.88"/>
  <line x1="0" y1="48" x2="1200" y2="48" stroke="#dc2626" stroke-width="1" opacity="0.6"/>
  <line x1="0" y1="254" x2="1200" y2="254" stroke="#dc2626" stroke-width="1" opacity="0.6"/>

  <!-- Kicker chip (outlined pill) -->
  <g transform="translate(600, 96)">
    <rect x="-200" y="-19" width="400" height="36" rx="18" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="5">निर्वासन · 強制退去 · १० घटना</text>
  </g>

  <!-- Headline (2 lines, centered) -->
  <text x="600" y="176" text-anchor="middle" fill="#f5f5f4" font-family="sans-serif" font-size="40" font-weight="500">यस्तो अवस्थामा जापानमा</text>
  <text x="600" y="234" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="58" font-weight="bold">निर्वासन हुनेछ</text>

  <!-- ===== MAIN SCENE: Hinomaru sun + Mt. Fuji + departing commercial jet ===== -->

  <!-- Hinomaru-style red sun rising behind Mt. Fuji (instantly recognizable Japan motif) -->
  <circle cx="320" cy="430" r="86" fill="#dc2626" opacity="0.92"/>
  <circle cx="320" cy="430" r="86" fill="none" stroke="#fca5a5" stroke-width="1" opacity="0.4"/>

  <!-- Subtle radiating rays from sun -->
  <g opacity="0.18" stroke="#fbbf24" stroke-width="1.5">
    <line x1="320" y1="320" x2="320" y2="296"/>
    <line x1="396" y1="354" x2="416" y2="334"/>
    <line x1="244" y1="354" x2="224" y2="334"/>
    <line x1="430" y1="430" x2="456" y2="430"/>
    <line x1="210" y1="430" x2="184" y2="430"/>
  </g>

  <!-- Mt. Fuji main body (symmetric mountain with concave slopes) -->
  <path d="M 80 595 Q 200 538 290 410 Q 320 376 350 410 Q 440 538 560 595 Z" fill="#3f1014" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Mt. Fuji second peak fold for depth -->
  <path d="M 280 470 Q 305 440 320 420 Q 335 440 360 470 Q 340 480 320 478 Q 300 480 280 470 Z" fill="#2d0a0d" opacity="0.7"/>

  <!-- Snow cap at peak (jagged base) -->
  <path d="M 272 444 Q 295 422 320 412 Q 345 422 368 444 L 360 452 L 348 444 L 336 454 L 322 446 L 308 454 L 296 444 L 284 454 L 272 444 Z" fill="#fef3c7" opacity="0.95"/>

  <!-- Snow streaks running down from cap -->
  <path d="M 286 454 L 273 490" stroke="#fef3c7" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 308 458 L 298 502" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M 332 458 L 342 502" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M 354 454 L 367 490" stroke="#fef3c7" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Japan label -->
  <text x="320" y="622" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="6" opacity="0.85">日本 · JAPAN</text>

  <!-- Departure origin marker at Fuji peak -->
  <circle cx="320" cy="408" r="5" fill="#fbbf24"/>
  <circle cx="320" cy="408" r="12" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.55"/>

  <!-- Dotted flight path arc (rising from Fuji peak up over to departing airplane) -->
  <path d="M 320 408 Q 680 280 1015 360" stroke="#fbbf24" stroke-width="3" stroke-dasharray="3 14" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- Faint echo arc for depth -->
  <path d="M 320 420 Q 700 308 1025 378" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="1 10" fill="none" opacity="0.35"/>

  <!-- ===== DEPARTING COMMERCIAL JET (mid-right, clearly recognizable) ===== -->
  <g transform="translate(1015, 360) rotate(10)">
    <!-- Drop shadow -->
    <ellipse cx="4" cy="9" rx="118" ry="11" fill="#000" opacity="0.5"/>

    <!-- Main fuselage (pill shape with tapered nose) -->
    <path d="M -118 0 L -88 -13 L 70 -13 Q 124 -8 124 0 Q 124 8 70 13 L -88 13 Z" fill="#f5f5f4"/>

    <!-- Cockpit windscreen (tinted dark at nose) -->
    <path d="M 95 -8 Q 118 -5 118 0 Q 118 5 95 8 L 80 6 L 80 -6 Z" fill="#7f1d1d" opacity="0.55"/>

    <!-- Vertical stabilizer (tail fin, swept-back) -->
    <path d="M -100 -13 L -118 -52 L -94 -52 L -72 -13 Z" fill="#e7e5e4"/>
    <path d="M -100 -13 L -118 -52 L -94 -52 L -72 -13 Z" fill="none" stroke="#a8a29e" stroke-width="0.8"/>

    <!-- Main wing (top, large swept-back) -->
    <path d="M -22 -13 L -78 -80 L -52 -80 L 24 -13 Z" fill="#f5f5f4"/>
    <path d="M -22 -13 L -78 -80 L -52 -80 L 24 -13 Z" fill="none" stroke="#d6d3d1" stroke-width="0.8"/>

    <!-- Main wing (bottom, slightly darker for perspective) -->
    <path d="M -22 13 L -78 80 L -52 80 L 24 13 Z" fill="#d6d3d1"/>
    <path d="M -22 13 L -78 80 L -52 80 L 24 13 Z" fill="none" stroke="#a8a29e" stroke-width="0.8"/>

    <!-- Horizontal tail stabilizers -->
    <path d="M -94 -13 L -124 -38 L -108 -38 L -78 -13 Z" fill="#f5f5f4"/>
    <path d="M -94 13 L -124 38 L -108 38 L -78 13 Z" fill="#d6d3d1"/>

    <!-- Engine pod under top wing -->
    <ellipse cx="-32" cy="-44" rx="12" ry="5" fill="#a8a29e"/>
    <ellipse cx="-36" cy="-44" rx="4" ry="3.5" fill="#1c1917"/>

    <!-- Engine pod under bottom wing -->
    <ellipse cx="-32" cy="44" rx="12" ry="5" fill="#737373"/>
    <ellipse cx="-36" cy="44" rx="4" ry="3.5" fill="#1c1917"/>

    <!-- Windows row (small circles along fuselage) -->
    <g fill="#7f1d1d" opacity="0.7">
      <circle cx="-70" cy="-2" r="1.6"/>
      <circle cx="-55" cy="-2" r="1.6"/>
      <circle cx="-40" cy="-2" r="1.6"/>
      <circle cx="-25" cy="-2" r="1.6"/>
      <circle cx="-10" cy="-2" r="1.6"/>
      <circle cx="5" cy="-2" r="1.6"/>
      <circle cx="20" cy="-2" r="1.6"/>
      <circle cx="35" cy="-2" r="1.6"/>
      <circle cx="50" cy="-2" r="1.6"/>
    </g>

    <!-- Door indicator -->
    <rect x="-78" y="-7" width="6" height="14" rx="1" fill="none" stroke="#7f1d1d" stroke-width="0.8" opacity="0.6"/>

    <!-- Nose highlight -->
    <ellipse cx="30" cy="-7" rx="44" ry="2.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- ===== LOWER-RIGHT: prominent RE-ENTRY BAN callout (bigger, more visible) ===== -->
  <g transform="translate(800, 500)">
    <!-- Dashed warning border container -->
    <rect width="360" height="100" rx="14" fill="#2d0a0d" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>

    <!-- Top label -->
    <text x="24" y="34" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">पुन: प्रवेश निषेध · 再入国禁止</text>

    <!-- Thin separator -->
    <line x1="24" y1="46" x2="156" y2="46" stroke="#dc2626" stroke-width="1" opacity="0.55"/>

    <!-- Main value (big, prominent) -->
    <text x="24" y="80" fill="#f5f5f4" font-family="sans-serif" font-size="28" font-weight="bold">५ वर्ष · १० वर्ष</text>
    <text x="220" y="80" fill="#fca5a5" font-family="sans-serif" font-size="18" font-weight="600">पुन: प्रवेश प्रतिबन्ध</text>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>
