<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="80" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">4 na Hakbang ng Aplikasyon</text>

  <!-- Step 1 -->
  <circle cx="180" cy="250" r="80" fill="#3b82f6"/>
  <text x="180" y="240" text-anchor="middle" fill="white" font-family="sans-serif" font-size="56" font-weight="bold">1</text>
  <text x="180" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">Dokumento</text>

  <!-- Arrow 1-2 -->
  <text x="310" y="260" fill="#94a3b8" font-family="sans-serif" font-size="50" font-weight="bold">&gt;</text>

  <!-- Step 2 -->
  <circle cx="450" cy="250" r="80" fill="#8b5cf6"/>
  <text x="450" y="240" text-anchor="middle" fill="white" font-family="sans-serif" font-size="56" font-weight="bold">2</text>
  <text x="450" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">Mag-apply</text>

  <!-- Arrow 2-3 -->
  <text x="580" y="260" fill="#94a3b8" font-family="sans-serif" font-size="50" font-weight="bold">&gt;</text>

  <!-- Step 3 -->
  <circle cx="720" cy="250" r="80" fill="#f59e0b"/>
  <text x="720" y="240" text-anchor="middle" fill="white" font-family="sans-serif" font-size="56" font-weight="bold">3</text>
  <text x="720" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">Pagsusuri</text>

  <!-- Arrow 3-4 -->
  <text x="850" y="260" fill="#94a3b8" font-family="sans-serif" font-size="50" font-weight="bold">&gt;</text>

  <!-- Step 4 -->
  <circle cx="990" cy="250" r="80" fill="#10b981"/>
  <text x="990" y="240" text-anchor="middle" fill="white" font-family="sans-serif" font-size="56" font-weight="bold">4</text>
  <text x="990" y="290" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">Aprubado</text>

  <!-- Bottom summary -->
  <rect x="100" y="400" width="1000" height="100" rx="16" fill="#1e293b"/>
  <text x="600" y="445" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="36" font-weight="bold">Paghahanda ng dokumento ang susi!</text>
  <text x="600" y="485" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="28">Kabuuang tagal: mga 1~3 buwan</text>

  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="24">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>