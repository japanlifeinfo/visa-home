<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="36" font-weight="bold">일본 여행, 비자가 필요할까?</text>
  <text x="600" y="105" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="20">국적에 따라 다릅니다</text>

  <!-- Center: 90 Days Circle -->
  <circle cx="600" cy="290" r="95" fill="white" stroke="#e2e8f0" stroke-width="3"/>
  <text x="600" y="275" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="56" font-weight="bold">90</text>
  <text x="600" y="310" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="20">일 이내</text>
  <text x="600" y="340" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">단기체류 최대 기간</text>

  <!-- Left Panel: 비자 면제 -->
  <g transform="translate(50, 150)">
    <rect width="420" height="280" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <circle cx="50" cy="40" r="22" fill="#16a34a"/>
    <text x="50" y="47" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">✓</text>
    <text x="82" y="48" fill="#15803d" font-family="sans-serif" font-size="22" font-weight="bold">비자 면제 국가</text>
    <text x="35" y="90" fill="#1e293b" font-family="sans-serif" font-size="17" font-weight="bold">비자 없이 입국 가능</text>
    <text x="35" y="125" fill="#64748b" font-family="sans-serif" font-size="15">• 한국 · 미국 · 캐나다</text>
    <text x="35" y="150" fill="#64748b" font-family="sans-serif" font-size="15">• 대부분 EU 국가</text>
    <text x="35" y="175" fill="#64748b" font-family="sans-serif" font-size="15">• 호주 · 뉴질랜드 등</text>
    <rect x="35" y="200" width="350" height="50" rx="10" fill="#dcfce7"/>
    <text x="210" y="222" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="14">관광 · 친지 방문 · 단기 출장 OK</text>
    <text x="210" y="240" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold">취업은 절대 불가!</text>
  </g>

  <!-- Right Panel: 비자 필요 -->
  <g transform="translate(730, 150)">
    <rect width="420" height="280" rx="20" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <circle cx="50" cy="40" r="22" fill="#dc2626"/>
    <text x="50" y="48" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">!</text>
    <text x="82" y="48" fill="#991b1b" font-family="sans-serif" font-size="22" font-weight="bold">비자 필요 국가</text>
    <text x="35" y="90" fill="#1e293b" font-family="sans-serif" font-size="17" font-weight="bold">사전 비자 발급 필수</text>
    <text x="35" y="125" fill="#64748b" font-family="sans-serif" font-size="15">• 일부 동남아시아 국가</text>
    <text x="35" y="150" fill="#64748b" font-family="sans-serif" font-size="15">• 일부 아프리카 국가</text>
    <text x="35" y="175" fill="#64748b" font-family="sans-serif" font-size="15">• 일부 중동 국가 등</text>
    <rect x="35" y="200" width="350" height="50" rx="10" fill="#fee2e2"/>
    <text x="210" y="222" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14">외무성 홈페이지에서</text>
    <text x="210" y="240" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="14" font-weight="bold">최신 대상국 확인 필수</text>
  </g>

  <!-- Bottom Warning Strip -->
  <g transform="translate(100, 460)">
    <rect width="1000" height="105" rx="16" fill="#1e293b"/>
    <text x="500" y="30" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold">⚠ 비자 면제라도 주의사항</text>
    <text x="250" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">왕복 항공권 준비</text>
    <text x="500" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">숙박 · 일정 증빙</text>
    <text x="750" y="60" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">충분한 여행 경비</text>
    <text x="500" y="88" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">90일 초과 체류 시 → 유학 · 취업 · 워킹홀리데이 등 장기 재류자격 필요</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
