<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Opisyal</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Gabay sa mga Kinakailangang Dokumento</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(40, 25)">
      <!-- Embassy/Government building -->
      <polygon points="60,15 20,35 100,35" fill="#1e3a5f"/>
      <rect x="25" y="35" width="70" height="60" fill="#1e40af"/>
      <!-- Columns -->
      <rect x="30" y="40" width="10" height="55" fill="#3b82f6"/>
      <rect x="45" y="40" width="10" height="55" fill="#3b82f6"/>
      <rect x="60" y="40" width="10" height="55" fill="#3b82f6"/>
      <rect x="75" y="40" width="10" height="55" fill="#3b82f6"/>
      <!-- Door -->
      <rect x="50" y="70" width="20" height="25" fill="#1e3a5f"/>
      <!-- Flag pole -->
      <rect x="95" y="20" width="3" height="75" fill="#6b7280"/>
      <!-- Flag -->
      <rect x="98" y="25" width="30" height="20" fill="#f0f9ff"/>
      <circle cx="113" cy="35" r="6" fill="#ef4444"/>
      <!-- Official seal/badge -->
      <circle cx="60" cy="55" r="12" fill="#fbbf24"/>
      <polygon points="60,45 62,51 68,51 63,55 65,61 60,57 55,61 57,55 52,51 58,51" fill="#92400e"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Status para sa Diplomatic/Official Visa</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Empleyado ng dayuhang gobyerno o int'l organization</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Staff ng embassy/consulate at kanilang pamilya</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Panahon: 5 taon, 3 taon, 1 taon, 3 buwan, 30 araw, 15 araw</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">&#10003;</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Pwedeng mag-apply: Pagkilala, Pagbabago, Pag-renew</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">公用</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
