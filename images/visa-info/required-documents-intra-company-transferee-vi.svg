<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="40" font-weight="bold">Chuyen cong tac noi bo</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(40, 40)">
      <!-- Building 1 (overseas) -->
      <rect x="10" y="50" width="45" height="70" fill="#60a5fa"/>
      <rect x="15" y="55" width="10" height="10" fill="#bfdbfe"/>
      <rect x="30" y="55" width="10" height="10" fill="#bfdbfe"/>
      <rect x="15" y="70" width="10" height="10" fill="#bfdbfe"/>
      <rect x="30" y="70" width="10" height="10" fill="#bfdbfe"/>
      <rect x="15" y="85" width="10" height="10" fill="#bfdbfe"/>
      <rect x="30" y="85" width="10" height="10" fill="#bfdbfe"/>
      <!-- Arrow -->
      <polygon points="65,85 85,75 85,80 110,80 110,90 85,90 85,95" fill="#3b82f6"/>
      <!-- Building 2 (Japan) -->
      <rect x="85" y="50" width="45" height="70" fill="#1d4ed8"/>
      <rect x="90" y="55" width="10" height="10" fill="#93c5fd"/>
      <rect x="105" y="55" width="10" height="10" fill="#93c5fd"/>
      <rect x="90" y="70" width="10" height="10" fill="#93c5fd"/>
      <rect x="105" y="70" width="10" height="10" fill="#93c5fd"/>
      <rect x="90" y="85" width="10" height="10" fill="#93c5fd"/>
      <rect x="105" y="85" width="10" height="10" fill="#93c5fd"/>
      <!-- Person icon -->
      <circle cx="70" cy="35" r="12" fill="#2563eb"/>
      <rect x="60" y="48" width="20" height="5" rx="2" fill="#2563eb"/>
      <!-- Labels -->
      <text x="32" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">Nuoc ngoai</text>
      <text x="108" y="135" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="10">Nhat Ban</text>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Chuyen cong tac trong noi bo cty</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Tu van phong nuoc ngoai den Nhat Ban</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Cong viec ky thuat/nhan van/quoc te</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 5 nam, 3 nam, 1 nam, 3 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dbeafe"/>
        <text x="12" y="17" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Chuyen cong tac trong thoi gian nhat dinh</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="305" y="290" width="190" height="44" rx="22" fill="#dbeafe"/>
    <text x="400" y="320" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="18" font-weight="bold">企業内転勤</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
