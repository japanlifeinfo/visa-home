<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="signGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#fdf6e3"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark (English): CAUTION -->
  <text x="1180" y="612" text-anchor="end" fill="#dc2626" font-family="sans-serif" font-size="200" font-weight="bold" opacity="0.05" letter-spacing="-4">CAUTION</text>

  <g opacity="0.30">
    <circle cx="60" cy="80" r="2" fill="#d97706"/>
    <circle cx="90" cy="80" r="2" fill="#d97706"/>
    <circle cx="120" cy="80" r="2" fill="#d97706"/>
    <circle cx="60" cy="110" r="2" fill="#d97706"/>
    <circle cx="90" cy="110" r="2" fill="#d97706"/>
    <circle cx="60" cy="140" r="2" fill="#d97706"/>
  </g>

  <circle cx="1110" cy="100" r="44" fill="#fbbf24" opacity="0.22"/>
  <circle cx="1060" cy="160" r="22" fill="#dc2626" opacity="0.16"/>
  <circle cx="80" cy="540" r="38" fill="#dc2626" opacity="0.10"/>

  <!-- Kicker pill (centered) — W=272 -->
  <g transform="translate(600, 56)">
    <rect x="-174" y="0" width="348" height="36" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="-154" cy="18" r="4.5" fill="#dc2626"/>
    <text x="-138" y="24" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">VISA AGENCY · CAUTIONS</text>
  </g>

  <!-- Prohibition sign -->
  <circle cx="600" cy="280" r="210" fill="url(#signGlow)"/>
  <circle cx="600" cy="280" r="170" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.45"/>
  <circle cx="600" cy="280" r="150" fill="#ffffff" stroke="#dc2626" stroke-width="12"/>
  <text x="600" y="315" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="100" font-weight="900" letter-spacing="-3">100%</text>
  <line x1="494" y1="174" x2="706" y2="386" stroke="#dc2626" stroke-width="14" stroke-linecap="round" opacity="0.95"/>

  <!-- Headline -->
  <text x="600" y="510" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="44" font-weight="bold">No approval guarantee</text>

  <!-- Subtitle -->
  <text x="600" y="548" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="19" font-weight="500">The Immigration Services Agency decides every visa case</text>

  <!-- Chip row: 160 + 192 + 204 + 32 = 588, left = 306 -->
  <g transform="translate(306, 578)">
    <g>
      <rect width="160" height="40" rx="20" fill="#0f172a"/>
      <g transform="translate(18, 20)">
        <circle r="8" fill="#fca5a5"/>
        <path d="M 0 -3 L 0 1 M 0 3.5 L 0 4" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
      <text x="38" y="26" fill="#fee2e2" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="1">Verify Ads</text>
    </g>
    <g transform="translate(176, 0)">
      <rect width="192" height="40" rx="20" fill="#0f172a"/>
      <g transform="translate(18, 20)">
        <circle r="8" fill="#fcd34d"/>
        <path d="M -3.5 -3.5 L 3.5 3.5 M 3.5 -3.5 L -3.5 3.5" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <text x="38" y="26" fill="#fef3c7" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="1">Fake Doc Risk</text>
    </g>
    <g transform="translate(384, 0)">
      <rect width="204" height="40" rx="20" fill="#0f172a"/>
      <g transform="translate(18, 20)">
        <circle r="8" fill="#5eead4"/>
        <path d="M -4.5 0 L -1 3.5 L 4.5 -3" stroke="#0f172a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="38" y="26" fill="#ccfbf1" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="1">Your Liability</text>
    </g>
  </g>
</svg>
