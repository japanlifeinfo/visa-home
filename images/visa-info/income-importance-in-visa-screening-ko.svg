<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="yenGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="48%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="coinGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stampInk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== TWO-PANEL VERTICAL SPLIT BACKGROUND ===== -->
  <!-- Left panel: warm cream (gold ¥ side) -->
  <rect x="0" y="0" width="500" height="630" fill="#fef3c7"/>
  <!-- Right panel: deep teal-navy (text side) -->
  <rect x="500" y="0" width="700" height="630" fill="#0c4a6e"/>
  <!-- Top gradient bar spans full width -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Subtle seam highlight on the split -->
  <line x1="500" y1="8" x2="500" y2="630" stroke="#d97706" stroke-width="2" opacity="0.4"/>

  <!-- Background watermark on left panel: "소득" Korean only -->
  <text x="40" y="600" fill="#d97706" font-family="sans-serif" font-size="100" font-weight="bold" letter-spacing="-4" opacity="0.13">소득</text>

  <!-- Subtle dotted accent grid on right panel (upper-right area) -->
  <g opacity="0.14">
    <circle cx="1100" cy="80" r="2" fill="#7dd3fc"/>
    <circle cx="1130" cy="80" r="2" fill="#7dd3fc"/>
    <circle cx="1160" cy="80" r="2" fill="#7dd3fc"/>
    <circle cx="1100" cy="110" r="2" fill="#7dd3fc"/>
    <circle cx="1130" cy="110" r="2" fill="#7dd3fc"/>
    <circle cx="1100" cy="140" r="2" fill="#7dd3fc"/>
  </g>

  <!-- Small decorative accent circle bottom-right of right panel -->
  <circle cx="1140" cy="570" r="48" fill="#fbbf24" opacity="0.08"/>

  <!-- =============================================================== -->
  <!-- LEFT PANEL: GIANT ¥ TYPOGRAPHY HERO + COIN STACK + 심사 STAMP -->
  <!-- =============================================================== -->

  <!-- Glow halo behind ¥ -->
  <circle cx="250" cy="290" r="230" fill="url(#halo)"/>

  <!-- Stacked coins at lower portion (3 overlapping disc coins) -->
  <g transform="translate(250, 540)">
    <!-- Bottom coin (largest) -->
    <ellipse cx="0" cy="0" rx="170" ry="26" fill="#78350f" opacity="0.85"/>
    <ellipse cx="0" cy="-8" rx="170" ry="26" fill="url(#coinGold)"/>
    <ellipse cx="0" cy="-8" rx="170" ry="26" fill="none" stroke="#92400e" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" fill="#92400e" font-family="serif" font-size="24" font-weight="bold" opacity="0.55">¥</text>

    <!-- Middle coin -->
    <ellipse cx="0" cy="-44" rx="138" ry="22" fill="#78350f" opacity="0.85"/>
    <ellipse cx="0" cy="-50" rx="138" ry="22" fill="url(#coinGold)"/>
    <ellipse cx="0" cy="-50" rx="138" ry="22" fill="none" stroke="#92400e" stroke-width="1.3"/>
    <text x="0" y="-44" text-anchor="middle" fill="#92400e" font-family="serif" font-size="20" font-weight="bold" opacity="0.55">¥</text>

    <!-- Top coin (smallest) -->
    <ellipse cx="0" cy="-82" rx="108" ry="18" fill="#78350f" opacity="0.85"/>
    <ellipse cx="0" cy="-87" rx="108" ry="18" fill="url(#coinGold)"/>
    <ellipse cx="0" cy="-87" rx="108" ry="18" fill="none" stroke="#92400e" stroke-width="1.1"/>
    <text x="0" y="-82" text-anchor="middle" fill="#92400e" font-family="serif" font-size="17" font-weight="bold" opacity="0.55">¥</text>
  </g>

  <!-- THE GIANT ¥ — typography hero centerpiece -->
  <text x="250" y="378" text-anchor="middle" font-family="serif" font-size="380" font-weight="bold" fill="url(#yenGold)" stroke="#78350f" stroke-width="2.5">¥</text>

  <!-- ===== 심사 RED STAMP overlay (upper-right of ¥) ===== -->
  <g transform="translate(388, 158) rotate(14)">
    <!-- Ink halo -->
    <circle r="68" fill="url(#stampInk)" opacity="0.85"/>
    <!-- Outer ink smudge -->
    <circle r="56" fill="#dc2626" opacity="0.10"/>
    <!-- Outer ring (thick) -->
    <circle r="48" fill="none" stroke="#dc2626" stroke-width="3.5"/>
    <!-- Inner ring (thin) -->
    <circle r="40" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    <!-- "심사" text inside stamp -->
    <text y="10" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="28" font-weight="bold" letter-spacing="2">심사</text>
    <!-- Ink imperfections -->
    <circle cx="-34" cy="-26" r="1.8" fill="#dc2626" opacity="0.55"/>
    <circle cx="36" cy="28" r="1.6" fill="#dc2626" opacity="0.5"/>
    <circle cx="-30" cy="34" r="1.4" fill="#dc2626" opacity="0.5"/>
  </g>

  <!-- =============================================================== -->
  <!-- RIGHT PANEL: KICKER + HEADLINE + SUBTITLE + CALLOUT -->
  <!-- =============================================================== -->

  <!-- Kicker pill (top, left-aligned within right panel) -->
  <g transform="translate(550, 96)">
    <rect width="296" height="34" rx="17" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="148" y="22" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">소득 · 일본 비자 심사</text>
  </g>

  <!-- Pre-headline (smaller, above main headline) -->
  <text x="550" y="180" fill="#7dd3fc" font-family="sans-serif" font-size="18" font-weight="500" letter-spacing="2">연봉만이 답은 아니지만</text>

  <!-- Main headline (2 lines, left-aligned) -->
  <text x="550" y="248" fill="#f1f5f9" font-family="sans-serif" font-size="56" font-weight="bold">소득은 비자 심사의</text>
  <text x="550" y="312" fill="#fbbf24" font-family="sans-serif" font-size="56" font-weight="bold">핵심 판단 자료</text>

  <!-- Thin accent line under headline -->
  <line x1="550" y1="346" x2="650" y2="346" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- Subtitle (2 lines, left-aligned) -->
  <text x="550" y="386" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="500">취업 · 배우자 · 가족체재 · 영주권 심사 모두</text>
  <text x="550" y="414" fill="#cbd5e1" font-family="sans-serif" font-size="18" font-weight="500">입관은 신청자의 경제적 자립 능력을 확인합니다</text>

  <!-- ===== BOTTOM CALLOUT (single supporting dark block) ===== -->
  <g transform="translate(550, 472)">
    <!-- Callout body -->
    <rect width="600" height="100" rx="14" fill="#0e2942" stroke="#fbbf24" stroke-width="1.2"/>
    <!-- Left accent stripe -->
    <rect width="6" height="100" rx="3" fill="#fbbf24"/>

    <!-- Small icon: yen circle with check -->
    <g transform="translate(28, 26)">
      <circle cx="24" cy="24" r="22" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <text x="24" y="33" text-anchor="middle" fill="#fbbf24" font-family="serif" font-size="22" font-weight="bold">¥</text>
    </g>

    <!-- Label -->
    <text x="92" y="40" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="4">심사 포인트</text>
    <!-- Main message -->
    <text x="92" y="74" fill="#fef9c3" font-family="sans-serif" font-size="22" font-weight="bold">연봉뿐 아니라 세금 · 연금 · 보험까지</text>
  </g>
</svg>
