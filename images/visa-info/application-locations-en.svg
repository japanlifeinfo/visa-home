<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="34" font-weight="bold">Addresses and phone numbers for all 47 prefectures</text>

  <!-- Step 1 (top-left) -->
  <g transform="translate(120, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dbeafe"/>
    <text x="45" y="53" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="20" font-weight="bold">🏢</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Office Network</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">8 main offices nationwide</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">3 branch bureaus</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">About 55 branch offices</text>
  </g>

  <!-- Step 2 (top-right) -->
  <g transform="translate(620, 110)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#dcfce7"/>
    <text x="45" y="53" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="20" font-weight="bold">📍</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Check Jurisdiction</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Based on place of residence</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Designated office per prefecture</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Verify online</text>
  </g>

  <!-- Step 3 (bottom-left) -->
  <g transform="translate(120, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fef3c7"/>
    <text x="45" y="53" text-anchor="middle" fill="#d97706" font-family="sans-serif" font-size="20" font-weight="bold">🕐</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Operating Hours</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Weekdays 9:00-16:00</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Busy during lunch hours</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Check peak periods in advance</text>
  </g>

  <!-- Step 4 (bottom-right) -->
  <g transform="translate(620, 300)">
    <rect width="460" height="165" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="45" cy="45" r="28" fill="#fce7f3"/>
    <text x="45" y="53" text-anchor="middle" fill="#db2777" font-family="sans-serif" font-size="20" font-weight="bold">📋</text>
    <text x="90" y="52" fill="#1e293b" font-family="sans-serif" font-size="20" font-weight="bold">Visit Preparation</text>
    <text x="45" y="92" fill="#64748b" font-family="sans-serif" font-size="15">Bring passport &amp; residence card</text>
    <text x="45" y="114" fill="#64748b" font-family="sans-serif" font-size="15">Prepare documents in advance</text>
    <text x="45" y="136" fill="#64748b" font-family="sans-serif" font-size="15">Revenue stamps ready</text>
  </g>

  <!-- Key Points Box -->
  <g transform="translate(200, 495)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">Key Points</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">Residence-based jurisdiction | 47 prefectures | 66+ offices</text>
  </g>

  <!-- Footer -->
  <text x="600" y="610" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>