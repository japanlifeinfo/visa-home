<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f0f9ff"/>
  <rect width="1200" height="8" fill="url(#hg)"/>

  <text x="600" y="70" text-anchor="middle" fill="#0c4a6e" font-family="sans-serif" font-size="40" font-weight="bold">재류카드 주소 변경 절차 완전 정리</text>

  <!-- Case A: Same city -->
  <rect x="60" y="105" width="520" height="370" rx="16" fill="white" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="60" y="105" width="520" height="45" rx="16" fill="#0284c7"/>
  <rect x="60" y="130" width="520" height="20" fill="#0284c7"/>
  <text x="320" y="137" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">같은 시·구 내 이동</text>

  <circle cx="120" cy="195" r="20" fill="#0ea5e9"/>
  <text x="120" y="202" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">1</text>
  <text x="155" y="202" fill="#334155" font-family="sans-serif" font-size="20">시청·구청 방문</text>

  <circle cx="120" cy="250" r="20" fill="#0ea5e9"/>
  <text x="120" y="257" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">2</text>
  <text x="155" y="257" fill="#334155" font-family="sans-serif" font-size="20">전거신고(転居届) 제출</text>

  <circle cx="120" cy="305" r="20" fill="#0ea5e9"/>
  <text x="120" y="312" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">3</text>
  <text x="155" y="312" fill="#334155" font-family="sans-serif" font-size="20">재류카드 제시</text>

  <circle cx="120" cy="360" r="20" fill="#0ea5e9"/>
  <text x="120" y="367" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">4</text>
  <text x="155" y="367" fill="#334155" font-family="sans-serif" font-size="20">카드 뒷면에 새 주소 기재</text>

  <rect x="90" y="400" width="460" height="50" rx="10" fill="#ecfdf5"/>
  <text x="320" y="432" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="20" font-weight="bold">당일 처리 완료 (10~20분)</text>

  <!-- Case B: Different city -->
  <rect x="620" y="105" width="520" height="370" rx="16" fill="white" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="620" y="105" width="520" height="45" rx="16" fill="#7e22ce"/>
  <rect x="620" y="130" width="520" height="20" fill="#7e22ce"/>
  <text x="880" y="137" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">다른 시·구로 이동</text>

  <circle cx="680" cy="190" r="18" fill="#a855f7"/>
  <text x="680" y="196" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">1</text>
  <text x="710" y="196" fill="#334155" font-family="sans-serif" font-size="18">기존 시청에서 전출신고(転出届)</text>

  <circle cx="680" cy="233" r="18" fill="#a855f7"/>
  <text x="680" y="239" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">2</text>
  <text x="710" y="239" fill="#334155" font-family="sans-serif" font-size="18">전출증명서 수령</text>

  <circle cx="680" cy="276" r="18" fill="#a855f7"/>
  <text x="680" y="282" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">3</text>
  <text x="710" y="282" fill="#334155" font-family="sans-serif" font-size="18">새로운 시청 방문</text>

  <circle cx="680" cy="319" r="18" fill="#a855f7"/>
  <text x="680" y="325" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">4</text>
  <text x="710" y="325" fill="#334155" font-family="sans-serif" font-size="18">전입신고(転入届) 제출</text>

  <circle cx="680" cy="362" r="18" fill="#a855f7"/>
  <text x="680" y="368" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">5</text>
  <text x="710" y="368" fill="#334155" font-family="sans-serif" font-size="18">재류카드 제시</text>

  <circle cx="680" cy="405" r="18" fill="#a855f7"/>
  <text x="680" y="411" text-anchor="middle" fill="white" font-family="sans-serif" font-size="14" font-weight="bold">6</text>
  <text x="710" y="411" fill="#334155" font-family="sans-serif" font-size="18">카드 뒷면 주소 변경</text>

  <rect x="650" y="430" width="460" height="30" rx="8" fill="#f5f3ff"/>
  <text x="880" y="452" text-anchor="middle" fill="#5b21b6" font-family="sans-serif" font-size="16" font-weight="bold">2곳 방문 필요 (기존 + 새 시청)</text>

  <!-- Bottom -->
  <rect x="60" y="500" width="1080" height="60" rx="12" fill="#fbbf24"/>
  <text x="600" y="538" text-anchor="middle" fill="#78350f" font-family="sans-serif" font-size="24" font-weight="bold">준비물: 재류카드 · 여권 · 마이넘버카드 · 전출증명서 | 기한: 14일 이내</text>

  <text x="600" y="605" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="22">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
</svg>
