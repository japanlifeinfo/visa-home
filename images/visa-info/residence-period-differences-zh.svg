<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <circle cx="100" cy="560" r="120" fill="#e0f2fe" opacity="0.5"/>
  <circle cx="1100" cy="80" r="80" fill="#d1fae5" opacity="0.4"/>

  <text x="60" y="160" fill="#64748b" font-family="sans-serif" font-size="28" font-weight="500">在留期间</text>
  <text x="60" y="252" fill="#0f172a" font-family="sans-serif" font-size="84" font-weight="bold">1·3·5 年</text>
  <text x="60" y="304" fill="#0f172a" font-family="sans-serif" font-size="36" font-weight="600">依据什么标准决定?</text>

  <text x="60" y="372" fill="#475569" font-family="sans-serif" font-size="22">期间越长 = 更新负担越少,</text>
  <text x="60" y="402" fill="#475569" font-family="sans-serif" font-size="22">越接近永住申请条件。</text>

  <rect x="640" y="340" width="160" height="200" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
  <rect x="640" y="340" width="160" height="48" rx="20" fill="#3b82f6"/>
  <rect x="640" y="368" width="160" height="20" fill="#3b82f6"/>
  <text x="720" y="374" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">SHORT</text>
  <text x="720" y="468" text-anchor="middle" fill="#1e3a8a" font-family="sans-serif" font-size="80" font-weight="bold">1</text>
  <text x="720" y="510" text-anchor="middle" fill="#1e3a8a" font-family="sans-serif" font-size="28" font-weight="600">年</text>

  <rect x="820" y="260" width="160" height="280" rx="20" fill="#f0fdfa" stroke="#14b8a6" stroke-width="3"/>
  <rect x="820" y="260" width="160" height="48" rx="20" fill="#14b8a6"/>
  <rect x="820" y="288" width="160" height="20" fill="#14b8a6"/>
  <text x="900" y="294" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">MID</text>
  <text x="900" y="450" text-anchor="middle" fill="#115e59" font-family="sans-serif" font-size="120" font-weight="bold">3</text>
  <text x="900" y="510" text-anchor="middle" fill="#115e59" font-family="sans-serif" font-size="28" font-weight="600">年</text>

  <rect x="1000" y="180" width="160" height="360" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
  <rect x="1000" y="180" width="160" height="48" rx="20" fill="#10b981"/>
  <rect x="1000" y="208" width="160" height="20" fill="#10b981"/>
  <text x="1080" y="214" text-anchor="middle" fill="white" font-family="sans-serif" font-size="20" font-weight="bold">MAX</text>
  <text x="1080" y="420" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="160" font-weight="bold">5</text>
  <text x="1080" y="510" text-anchor="middle" fill="#065f46" font-family="sans-serif" font-size="28" font-weight="600">年</text>

  <path d="M 660 580 L 1140 580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="640" y="588" text-anchor="end" fill="#64748b" font-family="sans-serif" font-size="18">稳定性</text>
  <path d="M 1145 575 L 1160 580 L 1145 585 Z" fill="#64748b"/>

  <rect x="60" y="448" width="540" height="56" rx="12" fill="#0f172a"/>
  <text x="330" y="485" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="20" font-weight="bold">入管厅评估的居留稳定性指标</text>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
