    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Dokumen yang Diperlukan</text>
    <text x="80" y="300" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="64" font-weight="900">Tenaga</text>
    <text x="80" y="380" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="64" font-weight="900">Kerja Terampil</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <path d="M115 60 L100 95 L80 95 L80 115 L100 115 L115 150 L145 150 L160 115 L180 115 L180 95 L160 95 L145 60Z" fill="#c2410c" opacity="0.25"/>
      <rect x="118" y="150" width="24" height="40" rx="4" fill="#c2410c" opacity="0.3"/>
      <circle cx="130" cy="105" r="15" fill="#c2410c" opacity="0.2"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#c2410c" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">技能</text>
  <text x="955" y="425" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="30" opacity="0.6">Skilled Labor</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#c2410c" opacity="0.08" stroke="#c2410c" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="23" font-weight="600">J</text>

