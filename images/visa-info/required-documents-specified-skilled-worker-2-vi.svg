<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="36" font-weight="bold">Lao dong ky nang dac dinh 2</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(45, 35)">
      <!-- Worker with helmet -->
      <ellipse cx="70" cy="35" rx="30" ry="15" fill="#6366f1"/>
      <rect x="45" y="35" width="50" height="10" fill="#4f46e5"/>
      <circle cx="70" cy="60" r="18" fill="#fcd34d"/>
      <circle cx="63" cy="57" r="3" fill="#1e293b"/>
      <circle cx="77" cy="57" r="3" fill="#1e293b"/>
      <path d="M63,68 Q70,74 77,68" fill="none" stroke="#1e293b" stroke-width="2"/>
      <!-- Worker body with vest -->
      <rect x="50" y="80" width="40" height="40" rx="4" fill="#6366f1"/>
      <rect x="55" y="85" width="10" height="30" fill="#fbbf24"/>
      <rect x="75" y="85" width="10" height="30" fill="#fbbf24"/>
      <!-- Number 2 badge -->
      <circle cx="115" cy="60" r="25" fill="#4f46e5"/>
      <text x="115" y="70" text-anchor="middle" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">2</text>
      <!-- Star for advanced -->
      <polygon points="115,100 118,110 128,110 120,117 123,127 115,121 107,127 110,117 102,110 112,110" fill="#fbbf24"/>
      <!-- Family icons -->
      <circle cx="105" cy="145" r="8" fill="#a5b4fc"/>
      <circle cx="125" cy="145" r="8" fill="#a5b4fc"/>
      <circle cx="115" cy="155" r="6" fill="#c7d2fe"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Ky nang thanh thao</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">11 linh vuc doi tuong</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Khong gioi han thoi gian luu tru</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Gia dinh duoc phep di kem</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#e0e7ff"/>
        <text x="12" y="17" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Co the xin vinh tru</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="300" y="290" width="200" height="44" rx="22" fill="#e0e7ff"/>
    <text x="400" y="320" text-anchor="middle" fill="#4338ca" font-family="sans-serif" font-size="18" font-weight="bold">特定技能2号</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
