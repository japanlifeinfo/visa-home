<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#1e293b"/>
  <rect width="1200" height="8" fill="url(#hg)"/>

  <text x="600" y="72" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="40" font-weight="bold">재류카드 상시 소지 의무 위반 시 처벌</text>

  <!-- Left: Obligation -->
  <rect x="60" y="105" width="520" height="370" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <rect x="60" y="105" width="520" height="50" rx="16" fill="#2563eb"/>
  <rect x="60" y="135" width="520" height="20" fill="#2563eb"/>
  <text x="320" y="140" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="bold">상시 소지 의무</text>

  <text x="100" y="200" fill="#93c5fd" font-family="sans-serif" font-size="20" font-weight="bold">외출 시 항상 휴대</text>
  <text x="100" y="232" fill="#cbd5e1" font-family="sans-serif" font-size="17">지갑·가방에 원본 보관</text>

  <line x1="90" y1="255" x2="550" y2="255" stroke="#334155" stroke-width="1"/>

  <text x="100" y="285" fill="#93c5fd" font-family="sans-serif" font-size="20" font-weight="bold">제시 요구 상황</text>
  <circle cx="110" cy="315" r="5" fill="#60a5fa"/>
  <text x="125" y="321" fill="#cbd5e1" font-family="sans-serif" font-size="17">경찰 불심검문</text>
  <circle cx="300" cy="315" r="5" fill="#60a5fa"/>
  <text x="315" y="321" fill="#cbd5e1" font-family="sans-serif" font-size="17">출입국 조사</text>
  <circle cx="110" cy="348" r="5" fill="#60a5fa"/>
  <text x="125" y="354" fill="#cbd5e1" font-family="sans-serif" font-size="17">교통 단속</text>
  <circle cx="300" cy="348" r="5" fill="#60a5fa"/>
  <text x="315" y="354" fill="#cbd5e1" font-family="sans-serif" font-size="17">직무상 확인</text>

  <line x1="90" y1="375" x2="550" y2="375" stroke="#334155" stroke-width="1"/>

  <rect x="90" y="395" width="460" height="55" rx="10" fill="#7f1d1d"/>
  <text x="320" y="420" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="16">사본 ✕ · 휴대폰 사진 ✕ · 운전면허증 ✕</text>
  <text x="320" y="440" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="14">원본만 인정됩니다</text>

  <!-- Right: Penalty -->
  <rect x="620" y="105" width="520" height="185" rx="16" fill="#dc2626"/>
  <text x="880" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="28" font-weight="bold">위반 시 처벌</text>
  <text x="880" y="200" text-anchor="middle" fill="#fef2f2" font-family="sans-serif" font-size="48" font-weight="bold">20만엔 이하 벌금</text>
  <text x="880" y="240" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="18">고의가 아니더라도 원칙적으로 위반</text>
  <text x="880" y="268" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="16">반복 시 실제 처벌 가능</text>

  <!-- Right bottom: Impact -->
  <rect x="620" y="310" width="520" height="165" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="880" y="352" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="22" font-weight="bold">영주권·비자 갱신에 영향</text>
  <circle cx="660" cy="388" r="5" fill="#fbbf24"/>
  <text x="680" y="394" fill="#e2e8f0" font-family="sans-serif" font-size="18">반복 위반 → 심사 시 불이익</text>
  <circle cx="660" cy="420" r="5" fill="#fbbf24"/>
  <text x="680" y="426" fill="#e2e8f0" font-family="sans-serif" font-size="18">벌금 이력 → 영주권 심사 불리</text>
  <circle cx="660" cy="452" r="5" fill="#fbbf24"/>
  <text x="680" y="458" fill="#e2e8f0" font-family="sans-serif" font-size="18">법 위반 기록은 입관에 보존</text>

  <!-- Bottom -->
  <rect x="60" y="500" width="1080" height="60" rx="12" fill="#16a34a"/>
  <text x="600" y="538" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="bold">예외: 16세 미만은 소지 의무 면제 · 특별영주자는 별도 제도 적용</text>

  <text x="600" y="605" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="22">visa.japanlifeinfo.com</text>

  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
</svg>
