    <text x="410" y="55" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="13">भिसा जाँचमा हानि</text>
  </g>

  <g transform="translate(610, 400)">
    <rect width="530" height="80" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
