<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>
  <text x="600" y="75" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="32" font-weight="bold">Quanto Tempo Demora o Status de Residencia?</text>
  <g transform="translate(80, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#3b82f6"/><rect y="45" width="330" height="15" fill="#3b82f6"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">Nova (COE)</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">1–3 meses</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Alta temporada: 3–4+ meses</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#dbeafe"/>
    <text x="165" y="192" text-anchor="middle" fill="#1d4ed8" font-family="sans-serif" font-size="15" font-weight="bold">Analise: Alta</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Para residentes no exterior</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Grandes cidades = mais tempo</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Abril → solicite Dez–Jan</text>
  </g>
  <g transform="translate(435, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#10b981"/><rect y="45" width="330" height="15" fill="#10b981"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">Renovacao</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="38" font-weight="bold">2 sem–1 mes</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Geralmente mais rapido</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#d1fae5"/>
    <text x="165" y="192" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="15" font-weight="bold">Analise: Baixa</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Estavel se condicoes inalteradas</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Problema na empresa = atraso</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Antes do vencimento = pode ficar</text>
  </g>
  <g transform="translate(790, 110)">
    <rect width="330" height="310" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
    <rect width="330" height="60" rx="16" fill="#f59e0b"/><rect y="45" width="330" height="15" fill="#f59e0b"/>
    <text x="165" y="42" text-anchor="middle" fill="white" font-family="sans-serif" font-size="22" font-weight="bold">Alteracao</text>
    <text x="165" y="110" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="42" font-weight="bold">1–2 meses</text>
    <text x="165" y="145" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="16">Pode igualar nivel de nova</text>
    <rect x="65" y="170" width="200" height="32" rx="16" fill="#fef3c7"/>
    <text x="165" y="192" text-anchor="middle" fill="#92400e" font-family="sans-serif" font-size="15" font-weight="bold">Analise: Media–Alta</text>
    <text x="165" y="235" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Relevancia formacao-funcao importante</text>
    <text x="165" y="260" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Incompativel = mais documentos</text>
    <text x="165" y="285" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="14">Descricao de cargo precisa essencial</text>
  </g>
  <!-- Key Points Box -->
  <g transform="translate(200, 450)">
    <rect width="800" height="80" rx="12" fill="#1e293b"/>
    <text x="400" y="32" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="15">Pontos-Chave</text>
    <text x="400" y="58" text-anchor="middle" fill="white" font-family="sans-serif" font-size="17" font-weight="bold">Entenda prazos e intensidade de analise por tipo para preparacao estrategica</text>
  </g>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
