<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="splitGrad" x1="0" y1="0" x2="700" y2="630">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <clipPath id="diagClip">
      <polygon points="0,0 880,0 480,630 0,630"/>
    </clipPath>
  </defs>

  <!-- White background (right side) -->
  <rect width="1200" height="630" fill="#fafafa"/>

  <!-- Diagonal color area (left side) -->
  <polygon points="0,0 880,0 480,630 0,630" fill="url(#splitGrad)"/>

  <!-- Left: title area -->
  <g clip-path="url(#diagClip)">
    <circle cx="100" cy="500" r="120" fill="white" opacity="0.07"/>
    <circle cx="620" cy="80" r="80" fill="white" opacity="0.05"/>

    <text x="80" y="210" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="28" font-weight="500" letter-spacing="6" opacity="0.8">Kinakailangang Dokumento</text>
    <text x="80" y="340" fill="white" font-family="'Noto Sans KR', 'Noto Sans JP', sans-serif" font-size="80" font-weight="900">Mamamahayag</text>
  </g>

  <!-- Right: icon + info -->
  <g transform="translate(840, 120) scale(0.85)">
    
      <rect x="70" y="65" width="120" height="130" rx="6" fill="#475569" opacity="0.2"/>
      <rect x="80" y="75" width="100" height="25" rx="3" fill="#475569" opacity="0.35"/>
      <line x1="80" y1="115" x2="170" y2="115" stroke="#475569" stroke-width="2" opacity="0.25"/>
      <line x1="80" y1="130" x2="170" y2="130" stroke="#475569" stroke-width="2" opacity="0.25"/>
      <line x1="80" y1="145" x2="140" y2="145" stroke="#475569" stroke-width="2" opacity="0.25"/>
      <line x1="80" y1="160" x2="170" y2="160" stroke="#475569" stroke-width="2" opacity="0.25"/>
      <line x1="80" y1="175" x2="150" y2="175" stroke="#475569" stroke-width="2" opacity="0.25"/>
  </g>

  <text x="955" y="385" text-anchor="middle" fill="#475569" font-family="'Noto Serif JP', serif" font-size="38" font-weight="700">報道</text>
  <text x="955" y="425" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="30" opacity="0.6">Journalist</text>

  <rect x="907" y="443" width="96" height="40" rx="20" fill="#475569" opacity="0.08" stroke="#475569" stroke-width="1.5" stroke-opacity="0.2"/>
  <text x="955" y="471" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="23" font-weight="600">A-4</text>

  <text x="955" y="598" text-anchor="middle" fill="#d4d4d8" font-family="sans-serif" font-size="26">visa.japanlifeinfo.com</text>
</svg>