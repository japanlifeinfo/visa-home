<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fef2f2"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <text x="600" y="80" text-anchor="middle" fill="#991b1b" font-family="sans-serif" font-size="48" font-weight="bold">배우자 비자, 왜 거절될까?</text>

  <!-- 3 main reasons -->
  <rect x="100" y="130" width="320" height="260" rx="20" fill="#dc2626"/>
  <text x="260" y="210" text-anchor="middle" fill="white" font-family="sans-serif" font-size="72" font-weight="bold">1</text>
  <text x="260" y="270" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">위장결혼</text>
  <text x="260" y="310" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="24">의심</text>

  <rect x="440" y="130" width="320" height="260" rx="20" fill="#ea580c"/>
  <text x="600" y="210" text-anchor="middle" fill="white" font-family="sans-serif" font-size="72" font-weight="bold">2</text>
  <text x="600" y="270" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">생계 능력</text>
  <text x="600" y="310" text-anchor="middle" fill="#fed7aa" font-family="sans-serif" font-size="24">부족</text>

  <rect x="780" y="130" width="320" height="260" rx="20" fill="#d97706"/>
  <text x="940" y="210" text-anchor="middle" fill="white" font-family="sans-serif" font-size="72" font-weight="bold">3</text>
  <text x="940" y="270" text-anchor="middle" fill="white" font-family="sans-serif" font-size="32" font-weight="bold">체류 이력</text>
  <text x="940" y="310" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="24">문제</text>

  <!-- Bottom message -->
  <rect x="100" y="430" width="1000" height="90" rx="16" fill="#1e293b"/>
  <text x="600" y="485" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="32" font-weight="bold">결혼 = 자동 승인이 아닙니다</text>


  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
</svg>