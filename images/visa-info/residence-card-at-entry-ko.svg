<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: dark slate-blue (distinct from prior cream / crimson / stone-warm / indigo / light sky) -->
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Background watermark 在留カード (large, faint, lower-right behind hero) -->
  <text x="1180" y="608" text-anchor="end" fill="#38bdf8" font-family="serif" font-size="180" font-weight="bold" opacity="0.05">在留カード</text>

  <!-- Subtle dotted arrival arc from upper-left to upper-right -->
  <path d="M 80 152 Q 600 90 1120 152" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 11" fill="none" opacity="0.35"/>

  <!-- Tiny airplane mid-arc -->
  <g transform="translate(600, 92) rotate(0)">
    <path d="M -12 0 L 14 -2 L 18 -1 L 18 1 L 14 2 L -12 0 Z" fill="#7dd3fc" opacity="0.85"/>
    <path d="M 0 -1 L -7 -10 L -3 -10 L 5 -1 Z" fill="#7dd3fc" opacity="0.85"/>
    <path d="M 0 1 L -7 10 L -3 10 L 5 1 Z" fill="#7dd3fc" opacity="0.7"/>
    <path d="M -10 0 L -16 -5 L -14 -5 L -7 0 Z" fill="#7dd3fc" opacity="0.85"/>
  </g>

  <!-- ===== TOP BANNER: kicker + huge single-line headline + subtitle (centered) ===== -->

  <!-- Kicker pill (outlined) -->
  <g transform="translate(600, 60)">
    <rect x="-240" y="-18" width="480" height="34" rx="17" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="5">RESIDENCE CARD · 在留カード · 入国時 受領</text>
  </g>

  <!-- Tiny pre-headline (small label above big banner) -->
  <text x="600" y="118" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18" font-weight="500" letter-spacing="2">일본 입국, 가장 먼저 받는 신분증</text>

  <!-- Big single-line banner headline (top-banner pattern #4) -->
  <text x="600" y="196" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="76" font-weight="bold">공항에서 받는 재류카드</text>

  <!-- Subtitle line -->
  <text x="600" y="236" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16" font-weight="500">주요 공항은 입국심사 시 즉시 · 그 외 공항은 주소 등록 후 우편 발송</text>

  <!-- Thin accent divider -->
  <line x1="540" y1="262" x2="660" y2="262" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>

  <!-- ===== CENTER-BOTTOM HERO: detailed Japanese residence card (centered, tilted) ===== -->

  <g transform="translate(320, 300) rotate(-5 280 150)">
    <!-- Card shadow -->
    <rect x="10" y="14" width="560" height="306" rx="14" fill="#000" opacity="0.55"/>

    <!-- Card body (cream/off-white) -->
    <rect width="560" height="306" rx="14" fill="#fefce8" stroke="#475569" stroke-width="1.5"/>

    <!-- Top header band (dark blue official) -->
    <path d="M 0 14 Q 0 0 14 0 L 546 0 Q 560 0 560 14 L 560 48 L 0 48 Z" fill="#1e3a8a"/>

    <!-- Card title -->
    <text x="22" y="20" fill="#fef3c7" font-family="serif" font-size="12" font-weight="bold">日本国 / Ministry of Justice</text>
    <text x="22" y="40" fill="#ffffff" font-family="serif" font-size="19" font-weight="bold">在留カード</text>
    <text x="538" y="40" text-anchor="end" fill="#bfdbfe" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4">RESIDENCE CARD</text>

    <!-- Card number row -->
    <text x="22" y="72" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">番号 / NUMBER</text>
    <text x="22" y="90" fill="#1e3a8a" font-family="monospace" font-size="17" font-weight="bold" letter-spacing="2">AB12345678CD</text>

    <!-- Photo placeholder (right side under header) -->
    <rect x="436" y="60" width="100" height="120" rx="3" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="486" cy="102" r="17" fill="#93c5fd"/>
    <path d="M 459 160 Q 459 128 486 128 Q 513 128 513 160 Z" fill="#93c5fd"/>
    <text x="486" y="176" text-anchor="middle" fill="#1e3a8a" font-family="sans-serif" font-size="7" font-weight="600" letter-spacing="2">PHOTO</text>

    <!-- Field 1: NAME -->
    <text x="22" y="116" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">氏名 / NAME</text>
    <text x="22" y="134" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">KIM TARO</text>
    <line x1="22" y1="142" x2="412" y2="142" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Field 2: NATIONALITY + DOB row -->
    <text x="22" y="158" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">国籍·地域 / NATIONALITY</text>
    <text x="22" y="176" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">韓国 / KOREA</text>
    <line x1="22" y1="184" x2="220" y2="184" stroke="#cbd5e1" stroke-width="1"/>

    <text x="240" y="158" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">生年月日 / DOB</text>
    <text x="240" y="176" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">1990.05.01</text>
    <line x1="240" y1="184" x2="412" y2="184" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Field 3: ADDRESS — blank with annotation -->
    <text x="22" y="200" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">住所 / ADDRESS</text>
    <text x="22" y="218" fill="#94a3b8" font-family="sans-serif" font-size="12" font-style="italic">— 未記入 · 전입신고 후 기재</text>
    <line x1="22" y1="226" x2="412" y2="226" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Field 4: STATUS + PERIOD -->
    <text x="22" y="242" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">在留資格 / STATUS</text>
    <text x="22" y="260" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">技術·人文知識·国際業務</text>

    <text x="260" y="242" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="1">在留期間 / PERIOD</text>
    <text x="260" y="260" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">5年</text>

    <!-- IC chip lower-right -->
    <rect x="450" y="200" width="80" height="60" rx="6" fill="url(#chipGradient)" stroke="#854d0e" stroke-width="1"/>
    <line x1="456" y1="210" x2="524" y2="210" stroke="#854d0e" stroke-width="0.5"/>
    <line x1="456" y1="220" x2="524" y2="220" stroke="#854d0e" stroke-width="0.5"/>
    <line x1="456" y1="230" x2="524" y2="230" stroke="#854d0e" stroke-width="0.5"/>
    <line x1="456" y1="240" x2="524" y2="240" stroke="#854d0e" stroke-width="0.5"/>
    <line x1="456" y1="250" x2="524" y2="250" stroke="#854d0e" stroke-width="0.5"/>
    <line x1="478" y1="200" x2="478" y2="260" stroke="#854d0e" stroke-width="0.5"/>
    <line x1="500" y1="200" x2="500" y2="260" stroke="#854d0e" stroke-width="0.5"/>

    <!-- Issuing authority footer -->
    <text x="22" y="290" fill="#64748b" font-family="sans-serif" font-size="9" letter-spacing="1">出入国在留管理庁 / IMMIGRATION SERVICES AGENCY OF JAPAN</text>
  </g>

  <!-- ===== RED 入国 STAMP overlay diagonal across the card ===== -->
  <g transform="translate(600, 432) rotate(-13)">
    <!-- Outer thick double-ring rectangular stamp -->
    <rect x="-130" y="-50" width="260" height="100" rx="2" fill="none" stroke="#dc2626" stroke-width="6" opacity="0.92"/>
    <rect x="-120" y="-40" width="240" height="80" rx="1" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.88"/>

    <!-- 入国 big kanji -->
    <text x="0" y="6" text-anchor="middle" fill="#dc2626" font-family="serif" font-size="48" font-weight="bold" letter-spacing="10" opacity="0.95">入国</text>

    <!-- Small label below -->
    <text x="0" y="30" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="4" opacity="0.9">LANDED · 入国許可</text>

    <!-- Ink imperfection notches -->
    <circle cx="-126" cy="-44" r="2.5" fill="#dc2626" opacity="0.65"/>
    <circle cx="124" cy="42" r="2.5" fill="#dc2626" opacity="0.65"/>
    <circle cx="-100" cy="50" r="1.8" fill="#dc2626" opacity="0.5"/>
  </g>

  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="chipGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
</svg>
