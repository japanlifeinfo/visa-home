<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>

  <!-- Header gradient bar -->
  <rect width="1200" height="8" fill="url(#headerGradient)"/>

  <!-- Title -->
  <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-family="sans-serif" font-size="44" font-weight="bold">Cu tru dai han</text>

  <!-- Subtitle -->
  <text x="600" y="150" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="28">Huong dan ho so can nop</text>

  <!-- Main Card -->
  <g transform="translate(200, 190)">
    <!-- Card background -->
    <rect width="800" height="350" rx="20" fill="white" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Left side - Icon area -->
    <g transform="translate(50, 40)">
      <!-- House icon -->
      <polygon points="70,30 20,70 120,70" fill="#22c55e"/>
      <rect x="35" y="70" width="70" height="60" fill="#16a34a"/>
      <rect x="50" y="85" width="20" height="25" fill="#15803d"/>
      <rect x="80" y="85" width="15" height="15" fill="#bbf7d0"/>
      <!-- Calendar/time icon -->
      <rect x="95" y="100" width="35" height="35" rx="4" fill="#166534"/>
      <rect x="100" y="95" width="6" height="10" fill="#14532d"/>
      <rect x="119" y="95" width="6" height="10" fill="#14532d"/>
      <text x="112" y="125" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="bold">5+</text>
      <!-- Person -->
      <circle cx="60" cy="150" r="12" fill="#4ade80"/>
      <rect x="50" y="163" width="20" height="15" rx="3" fill="#4ade80"/>
    </g>

    <!-- Right side - Content -->
    <g transform="translate(220, 40)">
      <text x="0" y="30" fill="#1e293b" font-family="sans-serif" font-size="24" font-weight="bold">Luu tru vi ly do dac biet</text>

      <!-- Features list -->
      <g transform="translate(0, 60)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Nguoi goc Nhat the he thu 3</text>
      </g>

      <g transform="translate(0, 105)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Vo/chong nguoi goc Nhat</text>
      </g>

      <g transform="translate(0, 150)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Thoi han: 5 nam, 3 nam, 1 nam, 6 thang</text>
      </g>

      <g transform="translate(0, 195)">
        <circle cx="12" cy="12" r="12" fill="#dcfce7"/>
        <text x="12" y="17" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14">✓</text>
        <text x="35" y="18" fill="#64748b" font-family="sans-serif" font-size="18">Khong gioi han viec lam</text>
      </g>
    </g>

    <!-- Bottom badge -->
    <rect x="330" y="290" width="140" height="44" rx="22" fill="#dcfce7"/>
    <text x="400" y="320" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="18" font-weight="bold">定住者</text>
  </g>

  <!-- Footer -->
  <text x="600" y="590" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="18">visa.japanlifeinfo.com</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
